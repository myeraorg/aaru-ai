<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aaru AI</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --panel-bg: #1e293b;
      --text-color: #f8fafc;
      --text-secondary: #94a3b8;
      --accent-color: #6366f1;
      --accent-hover: #4f46e5;
      --border-color: #334155;
      --bubble-user: #3b82f6;
      --bubble-assistant: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* Sidebar / History */
    .sidebar {
      width: 280px;
      background-color: var(--panel-bg);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .sidebar-header {
      padding: 16px;
      font-size: 18px;
      font-weight: bold;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .new-chat-btn {
      background-color: var(--accent-color);
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }

    .new-chat-btn:hover {
      background-color: var(--accent-hover);
    }

    .chat-history-list {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
    }

    .chat-history-item {
      padding: 10px 12px;
      border-radius: 6px;
      cursor: pointer;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: background 0.2s;
    }

    .chat-history-item:hover, .chat-history-item.active {
      background-color: var(--border-color);
    }

    .chat-history-info {
      overflow: hidden;
      flex: 1;
    }

    .chat-history-title {
      font-size: 14px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .chat-history-meta {
      font-size: 11px;
      color: var(--text-secondary);
    }

    .delete-chat {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 14px;
      opacity: 0.7;
    }

    .delete-chat:hover {
      opacity: 1;
    }

    /* Main Chat Area */
    .main-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
      position: relative;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .message {
      display: flex;
      flex-direction: column;
      max-width: 75%;
    }

    .message.user {
      align-self: flex-end;
    }

    .message.assistant {
      align-self: flex-start;
    }

    .bubble {
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.5;
      word-break: break-word;
    }

    .message.user .bubble {
      background-color: var(--bubble-user);
      color: white;
      border-bottom-right-radius: 2px;
    }

    .message.assistant .bubble {
      background-color: var(--bubble-assistant);
      color: var(--text-color);
      border-bottom-left-radius: 2px;
    }

    .msg-actions {
      display: flex;
      gap: 8px;
      margin-top: 4px;
      font-size: 12px;
    }

    .msg-action-btn {
      background: none;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
    }

    .msg-action-btn:hover {
      color: var(--text-color);
    }

    /* Input Area */
    .chat-input-area {
      padding: 16px;
      background-color: var(--panel-bg);
      border-top: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .chat-input {
      flex: 1;
      background-color: var(--bg-color);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 12px;
      color: var(--text-color);
      font-size: 14px;
      resize: none;
      max-height: 150px;
      outline: none;
    }

    .chat-input:focus {
      border-color: var(--accent-color);
    }

    .send-btn {
      background-color: var(--accent-color);
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    .send-btn:hover {
      background-color: var(--accent-hover);
    }

    .empty-history {
      text-align: center;
      color: var(--text-secondary);
      padding: 20px;
      font-size: 13px;
    }

    .generated-image, .attached-user-image {
      max-width: 100%;
      border-radius: 8px;
      margin-bottom: 8px;
    }

    /* Creations Grid Section Panel */
    .creations-panel {
      width: 250px;
      background-color: var(--panel-bg);
      border-left: 1px solid var(--border-color);
      padding: 12px;
      overflow-y: auto;
    }

    .creation-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .creation-card {
      background: var(--bg-color);
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid var(--border-color);
    }

    .creation-card img {
      width: 100%;
      height: 80px;
      object-fit: cover;
    }

    .creation-prompt {
      font-size: 10px;
      padding: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
</head>
<body>

  <!-- Left Sidebar: Chat History -->
  <div class="sidebar">
    <div class="sidebar-header">
      <span>चैट इतिहास</span>
      <button class="new-chat-btn" id="newChatBtn" onclick="createNewChat(true)">+ नई चैट</button>
    </div>
    <div class="chat-history-list" id="chatHistoryEl">
      <!-- Chat history items will render here -->
    </div>
  </div>

  <!-- Main Chat Container -->
  <div class="main-container">
    <div class="chat-messages" id="messagesEl">
      <!-- Messages will render here -->
    </div>
    
    <div class="chat-input-area">
      <textarea class="chat-input" id="promptEl" placeholder="यहाँ अपना संदेश लिखें... (या image banao: लिखें)" rows="1"></textarea>
      <button class="send-btn" id="sendBtn">भेजें</button>
    </div>
  </div>

  <!-- Right Creations Panel (Optional Visual Showcase) -->
  <div class="creations-panel">
    <div style="font-size: 14px; font-weight: bold; margin-bottom: 10px;">इमेज गैलरी</div>
    <div class="creation-grid" id="creationGrid">
      <!-- Creations will render here -->
    </div>
  </div>

<script>
  // Global Constants & State Variables
  const MAX_SAVED_CREATIONS = 20;
  const MAX_CREATION_PROMPT_CHARS = 100;
  const IMAGE_KEY = "aaru_ai_creations";
  const CHAT_KEY = "aaru_ai_chats";
  const HAS_STORAGE = typeof localStorage !== 'undefined';

  let chats = [];
  let currentChatId = null;
  let messages = [];
  let volatileCreations = [];
  let creationsLoaded = false;

  // DOM Elements
  const chatHistoryEl = document.getElementById("chatHistoryEl");
  const creationGrid = document.getElementById("creationGrid");
  const messagesEl = document.getElementById("messagesEl");
  const promptEl = document.getElementById("promptEl");
  const sendBtn = document.getElementById("sendBtn");

  // Utility functions
  function escapeHTML(str) {
    return String(str || "").replace(/[&<>'"]/g, 
      tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
    );
  }

  function makeImageId() {
    return 'img_' + Math.random().toString(36).substr(2, 9);
  }

  function showToast(msg) {
    console.log("Toast:", msg);
  }

  function speakText(text) {
    if ('speechSynthesis' in window) {
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'hi-IN';
      window.speechSynthesis.speak(utterance);
    } else {
      showToast("स्पीच सिंथेसिस समर्थित नहीं है।");
    }
  }

  function renderMarkdown(content) {
    return escapeHTML(content).replace(/\n/g, "<br>");
  }

  function safeGet(key) {
    try { return HAS_STORAGE ? localStorage.getItem(key) : null; } catch (e) { return null; }
  }

  function safeSet(key, val) {
    try { if (HAS_STORAGE) localStorage.setItem(key, val); } catch (e) {}
  }

  function safeRemove(key) {
    try { if (HAS_STORAGE) localStorage.removeItem(key); } catch (e) {}
  }

  function loadChatHistory() {
    const raw = safeGet(CHAT_KEY);
    if (raw) {
      try {
        const parsed = JSON.parse(raw);
        if (Array.isArray(parsed)) chats = parsed;
      } catch (e) { safeRemove(CHAT_KEY); }
    }
  }

  function saveChatHistory() {
    if (currentChatId) {
      const chatIndex = chats.findIndex(c => c.id === currentChatId);
      if (chatIndex !== -1) {
        chats[chatIndex].messages = messages;
        chats[chatIndex].updatedAt = Date.now();
      }
    }
    if (HAS_STORAGE) {
      safeSet(CHAT_KEY, JSON.stringify(chats));
    }
  }

  window.createNewChat = function(persist = true) {
    const newChat = {
      id: 'chat_' + Math.random().toString(36).substr(2, 9),
      title: 'नई चैट',
      messages: [],
      updatedAt: Date.now()
    };
    chats.unshift(newChat);
    currentChatId = newChat.id;
    messages = [];
    
    if (persist) {
      saveChatHistory();
      renderChatHistoryUI();
    }
    renderMessages();
    return newChat;
  }

  function renderChatHistoryUI() {
    if (!chatHistoryEl) return;
    if (chats.length === 0) {
      chatHistoryEl.innerHTML = `<div class="empty-history">कोई पुरानी चैट नहीं मिली।</div>`;
      return;
    }
    
    chatHistoryEl.innerHTML = chats.map(chat => {
      const active = chat.id === currentChatId ? "active" : "";
      const dateStr = new Date(chat.updatedAt || Date.now()).toLocaleDateString("hi-IN", { month: 'short', day: 'numeric' });
      return `
        <div class="chat-history-item ${active}" data-id="${escapeHTML(chat.id)}">
          <div class="chat-history-info">
            <div class="chat-history-title">${escapeHTML(chat.title)}</div>
            <div class="chat-history-meta">${dateStr}</div>
          </div>
          <button class="delete-chat" data-id="${escapeHTML(chat.id)}" title="डिलीट करें">🗑️</button>
        </div>
      `;
    }).join('');
  }

  function renderCreationsUI() {
    if (!creationGrid) return;
    if (!creationsLoaded) {
      const raw = safeGet(IMAGE_KEY);
      if (raw) {
        try {
          const parsed = JSON.parse(raw);
          if (Array.isArray(parsed)) {
            volatileCreations = parsed.slice(0, MAX_SAVED_CREATIONS);
          }
        } catch (e) {
          safeRemove(IMAGE_KEY);
        }
      }
      creationsLoaded = true;
    }
    
    if (volatileCreations.length === 0) {
      creationGrid.innerHTML = `<div class="empty-history" style="grid-column:span 2;">कोई जनरेटेड इमेज नहीं है।</div>`;
      return;
    }
    
    creationGrid.innerHTML = volatileCreations.map(item => `
      <div class="creation-card">
        <img src="${escapeHTML(item.url)}" alt="Creation" loading="lazy" data-view="${escapeHTML(item.url)}">
        <div class="creation-prompt">${escapeHTML(item.prompt)}</div>
      </div>
    `).join('');
  }

  function saveCreation(url, promptText) {
    const item = { 
      id: makeImageId(), 
      url: String(url), 
      prompt: String(promptText || "").slice(0, MAX_CREATION_PROMPT_CHARS), 
      createdAt: Date.now() 
    };
    volatileCreations.unshift(item);
    volatileCreations = volatileCreations.slice(0, MAX_SAVED_CREATIONS);
    
    if (HAS_STORAGE) {
      safeSet(IMAGE_KEY, JSON.stringify(volatileCreations));
    }
    renderCreationsUI();
  }

  function renderMessages() {
    if (!messagesEl) return;
    if (messages.length === 0) {
      messagesEl.innerHTML = `
        <div style="text-align:center; padding:40px 20px; opacity:0.6;">
          <div style="font-size:32px; margin-bottom:10px;">👋</div>
          <div style="font-size:16px; font-weight:700; margin-bottom:6px;">नमस्ते! मैं Aaru AI हूँ।</div>
          <div style="font-size:13px; line-height:1.5;">मुझसे कोई भी सवाल पूछें, कोडिंग कराएं, या <br><b>'image banao: [विवरण]'</b> लिखकर खूबसूरत तस्वीरें बनाएं।</div>
        </div>
      `;
      return;
    }

    messagesEl.innerHTML = messages.map(msg => {
      const isUser = msg.role === "user";
      const bubbleClass = isUser ? "message user" : "message assistant";
      
      let contentHtml = "";
      if (msg.imageUrl) {
        contentHtml += `<img src="${escapeHTML(msg.imageUrl)}" class="${isUser ? 'attached-user-image' : 'generated-image'}" alt="Image" data-view="${escapeHTML(msg.imageUrl)}">`;
      }
      if (msg.content) {
        if (isUser) {
          contentHtml += `<div>${escapeHTML(msg.content).replace(/\n/g, "<br>")}</div>`;
        } else {
          contentHtml += `<div class="md">${renderMarkdown(msg.content)}</div>`;
        }
      }

      let actionsHtml = "";
      if (!isUser && msg.content) {
        const safeContentEsc = escapeHTML(msg.content).replace(/"/g, '&quot;');
        actionsHtml = `
          <div class="msg-actions">
            <button class="msg-action-btn" onclick="copyMessageText(this)" data-text="${safeContentEsc}">कॉपी</button>
            <button class="msg-action-btn" onclick="speakMessageText(this)" data-text="${safeContentEsc}">बोलें 🔊</button>
          </div>
        `;
      }

      return `
        <div class="${bubbleClass}">
          <div class="bubble">${contentHtml}</div>
          ${actionsHtml}
        </div>
      `;
    }).join('');
  }

  window.copyModelText = function(btn) {
    const text = btn.getAttribute("data-text") || "";
    navigator.clipboard.writeText(text)
      .then(() => { showToast("टेक्स्ट कॉपी हो गया!"); })
      .catch(() => { showToast("कॉपी करने में विफल।"); });
  };

  window.speakModelText = function(btn) {
    const text = btn.getAttribute("data-text") || "";
    speakText(text);
  };

  // Global handlers for message actions
  window.copyMessageText = window.copyModelText;
  window.speakMessageText = window.speakModelText;

  function autoResize() {
    if (!promptEl) return;
    promptEl.style.height = "auto";
    promptEl.style.height = Math.min(promptEl.scrollHeight, 150) + "px";
  }

  if (promptEl) {
    promptEl.addEventListener("input", autoResize);
  }

  // Initialization on load
  loadChatHistory();
  if (chats.length > 0) {
    currentChatId = chats[0].id;
    messages = chats[0].messages.slice();
  } else {
    createNewChat(false);
  }

  renderChatHistoryUI();
  renderCreationsUI();
  renderMessages();
</script>
</body>
</html>
