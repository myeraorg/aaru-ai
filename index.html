<!DOCTYPE html>

<html lang="hi">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover" name="viewport"/>
<title>Aaru AI — GPT-6 Astra • Native Unified Composer</title>
<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  overflow-x:clip;
  overflow-y:auto;
  overscroll-behavior-y:auto;
}

body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100dvh;
  font-family:Arial,Helvetica,sans-serif;
  background:#f7f9fc;
  color:#172033;
  overflow-x:clip;
  overflow-y:auto;
  overscroll-behavior-y:auto;
}

button,
input,
textarea{
  font:inherit;
}

button{
  -webkit-user-select:none;
  user-select:none;
}

main{
  position:relative;
  flex:1 0 auto;
  min-height:calc(100dvh - 58px);
  overflow:visible;
  scroll-behavior:smooth;
}

.app{
  min-height:100dvh;
  display:flex;
  flex-direction:column;
}

.header{
  position:sticky;
  top:0;
  z-index:100;
  height:58px;
  display:flex;
  align-items:center;
  gap:10px;
  padding:0 12px;
  background:rgba(255,255,255,.96);
  border-bottom:1px solid rgba(20,35,60,.10);
  backdrop-filter:blur(14px);
}

.menu-btn{
  width:40px;
  height:40px;
  border:0;
  border-radius:12px;
  background:#eef2f7;
  color:#172033;
  font-size:22px;
  cursor:pointer;
}

.brand{
  min-width:0;
  flex:1;
}

.brand-name{
  font-size:18px;
  font-weight:800;
  letter-spacing:.2px;
}

.brand-sub{
  margin-top:1px;
  font-size:10px;
  opacity:.45;
}

.new-chat-top{
  width:40px;
  height:40px;
  border:0;
  border-radius:12px;
  background:#eef2f7;
  color:#172033;
  font-size:21px;
  cursor:pointer;
}

.drawer-overlay{
  position:fixed;
  inset:0;
  z-index:200;
  background:rgba(0,0,0,.58);
  opacity:0;
  pointer-events:none;
  transition:.2s;
}

.drawer-overlay.open{
  opacity:1;
  pointer-events:auto;
}

.drawer{
  position:fixed;
  z-index:210;
  top:0;
  left:0;
  bottom:0;
  width:min(88vw,340px);
  background:#151821;
  border-right:1px solid rgba(255,255,255,.07);
  transform:translateX(-105%);
  transition:.22s ease;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

.drawer.open{
  transform:translateX(0);
}

.drawer-head{
  height:58px;
  flex:none;
  display:flex;
  align-items:center;
  gap:10px;
  padding:0 12px;
  border-bottom:1px solid rgba(20,35,60,.10);
}

.drawer-title{
  flex:1;
  font-size:17px;
  font-weight:800;
}

.close-drawer{
  width:38px;
  height:38px;
  border:0;
  border-radius:11px;
  background:#eef2f7;
  color:#172033;
  font-size:21px;
}

.drawer-body{
  flex:1;
  overflow-y:auto;
  padding:12px;
}

.drawer-action{
  width:100%;
  display:flex;
  align-items:center;
  gap:10px;
  border:0;
  color:#172033;
  background:rgba(255,255,255,.055);
  border-radius:12px;
  padding:12px;
  margin-bottom:8px;
  text-align:left;
  cursor:pointer;
}

.drawer-action:hover{
  background:rgba(255,255,255,.09);
}

.section-title{
  margin:18px 4px 9px;
  font-size:11px;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.8px;
  opacity:.4;
}

.chat-history{
  display:flex;
  flex-direction:column;
  gap:4px;
}

.chat-history-item{
  display:flex;
  align-items:center;
  gap:7px;
  padding:10px;
  border-radius:11px;
  cursor:pointer;
  transition:.15s;
}

.chat-history-item:hover{
  background:rgba(255,255,255,.055);
}

.chat-history-item.active{
  background:rgba(255,255,255,.085);
}

.chat-history-info{
  min-width:0;
  flex:1;
}

.chat-history-title{
  font-size:13px;
  font-weight:600;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.chat-history-meta{
  margin-top:3px;
  font-size:10px;
  opacity:.4;
}

.delete-chat{
  width:30px;
  height:30px;
  flex:none;
  border:0;
  border-radius:8px;
  background:transparent;
  color:#172033;
  opacity:.48;
  font-size:16px;
  cursor:pointer;
}

.delete-chat:hover{
  opacity:1;
  background:rgba(255,70,70,.13);
}

.empty-history{
  padding:15px 10px;
  font-size:12px;
  opacity:.4;
  line-height:1.5;
}

.chat-wrap{
  width:100%;
  max-width:900px;
  margin:0 auto;
  padding:18px 12px 155px;
}

.messages{
  display:flex;
  flex-direction:column;
  gap:14px;
}

.message{
  width:100%;
  display:flex;
}

.message.user{
  justify-content:flex-end;
}

.message.assistant{
  justify-content:flex-start;
}

.bubble{
  max-width:min(85%,720px);
  padding:11px 14px;
  border-radius:17px;
  font-size:15px;
  line-height:1.55;
  word-break:break-word;
  -webkit-user-select:text;
  user-select:text;
  -webkit-touch-callout:default;
  touch-action:auto;
  cursor:text;
}

.message.user .bubble,
.message.assistant .bubble{
  -webkit-user-select:text;
  user-select:text;
  -webkit-touch-callout:default;
  touch-action:auto;
}

.message.user .bubble{
  background:#245eea;
  border-bottom-right-radius:5px;
}

.message.assistant .bubble{
  background:#191d27;
  border:1px solid rgba(255,255,255,.055);
  border-bottom-left-radius:5px;
}

.message.system .bubble{
  background:rgba(255,255,255,.05);
}

.md h1,
.md h2,
.md h3{
  margin:14px 0 8px;
  line-height:1.25;
}

.md h1{font-size:22px}
.md h2{font-size:19px}
.md h3{font-size:17px}

.md p{
  margin:0 0 9px;
}

.md p:last-child{
  margin-bottom:0;
}

.md ul,
.md ol{
  margin:7px 0 10px;
  padding-left:22px;
}

.md li{
  margin:4px 0;
}

.md blockquote{
  margin:10px 0;
  padding:7px 12px;
  border-left:3px solid #777;
  background:rgba(255,255,255,.04);
  opacity:.9;
}

.md a{
  color:#71a7ff;
  text-decoration:underline;
}

.md code{
  padding:2px 5px;
  border-radius:5px;
  background:#0d1016;
  font-family:monospace;
  font-size:.92em;
}

.md pre{
  margin:10px 0;
  padding:12px;
  overflow:auto;
  border-radius:10px;
  background:#0b0e13;
  border:1px solid rgba(255,255,255,.07);
  white-space:pre;
}

.md pre code{
  padding:0;
  background:transparent;
}

.attached-user-image{
  display:block;
  width:min(100%,320px);
  max-height:360px;
  object-fit:cover;
  border-radius:12px;
  margin-bottom:7px;
  cursor:pointer;
  border:1px solid rgba(255,255,255,.08);
}

.generated-image{
  display:block;
  width:100%;
  max-width:720px;
  border-radius:14px;
  margin-top:8px;
  cursor:pointer;
  border:1px solid rgba(255,255,255,.08);
}

.image-note{
  margin-top:7px;
  font-size:11px;
  opacity:.42;
}

.typing{
  display:flex;
  align-items:center;
  gap:5px;
  padding:5px 2px;
}

.typing span{
  width:6px;
  height:6px;
  border-radius:50%;
  background:#fff;
  opacity:.35;
  animation:typing 1s infinite;
}

.typing span:nth-child(2){animation-delay:.15s}
.typing span:nth-child(3){animation-delay:.3s}

@keyframes typing{
  0%,70%,100%{
    transform:translateY(0);
    opacity:.25;
  }
  35%{
    transform:translateY(-4px);
    opacity:.8;
  }
}

.composer-shell{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:120;
  padding:8px 10px calc(8px + env(safe-area-inset-bottom));
  background:linear-gradient(
    to bottom,
    rgba(15,17,23,0),
    rgba(15,17,23,.94) 22%,
    #0f1117 48%
  );
}

.composer{
  width:100%;
  max-width:900px;
  margin:0 auto;
  border:1px solid rgba(255,255,255,.1);
  background:#171a23;
  border-radius:18px;
  padding:8px;
  box-shadow:0 8px 35px rgba(0,0,0,.25);
}

.photo-preview{
  display:none;
  position:relative;
  width:74px;
  height:74px;
  margin:3px 3px 8px;
}

.photo-preview.show{
  display:block;
}

.photo-preview img{
  width:74px;
  height:74px;
  object-fit:cover;
  border-radius:10px;
}

.remove-photo{
  position:absolute;
  right:-6px;
  top:-6px;
  width:23px;
  height:23px;
  border:0;
  border-radius:50%;
  background:#ef4444;
  color:#172033;
  font-size:15px;
}

.input-row{
  display:flex;
  align-items:flex-end;
  gap:7px;
}

#prompt{
  flex:1;
  min-width:0;
  min-height:42px;
  max-height:150px;
  resize:none;
  border:0;
  outline:0;
  color:#172033;
  background:transparent;
  padding:10px 8px;
  line-height:1.4;
}

#prompt::placeholder{
  color:#172033;
  opacity:.38;
}

.icon-btn{
  width:40px;
  height:40px;
  flex:none;
  border:0;
  border-radius:12px;
  background:rgba(255,255,255,.065);
  color:#172033;
  cursor:pointer;
}

.icon-btn:hover{
  background:rgba(255,255,255,.1);
}

.send-btn{
  background:#2864e8;
}

.send-btn:hover{
  background:#3570ed;
}

.send-btn:disabled{
  opacity:.4;
  cursor:not-allowed;
}

#photoInput{
  display:none;
}

.creation-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:8px;
}

.creation-card{
  position:relative;
  overflow:hidden;
  border-radius:11px;
  background:#0e1117;
  border:1px solid rgba(255,255,255,.06);
}

.creation-card img{
  display:block;
  width:100%;
  aspect-ratio:1/1;
  object-fit:cover;
}

.creation-prompt{
  padding:7px;
  font-size:10px;
  opacity:.6;
  line-height:1.35;
}

.image-viewer{
  position:fixed;
  inset:0;
  z-index:500;
  display:none;
  align-items:center;
  justify-content:center;
  padding:18px;
  background:rgba(0,0,0,.9);
}

.image-viewer.open{
  display:flex;
}

.image-viewer img{
  max-width:100%;
  max-height:90dvh;
  object-fit:contain;
  border-radius:10px;
}

.close-viewer{
  position:absolute;
  top:14px;
  right:14px;
  width:40px;
  height:40px;
  border:0;
  border-radius:12px;
  background:rgba(255,255,255,.12);
  color:#172033;
  font-size:23px;
}

.toast{
  position:fixed;
  left:50%;
  bottom:92px;
  z-index:700;
  transform:translate(-50%,20px);
  max-width:90vw;
  padding:10px 14px;
  border-radius:11px;
  background:#252a36;
  color:#172033;
  font-size:12px;
  opacity:0;
  pointer-events:none;
  transition:.2s;
  box-shadow:0 7px 25px rgba(0,0,0,.3);
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}


.voice-active{
  background:#ef4444 !important;
  color:#fff !important;
}

.pdf-status{
  font-size:11px;
  opacity:.65;
  padding:4px 8px;
}

.response-error{
  white-space:pre-wrap;
}

.typing{
  min-height:20px;
}

.stream-text{white-space:pre-wrap;overflow-wrap:anywhere;}
.stream-status{font-size:11px;opacity:.58;margin-top:7px;}

@media(max-width:600px){

  .header{
    height:55px;
  }

  .brand-name{
    font-size:17px;
  }

  .chat-wrap{
    padding:14px 9px 155px;
  }

  .bubble{
    max-width:90%;
    font-size:15px;
  }

  .composer{
    border-radius:17px;
  }

  .creation-grid{
    grid-template-columns:repeat(2,minmax(0,1fr));
  }
}

/* =========================================================
   AARU MONOCHROME UI — FIXED BLACK / WHITE THEME
   Keep the interface visually stable so typing and replies
   remain readable on every device.
========================================================= */
html,body{
  background:#000 !important;
  color:#fff !important;
}

body,.app,main{
  background:#000 !important;
  color:#fff !important;
}

.header{
  background:#000 !important;
  color:#fff !important;
  border-bottom:1px solid #2a2a2a !important;
  backdrop-filter:none !important;
}

.brand-name,.brand-sub{
  color:#fff !important;
}

.menu-btn,.new-chat-top,.close-drawer{
  background:#1a1a1a !important;
  color:#fff !important;
  border:1px solid #333 !important;
}

.drawer{
  background:#000 !important;
  color:#fff !important;
  border-right:1px solid #2a2a2a !important;
}

.drawer-head{
  border-bottom:1px solid #2a2a2a !important;
}

.drawer-title,.section-title,.chat-history-title,.chat-history-meta,
.drawer-action,.empty-history,.delete-chat{
  color:#fff !important;
}

.drawer-action{
  background:#111 !important;
  border:1px solid #2a2a2a !important;
}

.drawer-action:hover,.chat-history-item:hover,.chat-history-item.active{
  background:#1c1c1c !important;
}

.delete-chat:hover{
  background:#fff !important;
  color:#000 !important;
}

.message.user .bubble,.message.assistant .bubble,.message.system .bubble{
  background:#161616 !important;
  color:#fff !important;
  border:1px solid #303030 !important;
}

.md,.md *{
  color:#fff !important;
}

.md a{
  color:#fff !important;
}

.md blockquote{
  border-left-color:#fff !important;
  background:#111 !important;
}

.md code,.md pre{
  background:#000 !important;
  color:#fff !important;
  border-color:#333 !important;
}

.composer-shell{
  background:#000 !important;
}

.composer{
  background:#111 !important;
  border:1px solid #333 !important;
  box-shadow:0 8px 35px rgba(255,255,255,.06) !important;
}

#prompt{
  color:#fff !important;
  background:transparent !important;
  caret-color:#fff !important;
}

#prompt::placeholder{
  color:#fff !important;
  opacity:.55 !important;
}

.icon-btn{
  background:#1b1b1b !important;
  color:#fff !important;
  border:1px solid #333 !important;
}

.icon-btn:hover{
  background:#292929 !important;
}

.send-btn{
  background:#fff !important;
  color:#000 !important;
  border-color:#fff !important;
}

.send-btn:hover{
  background:#ddd !important;
}

.send-btn:disabled{
  background:#555 !important;
  color:#aaa !important;
}

.remove-photo{
  background:#fff !important;
  color:#000 !important;
}

.photo-preview img,.attached-user-image,.generated-image{
  border-color:#333 !important;
}

.image-viewer{
  background:#000 !important;
}

.close-viewer{
  background:#1b1b1b !important;
  color:#fff !important;
  border:1px solid #333 !important;
}

.toast{
  background:#fff !important;
  color:#000 !important;
  border:1px solid #333 !important;
}

.voice-active{
  background:#fff !important;
  color:#000 !important;
}

.pdf-status,.image-note{
  color:#fff !important;
}

.creation-card{
  background:#111 !important;
  border-color:#333 !important;
}

.creation-prompt{
  color:#fff !important;
}

.typing span{
  background:#fff !important;
}

</style>
</head>
<body>
<div class="app">
<header class="header">
<button aria-label="Menu" class="menu-btn" id="menuBtn">
☰
</button>
<div class="brand">
<div class="brand-name">Aaru AI</div>
<div class="brand-sub">GPT-6 Astra • Native Unified Composer</div>
</div>
<button aria-label="New Chat" class="new-chat-top" id="newChatTop">
＋
</button>
</header>
<div class="drawer-overlay" id="drawerOverlay"></div>
<aside class="drawer" id="drawer">
<div class="drawer-head">
<div class="drawer-title">
Aaru AI
</div>
<button class="close-drawer" id="closeDrawer">
×
</button>
</div>
<div class="drawer-body">
<button class="drawer-action" id="newChatBtn">
<span>＋</span>
<span>नई चैट</span>
</button>
<button class="drawer-action" id="deleteAllBtn">
<span>🗑️</span>
<span>सभी चैट डिलीट करें</span>
</button>
<div class="section-title">
Recent Chats
</div>
<div class="chat-history" id="chatHistory"></div>
<div class="section-title">
Recent Creations
</div>
<div class="creation-grid" id="creationGrid"></div>
</div>
</aside>
<main>
<div class="chat-wrap">
<div class="messages" id="messages"></div>
</div>
</main>
<div class="composer-shell">
<div class="composer">
<div class="photo-preview" id="photoPreview">
<img alt="Selected image" id="photoPreviewImg"/>
<button class="remove-photo" id="removePhoto">
×
</button>
</div>
<div class="input-row">
<button class="icon-btn" id="photoBtn" title="Photo / PDF">
📎
</button>
<button class="icon-btn" id="micBtn" title="Voice Input">
🎙️
</button>
<textarea autocomplete="off" id="prompt" placeholder="Aaru से कुछ भी पूछें..." rows="1" spellcheck="true"></textarea>
<button class="icon-btn" id="speakBtn" title="Voice Output">
🔊
</button>
<button class="icon-btn send-btn" id="sendBtn" title="Send">
➤
</button>
</div>
</div>
</div>
</div>
<input accept="image/*,.pdf,application/pdf" id="photoInput" type="file"/>
<div class="image-viewer" id="imageViewer">
<button class="close-viewer" id="closeViewer">
×
</button>
<img alt="Image preview" id="viewerImg"/>
</div>
<div class="toast" id="toast"></div>
<script defer="True" src="./aaru-app.js"></script>

</body>
</html>
