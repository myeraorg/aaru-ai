<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">

<title>Aaru AI</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  overflow-x:clip;
  overflow-y:auto;
  overscroll-behavior-y:auto;
}

body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100dvh;
  font-family:Arial,Helvetica,sans-serif;
  background:#0f1117;
  color:#fff;
  overflow-x:clip;
  overflow-y:auto;
  overscroll-behavior-y:auto;
}

button,
input,
textarea{
  font:inherit;
}

button{
  -webkit-user-select:none;
  user-select:none;
}

main{
  position:relative;
  flex:1 0 auto;
  min-height:calc(100dvh - 58px);
  overflow:visible;
  scroll-behavior:smooth;
}

.app{
  min-height:100dvh;
  display:flex;
  flex-direction:column;
}

.header{
  position:sticky;
  top:0;
  z-index:100;
  height:58px;
  display:flex;
  align-items:center;
  gap:10px;
  padding:0 12px;
  background:rgba(15,17,23,.96);
  border-bottom:1px solid rgba(255,255,255,.07);
  backdrop-filter:blur(14px);
}

.menu-btn{
  width:40px;
  height:40px;
  border:0;
  border-radius:12px;
  background:rgba(255,255,255,.07);
  color:#fff;
  font-size:22px;
  cursor:pointer;
}

.brand{
  min-width:0;
  flex:1;
}

.brand-name{
  font-size:18px;
  font-weight:800;
  letter-spacing:.2px;
}

.brand-sub{
  margin-top:1px;
  font-size:10px;
  opacity:.45;
}

.new-chat-top{
  width:40px;
  height:40px;
  border:0;
  border-radius:12px;
  background:rgba(255,255,255,.07);
  color:#fff;
  font-size:21px;
  cursor:pointer;
}

.drawer-overlay{
  position:fixed;
  inset:0;
  z-index:200;
  background:rgba(0,0,0,.58);
  opacity:0;
  pointer-events:none;
  transition:.2s;
}

.drawer-overlay.open{
  opacity:1;
  pointer-events:auto;
}

.drawer{
  position:fixed;
  z-index:210;
  top:0;
  left:0;
  bottom:0;
  width:min(88vw,340px);
  background:#151821;
  border-right:1px solid rgba(255,255,255,.07);
  transform:translateX(-105%);
  transition:.22s ease;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

.drawer.open{
  transform:translateX(0);
}

.drawer-head{
  height:58px;
  flex:none;
  display:flex;
  align-items:center;
  gap:10px;
  padding:0 12px;
  border-bottom:1px solid rgba(255,255,255,.07);
}

.drawer-title{
  flex:1;
  font-size:17px;
  font-weight:800;
}

.close-drawer{
  width:38px;
  height:38px;
  border:0;
  border-radius:11px;
  background:rgba(255,255,255,.07);
  color:#fff;
  font-size:21px;
}

.drawer-body{
  flex:1;
  overflow-y:auto;
  padding:12px;
}

.drawer-action{
  width:100%;
  display:flex;
  align-items:center;
  gap:10px;
  border:0;
  color:#fff;
  background:rgba(255,255,255,.055);
  border-radius:12px;
  padding:12px;
  margin-bottom:8px;
  text-align:left;
  cursor:pointer;
}

.drawer-action:hover{
  background:rgba(255,255,255,.09);
}

.section-title{
  margin:18px 4px 9px;
  font-size:11px;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.8px;
  opacity:.4;
}

.chat-history{
  display:flex;
  flex-direction:column;
  gap:4px;
}

.chat-history-item{
  display:flex;
  align-items:center;
  gap:7px;
  padding:10px;
  border-radius:11px;
  cursor:pointer;
  transition:.15s;
}

.chat-history-item:hover{
  background:rgba(255,255,255,.055);
}

.chat-history-item.active{
  background:rgba(255,255,255,.085);
}

.chat-history-info{
  min-width:0;
  flex:1;
}

.chat-history-title{
  font-size:13px;
  font-weight:600;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.chat-history-meta{
  margin-top:3px;
  font-size:10px;
  opacity:.4;
}

.delete-chat{
  width:30px;
  height:30px;
  flex:none;
  border:0;
  border-radius:8px;
  background:transparent;
  color:#fff;
  opacity:.48;
  font-size:16px;
  cursor:pointer;
}

.delete-chat:hover{
  opacity:1;
  background:rgba(255,70,70,.13);
}

.empty-history{
  padding:15px 10px;
  font-size:12px;
  opacity:.4;
  line-height:1.5;
}

.chat-wrap{
  width:100%;
  max-width:900px;
  margin:0 auto;
  padding:18px 12px 155px;
}

.messages{
  display:flex;
  flex-direction:column;
  gap:14px;
}

.message{
  width:100%;
  display:flex;
}

.message.user{
  justify-content:flex-end;
}

.message.assistant{
  justify-content:flex-start;
}

.bubble{
  max-width:min(85%,720px);
  padding:11px 14px;
  border-radius:17px;
  font-size:15px;
  line-height:1.55;
  word-break:break-word;
  -webkit-user-select:text;
  user-select:text;
  -webkit-touch-callout:default;
  touch-action:auto;
  cursor:text;
}

.message.user .bubble,
.message.assistant .bubble{
  -webkit-user-select:text;
  user-select:text;
  -webkit-touch-callout:default;
  touch-action:auto;
}

.message.user .bubble{
  background:#245eea;
  border-bottom-right-radius:5px;
}

.message.assistant .bubble{
  background:#191d27;
  border:1px solid rgba(255,255,255,.055);
  border-bottom-left-radius:5px;
}

.message.system .bubble{
  background:rgba(255,255,255,.05);
}

.md h1,
.md h2,
.md h3{
  margin:14px 0 8px;
  line-height:1.25;
}

.md h1{font-size:22px}
.md h2{font-size:19px}
.md h3{font-size:17px}

.md p{
  margin:0 0 9px;
}

.md p:last-child{
  margin-bottom:0;
}

.md ul,
.md ol{
  margin:7px 0 10px;
  padding-left:22px;
}

.md li{
  margin:4px 0;
}

.md blockquote{
  margin:10px 0;
  padding:7px 12px;
  border-left:3px solid #777;
  background:rgba(255,255,255,.04);
  opacity:.9;
}

.md a{
  color:#71a7ff;
  text-decoration:underline;
}

.md code{
  padding:2px 5px;
  border-radius:5px;
  background:#0d1016;
  font-family:monospace;
  font-size:.92em;
}

.md pre{
  margin:10px 0;
  padding:12px;
  overflow:auto;
  border-radius:10px;
  background:#0b0e13;
  border:1px solid rgba(255,255,255,.07);
  white-space:pre;
}

.md pre code{
  padding:0;
  background:transparent;
}

.attached-user-image{
  display:block;
  width:min(100%,320px);
  max-height:360px;
  object-fit:cover;
  border-radius:12px;
  margin-bottom:7px;
  cursor:pointer;
  border:1px solid rgba(255,255,255,.08);
}

.generated-image{
  display:block;
  width:100%;
  max-width:720px;
  border-radius:14px;
  margin-top:8px;
  cursor:pointer;
  border:1px solid rgba(255,255,255,.08);
}

.image-note{
  margin-top:7px;
  font-size:11px;
  opacity:.42;
}

.typing{
  display:flex;
  align-items:center;
  gap:5px;
  padding:5px 2px;
}

.typing span{
  width:6px;
  height:6px;
  border-radius:50%;
  background:#fff;
  opacity:.35;
  animation:typing 1s infinite;
}

.typing span:nth-child(2){animation-delay:.15s}
.typing span:nth-child(3){animation-delay:.3s}

@keyframes typing{
  0%,70%,100%{
    transform:translateY(0);
    opacity:.25;
  }
  35%{

    opacity:.8;
  }
}

.composer-shell{

  right:0;

  padding:8px 10px calc(8px + env(safe-area-inset-bottom));

.composer{

  max-width:900px;

.input-row{

#prompt{

  max-height:150px;

  padding:10px 8px;

#prompt::placeholder{

}

.icon-btn{
  width:40px;
  height:40px;
  flex:none;
  border:0;
  border-radius:12px;
  background:rgba(255,255,255,.065);
  color:#fff;
  cursor:pointer;
}

.icon-btn:hover{
  background:rgba(255,255,255,.1);
}

.send-btn{
  background:#2864e8;
}

.send-btn:hover{
  background:#3570ed;
}

.send-btn:disabled{

}

#photoInput{
  display:none;
}

.creation-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:8px;
}

.creation-card{
  position:relative;
  overflow:hidden;
  border-radius:11px;
  background:#0e1117;
  border:1px solid rgba(255,255,255,.06);
}

.creation-card img{
  display:block;
  width:100%;
  aspect-ratio:1/1;
  object-fit:cover;
}

.creation-prompt{
  padding:7px;
  font-size:10px;
  opacity:.6;
  line-height:1.35;
}

.image-viewer{
  position:fixed;
  inset:0;
  z-index:500;
  display:none;
  align-items:center;
  justify-content:center;
  padding:18px;
  background:rgba(0,0,0,.9);
}

.image-viewer.open{

}

.image-viewer img{
  max-width:100%;
  max-height:90dvh;
  object-fit:contain;
  border-radius:10px;
}

.close-viewer{
  position:absolute;
  top:14px;
  right:14px;
  width:40px;
  height:40px;
  border:0;
  border-radius:12px;
  background:rgba(255,255,255,.12);
  color:#fff;
  font-size:23px;
}

.toast{
  position:fixed;
  left:50%;
  bottom:92px;
  z-index:700;
  transform:translate(-50%,20px);
  max-width:90vw;
  padding:10px 14px;
  border-radius:11px;
  background:#252a36;
  color:#fff;
  font-size:12px;
  opacity:0;
  pointer-events:none;
  transition:.2s;
  box-shadow:0 7px 25px rgba(0,0,0,.3);
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}


.voice-active{
  background:#ef4444 !important;
  color:#fff !important;
}

.pdf-status{
  font-size:11px;
  opacity:.65;
  padding:4px 8px;
}

@media(max-width:600px){

  .header{
    height:55px;
  }

  .brand-name{
    font-size:17px;
  }

  .chat-wrap{
    padding:14px 9px 155px;
  }

  .bubble{
    max-width:90%;
    font-size:15px;
  }

  .composer{
    border-radius:17px;
  }

  .creation-grid{
    grid-template-columns:repeat(2,minmax(0,1fr));
  }
}
</style>
</head>

<script>
"use strict";


/* =========================================================
   CONFIG
========================================================= */

const API =
  "https://aaru-ai-api.myera-org.workers.dev/";


const CHAT_LIST_KEY =
  "aaru_chat_history_v2";


const OLD_CHAT_KEY =
  "aaru_chat_messages";


const IMAGE_KEY =
  "aaru_history";


const MAX_SAVED_CHATS = 8;
const MAX_MESSAGES_PER_CHAT = 30;
const MAX_MESSAGE_CHARS = 4000;

const MAX_SAVED_CREATIONS = 4;
const MAX_CREATION_PROMPT_CHARS = 300;
const MAX_HISTORY_IMAGE_CHARS = 420000;


/*
  Cloudflare FLUX.2 Klein 4B के लिए
  reference image 512x512 से छोटी होनी चाहिए।

  इसलिए 511 रखा गया है।
*/
const MAX_MODEL_IMAGE_SIZE = 511;


/* =========================================================
   STATE
========================================================= */

let chats = [];
let currentChatId = null;
let messages = [];

let selectedPhotoBase64 = null;
let selectedPhotoUrl = null;
  selectedDocumentText = "";
let selectedDocumentText = "";
let voiceOutputEnabled = true;
let recognition = null;

let isBusy = false;

let volatileCreations = [];

let creationsLoaded = false;

let appReady = false;

let lastPageShowRecovery = 0;


/* =========================================================
   DOM
========================================================= */

const messagesEl =
  document.getElementById("messages");

const promptEl =
  document.getElementById("prompt");

const sendBtn =
  document.getElementById("sendBtn");

const photoInput =
  document.getElementById("photoInput");

const photoPreview =
  document.getElementById("photoPreview");

const photoPreviewImg =
  document.getElementById("photoPreviewImg");

const chatHistoryEl =
  document.getElementById("chatHistory");

const creationGrid =
  document.getElementById("creationGrid");

const drawer =
  document.getElementById("drawer");

const drawerOverlay =
  document.getElementById("drawerOverlay");

const imageViewer =
  document.getElementById("imageViewer");

const viewerImg =
  document.getElementById("viewerImg");

const toastEl =
  document.getElementById("toast");

/* =========================================================
   HELPERS
========================================================= */

function makeChatId(){

  return "chat_" +
    Date.now().toString(36) +
    "_" +
    Math.random()
      .toString(36)
      .slice(2,9);
}


function makeImageId(){

  return "img_" +
    Date.now().toString(36) +
    "_" +
    Math.random()
      .toString(36)
      .slice(2,10);
}


function showToast(text){

  toastEl.textContent =
    String(text || "");

  toastEl.classList.add("show");

  clearTimeout(showToast.timer);

  showToast.timer =
    setTimeout(() => {

      toastEl.classList.remove(
        "show"
      );

    },2200);
}


function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


/* =========================================================
   MARKDOWN RENDERER
   IMPORTANT: UNCHANGED
========================================================= */

function cleanAaruText(text){
  return String(text ?? "")
    .replace(/<br\s*\/?>/gi,"\n")
    .replace(/<div\s*>/gi,"\n")
    .replace(/<\/div\s*>/gi,"\n")
    .replace(/\r\n/g,"\n")
    .replace(/\r/g,"\n")
    .replace(/\*\*(.*?)\*\*/gs,"$1")
    .replace(/(?<!\*)\*([^*\n]+)\*(?!\*)/g,"$1")
    .replace(/\n{3,}/g,"\n\n")
    .trim();
}

function cleanAaruChunk(text){
  return String(text ?? "")
    .replace(/<br\s*\/?>/gi,"\n")
    .replace(/\*\*/g,"")
    .replace(/(?<!\*)\*(?!\*)/g,"");
}

function inlineMarkdown(text){

  let s =
    escapeHTML(text);

  s =
    s.replace(
      /`([^`]+)`/g,
      "<code>$1</code>"
    );

  s =
    s.replace(
      /\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,
      '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>'
    );

  s =
    s.replace(
      /\*\*([^*]+)\*\*/g,
      "<strong>$1</strong>"
    );

  s =
    s.replace(
      /__([^_]+)__/g,
      "<strong>$1</strong>"
    );

  s =
    s.replace(
      /(?<!\*)\*([^*]+)\*(?!\*)/g,
      "<em>$1</em>"
    );

  s =
    s.replace(
      /(?<!_)_([^_]+)_(?!_)/g,
      "<em>$1</em>"
    );

  return s;
}


function renderMarkdown(text){

  const source = cleanAaruText(text);

  const lines =
    source.split("\n");

  let html = "";

  let inCode = false;

  let codeBuffer = [];

  let inUl = false;

  let inOl = false;

  let paragraph = [];


  function closeLists(){

    if(inUl){

      html += "</ul>";

      inUl = false;
    }

    if(inOl){

      html += "</ol>";

      inOl = false;
    }
  }


  function flushParagraph(buffer){

    if(!buffer.length){
      return;
    }

    const value =
      buffer.join("\n")
        .trim();

    if(!value){
      return;
    }

    html +=
      "<p>" +
      inlineMarkdown(
        value.replace(
          /\n/g,
          "<br>"
        )
      ) +
      "</p>";
  }


  for(let i=0;i<lines.length;i++){

    const line =
      lines[i];


    if(
      line.trim()
        .startsWith("```")
    ){

      if(inCode){

        html +=
          "<pre><code>" +
          escapeHTML(
            codeBuffer.join("\n")
          ) +
          "</code></pre>";

        codeBuffer = [];

        inCode = false;

      }else{

        flushParagraph(
          paragraph
        );

        paragraph = [];

        closeLists();

        inCode = true;
      }

      continue;
    }


    if(inCode){

      codeBuffer.push(
        line
      );

      continue;
    }


    if(!line.trim()){

      flushParagraph(
        paragraph
      );

      paragraph = [];

      closeLists();

      continue;
    }


    const h3 =
      line.match(
        /^###\s+(.+)$/
      );

    const h2 =
      line.match(
        /^##\s+(.+)$/
      );

    const h1 =
      line.match(
        /^#\s+(.+)$/
      );


    if(h1){

      flushParagraph(
        paragraph
      );

      paragraph = [];

      closeLists();

      html +=
        "<h1>" +
        inlineMarkdown(h1[1]) +
        "</h1>";

      continue;
    }


    if(h2){

      flushParagraph(
        paragraph
      );

      paragraph = [];

      closeLists();

      html +=
        "<h2>" +
        inlineMarkdown(h2[1]) +
        "</h2>";

      continue;
    }


    if(h3){

      flushParagraph(
        paragraph
      );

      paragraph = [];

      closeLists();

      html +=
        "<h3>" +
        inlineMarkdown(h3[1]) +
        "</h3>";

      continue;
    }


    const ul =
      line.match(
        /^\s*[-*+]\s+(.+)$/
      );

    const ol =
      line.match(
        /^\s*\d+[.)]\s+(.+)$/
      );


    if(ul){

      flushParagraph(
        paragraph
      );

      paragraph = [];

      if(inOl){

        html += "</ol>";

        inOl = false;
      }

      if(!inUl){

        html += "<ul>";

        inUl = true;
      }

      html +=
        "<li>" +
        inlineMarkdown(ul[1]) +
        "</li>";

      continue;
    }


    if(ol){

      flushParagraph(
        paragraph
      );

      paragraph = [];

      if(inUl){

        html += "</ul>";

        inUl = false;
      }

      if(!inOl){

        html += "<ol>";

        inOl = true;
      }

      html +=
        "<li>" +
        inlineMarkdown(ol[1]) +
        "</li>";

      continue;
    }


    const quote =
      line.match(
        /^\s*>\s?(.*)$/
      );


    if(quote){

      flushParagraph(
        paragraph
      );

      paragraph = [];

      closeLists();

      html +=
        "<blockquote>" +
        inlineMarkdown(quote[1]) +
        "</blockquote>";

      continue;
    }


    paragraph.push(
      line
    );
  }


  if(inCode){

    html +=
      "<pre><code>" +
      escapeHTML(
        codeBuffer.join("\n")
      ) +
      "</code></pre>";
  }


  flushParagraph(
    paragraph
  );

  closeLists();

  return html;
}


/* =========================================================
   STORAGE
========================================================= */

function storageAvailable(){

  try{

    const storage =
      window.localStorage;

    if(!storage){
      return false;
    }

    const key =
      "__aaru_test__";

    storage.setItem(
      key,
      "1"
    );

    storage.removeItem(
      key
    );

    return true;

  }catch(error){

    return false;
  }
}


const HAS_STORAGE =
  storageAvailable();


function safeGet(key){

  if(!HAS_STORAGE){
    return null;
  }

  try{

    return localStorage.getItem(
      key
    );

  }catch(error){

    return null;
  }
}


function safeSet(key,value){

  if(!HAS_STORAGE){
    return false;
  }

  try{

    localStorage.setItem(
      key,
      value
    );

    return true;

  }catch(error){

    console.warn(
      "Storage write failed:",
      key,
      error
    );

    return false;
  }
}


function safeRemove(key){

  if(!HAS_STORAGE){
    return;
  }

  try{

    localStorage.removeItem(
      key
    );

  }catch(error){}
}


/* =========================================================
   CHAT NORMALIZE
========================================================= */

function normalizeChat(chat){

  if(!chat){
    return null;
  }

  const id =
    String(chat.id || "");

  if(!id){
    return null;
  }


  const raw =
    Array.isArray(chat.messages)
      ? chat.messages
      : [];


  const normalized =
    raw
      .slice(-MAX_MESSAGES_PER_CHAT)
      .map(item => {

        const result = {

          role:
            item.role === "user"
              ? "user"
              : "assistant",

          content:
            String(
              item.content ??
              item.text ??
              ""
            ).slice(
              0,
              MAX_MESSAGE_CHARS
            )
        };


        if(item.imageId){

          result.imageId =
            String(
              item.imageId
            ).slice(
              0,
              100
            );
        }


        return result;
      });


  let title =
    String(
      chat.title || ""
    )
    .trim()
    .slice(0,80);


  if(!title){

    const firstUser =
      normalized.find(
        item =>
          item.role === "user"
      );

    title =
      firstUser
        ? firstUser.content
            .replace(/\s+/g," ")
            .slice(0,80)
        : "नई चैट";
  }


  return {

    id,

    title:
      title || "नई चैट",

    messages:
      normalized,

    createdAt:
      Number(
        chat.createdAt
      ) || Date.now(),

    updatedAt:
      Number(
        chat.updatedAt
      ) || Date.now()
  };
}


/* =========================================================
   LOAD CHAT HISTORY
========================================================= */

function loadChatHistory(){

  chats = [];

  const raw =
    safeGet(
      CHAT_LIST_KEY
    );


  if(raw){

    try{

      const parsed =
        JSON.parse(raw);

      if(Array.isArray(parsed)){

        const seen =
          new Set();

        chats =
          parsed
            .map(normalizeChat)
            .filter(Boolean)
            .filter(chat => {

              if(seen.has(chat.id)){
                return false;
              }

              seen.add(chat.id);

              return true;
            })
            .sort(
              (a,b) =>
                (b.updatedAt || 0) -
                (a.updatedAt || 0)
            )
            .slice(
              0,
              MAX_SAVED_CHATS
            );
      }

    }catch(error){

      console.warn(
        "Chat history corrupted:",
        error
      );

      safeRemove(
        CHAT_LIST_KEY
      );
    }

    return;
  }


  /*
    पुराने storage की migration।
  */

  const oldRaw =
    safeGet(
      OLD_CHAT_KEY
    );


  if(oldRaw){

    try{

      const old =
        JSON.parse(
          oldRaw
        );

      if(
        Array.isArray(old) &&
        old.length
      ){

        const now =
          Date.now();

        const migrated =
          normalizeChat({

            id:
              makeChatId(),

            title:
              "पुरानी चैट",

            messages:
              old,

            createdAt:
              now,

            updatedAt:
              now
          });


        if(migrated){
          chats = [migrated];
        }
      }

    }catch(error){}

    safeRemove(
      OLD_CHAT_KEY
    );
  }
}


/* =========================================================
   SAVE CHAT HISTORY
========================================================= */

function saveChatHistory(){

  if(!HAS_STORAGE){
    return;
  }


  const sorted =
    chats
      .slice()
      .sort(
        (a,b) =>
          (b.updatedAt || 0) -
          (a.updatedAt || 0)
      )
      .slice(
        0,
        MAX_SAVED_CHATS
      );


  /*
    पहले सामान्य save।
  */

  if(
    safeSet(
      CHAT_LIST_KEY,
      JSON.stringify(sorted)
    )
  ){

    chats = sorted;

    return;
  }


  /*
    Storage quota भरने पर कम chats।
  */

  for(
    const count of [6,4,3,2,1]
  ){

    const smaller =
      sorted.slice(
        0,
        count
      );

    if(
      safeSet(
        CHAT_LIST_KEY,
        JSON.stringify(smaller)
      )
    ){

      chats = sorted;

      return;
    }
  }


  /*
    Last resort:
    image history हटाकर chat बचाएँ।
  */

  safeRemove(
    IMAGE_KEY
  );


  const emergency =
    sorted.slice(
      0,
      3
    );


  safeSet(
    CHAT_LIST_KEY,
    JSON.stringify(
      emergency
    )
  );

  chats = sorted;
}


/* =========================================================
   NEW CHAT
========================================================= */

function createNewChat(
  persist = true
){

  const now =
    Date.now();


  const chat = {

    id:
      makeChatId(),

    title:
      "नई चैट",

    messages:
      [],

    createdAt:
      now,

    updatedAt:
      now
  };


  chats.unshift(
    chat
  );


  chats =
    chats
      .sort(
        (a,b) =>
          (b.updatedAt || 0) -
          (a.updatedAt || 0)
      )
      .slice(
        0,
        MAX_SAVED_CHATS
      );


  currentChatId =
    chat.id;

  messages = [];


  if(persist){

    saveChatHistory();
  }


  return chat;
}


/* =========================================================
   ENSURE CURRENT CHAT
========================================================= */

function ensureCurrentChat(){

  if(currentChatId){

    const existing =
      chats.find(
        chat =>
          chat.id === currentChatId
      );

    if(existing){
      return existing;
    }
  }


  return createNewChat(
    true
  );
}


/* =========================================================
   SAVE CURRENT CHAT
========================================================= */

function saveCurrentChat(){

  const chat =
    ensureCurrentChat();


  chat.messages =
    messages
      .slice(
        -MAX_MESSAGES_PER_CHAT
      )
      .map(item => {

        const result = {

          role:
            item.role === "user"
              ? "user"
              : "assistant",

          content:
            String(
              item.content || ""
            ).slice(
              0,
              MAX_MESSAGE_CHARS
            )
        };


        if(item.imageId){

          result.imageId =
            String(
              item.imageId
            ).slice(
              0,
              100
            );
        }


        return result;
      });


  const firstUser =
    chat.messages.find(
      item =>
        item.role === "user"
    );


  chat.title =
    firstUser
      ? firstUser.content
          .replace(/\s+/g," ")
          .slice(0,80)
      : "नई चैट";


  chat.updatedAt =
    Date.now();


  saveChatHistory();

  renderChatHistory();
}

/* =========================================================
   DELETE CHAT
========================================================= */

function deleteChat(id){

  const chat =
    chats.find(
      item =>
        item.id === id
    );


  if(!chat){
    return;
  }


  const ok =
    confirm(
      `क्या आप "${chat.title || "इस चैट"}" को डिलीट करना चाहते हैं?`
    );


  if(!ok){
    return;
  }


  chats =
    chats.filter(
      item =>
        item.id !== id
    );


  if(currentChatId === id){

    currentChatId =
      null;

    messages = [];

    createNewChat(
      true
    );

    renderCurrentChat();

  }else{

    saveChatHistory();
  }


  renderChatHistory();

  showToast(
    "चैट डिलीट कर दी गई।"
  );
}

/* =========================================================
   IMAGE HISTORY
========================================================= */

function getStoredCreations(){

  if(!HAS_STORAGE){
    return [];
  }


  const raw =
    safeGet(
      IMAGE_KEY
    );


  if(!raw){
    return [];
  }


  try{

    const parsed =
      JSON.parse(
        raw
      );


    if(!Array.isArray(parsed)){
      return [];
    }


    return parsed
      .filter(
        item =>
          item &&
          typeof item.image === "string"
      )
      .slice(
        0,
        MAX_SAVED_CREATIONS
      );

  }catch(error){

    console.warn(
      "Image history invalid:",
      error
    );

    safeRemove(
      IMAGE_KEY
    );

    return [];
  }
}


/* =========================================================
   CREATIONS
========================================================= */

function getCreations(){

  const stored =
    getStoredCreations();


  const all = [
    ...volatileCreations,
    ...stored
  ];


  const seen =
    new Set();


  return all
    .filter(item => {

      if(
        !item ||
        !item.image ||
        !item.id
      ){
        return false;
      }


      if(
        seen.has(
          item.id
        )
      ){
        return false;
      }


      seen.add(
        item.id
      );

      return true;
    })
    .sort(
      (a,b) =>
        (b.time || b.createdAt || 0) -
        (a.time || a.createdAt || 0)
    )
    .slice(
      0,
      MAX_SAVED_CREATIONS
    );
}


function findCreationById(id){

  if(!id){
    return null;
  }


  const volatile =
    volatileCreations.find(
      item =>
        item.id === id
    );


  if(volatile){
    return volatile;
  }


  return getStoredCreations()
    .find(
      item =>
        item.id === id
    ) || null;
}


/* =========================================================
   SAVE CREATIONS
========================================================= */

function saveCreations(list){

  if(!HAS_STORAGE){
    return false;
  }


  try{

    const clean =
      list
        .filter(
          item =>
            item &&
            item.image &&
            item.image.length <=
              MAX_HISTORY_IMAGE_CHARS
        )
        .slice(
          0,
          MAX_SAVED_CREATIONS
        );


    return safeSet(
      IMAGE_KEY,
      JSON.stringify(
        clean
      )
    );

  }catch(error){

    console.warn(
      "Creation save failed:",
      error
    );

    return false;
  }
}


/* =========================================================
   IMAGE BLOB HELPERS
========================================================= */

async function dataURLToBlob(
  dataURL
){

  if(!dataURL){
    throw new Error(
      "Image data missing"
    );
  }


  /*
    data:image/...;base64,...
  */

  if(
    dataURL.startsWith(
      "data:"
    )
  ){

    const parts =
      dataURL.split(",");

    const header =
      parts[0];

    const body =
      parts.slice(1).join(",");


    const mime =
      (
        header.match(
          /data:([^;]+)/
        ) || []
      )[1] ||
      "image/png";


    const binary =
      atob(body);


    const bytes =
      new Uint8Array(
        binary.length
      );


    for(
      let i=0;
      i<binary.length;
      i++
    ){

      bytes[i] =
        binary.charCodeAt(i);
    }


    return new Blob(
      [bytes],
      {
        type:mime
      }
    );
  }


  const response =
    await fetch(
      dataURL
    );


  if(!response.ok){

    throw new Error(
      "Image fetch failed"
    );
  }


  return response.blob();
}


async function blobToDataURL(
  blob
){

  return new Promise(
    (resolve,reject) => {

      const reader =
        new FileReader();


      reader.onload =
        () =>
          resolve(
            reader.result
          );


      reader.onerror =
        reject;


      reader.readAsDataURL(
        blob
      );
    }
  );
}

   IMAGE RESIZE

async function resizeImageDataURL(

){

  if(!dataURL){

  const img =
    new Image();


  await new Promise(
    (resolve,reject) => {

      img.onload =
        resolve;

      img.onerror =
        reject;

      img.src =
        dataURL;
    }
  );


  const sourceWidth =
    img.naturalWidth ||
    img.width;


  const sourceHeight =
    img.naturalHeight ||
    img.height;


  if(
    !sourceWidth ||
    !sourceHeight
  ){

    return dataURL;
  }


  const scale =
    Math.min(
      1,
      maxSize /
      Math.max(
        sourceWidth,
        sourceHeight
      )
    );


  const width =
    Math.max(
      1,
      Math.round(
        sourceWidth * scale
      )
    );


  const height =
    Math.max(
      1,
      Math.round(
        sourceHeight * scale
      )
    );


  const canvas =
    document.createElement(
      "canvas"
    );


  canvas.width =
    width;

  canvas.height =
    height;


  const ctx =
    canvas.getContext(
      "2d"
    );


  if(!ctx){
    return dataURL;
  }


  ctx.drawImage(
    img,
    0,
    0,
    width,
    height
  );


  /*
    JPEG reference image काफी छोटा रहेगा।
  */

  return canvas.toDataURL(
    "image/jpeg",
    quality
  );
}


/* =========================================================
   HISTORY IMAGE
========================================================= */

async function blobToHistoryDataURL(
  blob,
  maxSize = 560
){

  try{

    const bitmap =
      await createImageBitmap(
        blob
      );


    /*
      IMPORTANT:
      dimensions close() से पहले save करें।
    */

    const originalWidth =
      bitmap.width;

    const originalHeight =
      bitmap.height;


    const scale =
      Math.min(
        1,
        maxSize /
        Math.max(
          originalWidth,
          originalHeight
        )
      );


    const width =
      Math.max(
        1,
        Math.round(
          originalWidth * scale
        )
      );


    const height =
      Math.max(
        1,
        Math.round(
          originalHeight * scale
        )
      );


    const canvas =
      document.createElement(
        "canvas"
      );


    canvas.width =
      width;

    canvas.height =
      height;


    const ctx =
      canvas.getContext(
        "2d"
      );


    if(!ctx){

      bitmap.close();

      return null;
    }


    ctx.drawImage(
      bitmap,
      0,
      0,
      width,
      height
    );


    bitmap.close();


    /*
      WebP preferred.
    */

    let dataURL =
      canvas.toDataURL(
        "image/webp",
        .70
      );


    /*
      Browser WebP support न करे तो JPEG।
    */

    if(
      !dataURL.startsWith(
        "data:image/webp"
      )
    ){

      dataURL =
        canvas.toDataURL(
          "image/jpeg",
          .70
        );
    }


    /*
      History के लिए hard limit।
    */

    if(
      dataURL.length >
      MAX_HISTORY_IMAGE_CHARS
    ){

      const smallerCanvas =
        document.createElement(
          "canvas"
        );


      const smallerMax =
        420;


      const smallerScale =
        Math.min(
          1,
          smallerMax /
          Math.max(
            originalWidth,
            originalHeight
          )
        );


      const smallWidth =
        Math.max(
          1,
          Math.round(
            originalWidth *
            smallerScale
          )
        );


      const smallHeight =
        Math.max(
          1,
          Math.round(
            originalHeight *
            smallerScale
          )
        );


      smallerCanvas.width =
        smallWidth;

      smallerCanvas.height =
        smallHeight;


      const smallerCtx =
        smallerCanvas.getContext(
          "2d"
        );


      if(!smallerCtx){
        return null;
      }


      /*
        Original bitmap बंद हो चुका है,
        इसलिए current canvas से downscale करें।
      */

      smallerCtx.drawImage(
        canvas,
        0,
        0,
        smallWidth,
        smallHeight
      );


      dataURL =
        smallerCanvas.toDataURL(
          "image/jpeg",
          .62
        );


      if(
        dataURL.length >
        MAX_HISTORY_IMAGE_CHARS
      ){

        return null;
      }
    }


    return dataURL;

  }catch(error){

    console.warn(
      "History image compression failed:",
      error
    );

    return null;
  }
}


/* =========================================================
   SAVE CREATION
========================================================= */

async function saveCreation(
  imageData,
  promptText
){

  if(!imageData){
    return null;
  }


  const imageId =
    makeImageId();


  /*
    Original image को localStorage में नहीं डालेंगे।
    पहले छोटा history copy बनाएँगे।
  */

  let historyImage =
    null;


  try{

    const blob =
      await dataURLToBlob(
        imageData
      );


    historyImage =
      await blobToHistoryDataURL(
        blob,
        560
      );

  }catch(error){

    console.warn(
      "Creation history conversion failed:",
      error
    );
  }


  /*
    अगर compressed history नहीं बनी,
    तो current session में full image रहेगी।
    localStorage में नहीं जाएगी।
  */

  const record = {

    id:
      imageId,

    image:
      historyImage ||
      imageData,

    prompt:
      String(
        promptText || ""
      ).slice(
        0,
        MAX_CREATION_PROMPT_CHARS
      ),

    time:
      Date.now()
  };


  volatileCreations.unshift(
    record
  );


  volatileCreations =
    volatileCreations.slice(
      0,
      MAX_SAVED_CREATIONS
    );


  /*
    केवल compressed image storage में save करें।
  */

  if(historyImage){

    const existing =
      getStoredCreations();


    const list =
      [
        {
          ...record,
          image:
            historyImage
        },
        ...existing
      ]
      .slice(
        0,
        MAX_SAVED_CREATIONS
      );


    if(
      saveCreations(
        list
      )
    ){

      /*
        Storage में successfully save हो गई,
        इसलिए duplicate volatile copy हटा दें।
      */

      volatileCreations =
        volatileCreations.filter(
          item =>
            item.id !== imageId
        );
    }
  }


  creationsLoaded =
    true;


  renderCreations();


  return imageId;
}

/* =========================================================
   IMAGE RESPONSE NORMALIZATION
========================================================= */

function normalizeImageResult(
  value
){

  if(!value){
    return null;
  }


  /*
    Direct data URL.
  */

  if(
    typeof value === "string"
  ){

    const s =
      value.trim();


    if(!s){
      return null;
    }


    if(
      s.startsWith(
        "data:image/"
      )
    ){

      return s;
    }


    /*
      URL भी स्वीकार करें।
    */

    if(
      /^https?:\/\//i.test(s)
    ){

      return s;
    }


    /*
      Raw Base64।
    */

    if(
      /^[A-Za-z0-9+/=\r\n]+$/.test(
        s
      )
    ){

      return (
        "data:image/png;base64," +
        s.replace(
          /\s/g,
          ""
        )
      );
    }


    return null;
  }


  /*
    Array response।
  */

  if(
    Array.isArray(value)
  ){

    for(
      const item of value
    ){

      const found =
        normalizeImageResult(
          item
        );

      if(found){
        return found;
      }
    }

    return null;
  }


  if(
    typeof value === "object"
  ){

    const candidates = [

      value.image,

      value.image_url,

      value.imageUrl,

      value.url,

      value.result,

      value.data
    ];


    for(
      const item of candidates
    ){

      const found =
        normalizeImageResult(
          item
        );

      if(found){
        return found;
      }
    }
  }


  return null;
}


/* =========================================================
   RAW IMAGE RESPONSE -> DATA URL
========================================================= */

async function responseToImage(
  response
){

  const contentType =
    (
      response.headers.get(
        "content-type"
      ) || ""
    ).toLowerCase();


  /*
    Worker अगर सीधे image/png,
    image/jpeg या image/webp लौटाता है।
  */

  if(
    contentType.startsWith(
      "image/"
    )
  ){

    const blob =
      await response.blob();


    return blobToDataURL(
      blob
    );
  }


  /*
    JSON response।
  */

  const text =
    await response.text();


  let data = null;


  try{

    data =
      text
        ? JSON.parse(text)
        : null;

  }catch(error){

    throw new Error(
      text ||
      "Image response पढ़ा नहीं जा सका।"
    );
  }


  if(!response.ok){

    throw new Error(
      data?.error ||
      data?.message ||
      data?.response ||
      "Image request failed."
    );
  }


  const image =
    normalizeImageResult(
      data
    );


  if(!image){

    throw new Error(
      "Image response में image नहीं मिली।"
    );
  }


  return image;
}

    "change background",

    "remove background",

    "replace background",

    "edit this",

    "edit the photo",

    "edit image",

    "replace the background",

    "remove the background"

  if(

   CHAT IMAGE NORMALIZATION

function normalizeChatResult(
  data
){

  /*
    Worker JSON object।
  */

  if(
    data &&
    typeof data === "object"
  ){

    const text =
      data.response ??
      data.answer ??
      data.text ??
      data.message ??
      data.output ??
      data.content ??
      "";


    const image =
      normalizeImageResult(
        data.image ??

        null
      );


    return {

        cleanAaruText(

        ),

    };
  }


  /*

  */

  return {

    text:
      String(
        data || ""
      ),

    image:
      null
  };
}


/* =========================================================
   CHAT API
========================================================= */

async function sendChatRequest(){

  const recentMessages =
    messages.slice(-19).map(item => ({
      role: item.role === "user" ? "user" : "assistant",
      content: cleanAaruText(String(item.content || "")).slice(0, MAX_MESSAGE_CHARS)
    }));

  const lastUserMessage = messages.slice().reverse().find(item => item.role === "user");

  const payload = {
    message: lastUserMessage?.content || "",
    prompt: lastUserMessage?.content || "",
    messages: recentMessages,
    stream: true
  };

  if(selectedPhotoBase64){
    payload.image_b64 = await resizeImageDataURL(selectedPhotoBase64, MAX_MODEL_IMAGE_SIZE, .76);
  }

  if(selectedDocumentText){
    payload.document_text = selectedDocumentText.slice(0, 90000);
  }

  const response = await fetch(API + "chat", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify(payload)
  });

  const contentType = (response.headers.get("content-type") || "").toLowerCase();

  if(contentType.startsWith("image/")){
    const image = await blobToDataURL(await response.blob());
    if(!response.ok) throw new Error("Chat image request failed.");
    return {text:"इमेज तैयार है।", image};
  }

  if(!response.ok){
    const errText = await response.text();
    let errData = null;
    try{ errData = errText ? JSON.parse(errText) : null; }catch{}
    throw new Error(errData?.error || errData?.message || errText || "Chat request failed.");
  }

  const isStream = contentType.includes("text/event-stream") && response.body;

  if(!isStream){
    const raw = await response.text();
    let data = null;
    try{ data = raw ? JSON.parse(raw) : null; }
    catch{ return {text:cleanAaruText(raw),image:null}; }
    return normalizeChatResult(data);
  }

  hideTyping();

  const row = document.createElement("div");
  row.className = "message assistant";
  row.id = "streamingMessage";

  const bubble = document.createElement("div");
  bubble.className = "bubble md";
  bubble.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
  row.appendChild(bubble);
  messagesEl.appendChild(row);
  scrollBottom();

  let fullText = "";
  let buffer = "";

  function extractStreamText(obj){
    if(obj == null) return "";
    if(typeof obj === "string") return obj;
    return obj.response ?? obj.text ?? obj.content ?? obj.delta ?? obj.output_text ?? obj.token ?? obj.choices?.[0]?.delta?.content ?? obj.choices?.[0]?.text ?? obj.result?.response ?? obj.result?.text ?? "";
  }

  function consumeEvent(eventText){
    const lines = eventText.split(/\n/);
    for(const line of lines){
      const trimmed = line.trim();
      if(!trimmed || trimmed.startsWith(":")) continue;
      if(!trimmed.startsWith("data:")) continue;
      const dataText = trimmed.slice(5).trim();
      if(!dataText || dataText === "[DONE]") continue;
      let value = dataText;
      try{ value = extractStreamText(JSON.parse(dataText)); }catch{}
      if(value){
        const chunk = cleanAaruChunk(value);
        fullText += chunk;
      }
    }
    bubble.innerHTML = renderMarkdown(fullText || "");
    scrollBottom();
  }

  const reader = response.body.getReader();
  const decoder = new TextDecoder();

  while(true){
    const {value,done} = await reader.read();
    if(done) break;
    buffer += decoder.decode(value,{stream:true});
    const events = buffer.split(/\n\n|\r\n\r\n/);
    buffer = events.pop() || "";
    for(const event of events) consumeEvent(event);
  }

  buffer += decoder.decode();
  if(buffer.trim()) consumeEvent(buffer);

  row.remove();

  return {
    text: cleanAaruText(fullText),
    image: null
  };
}


/* =========================================================
   HANDLE SEND
   Unified composer: text + photo + image generation/editing
========================================================= */

async function handleSend(){

  if(isBusy){
    return;
  }

  const prompt =
    promptEl.value.trim();

  const hasPhoto =
    !!selectedPhotoBase64;

  const hasDocument =
    !!selectedDocumentText;

  /* ChatGPT-style: photo alone can be sent. */
  if(!prompt && !hasPhoto && !hasDocument){
    showToast(
      "कुछ लिखें या photo जोड़ें।"
    );
    return;
  }

  ensureCurrentChat();

  isBusy =
    true;

  sendBtn.disabled =
    true;

  const attachedPhoto =
    selectedPhotoUrl;

  if(hasDocument && !prompt){
    promptEl.value = "इस PDF को पढ़कर समझाइए।";
  }

  const displayPrompt = prompt || (hasDocument ? "इस PDF को पढ़कर समझाइए।" : "इस तस्वीर को समझाइए।");

  addUserMessage(
    displayPrompt,
    true,
    attachedPhoto
  );

  promptEl.value =
    "";

  autoResize();
  scrollBottom();

  try{

    showTyping();

    /*
      One unified route. Worker /chat automatically decides:
      normal chat, Vision, image generation or image editing.
    */
    const result =
      await sendChatRequest();

    hideTyping();

    if(result && result.image){

      const imageId =
        await saveCreation(
          result.image,
          prompt || "Image generation"
        );

      addAssistantMessage(
        result.text ||
        "🖼️ Image generated successfully.",
        true,
        imageId
      );

    }else{

      const finalText =
        cleanAaruText(
          result?.text ||
          "माफ़ कीजिए, इस समय मुझे जवाब तैयार करने में समस्या हुई।"
        );

      addAssistantMessage(
        finalText,
        true
      );

      if(voiceOutputEnabled && finalText){
        speakAaru(finalText);
      }
    }

    clearSelectedPhoto();

  }catch(error){

    console.error(
      "Aaru request failed:",
      error
    );

    hideTyping();

    addAssistantMessage(
      "⚠️ अभी request पूरी नहीं हो सकी। कृपया थोड़ी देर बाद फिर कोशिश करें।",
      true
    );

    showToast(
      error?.message ||
      "Request failed"
    );

  }finally{

    isBusy =
      false;

    sendBtn.disabled =
      false;

    scrollBottom();

    try{
      promptEl.focus();
    }catch(error){}
  }
}

/* =========================================================
   VOICE OUTPUT
========================================================= */

function speakAaru(text){
  if(!voiceOutputEnabled || !("speechSynthesis" in window) || !text) return;
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(cleanAaruText(text));
    u.lang = /[\u0900-\u097F]/.test(text) ? "hi-IN" : "en-US";
    u.rate = .98;
    speechSynthesis.speak(u);
  }catch(error){
    console.warn("Voice output failed:",error);
  }
}

/* =========================================================
   VOICE INPUT
========================================================= */

function startAaruVoice(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){
    showToast("इस browser में Voice Input उपलब्ध नहीं है।");
    return;
  }
  if(recognition){
    try{ recognition.stop(); }catch(error){}
    recognition = null;
    document.getElementById("micBtn")?.classList.remove("voice-active");
    return;
  }
  recognition = new SR();
  recognition.lang = "hi-IN";
  recognition.interimResults = false;
  recognition.continuous = false;
  recognition.onstart = () => {
    document.getElementById("micBtn")?.classList.add("voice-active");
    showToast("सुन रहा हूँ…");
  };
  recognition.onresult = event => {
    const text = event.results?.[0]?.[0]?.transcript || "";
    if(text){
      promptEl.value = text;
      autoResize();
      promptEl.focus();
    }
  };
  recognition.onerror = event => {
    showToast("Voice error: " + (event.error || "unknown"));
  };
  recognition.onend = () => {
    recognition = null;
    document.getElementById("micBtn")?.classList.remove("voice-active");
  };
  try{ recognition.start(); }
  catch(error){
    recognition = null;
    document.getElementById("micBtn")?.classList.remove("voice-active");
  }
}

/* =========================================================
   PDF READER
========================================================= */

async function extractPDFText(file){
  const pdfjs = await import("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs");
  pdfjs.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs";
  const data = new Uint8Array(await file.arrayBuffer());
  const pdf = await pdfjs.getDocument({data}).promise;
  let output = "";
  for(let pageNo=1; pageNo<=pdf.numPages; pageNo++){
    setToastProgress(`PDF पढ़ा जा रहा है… ${pageNo}/${pdf.numPages}`);
    const page = await pdf.getPage(pageNo);
    const content = await page.getTextContent();
    const text = content.items.map(item => item.str || "").join(" ");
    output += `\n\n--- Page ${pageNo} ---\n${text}`;
    if(output.length >= 90000) break;
  }
  return output.trim().slice(0,90000);
}

function setToastProgress(text){
  showToast(text);
}

async function handlePDFFile(file){
  try{
    selectedDocumentText = await extractPDFText(file);
    if(!selectedDocumentText){
      showToast("PDF में पढ़ने योग्य text नहीं मिला।");
      return;
    }
    selectedPhotoBase64 = null;
    selectedPhotoUrl = null;
    photoPreview.classList.remove("show");
    photoPreviewImg.src = "";
    showToast(`PDF तैयार है: ${selectedDocumentText.length.toLocaleString()} अक्षर`);
  }catch(error){
    console.error("PDF failed:",error);
    selectedDocumentText = "";
    showToast("PDF पढ़ने में समस्या हुई।");
  }
}

/* =========================================================
   PHOTO UPLOAD
========================================================= */

photoInput.addEventListener(
  "change",
  async event => {

    const file =
      event.target.files?.[0];


    if(!file){
      return;
    }


    if(
      file.type === "application/pdf" ||
      file.name.toLowerCase().endsWith(".pdf")
    ){
      await handlePDFFile(file);
      photoInput.value = "";
      return;
    }

    if(
      !file.type.startsWith(
        "image/"
      )
    ){

      showToast(
        "कृपया image file चुनें।"
      );

      return;
    }


    try{

      const original =
        await fileToDataURL(
          file
        );


      /*
        IMPORTANT:
        Preview और API दोनों के लिए
        छोटा image रखें।
      */

      const resized =
        await resizeImageDataURL(
          original,
          MAX_MODEL_IMAGE_SIZE,
          .80
        );


      selectedPhotoBase64 =
        resized;


      selectedPhotoUrl =
        resized;


      photoPreviewImg.src =
        selectedPhotoUrl;


      photoPreview.classList.add(
        "show"
      );


      showToast(
        "Photo तैयार है। अब सीधे Send दबाएँ या सवाल लिखें।"
      );


    }catch(error){

      console.error(
        "Photo processing failed:",
        error
      );


      showToast(
        "Photo पढ़ने में समस्या हुई।"
      );

    }finally{

      /*
        Same file दोबारा select हो सके।
      */

      photoInput.value =
        "";
    }
  });


function fileToDataURL(file){

  return new Promise(
    (resolve,reject) => {

      const reader =
        new FileReader();


      reader.onload =
        () =>
          resolve(
            reader.result
          );


      reader.onerror =
        reject;


      reader.readAsDataURL(
        file
      );
    }
  );
}

/* =========================================================
   PAGE RECOVERY
========================================================= */

function recoverPage(){

  const now =
    Date.now();


  if(
    now -
    lastPageShowRecovery <
    300
  ){

    return;
  }


  lastPageShowRecovery =
    now;


  try{

    hideTyping();

  }catch(error){}


  isBusy =
    false;

  sendBtn.disabled =
    false;


  try{

    closeDrawer();

    closeImageViewer();

  }catch(error){}


  try{

    const current =
      chats.find(
        item =>
          item.id ===
          currentChatId
      );


    if(current){

      messages =
        Array.isArray(
          current.messages
        )
          ? current.messages
              .slice(
                -MAX_MESSAGES_PER_CHAT
              )
          : [];
    }


    renderCurrentChat();

    renderChatHistory();

    updateModeButtons();

    autoResize();

  }catch(error){

    console.error(
      "Recovery failed:",
      error
    );
  }
}

========================================================= */

  event => {

    if(!appReady){

      return;
    }


    if(
      document.visibilityState ===
      "visible"

        50

    }
  }
);

/* =========================================================
   INITIAL LOAD
========================================================= */

function safeInitialLoad(){

  try{

    loadChatHistory();

  }catch(error){

    console.error(
      "Chat history load failed:",
      error
    );

    chats = [];

    currentChatId =
      null;

    messages = [];
  }


  try{

    if(!chats.length){

      /*
        Startup पर localStorage write नहीं।
      */

      createNewChat(
        false
      );

    }else{

      const latest =
        chats
          .slice()
          .sort(
            (a,b) =>
              (b.updatedAt || 0) -
              (a.updatedAt || 0)
          )[0];


      if(latest){

        currentChatId =
          latest.id;


        messages =
          Array.isArray(
            latest.messages
          )
            ? latest.messages
                .slice(
                  -MAX_MESSAGES_PER_CHAT
                )
            : [];
      }
    }


  }catch(error){

    console.error(
      "Chat initialization failed:",
      error
    );

    chats = [];

    messages = [];

    currentChatId =
      null;


    createNewChat(
      false
    );
  }


  /*
    Chat पहले render।
  */

  renderCurrentChat();

  renderChatHistory();


  /*
    Image history startup पर parse नहीं।
  */

  creationGrid.innerHTML =
    `
      <div class="empty-history">
        Images देखने के लिए Menu खोलें।
      </div>
    `;


  updateModeButtons();

  autoResize();


  setTimeout(
    () => {

      try{

        window.scrollTo({
          top:
            document.documentElement
              .scrollHeight,

          behavior:"auto"
        });

      }catch(error){}

    },
    80
  );


  appReady =
    true;
}


/* =========================================================
   START
========================================================= */

if(
  document.readyState ===
  "loading"
){

  document.addEventListener(
    "DOMContentLoaded",
    safeInitialLoad,
    {
      once:true
    }
  );

}else{

  setTimeout(
    safeInitialLoad,
    0
  );
}
