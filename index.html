<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Aaru AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0b0f;
      color: white;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 20px;
    }

    .logo {
      font-size: 28px;
      font-weight: bold;
      text-align: center;
      margin-top: 20px;
    }

    .hero {
      text-align: center;
      margin-top: 45px;
    }

    .hero h1 {
      font-size: 42px;
      margin-bottom: 10px;
    }

    .hero p {
      color: #aaa;
      font-size: 17px;
    }

    .tabs {
      display: flex;
      gap: 10px;
      margin: 30px 0 15px;
    }

    .tab {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: #1a1a22;
      color: #aaa;
      font-size: 16px;
      cursor: pointer;
    }

    .tab.active {
      background: white;
      color: black;
    }

    textarea {
      width: 100%;
      min-height: 130px;
      resize: vertical;
      background: #15151c;
      color: white;
      border: 1px solid #2a2a35;
      border-radius: 14px;
      padding: 16px;
      font-size: 16px;
      outline: none;
    }

    .controls {
      display: flex;
      gap: 10px;
      margin-top: 12px;
    }

    select {
      flex: 1;
      padding: 13px;
      border-radius: 10px;
      background: #15151c;
      color: white;
      border: 1px solid #2a2a35;
    }

    .generate {
      width: 100%;
      margin-top: 15px;
      padding: 16px;
      border: none;
      border-radius: 12px;
      background: white;
      color: black;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .generate:disabled {
      opacity: 0.5;
    }

    #status {
      text-align: center;
      margin: 20px 0;
      color: #aaa;
    }

    #result {
      margin-top: 20px;
      text-align: center;
    }

    #result img {
      max-width: 100%;
      border-radius: 15px;
      margin-top: 10px;
    }

    .download-btn {
      display: block;
      width: 100%;
      margin-top: 12px;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: #1f1f29;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .download-btn:hover {
      background: #2a2a35;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-top: 40px;
    }

    .card {
      background: #15151c;
      padding: 20px;
      border-radius: 14px;
      border: 1px solid #24242e;
    }

    .card h3 {
      margin-top: 0;
    }

    .card p {
      color: #999;
      font-size: 14px;
    }

    .nav {
      display: flex;
      justify-content: space-around;
      margin-top: 40px;
      padding: 15px 0;
      border-top: 1px solid #222;
      color: #999;
    }

    @media (max-width: 600px) {
      .hero h1 {
        font-size: 34px;
      }

      .cards {
        grid-template-columns: 1fr;
      }

      .controls {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">
      Aaru AI
    </div>

    <div class="hero">
      <h1>Create Anything.</h1>
      <p>Generate amazing images with AI.</p>
    </div>

    <div class="tabs">

      <button
        class="tab active"
        onclick="selectMode('image', this)">
        🖼️ Image
      </button>

      <button
        class="tab"
        onclick="selectMode('video', this)">
        🎬 Video
      </button>

    </div>

    <textarea
      id="prompt"
      placeholder="Describe the image you want to create..."></textarea>

    <div class="controls">

      <select id="ratio">
        <option value="9:16">9:16</option>
        <option value="1:1" selected>1:1</option>
        <option value="16:9">16:9</option>
      </select>

      <select id="quality">
        <option value="standard" selected>Standard</option>
        <option value="hd">HD</option>
      </select>

    </div>

    <button
      class="generate"
      id="generateBtn"
      onclick="generate()">
      Generate
    </button>

    <div id="status"></div>

    <div id="result"></div>

    <div class="cards">

      <div class="card">
        <h3>AI Images</h3>
        <p>Create images from simple text prompts.</p>
      </div>

      <div class="card">
        <h3>AI Videos</h3>
        <p>Generate creative AI videos.</p>
      </div>

      <div class="card">
        <h3>Image to Video</h3>
        <p>Turn your images into videos.</p>
      </div>

      <div class="card">
        <h3>AI Studio</h3>
        <p>Create and manage your AI content.</p>
      </div>

    </div>

    <div class="nav">
      <span>Home</span>
      <span>Create</span>
      <span>Studio</span>
      <span>Profile</span>
    </div>

  </div>

  <script>

    const API_URL =
      "https://aaru-ai-api.myera-org.workers.dev/";

    let mode = "image";


    function selectMode(newMode, button) {

      mode = newMode;

      document.querySelectorAll(".tab").forEach(tab => {
        tab.classList.remove("active");
      });

      button.classList.add("active");

      const promptBox =
        document.getElementById("prompt");

      if (mode === "image") {

        promptBox.placeholder =
          "Describe the image you want to create...";

      } else {

        promptBox.placeholder =
          "Describe the video you want to create...";

      }
    }


    async function generate() {

      const prompt =
        document.getElementById("prompt").value.trim();

      const ratio =
        document.getElementById("ratio").value;

      const quality =
        document.getElementById("quality").value;

      const status =
        document.getElementById("status");

      const result =
        document.getElementById("result");

      const button =
        document.getElementById("generateBtn");


      if (!prompt) {

        status.innerText =
          "Please enter a prompt.";

        return;
      }


      if (mode !== "image") {

        status.innerText =
          "Video generation coming soon.";

        return;
      }


      button.disabled = true;

      status.innerText =
        quality === "hd"
          ? "Generating HD image..."
          : "Generating image...";

      result.innerHTML = "";


      try {

        const imageRequestURL =
          API_URL +
          "?prompt=" +
          encodeURIComponent(prompt) +
          "&ratio=" +
          encodeURIComponent(ratio) +
          "&quality=" +
          encodeURIComponent(quality) +
          "&t=" +
          Date.now();


        const img =
          document.createElement("img");

        img.src = imageRequestURL;


        img.onload = function () {

          result.appendChild(img);


          const downloadButton =
            document.createElement("button");

          downloadButton.className =
            "download-btn";

          downloadButton.innerText =
            "⬇️ Download Image";


          downloadButton.onclick =
            async function () {

              try {

                downloadButton.innerText =
                  "Preparing download...";

                const response =
                  await fetch(imageRequestURL);

                if (!response.ok) {
                  throw new Error(
                    "Download failed"
                  );
                }

                const blob =
                  await response.blob();

                const blobURL =
                  URL.createObjectURL(blob);

                const link =
                  document.createElement("a");

                link.href = blobURL;

                link.download =
                  quality === "hd"
                    ? "aaru-ai-hd-image.png"
                    : "aaru-ai-image.png";

                document.body.appendChild(link);

                link.click();

                link.remove();

                URL.revokeObjectURL(blobURL);

                downloadButton.innerText =
                  "✅ Downloaded";

              } catch (error) {

                console.error(error);

                downloadButton.innerText =
                  "❌ Download failed";

              }

            };


          result.appendChild(
            downloadButton
          );


          status.innerText =
            quality === "hd"
              ? "✅ HD image generated successfully."
              : "✅ Image generated successfully.";

          button.disabled = false;

        };


        img.onerror = function () {

          console.error(
            "Image generation failed:",
            imageRequestURL
          );

          status.innerText =
            "❌ Image generation failed. Please try again.";

          button.disabled = false;

        };


      } catch (error) {

        console.error(error);

        status.innerText =
          "❌ Something went wrong.";

        button.disabled = false;

      }

    }

  </script>

</body>
</html>
