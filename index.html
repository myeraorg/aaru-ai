<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aaru AI - Create Anything</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,Helvetica,sans-serif;background:#070707;color:#fff;min-height:100vh}
.container{width:100%;max-width:650px;margin:auto;padding:18px}
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:35px}
.logo{font-size:25px;font-weight:800;letter-spacing:-1px}
.logo span{opacity:.55}
.badge{font-size:11px;border:1px solid #333;padding:6px 10px;border-radius:20px;color:#aaa}
.hero{text-align:center;margin-bottom:28px}
.hero h1{font-size:38px;line-height:1.05;letter-spacing:-1.5px;margin-bottom:10px}
.hero p{color:#888;font-size:14px}
.tabs{display:flex;background:#111;border:1px solid #222;padding:4px;border-radius:14px;margin-bottom:16px}
.tab{flex:1;border:none;background:transparent;color:#777;padding:12px;border-radius:10px;font-weight:bold;cursor:pointer}
.tab.active{background:#fff;color:#000}
.card{background:#101010;border:1px solid #222;border-radius:18px;padding:16px;margin-bottom:16px}
.label{font-size:12px;color:#888;margin-bottom:8px;display:block}
textarea{width:100%;min-height:125px;resize:vertical;background:#080808;border:1px solid #292929;color:#fff;border-radius:13px;padding:14px;font-size:15px;outline:none;line-height:1.5}
textarea:focus{border-color:#555}
.upload-box{border:1px dashed #444;border-radius:15px;padding:22px 15px;text-align:center;background:#090909}
.upload-box p{color:#777;font-size:12px;margin-top:7px}
.upload-btn{display:inline-block;background:#fff;color:#000;padding:11px 18px;border-radius:10px;font-size:13px;font-weight:bold;cursor:pointer}
#imageInput{display:none}
.preview{display:none;margin-top:15px;position:relative}
.preview img{width:100%;max-height:350px;object-fit:contain;border-radius:13px;background:#000}
.remove-btn{position:absolute;right:10px;top:10px;border:none;background:rgba(0,0,0,.8);color:#fff;width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:18px}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:15px}
.control{background:#080808;border:1px solid #292929;border-radius:12px;padding:10px}
select{width:100%;background:transparent;color:white;border:none;outline:none;font-size:14px}
select option{background:#111;color:white}
.strength-box{display:none;margin-top:15px}
.strength-row{display:flex;justify-content:space-between;align-items:center;color:#999;font-size:12px;margin-bottom:8px}
#strengthValue{color:#fff;font-weight:bold}
input[type=range]{width:100%;accent-color:white}
.generate{width:100%;border:none;background:#fff;color:#000;padding:15px;border-radius:13px;margin-top:15px;font-size:16px;font-weight:800;cursor:pointer}
.generate:disabled{opacity:.45;cursor:not-allowed}
.status{display:none;text-align:center;color:#999;font-size:13px;padding:15px 5px}
.result-card{display:none}
.result-title{font-size:14px;color:#aaa;margin-bottom:10px}
#resultImage{width:100%;display:block;border-radius:14px;background:#000}
.download-btn{display:block;width:100%;text-align:center;background:#1b1b1b;color:white;border:1px solid #333;text-decoration:none;padding:13px;border-radius:11px;margin-top:12px;font-weight:bold;font-size:14px}
.history-title{font-size:17px;margin:25px 0 12px}
.history{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.history-item{aspect-ratio:1;border-radius:10px;overflow:hidden;background:#111;cursor:pointer}
.history-item img{width:100%;height:100%;object-fit:cover}
.empty{color:#555;font-size:12px;text-align:center;padding:15px}
.footer{text-align:center;color:#444;font-size:11px;padding:30px 0 10px}
@media(max-width:400px){.hero h1{font-size:32px}.container{padding:14px}}
</style>
</head>

<body>

<div class="container">

<div class="header">
<div class="logo">Aaru <span>AI</span></div>
<div class="badge">AI STUDIO</div>
</div>

<div class="hero">
<h1>Create Anything.</h1>
<p>Turn your ideas into stunning AI images.</p>
</div>

<div class="tabs">
<button class="tab active" id="imageTab" onclick="setMode('image')">Image</button>
<button class="tab" id="videoTab" onclick="setMode('video')">Video</button>
</div>

<div class="card">

<label class="label">Describe what you want</label>

<textarea id="prompt" placeholder="अपना prompt किसी भी भाषा में लिखें...

उदाहरण: एक सुंदर भारतीय गाँव का photorealistic दृश्य, सुबह का समय, खेत और पहाड़..."></textarea>

<div id="uploadSection" style="margin-top:15px">

<label class="label">Reference Photo — Optional</label>

<div class="upload-box">

<label class="upload-btn" for="imageInput">
📷 Upload Photo
</label>

<input type="file" id="imageInput" accept="image/*">

<p>Photo upload करके उसे transform या edit करें</p>

<div class="preview" id="preview">

<img id="previewImage" alt="Reference preview">

<button class="remove-btn" onclick="removeImage()" type="button">×</button>

</div>

</div>
</div>

<div class="controls">

<div class="control">
<span class="label">Aspect Ratio</span>

<select id="ratio">
<option value="1:1">1 : 1</option>
<option value="9:16">9 : 16 Portrait</option>
<option value="16:9">16 : 9 Landscape</option>
</select>
</div>

<div class="control">
<span class="label">Quality</span>

<select id="quality">
<option value="standard">Standard</option>
<option value="hd">HD</option>
</select>
</div>

</div>

<div class="strength-box" id="strengthBox">

<div class="strength-row">
<span>Image Transformation Strength</span>
<span id="strengthValue">65%</span>
</div>

<input type="range" id="strength" min="10" max="100" value="65">

</div>

<button class="generate" id="generateBtn" onclick="generateImage()">
✨ Generate Image
</button>

</div>

<div class="status" id="status">
Creating your image...
</div>

<div class="card result-card" id="resultCard">

<div class="result-title">Your Creation</div>

<img id="resultImage" alt="Generated image">

<a id="downloadBtn" class="download-btn" download="aaru-ai-image.png">
⬇️ Download Image
</a>

</div>

<div class="history-title">Recent Creations</div>

<div class="history" id="history"></div>

<div class="footer">Powered by Aaru AI</div>

</div>

<script>

const API_URL =
"https://aaru-ai-api.myera-org.workers.dev/";

let selectedImageBase64 = "";
let currentMode = "image";


// MODE
function setMode(mode){

currentMode = mode;

const imageTab =
document.getElementById("imageTab");

const videoTab =
document.getElementById("videoTab");

if(mode === "image"){

imageTab.classList.add("active");
videoTab.classList.remove("active");

}else{

videoTab.classList.add("active");
imageTab.classList.remove("active");

alert("Video generation जल्द ही उपलब्ध होगा।");

currentMode = "image";

imageTab.classList.add("active");
videoTab.classList.remove("active");
}

}


// IMAGE UPLOAD
document
.getElementById("imageInput")
.addEventListener("change",function(event){

const file =
event.target.files[0];

if(!file)return;

if(!file.type.startsWith("image/")){

alert("कृपया image file चुनें।");
return;
}

const reader =
new FileReader();

reader.onload =
function(e){

selectedImageBase64 =
e.target.result;

document
.getElementById("previewImage")
.src =
selectedImageBase64;

document
.getElementById("preview")
.style.display =
"block";

document
.getElementById("strengthBox")
.style.display =
"block";
};

reader.readAsDataURL(file);

});


// REMOVE IMAGE
function removeImage(){

selectedImageBase64 = "";

document
.getElementById("imageInput")
.value = "";

document
.getElementById("preview")
.style.display =
"none";

document
.getElementById("strengthBox")
.style.display =
"none";
}


// STRENGTH
document
.getElementById("strength")
.addEventListener("input",function(){

document
.getElementById("strengthValue")
.textContent =
this.value + "%";

});


// RESIZE IMAGE
function resizeImage(base64,maxSize=1536){

return new Promise((resolve)=>{

const img =
new Image();

img.onload =
function(){

let width =
img.width;

let height =
img.height;

if(width <= maxSize && height <= maxSize){

resolve(base64);
return;
}

const scale =
Math.min(
maxSize / width,
maxSize / height
);

width =
Math.round(width * scale);

height =
Math.round(height * scale);

const canvas =
document.createElement("canvas");

canvas.width =
width;

canvas.height =
height;

const ctx =
canvas.getContext("2d");

ctx.drawImage(
img,
0,
0,
width,
height
);

resolve(
canvas.toDataURL(
"image/jpeg",
0.88
)
);

};

img.src =
base64;

});

}


// IMPORTANT:
// Remove "data:image/...;base64," prefix
function cleanBase64(dataUrl){

if(!dataUrl){
return "";
}

if(dataUrl.includes(",")){

return dataUrl.split(",")[1];

}

return dataUrl;
}


// GENERATE
async function generateImage(){

if(currentMode !== "image"){

alert("Video generation अभी उपलब्ध नहीं है।");
return;
}

const prompt =
document
.getElementById("prompt")
.value
.trim();

if(!prompt){

alert("पहले अपना prompt लिखें।");
return;
}

const ratio =
document
.getElementById("ratio")
.value;

const quality =
document
.getElementById("quality")
.value;

const btn =
document
.getElementById("generateBtn");

const status =
document
.getElementById("status");

const resultCard =
document
.getElementById("resultCard");

btn.disabled = true;

status.style.display = "block";

resultCard.style.display = "none";


try{

let imageBase64 = "";


// IMAGE TO IMAGE
if(selectedImageBase64){

status.textContent =
"🔄 Reference photo को तैयार कर रहे हैं...";

const resized =
await resizeImage(
selectedImageBase64
);


// FIX:
// Only pure Base64 is sent to Worker
imageBase64 =
cleanBase64(resized);

}


// REQUEST
let response;


// IMAGE TO IMAGE
if(imageBase64){

status.textContent =
"✨ आपकी photo को transform किया जा रहा है...";

response =
await fetch(
API_URL,
{
method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:JSON.stringify({

prompt:prompt,

ratio:ratio,

quality:quality,

image_b64:imageBase64,

strength:
Number(
document
.getElementById("strength")
.value
) / 100

})
}
);

}


// TEXT TO IMAGE
else{

status.textContent =
"✨ आपकी image तैयार हो रही है...";

const params =
new URLSearchParams({

prompt:prompt,

ratio:ratio,

quality:quality

});

response =
await fetch(
API_URL +
"?" +
params.toString()
);

}


if(!response.ok){

let errorText =
"Image generation failed.";

try{

const errorData =
await response.json();

if(errorData.error){

errorText =
errorData.error;
}

}catch(e){}

throw new Error(errorText);

}


const blob =
await response.blob();

if(!blob.type.includes("image")){

throw new Error(
"Server ने valid image नहीं भेजी।"
);

}


const imageUrl =
URL.createObjectURL(blob);

const resultImage =
document
.getElementById("resultImage");

resultImage.src =
imageUrl;

resultCard.style.display =
"block";


// DOWNLOAD
const downloadBtn =
document
.getElementById("downloadBtn");

downloadBtn.href =
imageUrl;

downloadBtn.download =
"aaru-ai-" +
Date.now() +
".png";


// HISTORY
const reader =
new FileReader();

reader.onloadend =
function(){

saveToHistory(
reader.result
);

};

reader.readAsDataURL(blob);

status.textContent =
"✅ Image तैयार है!";

}
catch(error){

console.error(error);

status.textContent =
"❌ " +
(
error.message ||
"Image generation failed."
);

}
finally{

btn.disabled = false;

}

}


// THUMBNAIL
function createThumbnail(dataUrl,maxWidth=500){

return new Promise((resolve)=>{

const img =
new Image();

img.onload =
function(){

let width =
img.width;

let height =
img.height;

if(width > maxWidth){

const scale =
maxWidth / width;

width =
Math.round(width * scale);

height =
Math.round(height * scale);
}

const canvas =
document.createElement("canvas");

canvas.width =
width;

canvas.height =
height;

const ctx =
canvas.getContext("2d");

ctx.drawImage(
img,
0,
0,
width,
height
);

resolve(
canvas.toDataURL(
"image/jpeg",
0.65
)
);

};

img.src =
dataUrl;

});

}


// SAVE HISTORY
async function saveToHistory(imageData){

try{

const thumbnail =
await createThumbnail(imageData);

let history =
JSON.parse(
localStorage.getItem(
"aaru_history"
) || "[]"
);

history.unshift(thumbnail);

history =
history.slice(0,10);

localStorage.setItem(
"aaru_history",
JSON.stringify(history)
);

loadHistory();

}catch(error){

console.log(
"History save failed",
error
);

}

}


// LOAD HISTORY
function loadHistory(){

const container =
document
.getElementById("history");

let history = [];

try{

history =
JSON.parse(
localStorage.getItem(
"aaru_history"
) || "[]"
);

}catch(e){

history = [];
}

container.innerHTML = "";

if(!history.length){

container.innerHTML =
'<div class="empty">अभी कोई creation नहीं है</div>';

return;
}

history.forEach(
function(imageData){

const item =
document.createElement("div");

item.className =
"history-item";

const img =
document.createElement("img");

img.src =
imageData;

img.loading =
"lazy";

item.appendChild(img);

item.onclick =
function(){

document
.getElementById("resultImage")
.src =
imageData;

document
.getElementById("resultCard")
.style.display =
"block";

document
.getElementById("downloadBtn")
.href =
imageData;

};

container.appendChild(item);

}
);

}


// INITIAL LOAD
loadHistory();

</script>

</body>
</html>
