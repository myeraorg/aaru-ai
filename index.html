<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Aaru AI</title>
<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}
html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  font-family:Arial,Helvetica,sans-serif;
  background:#0f1117;
  color:#fff;
  overflow:hidden;
}
.app{
  display:flex;
  flex-direction:column;
  height:100dvh;
  width:100%;
}
.header{
  flex:none;
  height:58px;
  display:flex;
  align-items:center;
  gap:10px;
  padding:0 12px;
  background:rgba(15,17,23,.96);
  border-bottom:1px solid rgba(255,255,255,.07);
  z-index:100;
}
.menu-btn,.new-chat-top{
  width:40px;
  height:40px;
  border:0;
  border-radius:12px;
  background:rgba(255,255,255,.07);
  color:#fff;
  font-size:22px;
  cursor:pointer;
}
.brand{
  flex:1;
  min-width:0;
}
.brand-name{
  font-size:18px;
  font-weight:800;
}
.brand-sub{
  font-size:10px;
  opacity:.45;
}
main{
  flex:1;
  overflow-y:auto;
  scroll-behavior:smooth;
  padding:18px 12px 20px;
}
.chat-wrap{
  max-width:900px;
  margin:0 auto;
}
.messages{
  display:flex;
  flex-direction:column;
  gap:14px;
}
.message{
  display:flex;
  width:100%;
}
.message.user{
  justify-content:flex-end;
}
.message.assistant{
  justify-content:flex-start;
}
.bubble{
  max-width:min(85%,720px);
  padding:11px 14px;
  border-radius:17px;
  font-size:15px;
  line-height:1.55;
  word-break:break-word;
  user-select:text;
}
.message.user .bubble{
  background:#245eea;
  border-bottom-right-radius:5px;
}
.message.assistant .bubble{
  background:#191d27;
  border:1px solid rgba(255,255,255,.055);
  border-bottom-left-radius:5px;
}
.md p{margin:0 0 9px;}
.md p:last-child{margin-bottom:0;}
.md code{padding:2px 5px;background:#0d1016;border-radius:5px;font-family:monospace;}
.md pre{padding:12px;background:#0b0e13;border-radius:10px;overflow:auto;}
.attached-user-image,.generated-image{
  display:block;
  width:min(100%,320px);
  max-height:360px;
  object-fit:cover;
  border-radius:12px;
  margin-bottom:7px;
  cursor:pointer;
  border:1px solid rgba(255,255,255,.08);
}
.generated-image{
  max-width:720px;
  width:100%;
}
.typing{
  display:flex;
  align-items:center;
  gap:5px;
  padding:5px 2px;
}
.typing span{
  width:6px;
  height:6px;
  border-radius:50%;
  background:#fff;
  opacity:.35;
  animation:typing 1s infinite;
}
.typing span:nth-child(2){animation-delay:.15s;}
.typing span:nth-child(3){animation-delay:.3s;}
@keyframes typing{
  0%,70%,100%{transform:translateY(0);opacity:.25;}
  35%{transform:translateY(-4px);opacity:.8;}
}

/* Fixed Composer Layout to Prevent Overlap */
.composer-shell{
  flex:none;
  padding:10px;
  background:#0f1117;
  border-top:1px solid rgba(255,255,255,.06);
}
.composer{
  width:100%;
  max-width:900px;
  margin:0 auto;
  border:1px solid rgba(255,255,255,.1);
  background:#171a23;
  border-radius:18px;
  padding:8px;
  box-shadow:0 4px 20px rgba(0,0,0,.3);
}
.photo-preview{
  display:none;
  position:relative;
  width:74px;
  height:74px;
  margin:4px 4px 8px;
}
.photo-preview.show{
  display:block;
}
.photo-preview img{
  width:74px;
  height:74px;
  object-fit:cover;
  border-radius:10px;
}
.remove-photo{
  position:absolute;
  right:-6px;
  top:-6px;
  width:23px;
  height:23px;
  border:0;
  border-radius:50%;
  background:#ef4444;
  color:#fff;
  font-size:15px;
  cursor:pointer;
}
.input-row{
  display:flex;
  align-items:flex-end;
  gap:7px;
}
#prompt{
  flex:1;
  min-width:0;
  min-height:42px;
  max-height:120px;
  resize:none;
  border:0;
  outline:0;
  color:#fff;
  background:transparent;
  padding:10px 8px;
  line-height:1.4;
}
#prompt::placeholder{
  color:#fff;
  opacity:.38;
}
.icon-btn{
  width:40px;
  height:40px;
  flex:none;
  border:0;
  border-radius:12px;
  background:rgba(255,255,255,.065);
  color:#fff;
  cursor:pointer;
}
.send-btn{
  background:#2864e8;
}
.send-btn:disabled{
  opacity:.4;
  cursor:not-allowed;
}
#photoInput{
  display:none;
}
.drawer-overlay{
  position:fixed;
  inset:0;
  z-index:200;
  background:rgba(0,0,0,.58);
  opacity:0;
  pointer-events:none;
  transition:.2s;
}
.drawer-overlay.open{
  opacity:1;
  pointer-events:auto;
}
.drawer{
  position:fixed;
  z-index:210;
  top:0;
  left:0;
  bottom:0;
  width:min(88vw,340px);
  background:#151821;
  border-right:1px solid rgba(255,255,255,.07);
  transform:translateX(-105%);
  transition:.22s ease;
  display:flex;
  flex-direction:column;
}
.drawer.open{
  transform:translateX(0);
}
.drawer-head{
  height:58px;
  display:flex;
  align-items:center;
  gap:10px;
  padding:0 12px;
  border-bottom:1px solid rgba(255,255,255,.07);
}
.drawer-title{
  flex:1;
  font-size:17px;
  font-weight:800;
}
.close-drawer{
  width:38px;
  height:38px;
  border:0;
  border-radius:11px;
  background:rgba(255,255,255,.07);
  color:#fff;
}
.drawer-body{
  flex:1;
  overflow-y:auto;
  padding:12px;
}
.drawer-action{
  width:100%;
  display:flex;
  align-items:center;
  gap:10px;
  border:0;
  color:#fff;
  background:rgba(255,255,255,.055);
  border-radius:12px;
  padding:12px;
  margin-bottom:8px;
  cursor:pointer;
}
.section-title{
  margin:18px 4px 9px;
  font-size:11px;
  font-weight:700;
  text-transform:uppercase;
  opacity:.4;
}
.chat-history-item{
  display:flex;
  align-items:center;
  padding:10px;
  border-radius:11px;
  cursor:pointer;
}
.chat-history-item.active{
  background:rgba(255,255,255,.085);
}
.chat-history-info{
  flex:1;
  min-width:0;
}
.chat-history-title{
  font-size:13px;
  font-weight:600;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.chat-history-meta{
  font-size:10px;
  opacity:.4;
}
.delete-chat{
  border:0;
  background:transparent;
  color:#fff;
  opacity:.48;
  cursor:pointer;
}
.creation-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:8px;
}
.creation-card{
  border-radius:11px;
  background:#0e1117;
  overflow:hidden;
}
.creation-card img{
  width:100%;
  aspect-ratio:1/1;
  object-fit:cover;
}
.creation-prompt{
  padding:6px;
  font-size:9px;
  opacity:.6;
}
.image-viewer{
  position:fixed;
  inset:0;
  z-index:500;
  display:none;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.9);
}
.image-viewer.open{display:flex;}
.image-viewer img{max-width:90%;max-height:90dvh;border-radius:10px;}
.close-viewer{position:absolute;top:15px;right:15px;width:40px;height:40px;border:0;background:rgba(255,255,255,.2);color:#fff;border-radius:10px;}
.toast{
  position:fixed;
  left:50%;
  bottom:80px;
  transform:translateX(-50%);
  background:#252a36;
  padding:8px 14px;
  border-radius:8px;
  font-size:12px;
  opacity:0;
  pointer-events:none;
  transition:.2s;
  z-index:600;
}
.toast.show{opacity:1;}
</style>
</head>
<body>

<div class="app">
  <header class="header">
    <button class="menu-btn" id="menuBtn">☰</button>
    <div class="brand">
      <div class="brand-name">Aaru AI</div>
      <div class="brand-sub">Fast • Smart • Indian AI</div>
    </div>
    <button class="new-chat-top" id="newChatTop">＋</button>
  </header>

  <div class="drawer-overlay" id="drawerOverlay"></div>

  <aside class="drawer" id="drawer">
    <div class="drawer-head">
      <div class="drawer-title">Aaru AI</div>
      <button class="close-drawer" id="closeDrawer">×</button>
    </div>
    <div class="drawer-body">
      <button class="drawer-action" id="newChatBtn"><span>＋</span><span>नई चैट</span></button>
      <button class="drawer-action" id="deleteAllBtn"><span>🗑️</span><span>सभी चैट डिलीट करें</span></button>
      <div class="section-title">Recent Chats</div>
      <div class="chat-history" id="chatHistory"></div>
      <div class="section-title">Recent Creations</div>
      <div class="creation-grid" id="creationGrid"></div>
    </div>
  </aside>

  <main id="mainContent">
    <div class="chat-wrap">
      <div class="messages" id="messages"></div>
    </div>
  </main>

  <div class="composer-shell">
    <div class="composer">
      <div class="photo-preview" id="photoPreview">
        <img id="photoPreviewImg" alt="Selected">
        <button class="remove-photo" id="removePhoto">×</button>
      </div>
      <div class="input-row">
        <button class="icon-btn" id="photoBtn">📎</button>
        <textarea id="prompt" rows="1" placeholder="Aaru से कुछ भी पूछें..."></textarea>
        <button class="icon-btn send-btn" id="sendBtn">➤</button>
      </div>
    </div>
  </div>
</div>

<input type="file" id="photoInput" accept="image/*">
<div class="image-viewer" id="imageViewer">
  <button class="close-viewer" id="closeViewer">×</button>
  <img id="viewerImg" alt="Viewer">
</div>
<div class="toast" id="toast"></div>

<script>
"use strict";

const API = "https://aaru-ai-api.myera-org.workers.dev/";
const CHAT_LIST_KEY = "aaru_chat_history_v2";
const IMAGE_KEY = "aaru_history";

let chats = [];
let currentChatId = null;
let messages = [];
let selectedPhotoBase64 = null;
let isBusy = false;
let volatileCreations = [];

const messagesEl = document.getElementById("messages");
const promptEl = document.getElementById("prompt");
const sendBtn = document.getElementById("sendBtn");
const photoInput = document.getElementById("photoInput");
const photoPreview = document.getElementById("photoPreview");
const photoPreviewImg = document.getElementById("photoPreviewImg");
const chatHistoryEl = document.getElementById("chatHistory");
const creationGrid = document.getElementById("creationGrid");
const drawer = document.getElementById("drawer");
const drawerOverlay = document.getElementById("drawerOverlay");
const imageViewer = document.getElementById("imageViewer");
const viewerImg = document.getElementById("viewerImg");
const toastEl = document.getElementById("toast");
const mainContent = document.getElementById("mainContent");

function updateModeButtons() {}

function showToast(text){
  toastEl.textContent = text;
  toastEl.classList.add("show");
  setTimeout(() => toastEl.classList.remove("show"), 2000);
}

function escapeHTML(str){
  return String(str || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function renderMarkdown(text){
  return "<p>" + escapeHTML(text).replace(/\n/g, "<br>") + "</p>";
}

function scrollBottom(){
  setTimeout(() => {
    mainContent.scrollTop = mainContent.scrollHeight;
  }, 50);
}

function loadChatHistory(){
  const raw = localStorage.getItem(CHAT_LIST_KEY);
  if(raw){
    try { chats = JSON.parse(raw); } catch(e){ chats = []; }
  }
}

function saveChatHistory(){
  localStorage.setItem(CHAT_LIST_KEY, JSON.stringify(chats.slice(0, 10)));
}

function createNewChat(){
  const chat = { id: "chat_" + Date.now(), title: "नई चैट", messages: [], updatedAt: Date.now() };
  chats.unshift(chat);
  currentChatId = chat.id;
  messages = [];
  saveChatHistory();
  return chat;
}

function ensureChat(){
  if(!currentChatId || !chats.find(c => c.id === currentChatId)){
    createNewChat();
  }
}

function saveCurrentChat(){
  ensureChat();
  const chat = chats.find(c => c.id === currentChatId);
  if(chat){
    chat.messages = messages;
    const firstUser = messages.find(m => m.role === "user");
    chat.title = firstUser ? firstUser.content.slice(0, 30) : "नई चैट";
    chat.updatedAt = Date.now();
    saveChatHistory();
    renderChatHistory();
  }
}

function renderMessages(){
  messagesEl.innerHTML = "";
  messages.forEach(item => {
    const row = document.createElement("div");
    row.className = "message " + item.role;
    const bubble = document.createElement("div");
    bubble.className = "bubble md";
    if(item.image){
      const img = document.createElement("img");
      img.className = item.role === "user" ? "attached-user-image" : "generated-image";
      img.src = item.image;
      img.onclick = () => openImageViewer(item.image);
      bubble.appendChild(img);
    }
    if(item.content){
      const txt = document.createElement("div");
      txt.innerHTML = renderMarkdown(item.content);
      bubble.appendChild(txt);
    }
    row.appendChild(bubble);
    messagesEl.appendChild(row);
  });
  scrollBottom();
}

function addUserMessage(content, image = null){
  messages.push({ role: "user", content, image });
  renderMessages();
  saveCurrentChat();
}

function addAssistantMessage(content, image = null){
  messages.push({ role: "assistant", content, image });
  renderMessages();
  saveCurrentChat();
}

function showTyping(){
  const row = document.createElement("div");
  row.className = "message assistant";
  row.id = "typingRow";
  row.innerHTML = '<div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>';
  messagesEl.appendChild(row);
  scrollBottom();
}

function hideTyping(){
  const t = document.getElementById("typingRow");
  if(t) t.remove();
}

function renderChatHistory(){
  chatHistoryEl.innerHTML = "";
  chats.forEach(item => {
    const div = document.createElement("div");
    div.className = "chat-history-item" + (item.id === currentChatId ? " active" : "");
    div.innerHTML = `<div class="chat-history-info"><div class="chat-history-title">${escapeHTML(item.title)}</div></div>`;
    div.onclick = () => {
      currentChatId = item.id;
      messages = item.messages || [];
      renderMessages();
      renderChatHistory();
      closeDrawer();
    };
    chatHistoryEl.appendChild(div);
  });
}

function renderCreations(){
  creationGrid.innerHTML = "";
  volatileCreations.forEach(item => {
    const card = document.createElement("div");
    card.className = "creation-card";
    card.innerHTML = `<img src="${item.image}" onclick="openImageViewer('${item.image}')"><div class="creation-prompt">${escapeHTML(item.prompt)}</div>`;
    creationGrid.appendChild(card);
  });
}

function openImageViewer(src){
  viewerImg.src = src;
  imageViewer.classList.add("open");
}
function closeImageViewer(){
  imageViewer.classList.remove("open");
}

async function handleSend(){
  const prompt = promptEl.value.trim();
  const photo = selectedPhotoBase64;
  if(!prompt && !photo) return;

  ensureChat();
  isBusy = true;
  sendBtn.disabled = true;

  addUserMessage(prompt, photo);
  promptEl.value = "";
  autoResize();
  clearPhoto();

  showTyping();

  try {
    const payload = { message: prompt, prompt, messages: messages.slice(-6) };
    if(photo) payload.image_b64 = photo;

    const res = await fetch(API + "chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });
    
    const data = await res.json();
    hideTyping();

    const replyText = data.response || data.text || data.message || "जवाब प्राप्त हुआ।";
    let replyImage = data.image || data.image_url || null;

    addAssistantMessage(replyText, replyImage);
    if(replyImage){
      volatileCreations.unshift({ image: replyImage, prompt: prompt });
      renderCreations();
    }
  } catch(e) {
    hideTyping();
    addAssistantMessage("⚠️ सर्वर से कनेक्ट करने में समस्या हुई।");
  } finally {
    isBusy = false;
    sendBtn.disabled = false;
  }
}

function clearPhoto(){
  selectedPhotoBase64 = null;
  photoPreview.classList.remove("show");
  photoInput.value = "";
}

function autoResize(){
  promptEl.style.height = "auto";
  promptEl.style.height = Math.min(promptEl.scrollHeight, 120) + "px";
}

promptEl.oninput = autoResize;
promptEl.onkeydown = e => {
  if(e.key === "Enter" && !e.shiftKey){
    e.preventDefault();
    handleSend();
  }
};
sendBtn.onclick = handleSend;

document.getElementById("photoBtn").onclick = () => photoInput.click();
photoInput.onchange = e => {
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = event => {
    selectedPhotoBase64 = event.target.result;
    photoPreviewImg.src = selectedPhotoBase64;
    photoPreview.classList.add("show");
  };
  reader.readAsDataURL(file);
};
document.getElementById("removePhoto").onclick = clearPhoto;

function openDrawer(){ drawer.classList.add("open"); drawerOverlay.classList.add("open"); }
function closeDrawer(){ drawer.classList.remove("open"); drawerOverlay.classList.remove("open"); }

document.getElementById("menuBtn").onclick = openDrawer;
document.getElementById("closeDrawer").onclick = closeDrawer;
drawerOverlay.onclick = closeDrawer;
document.getElementById("newChatBtn").onclick = () => { createNewChat(); renderMessages(); renderChatHistory(); closeDrawer(); };
document.getElementById("newChatTop").onclick = () => { createNewChat(); renderMessages(); renderChatHistory(); };
document.getElementById("deleteAllBtn").onclick = () => { chats = []; localStorage.removeItem(CHAT_LIST_KEY); createNewChat(); renderMessages(); renderChatHistory(); closeDrawer(); };
document.getElementById("closeViewer").onclick = closeImageViewer;

loadChatHistory();
if(!chats.length) createNewChat();
else { currentChatId = chats[0].id; messages = chats[0].messages || []; }
renderMessages();
renderChatHistory();
</script>

</body>
</html>
