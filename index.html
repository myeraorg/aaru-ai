<script>
/* AARU v15 — Autonomous Task Execution & Workflow Engine (Index-only, Worker unchanged) */
(function(){
  "use strict";
  window.AARU_V15_AUTONOMOUS=true;
  window.AARU_V15_VERSION="AUTONOMOUS-TASK-EXECUTION-V15";
  window.AARU_V15_MAX_STEPS=6;
  window.AARU_V15_MAX_HISTORY=24;
  window.AARU_V15_STATE_PREFIX="aaru_v15_workflow_";

  const clean=v=>String(v||"").replace(/\\s+/g," ").trim();
  const stateKey=()=>window.AARU_V15_STATE_PREFIX+String(window.currentChatId||"default");
  const safeLoad=()=>{try{return JSON.parse(localStorage.getItem(stateKey())||"null")}catch(_){return null}};
  const safeSave=v=>{try{localStorage.setItem(stateKey(),JSON.stringify(v));return true}catch(_){return false}};

  function buildSteps(query, plan){
    const source=Array.isArray(plan?.steps)?plan.steps:[];
    return source.slice(0,window.AARU_V15_MAX_STEPS).map((x,i)=>({
      id:String(x.id||`step_${i+1}`),
      label:clean(x.label||`कार्य चरण ${i+1}`),
      status:i===0?"ready":"queued",
      result:"",
      attempts:0
    }));
  }

  window.aaruV15CreateWorkflow=function(query,plan){
    const q=clean(query);
    const steps=buildSteps(q,plan);
    const active=!!q && !!plan?.active && steps.length>0;
    return {
      version:window.AARU_V15_VERSION,
      active,
      status:active?"planned":"direct",
      query:q.slice(0,1200),
      currentStep:active?0:-1,
      steps,
      completed:[],
      lastError:"",
      createdAt:Date.now(),
      updatedAt:Date.now()
    };
  };

  window.aaruV15LoadWorkflow=function(){return safeLoad()};
  window.aaruV15SaveWorkflow=function(state){
    if(!state)return false;
    state.updatedAt=Date.now();
    return safeSave(state);
  };
  window.aaruV15ResetWorkflow=function(){try{localStorage.removeItem(stateKey())}catch(_){}
    return window.aaruV15CreateWorkflow("",{active:false,steps:[]});
  };

  window.aaruV15PrepareExecution=function(query,plan){
    const previous=safeLoad();
    const normalized=clean(query);
    let state=previous;
    if(!state || state.query!==normalized || state.status==="completed" || state.status==="failed"){
      state=window.aaruV15CreateWorkflow(normalized,plan);
    }else{
      state.updatedAt=Date.now();
      if(state.status==="planned" && state.steps?.length)state.steps[0].status="ready";
    }
    window.aaruV15SaveWorkflow(state);
    return state;
  };

  window.aaruV15MarkExecution=function(result){
    const state=safeLoad();
    if(!state?.active)return state||null;
    const text=clean(result?.text||result?.message||"");
    const failed=!!result?.error;
    const i=Math.max(0,Math.min(Number(state.currentStep)||0,state.steps.length-1));
    const step=state.steps[i];
    if(step){
      step.attempts=(step.attempts||0)+1;
      if(failed){step.status="failed";state.lastError=text.slice(0,500);state.status="failed";}
      else {step.status="completed";step.result=text.slice(0,1200);state.completed=Array.from(new Set([...(state.completed||[]),step.id]));
        if(i+1<state.steps.length){state.currentStep=i+1;state.steps[i+1].status="ready";state.status="running";}
        else {state.currentStep=i;state.status="completed";}
      }
    }
    window.aaruV15SaveWorkflow(state);
    return state;
  };

  window.aaruV15CompactState=function(state){
    if(!state?.active)return "";
    return state.steps.map((s,i)=>`${i+1}. ${s.id}:${s.status}`).join(" | ").slice(0,2400);
  };

  window.aaruV15GetExecutionHint=function(state){
    if(!state?.active)return "";
    const current=state.steps?.[state.currentStep];
    return `workflow=${state.status}; current=${current?.id||"none"}; completed=${(state.completed||[]).join(",")}`.slice(0,1000);
  };

  /* Safely enrich the existing Worker request; no new endpoint and no second model. */
  const originalFetch=window.fetchChatWithRecovery;
  if(typeof originalFetch==="function" && !originalFetch.__AARU_V15_WRAPPED){
    const wrapped=async function(payload){
      try{
        const p=payload||{};
        if(window.AARU_V15_LAST_WORKFLOW){
          p.client_workflow_version=window.AARU_V15_VERSION;
          p.client_workflow_state=window.aaruV15CompactState(window.AARU_V15_LAST_WORKFLOW);
          p.client_workflow_execution=window.aaruV15GetExecutionHint(window.AARU_V15_LAST_WORKFLOW);
        }
      }catch(_){ }
      return originalFetch.call(this,payload);
    };
    wrapped.__AARU_V15_WRAPPED=true;
    window.fetchChatWithRecovery=wrapped;
  }

  /* Observe the existing send pipeline without replacing handleSend or sendChatRequest. */
  document.addEventListener("click",function(e){
    try{
      const el=e.target?.closest?.("button,[role='button']");
      if(!el)return;
      const label=clean(el.getAttribute("aria-label")||el.textContent||"").toLowerCase();
      if(/send|भेज|submit/.test(label) && window.AARU_V15_LAST_WORKFLOW){
        window.AARU_V15_LAST_WORKFLOW.updatedAt=Date.now();
        window.aaruV15SaveWorkflow(window.AARU_V15_LAST_WORKFLOW);
      }
    }catch(_){ }
  },true);

  window.addEventListener("pagehide",function(){
    try{if(window.AARU_V15_LAST_WORKFLOW)window.aaruV15SaveWorkflow(window.AARU_V15_LAST_WORKFLOW)}catch(_){ }
  });
})();
</script>

<script>
/* AARU v18 — Self-Healing Runtime & Recovery Engine
   Index-only additive layer. Worker/API architecture remains unchanged.
*/
(function(){
  "use strict";
  window.AARU_V18_SELF_HEALING=true;
  window.AARU_V18_VERSION="SELF-HEALING-RUNTIME-RECOVERY-V18";
  window.AARU_V18_MAX_RECOVERY_ATTEMPTS=2;
  window.AARU_V18_STATE_KEY="aaru_v18_recovery_state_v1";

  const clean=v=>String(v==null?"":v).replace(/\\s+/g," ").trim();
  const now=()=>Date.now();
  function load(){try{return JSON.parse(localStorage.getItem(window.AARU_V18_STATE_KEY)||"null")}catch(_){return null}}
  function save(v){try{localStorage.setItem(window.AARU_V18_STATE_KEY,JSON.stringify(v));return true}catch(_){return false}}

  window.aaruV18ClassifyError=function(error){
    const status=Number(error?.status||0);
    const code=clean(error?.code||"").toLowerCase();
    const text=clean(error?.message||error||"").toLowerCase();
    if(status===401||status===403||/unauthori[sz]ed|forbidden|invalid api key/.test(text))return "auth";
    if(status===408||status===504||/timeout|timed out|deadline/.test(text))return "timeout";
    if(status===429||/rate.?limit|quota|credit|billing|insufficient/.test(text))return "quota";
    if(status>=500||/worker|gateway|bad gateway|service unavailable|upstream/.test(text))return "server";
    if(/network|failed to fetch|offline|connection/.test(text))return "network";
    if(code)return code;
    return "unknown";
  };

  window.aaruV18BuildRecoveryPlan=function(error,attempt){
    const type=window.aaruV18ClassifyError(error);
    const n=Math.max(0,Number(attempt)||0);
    const retryable=(type==="timeout"||type==="network"||type==="server") && n<window.AARU_V18_MAX_RECOVERY_ATTEMPTS;
    return {
      version:window.AARU_V18_VERSION,
      error_type:type,
      attempt:n,
      retryable,
      action:retryable?"retry":"surface_error",
      preserve_context:true,
      preserve_worker:true
    };
  };

  window.aaruV18RecordRecovery=function(plan,error){
    const state=load()||{version:window.AARU_V18_VERSION,total:0,retries:0,last:null};
    state.version=window.AARU_V18_VERSION;
    state.total=(state.total||0)+1;
    if(plan?.retryable)state.retries=(state.retries||0)+1;
    state.last={time:now(),type:plan?.error_type||"unknown",action:plan?.action||"surface_error",message:clean(error?.message||"").slice(0,300)};
    save(state);
    return state;
  };

  window.aaruV18GetRuntimeHealth=function(){
    const state=load()||{};
    return {
      version:window.AARU_V18_VERSION,
      online:navigator.onLine!==false,
      fetchAvailable:typeof window.fetch==="function",
      workerGateway:typeof window.fetchChatWithRecovery==="function",
      chatPipeline:typeof window.sendChatRequest==="function" && typeof window.handleSend==="function",
      lastRecovery:state.last||null
    };
  };

  /* Non-invasive recovery wrapper: retries only transient failures and never retries quota/auth errors. */
  const original=window.fetchChatWithRecovery;
  if(typeof original==="function" && !original.__AARU_V18_WRAPPED){
    const wrapped=async function(payload){
      let attempt=0;
      while(true){
        try{return await original.call(this,payload)}
        catch(error){
          const plan=window.aaruV18BuildRecoveryPlan(error,attempt);
          window.aaruV18RecordRecovery(plan,error);
          if(!plan.retryable)throw error;
          attempt++;
          const delay=500*attempt;
          await new Promise(resolve=>setTimeout(resolve,delay));
        }
      }
    };
    wrapped.__AARU_V18_WRAPPED=true;
    wrapped.__AARU_V18_ORIGINAL=original;
    window.fetchChatWithRecovery=wrapped;
  }

  window.addEventListener("online",function(){window.AARU_V18_LAST_ONLINE=now()});
  window.addEventListener("offline",function(){window.AARU_V18_LAST_OFFLINE=now()});
  window.addEventListener("pagehide",function(){try{save(load()||{version:window.AARU_V18_VERSION})}catch(_){} });
})();
</script>

<script>
/* AARU v19 — Adaptive Learning & Behavior Optimization Engine */
(function(){
  "use strict";
  window.AARU_V19_ADAPTIVE=true;
  window.AARU_V19_VERSION="ADAPTIVE-LEARNING-BEHAVIOR-V19";
  const KEY="aaru_adaptive_behavior_v19";
  const MAX_ITEMS=24;
  const MAX_CHARS=2600;

  function clean(v){return String(v||"").replace(/\s+/g," ").trim();}
  function load(){try{const x=JSON.parse(localStorage.getItem(KEY)||"{}");return x&&typeof x==="object"?x:{};}catch(_){return {};}}
  function save(x){try{localStorage.setItem(KEY,JSON.stringify(x));}catch(_){} }
  function words(v){
    return new Set(clean(v).toLowerCase().replace(/[^\p{L}\p{N}\s]/gu," ").split(/\s+/).filter(x=>x.length>2).slice(0,80));
  }
  function overlap(a,b){if(!a.size||!b.size)return 0;let n=0;a.forEach(x=>{if(b.has(x))n++;});return n/Math.max(1,Math.min(a.size,b.size));}

  window.aaruV19GetAdaptiveProfile=function(text,messages){
    const q=clean(text), all=Array.isArray(messages)?messages:[];
    const lower=q.toLowerCase();

<script>

(function(){

function aaruV27Normalize(text){
  return typeof cleanAaruText === "function" ? cleanAaruText(text || "") : String(text || "").trim();
}
function aaruV27EvaluateResponse(query, answer){
  const q=aaruV27Normalize(query), a=aaruV27Normalize(answer);
  const checks={
    hasAnswer:a.length>0,
    notTruncated:!/[…]$/.test(a) && a.length>8,
    addressesQuery:q.length===0 || a.length>0,
    likelyError:/(failed|error|exception|something went wrong|couldn't|cannot process|quota|429|502|error al|fehler|erreur|त्रुटि|समस्या)/i.test(a),
    tooShort:q.length>80 && a.length<25,
    repetition:false
  };
  const words=a.toLowerCase().split(/\s+/).filter(Boolean);
  if(words.length>=12){
    const tail=words.slice(-Math.min(30,words.length));
    const unique=new Set(tail).size;
    checks.repetition=(tail.length-unique)/tail.length>.55;
  }
  let score=1;
  if(!checks.hasAnswer)score-=.45;
  if(!checks.notTruncated)score-=.08;
  if(!checks.addressesQuery)score-=.12;
  if(checks.likelyError)score-=.35;
  if(checks.tooShort)score-=.12;
  if(checks.repetition)score-=.18;
  score=Math.max(0,Math.min(1,score));
  return {score:Number(score.toFixed(2)),checks,needsReview:score<.62};
}

    const q=clean(text).toLowerCase();
    if(!q)return "empty";
    if(/(latest|current|today|now|live|recent|news|search|web|price|weather|score|अभी|आज|ताज़ा|ताजा|लेटेस्ट|करंट|समाचार|न्यूज़|न्यूज|सर्च|खोज|कीमत|मौसम|स्कोर)/i.test(q))return "current_information";
    if(/(image|picture|photo|draw|generate.*image|इमेज|तस्वीर|फोटो|चित्र|बनाओ|जनरेट)/i.test(q))return "image_generation";
    if(/(calculate|calculation|math|code|debug|program|script|csv|data|कैलकुलेट|गणना|कोड|डिबग|प्रोग्राम|डेटा)/i.test(q))return "analysis_or_code";
    if(/(plan|build|create|make|develop|implement|continue|finish|complete|योजना|बनाओ|बनाइए|तैयार|जारी|पूरा|विकसित)/i.test(q))return "task_execution";
    if(/(explain|compare|research|analy[sz]e|विश्लेषण|तुलना|रिसर्च|समझाओ|समझाइए)/i.test(q))return "deep_reasoning";
    return "conversation";
  }

  function buildRuntime(text,hasImage,hasPdf){
    const intent=detectIntent(text);
    let toolPlan=null;
    try{
      if(typeof window.aaruV29BuildToolPlan==="function") toolPlan=window.aaruV29BuildToolPlan(text,hasImage,hasPdf);
    }catch(e){}
    let goal=null, workflow=null, adaptive=null, proactive=null;
    try{if(typeof window.aaruV23GetGoalState==="function")goal=window.aaruV23GetGoalState();}catch(e){}
    try{if(typeof window.aaruV26GetWorkflowState==="function")workflow=window.aaruV26GetWorkflowState();}catch(e){}
    try{if(typeof window.aaruV19GetAdaptiveProfile==="function")adaptive=window.aaruV19GetAdaptiveProfile(text,[]);}catch(e){}
    try{if(typeof window.aaruV21BuildProactivePlan==="function")proactive=window.aaruV21BuildProactivePlan(text);}catch(e){}
    return {version:VERSION,intent,toolPlan,goal,workflow,adaptive,proactive,attachments:{image:!!hasImage,pdf:!!hasPdf},timestamp:now()};
  }

  function compact(runtime){
    if(!runtime)return "";
    return JSON.stringify({version:VERSION,intent:runtime.intent,tools:runtime.toolPlan?.tools||[],mode:runtime.toolPlan?.mode||"model-only",goal:runtime.goal?.activeGoal||runtime.goal?.goal||null,workflow:runtime.workflow?.status||runtime.workflow?.active||null,adaptive:runtime.adaptive?{verbosity:runtime.adaptive.verbosity,tone:runtime.adaptive.tone,reasoning:runtime.adaptive.reasoning}:null,attachments:runtime.attachments});
  }

  function saveEvent(runtime,ok){
    const s=load();
    s.events=Array.isArray(s.events)?s.events:[];
    s.events.unshift({ts:now(),intent:runtime?.intent||"empty",tools:runtime?.toolPlan?.tools||[],ok:!!ok});
    s.events=s.events.slice(0,MAX_EVENTS);
    s.count=Number(s.count||0)+1;
    s.last=s.events[0]||null;
    save(s);
  }

  function health(){
    const layers=getLayerState(), values=Object.values(layers);
    const active=values.filter(Boolean).length;
    return {version:VERSION,activeLayers:active,totalLayers:values.length,coverage:values.length?Math.round(active/values.length*100):0,online:navigator.onLine!==false,lastEvent:load().last||null};
  }

  window.aaruV30GetLayerState=getLayerState;
  window.aaruV30DetectIntent=detectIntent;
  window.aaruV30BuildRuntime=buildRuntime;
  window.aaruV30CompactRuntime=compact;
  window.aaruV30GetHealth=health;

  if(typeof window.fetchChatWithRecovery==="function" && !window.AARU_V30_WRAPPED){
    const prev=window.fetchChatWithRecovery;
    window.fetchChatWithRecovery=async function(messages,opts){
      const last=(messages||[]).filter(m=>m&&m.role==="user").slice(-1)[0];
      const raw=last?.content;
      const text=typeof raw==="string"?raw:JSON.stringify(raw??"");
      const runtime=buildRuntime(text,!!window.selectedPhotoBase64,!!window.selectedPdfText);
      window.AARU_V30_LAST_RUNTIME=runtime;
      const nextOpts=Object.assign({},opts||{}, {
        client_unified_agent_version:VERSION,
        client_unified_agent_intent:runtime.intent,
        client_unified_agent_runtime:compact(runtime),
        client_unified_agent_health:JSON.stringify(health()),
        client_unified_agent_model_decision:true
      });
      try{const response=await prev(messages,nextOpts);saveEvent(runtime,true);return response;}
      catch(e){saveEvent(runtime,false);throw e;}
    };
    window.AARU_V30_WRAPPED=true;
  }

  window.addEventListener("online",function(){window.AARU_V30_LAST_NETWORK="online";});
  window.addEventListener("offline",function(){window.AARU_V30_LAST_NETWORK="offline";});
})();
</script>
