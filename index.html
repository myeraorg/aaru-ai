<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Aaru AI - Advanced Assistant</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --text-color: #f8fafc;
            --accent-color: #3b82f6;
            --safe-bottom: env(safe-area-inset-bottom, 20px);
        }
        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
        }
        .container {
            flex: 1;
            display: flex;
            flex-direction: column;
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
            padding: 16px;
            box-sizing: border-box;
        }
        .chat-box {
            flex: 1;
            overflow-y: auto;
            padding-bottom: calc(var(--safe-bottom) + 80px);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .message {
            padding: 10px 14px;
            border-radius: 10px;
            max-width: 85%;
            word-break: break-word;
        }
        .user-msg { background: #1e293b; align-self: flex-end; }
        .ai-msg { background: #334155; align-self: flex-start; }
        .input-area {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(15, 23, 42, 0.95);
            padding: 12px 16px calc(var(--safe-bottom) + 12px) 16px;
            display: flex;
            gap: 8px;
            align-items: center;
            backdrop-filter: blur(10px);
            border-top: 1px solid #1e293b;
        }
        input[type="text"] {
            flex: 1;
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #1e293b;
            color: #fff;
            font-size: 16px;
        }
        button {
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 10px 14px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            white-space: nowrap;
        }
        .tools-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
            overflow-x: auto;
            padding-bottom: 4px;
        }
        .tool-btn {
            background: #1e293b;
            border: 1px solid #475569;
            color: #cbd5e1;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
        }
    </style>
    <!-- PDF Processing Library (jsPDF) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>

    <div class="container">
        <div class="tools-bar">
            <button class="tool-btn" onclick="triggerImageUpload()">🖼️ इमेज पहचानें</button>
            <button class="tool-btn" onclick="triggerPDFUpload()">📄 PDF पढ़ें</button>
            <button class="tool-btn" onclick="generatePDFFromText()">📥 टेक्स्ट से PDF</button>
            <input type="file" id="imageInput" accept="image/*" style="display:none" onchange="handleImageUpload(event)">
            <input type="file" id="pdfInput" accept="application/pdf" style="display:none" onchange="handlePDFUpload(event)">
        </div>

        <div id="chatBox" class="chat-box">
            <div class="message ai-msg">नमस्ते! मैं Aaru AI हूँ। आप मुझसे बातचीत कर सकते हैं, वॉयस कमांड दे सकते हैं, इमेज बना सकते हैं या PDF/इमेज अपलोड कर सकते हैं।</div>
        </div>
    </div>

    <div class="input-area">
        <button id="voiceBtn" onclick="toggleVoiceInput()" title="बोलकर टाइप करें">🎤</button>
        <input type="text" id="userInput" placeholder="संदेश लिखें या इमेज प्रॉम्प्ट दें..." autocomplete="off">
        <button onclick="handleSendMessage()">भेजें</button>
    </div>

    <script>
        // 1. सुरक्षित LocalStorage सेविंग
        function safeSetLocalStorage(key, value) {
            try {
                localStorage.setItem(key, JSON.stringify(value));
            } catch (e) {
                console.warn("Storage quota exceeded. Clearing cache...", e);
                try {
                    localStorage.removeItem('old_temp_cache');
                    localStorage.setItem(key, JSON.stringify(value));
                } catch (innerError) {
                    console.error("Critical: Unable to save to localStorage", innerError);
                }
            }
        }

        // 2. वॉयस इनपुट (Speech Recognition) और आउटपुट (Speech Synthesis)
        let recognition;
        function toggleVoiceInput() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("आपका ब्राउज़र वॉइस इनपुट सपोर्ट नहीं करता है।");
                return;
            }
            recognition = new SpeechRecognition();
            recognition.lang = 'hi-IN';
            recognition.start();

            recognition.onresult = (event) => {
                const speechText = event.results[0][0].transcript;
                document.getElementById('userInput').value = speechText;
            };

            recognition.onerror = (err) => {
                console.error("Speech recognition error", err);
            };
        }

        function speakText(text) {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'hi-IN';
                window.speechSynthesis.speak(utterance);
            }
        }

        // 3. संदेश भेजना और इमेज जनरेशन प्रॉम्प्ट पहचानना
        function handleSendMessage() {
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            if (!text) return;

            appendMessage(text, 'user-msg');
            input.value = '';

            // यदि यूजर इमेज बनाने का निर्देश दे (जैसे "Generate image of...")
            if (text.toLowerCase().startsWith('image:') || text.toLowerCase().includes('तस्वीर बनाओ') || text.toLowerCase().includes('draw')) {
                generateAIImage(text);
            } else {
                // सामान्य प्रतिक्रिया और वॉयस आउटपुट
                const reply = `आपने कहा: "${text}"। यह एक स्मार्ट AI जवाब है।`;
                appendMessage(reply, 'ai-msg');
                speakText(reply);
                safeSetLocalStorage('last_chat', text);
            }
        }

        function appendMessage(text, className) {
            const chatBox = document.getElementById('chatBox');
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${className}`;
            msgDiv.textContent = text;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // 4. इमेज जनरेशन (प्रॉम्प्ट आधारित)
        async function generateAIImage(promptText) {
            appendMessage("तस्वीर बनाई जा रही है, कृपया प्रतीक्षा करें...", 'ai-msg');
            // यहाँ आप Pollinations AI या किसी अन्य फ्री इमेज जनरेशन API का उपयोग कर सकते हैं
            const encodedPrompt = encodeURIComponent(promptText);
            const imageUrl = `https://image.pollinations.ai/prompt/${encodedPrompt}`;

            const chatBox = document.getElementById('chatBox');
            const imgDiv = document.createElement('div');
            imgDiv.className = 'message ai-msg';
            imgDiv.innerHTML = `<p>आपके प्रॉम्प्ट के आधार पर तस्वीर:</p><img src="${imageUrl}" style="max-width:100%; border-radius:8px;" alt="AI Generated Image">`;
            chatBox.appendChild(imgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // 5. इमेज पहचानना (Image Recognition / Upload)
        function triggerImageUpload() { document.getElementById('imageInput').click(); }
        function handleImageUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const chatBox = document.getElementById('chatBox');
                const imgDiv = document.createElement('div');
                imgDiv.className = 'message user-msg';
                imgDiv.innerHTML = `<img src="${e.target.result}" style="max-width:150px; border-radius:6px;"><br>अपलोड की गई इमेज`;
                chatBox.appendChild(imgDiv);

                // सिमुलेटेड इमेज रिकग्निशन रिस्पॉन्स
                setTimeout(() => {
                    const analysis = "विश्लेषण: इस इमेज में एक विजुअल ऑब्जेक्ट दिखाई दे रहा है (इमेज रिकग्निशन सफल)।";
                    appendMessage(analysis, 'ai-msg');
                    speakText(analysis);
                }, 1000);
            };
            reader.readAsDataURL(file);
        }

        // 6. PDF रीडिंग (Text Extraction Simulation)
        function triggerPDFUpload() { document.getElementById('pdfInput').click(); }
        function handlePDFUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            appendMessage(`PDF लोड हो रही है: ${file.name}`, 'user-msg');
            // वास्तविक प्रोजेक्ट में PDF.js का उपयोग करके टेक्स्ट निकाला जा सकता है
            setTimeout(() => {
                const pdfSummary = `PDF सारांश: "${file.name}" फाइल सफलतापूर्वक पढ़ ली गई है। इसमें कुल डेटा टेक्स्ट फॉर्मेट में मौजूद है।`;
                appendMessage(pdfSummary, 'ai-msg');
                speakText(pdfSummary);
            }, 1000);
        }

        // 7. टेक्स्ट से PDF बनाना (Text to PDF)
        function generatePDFFromText() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            doc.text("Aaru AI Generated Document", 10, 10);
            doc.text("यह पीडीएफ चैट या टेक्स्ट डेटा से ऑटोमैटिक जनरेट की गई है।", 10, 20);
            doc.save("Aaru-AI-Document.pdf");
            appendMessage("PDF फाइल सफलतापूर्वक डाउनलोड हो गई है!", 'ai-msg');
        }
    </script>
</body>
</html>
