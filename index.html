<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#070707">
<title>Aaru AI</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  width:100%;
  min-height:100%;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#070707;
  color:#fff;
  overflow-x:hidden;
}

button,
textarea,
input{
  font-family:inherit;
}

button{
  -webkit-tap-highlight-color:transparent;
}

/* APP */

.app{
  width:100%;
  min-height:100vh;
  max-width:900px;
  margin:auto;
}

/* HEADER */

.header{
  position:sticky;
  top:0;
  z-index:30;
  height:58px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 14px;
  background:rgba(7,7,7,.96);
  border-bottom:1px solid #171717;
  backdrop-filter:blur(12px);
}

.left-header{
  display:flex;
  align-items:center;
  gap:10px;
}

.menu{
  width:38px;
  height:38px;
  border:1px solid #292929;
  border-radius:11px;
  background:#111;
  color:#fff;
  font-size:20px;
  cursor:pointer;
}

.logo{
  font-size:21px;
  font-weight:800;
  letter-spacing:-.7px;
}

.logo span{
  opacity:.5;
}

.header-status{
  font-size:11px;
  color:#666;
}

/* CHAT */

.chat{
  width:100%;
  padding:10px 12px 170px;
}

.welcome{
  min-height:68vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:20px;
}

.welcome-logo{
  width:64px;
  height:64px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#111;
  border:1px solid #333;
  border-radius:20px;
  font-size:27px;
  font-weight:800;
  margin-bottom:18px;
}

.welcome h1{
  font-size:34px;
  letter-spacing:-1.4px;
  margin-bottom:9px;
}

.welcome p{
  max-width:430px;
  color:#777;
  font-size:14px;
  line-height:1.6;
}

/* MESSAGES */

.message{
  display:flex;
  width:100%;
  margin:16px 0;
}

.message.user{
  justify-content:flex-end;
}

.message.assistant{
  justify-content:flex-start;
}

.message-inner{
  max-width:min(78%,620px);
}

.bubble{
  padding:12px 15px;
  border-radius:18px;
  font-size:15px;
  line-height:1.55;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}

.user .bubble{
  background:#fff;
  color:#000;
  border-bottom-right-radius:5px;
}

.assistant .bubble{
  background:#151515;
  border:1px solid #252525;
  color:#eee;
  border-bottom-left-radius:5px;
}

/* USER PHOTO */

.photo-user{
  width:min(330px,80vw);
  margin-bottom:7px;
}

.photo-user img{
  width:100%;
  display:block;
  max-height:330px;
  object-fit:cover;
  border-radius:16px;
  border:1px solid #292929;
}

/* GENERATED IMAGE */

.generated{
  width:min(560px,88vw);
}

.generated img{
  width:100%;
  display:block;
  border-radius:17px;
  background:#111;
  border:1px solid #252525;
}

.image-actions{
  display:flex;
  gap:8px;
  margin-top:9px;
}

.image-actions a,
.image-actions button{
  flex:1;
  border:1px solid #303030;
  background:#141414;
  color:#fff;
  text-decoration:none;
  text-align:center;
  padding:10px 8px;
  border-radius:11px;
  font-size:12px;
  cursor:pointer;
}

/* TYPING */

.typing{
  display:flex;
  align-items:center;
  gap:5px;
  padding:13px 15px;
  background:#151515;
  border:1px solid #252525;
  border-radius:17px;
  border-bottom-left-radius:5px;
}

.typing i{
  width:6px;
  height:6px;
  background:#777;
  border-radius:50%;
  animation:typing 1s infinite;
}

.typing i:nth-child(2){
  animation-delay:.15s;
}

.typing i:nth-child(3){
  animation-delay:.30s;
}

@keyframes typing{
  0%,60%,100%{
    opacity:.3;
    transform:translateY(0);
  }
  30%{
    opacity:1;
    transform:translateY(-4px);
  }
}

/* COMPOSER */

.composer-area{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:50;
  padding:20px 10px 10px;
  background:linear-gradient(to bottom,rgba(7,7,7,0),#070707 30%);
}

.composer{
  width:100%;
  max-width:870px;
  margin:auto;
  background:#111;
  border:1px solid #292929;
  border-radius:20px;
  padding:9px;
  box-shadow:0 -10px 35px rgba(0,0,0,.25);
}

/* ATTACHMENT */

.attachment{
  display:none;
  position:relative;
  width:115px;
  margin:2px 0 9px 2px;
}

.attachment img{
  width:115px;
  height:115px;
  object-fit:cover;
  border-radius:13px;
  border:1px solid #333;
  display:block;
}

.remove-photo{
  position:absolute;
  top:5px;
  right:5px;
  width:28px;
  height:28px;
  border:0;
  border-radius:50%;
  background:rgba(0,0,0,.85);
  color:#fff;
  font-size:18px;
  cursor:pointer;
}

/* INPUT */

.input-row{
  display:flex;
  align-items:flex-end;
  gap:8px;
}

.attach-btn,
.send-btn{
  width:42px;
  height:42px;
  flex:none;
  border-radius:13px;
  cursor:pointer;
}

.attach-btn{
  border:1px solid #303030;
  background:#181818;
  color:#fff;
  font-size:23px;
}

.send-btn{
  border:0;
  background:#fff;
  color:#000;
  font-size:20px;
  font-weight:bold;
}

.send-btn:disabled{
  opacity:.35;
  cursor:not-allowed;
}

#prompt{
  width:100%;
  min-height:42px;
  max-height:150px;
  resize:none;
  border:0;
  outline:0;
  background:transparent;
  color:#fff;
  font-size:15px;
  line-height:1.45;
  padding:10px 3px;
}

#prompt::placeholder{
  color:#666;
}

/* TOOLS */

.tools{
  display:flex;
  gap:7px;
  margin-top:8px;
  padding:0 2px 1px;
  overflow-x:auto;
  scrollbar-width:none;
}

.tools::-webkit-scrollbar{
  display:none;
}

.tool{
  flex:none;
  border:1px solid #2b2b2b;
  background:#181818;
  color:#aaa;
  padding:8px 11px;
  border-radius:10px;
  font-size:12px;
  cursor:pointer;
}

.tool.active{
  background:#fff;
  color:#000;
  border-color:#fff;
}

#imageInput{
  display:none;
}

.status{
  min-height:16px;
  text-align:center;
  color:#777;
  font-size:11px;
  padding-top:6px;
}

/* HISTORY */

.overlay{
  display:none;
  position:fixed;
  inset:0;
  z-index:80;
  background:rgba(0,0,0,.6);
}

.overlay.show{
  display:block;
}

.history-drawer{
  position:fixed;
  top:0;
  left:0;
  bottom:0;
  z-index:90;
  width:min(330px,88vw);
  background:#0d0d0d;
  border-right:1px solid #292929;
  transform:translateX(-100%);
  transition:transform .25s ease;
  overflow-y:auto;
}

.history-drawer.show{
  transform:translateX(0);
}

.history-head{
  height:60px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 14px;
  border-bottom:1px solid #222;
  position:sticky;
  top:0;
  background:#0d0d0d;
  z-index:2;
}

.history-head-title{
  font-weight:700;
  font-size:16px;
}

.close-history{
  width:34px;
  height:34px;
  border:1px solid #303030;
  border-radius:10px;
  background:#151515;
  color:#fff;
  font-size:19px;
  cursor:pointer;
}

.history-tools{
  padding:12px 14px;
  border-bottom:1px solid #1c1c1c;
}

.delete-all{
  width:100%;
  border:1px solid #333;
  background:#151515;
  color:#ccc;
  padding:10px;
  border-radius:10px;
  font-size:12px;
  cursor:pointer;
}

.history-list{
  padding:12px;
}

.history-empty{
  text-align:center;
  color:#555;
  font-size:12px;
  padding:25px 5px;
}

.history-card{
  position:relative;
  display:flex;
  gap:9px;
  padding:8px;
  margin-bottom:8px;
  border:1px solid #242424;
  border-radius:12px;
  background:#111;
}

.history-card img{
  width:70px;
  height:70px;
  object-fit:cover;
  border-radius:9px;
  cursor:pointer;
}

.history-card-info{
  flex:1;
  display:flex;
  align-items:center;
  color:#999;
  font-size:12px;
}

.history-delete{
  position:absolute;
  right:7px;
  top:7px;
  width:27px;
  height:27px;
  border:0;
  border-radius:8px;
  background:#222;
  color:#aaa;
  cursor:pointer;
  font-size:15px;
}

/* MOBILE */

@media(max-width:600px){

  .header{
    padding:0 11px;
  }

  .chat{
    padding-left:9px;
    padding-right:9px;
  }

  .message-inner{
    max-width:88%;
  }

  .welcome h1{
    font-size:29px;
  }

  .generated{
    width:90vw;
  }
}

@media(max-width:380px){

  .welcome h1{
    font-size:27px;
  }

  .tool{
    font-size:11px;
    padding:7px 9px;
  }
}
</style>
</head>

<body>

<div class="app">

<header class="header">

  <div class="left-header">

    <button
      class="menu"
      id="menuBtn"
      type="button"
    >☰</button>

    <div class="logo">
      Aaru <span>AI</span>
    </div>

  </div>

  <div class="header-status">
    AI Assistant
  </div>

</header>


<main class="chat" id="chat">

  <section class="welcome" id="welcome">

    <div class="welcome-logo">
      A
    </div>

    <h1>
      What can I help with?
    </h1>

    <p>
      Chat करें, photo edit करें या अपनी कल्पना से नई image बनाएं।
    </p>

  </section>

</main>

</div>


<!-- HISTORY -->

<div
  class="overlay"
  id="overlay"
></div>

<aside
  class="history-drawer"
  id="historyDrawer"
>

  <div class="history-head">

    <div class="history-head-title">
      Recent Creations
    </div>

    <button
      class="close-history"
      id="closeHistoryBtn"
      type="button"
    >×</button>

  </div>

  <div class="history-tools">

    <button
      class="delete-all"
      id="deleteAllBtn"
      type="button"
    >
      🗑 Delete All
    </button>

  </div>

  <div
    class="history-list"
    id="historyList"
  ></div>

</aside>


<!-- COMPOSER -->

<div class="composer-area">

  <div class="composer">

    <div
      class="attachment"
      id="attachment"
    >

      <img
        id="attachmentImage"
        alt="Selected photo"
      >

      <button
        class="remove-photo"
        id="removePhotoBtn"
        type="button"
      >×</button>

    </div>


    <div class="input-row">

      <button
        class="attach-btn"
        id="attachBtn"
        type="button"
      >+</button>

      <textarea
        id="prompt"
        rows="1"
        placeholder="Message Aaru AI..."
      ></textarea>

      <button
        class="send-btn"
        id="sendBtn"
        type="button"
      >↑</button>

    </div>


    <div class="tools">

      <button
        class="tool"
        id="imageTool"
        type="button"
      >
        🎨 Create Image
      </button>

      <button
        class="tool"
        id="photoTool"
        type="button"
      >
        📷 Photo
      </button>

      <button
        class="tool"
        id="exampleTool"
        type="button"
      >
        ✨ Example
      </button>

    </div>


    <input
      type="file"
      id="imageInput"
      accept="image/jpeg,image/png,image/webp,image/*"
    >

    <div
      class="status"
      id="status"
    ></div>

  </div>

</div>


<script>

/* =====================================================
   AARU AI FRONTEND
===================================================== */

"use strict";


/* =========================
   CONFIG
========================= */

const API_URL =
  "https://aaru-ai-api.myera-org.workers.dev/";


/* =========================
   STATE
========================= */

let selectedImageDataUrl = "";
let imageMode = false;
let busy = false;


/* =========================
   ELEMENTS
========================= */

const chat =
  document.getElementById("chat");

const welcome =
  document.getElementById("welcome");

const promptInput =
  document.getElementById("prompt");

const imageInput =
  document.getElementById("imageInput");

const attachment =
  document.getElementById("attachment");

const attachmentImage =
  document.getElementById("attachmentImage");

const sendBtn =
  document.getElementById("sendBtn");

const imageTool =
  document.getElementById("imageTool");

const photoTool =
  document.getElementById("photoTool");

const exampleTool =
  document.getElementById("exampleTool");

const attachBtn =
  document.getElementById("attachBtn");

const removePhotoBtn =
  document.getElementById("removePhotoBtn");

const status =
  document.getElementById("status");

const menuBtn =
  document.getElementById("menuBtn");

const historyDrawer =
  document.getElementById("historyDrawer");

const closeHistoryBtn =
  document.getElementById("closeHistoryBtn");

const overlay =
  document.getElementById("overlay");

const historyList =
  document.getElementById("historyList");

const deleteAllBtn =
  document.getElementById("deleteAllBtn");


/* =========================
   SAFETY CHECK
========================= */

console.log("Aaru AI frontend loaded");


if(
  !chat ||
  !promptInput ||
  !imageInput ||
  !sendBtn
){

  console.error(
    "Aaru AI: Required elements missing."
  );

}


/* =========================
   TEXTAREA
========================= */

promptInput.addEventListener(
  "input",
  function(){

    this.style.height = "42px";

    this.style.height =
      Math.min(
        this.scrollHeight,
        150
      ) + "px";

  }
);


/* =========================
   ENTER
========================= */

promptInput.addEventListener(
  "keydown",
  function(e){

    if(
      e.key === "Enter" &&
      !e.shiftKey
    ){

      e.preventDefault();

      sendMessage();

    }

  }
);


/* =========================
   BUTTON EVENTS
========================= */

menuBtn.addEventListener(
  "click",
  openHistory
);


closeHistoryBtn.addEventListener(
  "click",
  closeHistory
);


overlay.addEventListener(
  "click",
  closeHistory
);


deleteAllBtn.addEventListener(
  "click",
  deleteAllHistory
);


attachBtn.addEventListener(
  "click",
  openPhotoPicker
);


photoTool.addEventListener(
  "click",
  openPhotoPicker
);


removePhotoBtn.addEventListener(
  "click",
  removePhoto
);


imageTool.addEventListener(
  "click",
  toggleImageMode
);


exampleTool.addEventListener(
  "click",
  insertExample
);


sendBtn.addEventListener(
  "click",
  sendMessage
);


imageInput.addEventListener(
  "change",
  handlePhotoSelect
);


/* =========================
   PHOTO PICKER
========================= */

function openPhotoPicker(){

  if(busy){
    return;
  }

  imageInput.click();

}


/* =========================
   PHOTO SELECT
========================= */

async function handlePhotoSelect(){

  const file =
    imageInput.files[0];

  if(!file){
    return;
  }

  if(
    !file.type ||
    !file.type.startsWith("image/")
  ){

    alert(
      "कृपया image file चुनें।"
    );

    imageInput.value = "";

    return;

  }

  try{

    setStatus(
      "🔄 Photo तैयार हो रही है..."
    );

    selectedImageDataUrl =
      await preparePhoto(file);

    attachmentImage.src =
      selectedImageDataUrl;

    attachment.style.display =
      "block";

    imageMode = true;

    imageTool.classList.add(
      "active"
    );

    promptInput.placeholder =
      "इस photo के साथ क्या करना है?";

    setStatus("");

  }catch(error){

    console.error(
      "Photo preparation error:",
      error
    );

    selectedImageDataUrl = "";

    attachment.style.display =
      "none";

    setStatus(
      "❌ Photo तैयार नहीं हो सकी।"
    );

  }

}


/* =========================
   PREPARE PHOTO
========================= */

function preparePhoto(file){

  return new Promise(
    function(resolve,reject){

      const reader =
        new FileReader();

      reader.onerror =
        function(){

          reject(
            new Error(
              "Photo read failed."
            )
          );

        };


      reader.onload =
        function(){

          const img =
            new Image();

          img.onerror =
            function(){

              reject(
                new Error(
                  "Photo load failed."
                )
              );

            };


          img.onload =
            function(){

              let maxSize = 768;

              let width =
                img.naturalWidth;

              let height =
                img.naturalHeight;


              const scale =
                Math.min(
                  1,
                  maxSize /
                  Math.max(
                    width,
                    height
                  )
                );


              width =
                Math.max(
                  1,
                  Math.round(
                    width * scale
                  )
                );


              height =
                Math.max(
                  1,
                  Math.round(
                    height * scale
                  )
                );


              const canvas =
                document.createElement(
                  "canvas"
                );


              canvas.width =
                width;

              canvas.height =
                height;


              const ctx =
                canvas.getContext(
                  "2d",
                  {
                    alpha:false
                  }
                );


              ctx.drawImage(
                img,
                0,
                0,
                width,
                height
              );


              let quality = 0.68;

              let data =
                canvas.toDataURL(
                  "image/jpeg",
                  quality
                );


              /*
               * Keep base64 request small.
               */

              while(
                data.length > 600000 &&
                quality > 0.30
              ){

                quality -= 0.05;

                data =
                  canvas.toDataURL(
                    "image/jpeg",
                    quality
                  );

              }


              /*
               * Final fallback.
               */

              if(
                data.length > 600000
              ){

                const max2 = 512;

                const scale2 =
                  Math.min(
                    1,
                    max2 /
                    Math.max(
                      img.naturalWidth,
                      img.naturalHeight
                    )
                  );


                const canvas2 =
                  document.createElement(
                    "canvas"
                  );


                canvas2.width =
                  Math.max(
                    1,
                    Math.round(
                      img.naturalWidth *
                      scale2
                    )
                  );


                canvas2.height =
                  Math.max(
                    1,
                    Math.round(
                      img.naturalHeight *
                      scale2
                    )
                  );


                const ctx2 =
                  canvas2.getContext(
                    "2d",
                    {
                      alpha:false
                    }
                  );


                ctx2.drawImage(
                  img,
                  0,
                  0,
                  canvas2.width,
                  canvas2.height
                );


                data =
                  canvas2.toDataURL(
                    "image/jpeg",
                    0.42
                  );

              }


              resolve(data);

            };


          img.src =
            reader.result;

        };


      reader.readAsDataURL(file);

    }
  );

}


/* =========================
   REMOVE PHOTO
========================= */

function removePhoto(){

  selectedImageDataUrl = "";

  imageInput.value = "";

  attachment.style.display =
    "none";

  attachmentImage.src = "";

  imageMode = false;

  imageTool.classList.remove(
    "active"
  );

  promptInput.placeholder =
    "Message Aaru AI...";

  setStatus("");

}


/* =========================
   IMAGE MODE
========================= */

function toggleImageMode(){

  if(busy){
    return;
  }

  imageMode =
    !imageMode;


  if(imageMode){

    imageTool.classList.add(
      "active"
    );

    promptInput.placeholder =
      "Image में क्या बनाना चाहते हैं?";

  }else{

    imageTool.classList.remove(
      "active"
    );

    promptInput.placeholder =
      "Message Aaru AI...";

  }

}


/* =========================
   EXAMPLE
========================= */

function insertExample(){

  if(busy){
    return;
  }

  imageMode = true;

  imageTool.classList.add(
    "active"
  );

  promptInput.value =
    "एक भारतीय गाँव का photorealistic दृश्य, सुबह की सुनहरी रोशनी, खेत और दूर पहाड़";


  promptInput.dispatchEvent(
    new Event("input")
  );


  promptInput.focus();

}


/* =========================
   IMAGE INTENT
========================= */

function isImageRequest(text){

  const t =
    String(text || "")
      .toLowerCase();


  const words = [

    "create image",
    "generate image",
    "make image",
    "create a picture",
    "generate a picture",
    "make a picture",
    "draw a picture",
    "draw an image",
    "image generate",

    "image बनाओ",
    "image बना",
    "इमेज बनाओ",
    "इमेज बना",
    "फोटो बनाओ",
    "फोटो बना",
    "फोटो तैयार",
    "चित्र बनाओ",
    "चित्र बना",
    "तस्वीर बनाओ",
    "तस्वीर बना",

    "cinematic realistic",
    "cinematic photo",
    "photorealistic image",
    "realistic image",

    "generate an image",
    "create an image"

  ];


  return words.some(
    function(word){

      return t.includes(word);

    }
  );

}


/* =========================
   SEND MESSAGE
========================= */

async function sendMessage(){

  if(busy){
    return;
  }


  const text =
    promptInput.value.trim();


  if(!text){

    if(selectedImageDataUrl){

      alert(
        "Photo के साथ क्या करना है, वह लिखें।"
      );

    }else{

      alert(
        "पहले अपना message लिखें।"
      );

    }

    return;

  }


  const shouldGenerate =
    !!selectedImageDataUrl ||
    imageMode ||
    isImageRequest(text);


  busy = true;

  sendBtn.disabled = true;


  try{

    if(shouldGenerate){

      await generateImage(text);

    }else{

      await sendChat(text);

    }

  }catch(error){

    console.error(
      "Send error:",
      error
    );

  }finally{

    busy = false;

    sendBtn.disabled = false;

  }

}

/* =========================
   CHAT API
========================= */

async function sendChat(text){

  addUserMessage(
    text
  );


  promptInput.value = "";

  resetTextarea();


  showTyping();


  setStatus(
    "Aaru सोच रहा है..."
  );


  try{

    const response =
      await fetch(
        API_URL + "chat",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({
            message:text
          })

        }
      );


    let data = null;


    try{

      data =
        await response.json();

    }catch(e){

      data = null;

    }


    if(!response.ok){

      throw new Error(
        data &&
        data.error
        ? data.error
        : "Chat failed."
      );

    }


    removeTyping();


    addAssistantMessage(
      data &&
      data.reply
      ? data.reply
      : "मुझे अभी कोई response नहीं मिला।"
    );


  }catch(error){

    console.error(
      "Chat error:",
      error
    );


    removeTyping();


    addAssistantMessage(
      "❌ " +
      (
        error.message ||
        "Chat failed."
      )
    );

  }


  setStatus("");

}


/* =========================
   IMAGE GENERATION
========================= */

async function generateImage(text){

  const sourcePhoto =
    selectedImageDataUrl;


  addUserMessage(
    text,
    sourcePhoto
  );


  promptInput.value = "";

  resetTextarea();


  showTyping();


  setStatus(
    sourcePhoto
    ? "🔄 Photo को transform किया जा रहा है..."
    : "✨ आपकी image तैयार हो रही है..."
  );


  try{

    let response;


    /* =====================
       PHOTO TO IMAGE
    ===================== */

    if(sourcePhoto){

      const base64 =
        cleanBase64(
          sourcePhoto
        );


      if(!base64){

        throw new Error(
          "Photo data खाली है।"
        );

      }


      if(base64.length > 650000){

        throw new Error(
          "Photo अभी भी बहुत बड़ी है। छोटी photo चुनें।"
        );

      }


      response =
        await fetch(
          API_URL,
          {
            method:"POST",

            headers:{
              "Content-Type":
                "application/json"
            },

            body:JSON.stringify({

              prompt:text,

              ratio:"1:1",

              quality:"hd",

              image_b64:base64,

              strength:.65

            })

          }
        );

    }


    /* =====================
       TEXT TO IMAGE
    ===================== */

    else{

      const params =
        new URLSearchParams();


      params.set(
        "prompt",
        text
      );


      params.set(
        "ratio",
        "1:1"
      );


      params.set(
        "quality",
        "hd"
      );


      response =
        await fetch(
          API_URL +
          "?" +
          params.toString()
        );

    }


    /* =====================
       RESPONSE
    ===================== */

    if(!response.ok){

      let message =
        "Image generation failed.";


      try{

        const data =
          await response.json();


        if(
          data &&
          data.error
        ){

          message =
            data.error;

        }

      }catch(e){}


      throw new Error(
        message
      );

    }


    const type =
      response.headers.get(
        "content-type"
      ) || "";


    if(
      !type.toLowerCase().includes(
        "image"
      )
    ){

      throw new Error(
        "Server ने valid image नहीं भेजी।"
      );

    }


    const blob =
      await response.blob();


    const url =
      URL.createObjectURL(
        blob
      );


    removeTyping();


    addGeneratedImage(
      url,
      blob
    );


    removePhoto();


    setStatus(
      "✅ Image तैयार है!"
    );


  }catch(error){

    console.error(
      "Image generation error:",
      error
    );


    removeTyping();


    addAssistantMessage(
      "❌ " +
      (
        error.message ||
        "Image generation failed."
      )
    );


    setStatus("");

  }

}

/* =========================
   BASE64
========================= */

function cleanBase64(
  value
){

  if(!value){
    return "";
  }


  if(
    value.startsWith("data:")
  ){

    const comma =
      value.indexOf(",");


    if(comma >= 0){

      value =
        value.substring(
          comma + 1
        );

    }

  }


  return value.replace(
    /\s/g,
    ""
  );

}


/* =========================
   HISTORY SAVE
========================= */

function saveHistory(
  blob
){

  const reader =
    new FileReader();


  reader.onloadend =
    async function(){

      try{

        const thumbnail =
          await makeThumbnail(
            reader.result
          );


        let history =
          JSON.parse(
            localStorage.getItem(
              "aaru_history"
            ) || "[]"
          );


        history.unshift({
          id:Date.now(),
          image:thumbnail
        });


        history =
          history.slice(
            0,
            20
          );


        localStorage.setItem(
          "aaru_history",
          JSON.stringify(
            history
          )
        );


        loadHistory();


      }catch(error){

        console.log(
          "History save failed:",
          error
        );

      }

    };


  reader.readAsDataURL(
    blob
  );

}


/* =========================
   THUMBNAIL
========================= */

function makeThumbnail(
  dataUrl
){

  return new Promise(
    function(resolve){

      const img =
        new Image();


      img.onload =
        function(){

          const max =
            500;


          let width =
            img.width;

          let height =
            img.height;


          if(width > max){

            const scale =
              max / width;


            width =
              Math.round(
                width * scale
              );


            height =
              Math.round(
                height * scale
              );

          }


          const canvas =
            document.createElement(
              "canvas"
            );


          canvas.width =
            width;

          canvas.height =
            height;


          const ctx =
            canvas.getContext(
              "2d"
            );


          ctx.drawImage(
            img,
            0,
            0,
            width,
            height
          );


          resolve(
            canvas.toDataURL(
              "image/jpeg",
              .65
            )
          );

        };


      img.src =
        dataUrl;

    }
  );

}


/* =========================
   LOAD HISTORY
========================= */

function loadHistory(){

  let history = [];


  try{

    history =
      JSON.parse(
        localStorage.getItem(
          "aaru_history"
        ) || "[]"
      );

  }catch(e){

    history = [];

  }


  historyList.innerHTML =
    "";


  if(!history.length){

    historyList.innerHTML =
      '<div class="history-empty">' +
      'अभी कोई creation नहीं है' +
      '</div>';

    return;

  }


  history.forEach(
    function(item,index){

      const image =
        typeof item === "string"
        ? item
        : item.image;


      const id =
        typeof item === "string"
        ? index
        : item.id;


      const card =
        document.createElement(
          "div"
        );


      card.className =
        "history-card";


      const img =
        document.createElement(
          "img"
        );


      img.src =
        image;


      img.loading =
        "lazy";


      img.addEventListener(
        "click",
        function(){

          closeHistory();

          showHistoryImage(
            image
          );

        }
      );


      const info =
        document.createElement(
          "div"
        );


      info.className =
        "history-card-info";


      info.textContent =
        "Creation " +
        (index + 1);


      const del =
        document.createElement(
          "button"
        );


      del.className =
        "history-delete";


      del.type =
        "button";


      del.textContent =
        "🗑";


      del.addEventListener(
        "click",
        function(e){

          e.stopPropagation();

          deleteHistoryItem(
            id,
            index
          );

        }
      );


      card.appendChild(
        img
      );


      card.appendChild(
        info
      );


      card.appendChild(
        del
      );


      historyList.appendChild(
        card
      );

    }
  );

}

/* =========================
   DELETE ONE
========================= */

function deleteHistoryItem(
  id,
  index
){

  let history = [];


  try{

    history =
      JSON.parse(
        localStorage.getItem(
          "aaru_history"
        ) || "[]"
      );

  }catch(e){

    history = [];

  }


  if(
    typeof history[index] === "object" &&
    history[index] !== null
  ){

    history =
      history.filter(
        function(item){

          return item.id !== id;

        }
      );

  }else{

    history.splice(
      index,
      1
    );

  }


  localStorage.setItem(
    "aaru_history",
    JSON.stringify(
      history
    )
  );


  loadHistory();

}
