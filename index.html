<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Aaru AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0b0f;
      color: white;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 20px;
    }

    .logo {
      font-size: 28px;
      font-weight: bold;
      text-align: center;
      margin-top: 20px;
    }

    .hero {
      text-align: center;
      margin-top: 45px;
    }

    .hero h1 {
      font-size: 42px;
      margin-bottom: 10px;
    }

    .hero p {
      color: #aaa;
      font-size: 17px;
    }

    .tabs {
      display: flex;
      gap: 10px;
      margin: 30px 0 15px;
    }

    .tab {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: #1a1a22;
      color: #aaa;
      font-size: 16px;
      cursor: pointer;
    }

    .tab.active {
      background: white;
      color: black;
    }

    textarea {
      width: 100%;
      min-height: 130px;
      resize: vertical;
      background: #15151c;
      color: white;
      border: 1px solid #2a2a35;
      border-radius: 14px;
      padding: 16px;
      font-size: 16px;
      outline: none;
    }

    .controls {
      display: flex;
      gap: 10px;
      margin-top: 12px;
    }

    select {
      flex: 1;
      padding: 13px;
      border-radius: 10px;
      background: #15151c;
      color: white;
      border: 1px solid #2a2a35;
    }

    .generate {
      width: 100%;
      margin-top: 15px;
      padding: 16px;
      border: none;
      border-radius: 12px;
      background: white;
      color: black;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .generate:disabled {
      opacity: 0.5;
    }

    #status {
      text-align: center;
      margin: 20px 0;
      color: #aaa;
    }

    #result {
      margin-top: 20px;
      text-align: center;
    }

    #result img {
      max-width: 100%;
      border-radius: 15px;
      margin-top: 10px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-top: 40px;
    }

    .card {
      background: #15151c;
      padding: 20px;
      border-radius: 14px;
      border: 1px solid #24242e;
    }

    .card h3 {
      margin-top: 0;
    }

    .card p {
      color: #999;
      font-size: 14px;
    }

    .nav {
      display: flex;
      justify-content: space-around;
      margin-top: 40px;
      padding: 15px 0;
      border-top: 1px solid #222;
      color: #999;
    }

    @media (max-width: 600px) {
      .hero h1 {
        font-size: 34px;
      }

      .cards {
        grid-template-columns: 1fr;
      }
