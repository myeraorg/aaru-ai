<script>
/* =========================================================
   AARU v10 — PERSISTENT CONVERSATION INTELLIGENCE
   Additive Index layer. Worker/API architecture unchanged.
   Keeps compact per-chat state outside the main chat payload.
========================================================= */
(function(){
  window.AARU_V10_PERSISTENT = true;
  window.AARU_V10_VERSION = "PERSISTENT-CONVERSATION-INTELLIGENCE-V10";
  window.AARU_V10_STORAGE_KEY = "aaru_persistent_context_v10";
  window.AARU_V10_MAX_CHARS = 5200;
  window.AARU_V10_MAX_TOPICS = 12;
  window.AARU_V10_MAX_TURNS = 18;
  window.AARU_V10_MAX_CHATS = 12;

  function clean(v){
    return String(v||"").replace(/\s+/g," ").trim();
  }
  function norm(v){
    return clean(v).toLowerCase().replace(/[^\p{L}\p{N}\s]/gu," ");
  }
  function tokens(v){
    const stop=new Set([
      "the","and","for","with","that","this","you","are","was","has","have","from","what","how","why","can",
      "में","और","का","की","के","को","से","है","हैं","था","थे","यह","वह","एक","क्या","कैसे","क्यों","करो","करें","मुझे","आप"
    ]);
    return [...new Set(norm(v).split(/\s+/).filter(x=>x.length>2&&!stop.has(x)))].slice(0,80);
  }
  function read(){
    try{
      const raw=localStorage.getItem(window.AARU_V10_STORAGE_KEY);
      const data=raw?JSON.parse(raw):{};
      return data&&typeof data==="object"?data:{};
    }catch(_){ return {}; }
  }
  function write(data){
    try{ localStorage.setItem(window.AARU_V10_STORAGE_KEY,JSON.stringify(data)); }catch(_){}
  }
  function compact(text,max){
    const value=clean(text);
    if(value.length<=max)return value;
    return value.slice(0,Math.max(0,max-1)).replace(/\s+\S*$/,"")+"…";
  }

  function buildState(allMessages,currentQuery){
    const list=Array.isArray(allMessages)?allMessages:[];
    const users=list.filter(m=>m?.role==="user");
    const freq=new Map();
    users.slice(-30).forEach(m=>{
      tokens(m.content).forEach(t=>freq.set(t,(freq.get(t)||0)+1));
    });
    const topics=[...freq.entries()]
      .sort((a,b)=>b[1]-a[1])
      .slice(0,window.AARU_V10_MAX_TOPICS)
      .map(x=>x[0]);

    const turns=list.slice(-window.AARU_V10_MAX_TURNS).map(m=>({
      role:m?.role==="user"?"user":"assistant",
      content:compact(m?.content,420)
    })).filter(x=>x.content);

    const older=list.slice(0,Math.max(0,list.length-window.AARU_V10_MAX_TURNS));
    const summaryParts=[];
    older.filter(m=>m?.role==="user").slice(-10).forEach(m=>{
      const s=clean(m.content);
      if(s)summaryParts.push("User: "+compact(s,360));
    });
    const summary=compact(summaryParts.join("\n"),window.AARU_V10_MAX_CHARS);

    return {
      version:window.AARU_V10_VERSION,
      updatedAt:Date.now(),
      messageCount:list.length,
      topics,
      summary,
      recentTurns:turns,
      lastQuery:compact(currentQuery,500)
    };
  }

  window.aaruV10PersistState=function(chatId,allMessages,currentQuery){
    if(!chatId)return null;
    const state=buildState(allMessages,currentQuery);
    const data=read();
    data[String(chatId)]=state;
    const entries=Object.entries(data)
      .sort((a,b)=>(b[1]?.updatedAt||0)-(a[1]?.updatedAt||0))
      .slice(0,window.AARU_V10_MAX_CHATS);
    write(Object.fromEntries(entries));
    return state;
  };

  window.aaruV10GetState=function(chatId){
    if(!chatId)return null;
    const data=read();
    return data[String(chatId)]||null;
  };

  window.aaruV10BuildContextBridge=function(chatId,allMessages,currentQuery){
    const state=window.aaruV10GetState(chatId) ||
      window.aaruV10PersistState(chatId,allMessages,currentQuery);
    if(!state)return {summary:"",topics:[],recentTurns:[],mode:"none"};

    const q=norm(currentQuery);
    const follow=/^(yes|yeah|yep|ok|okay|sure|do it|continue|next|same|that one|this one|वही|इसे|उसे|हाँ|हां|ठीक है|करो|आगे|जारी रखो|नेक्स्ट)[!?.,\s]*$/i.test(clean(q));
    const topicHit=state.topics.some(t=>q.includes(t));
    return {
      summary:compact(state.summary,window.AARU_V10_MAX_CHARS),
      topics:state.topics.join(" ").slice(0,500),
      recentTurns:follow||topicHit ? state.recentTurns : state.recentTurns.slice(-8),
      mode:follow ? "persistent-continuity" : (topicHit ? "persistent-topic" : "persistent"),
      messageCount:state.messageCount
    };
  };

  window.aaruV10ClearState=function(chatId){
    try{
      const data=read();
      if(chatId)delete data[String(chatId)];
      else Object.keys(data).forEach(k=>delete data[k]);
      write(data);
    }catch(_){}
  };
})();
</script>
<script>
/* =========================================================
   AARU v9 — LONG-CONTEXT & CONVERSATION CONTINUITY ENGINE
   Safe additive layer. Worker/API architecture unchanged.
========================================================= */
(function(){
  window.AARU_V9_LONG_CONTEXT = true;
  window.AARU_V9_VERSION = "LONG-CONTEXT-CONTINUITY-V9";
  window.AARU_V9_MAX_CONTEXT = 240;
  window.AARU_V9_RECENT_ALWAYS = 10;
  window.AARU_V9_MAX_SELECTED = 48;
  window.AARU_V9_MAX_PAIR_CHARS = 900;

  function norm(v){
    return String(v||"").toLowerCase().replace(/[^\p{L}\p{N}\s]/gu," ").replace(/\s+/g," ").trim();
  }
  function tokens(v){
    const stop=new Set(["the","and","for","with","that","this","you","are","was","has","have","from","what","how","why","can","में","और","का","की","के","को","से","है","हैं","था","थे","यह","वह","एक","क्या","कैसे","क्यों","करो","करें","मुझे","आप"]);
    return new Set(norm(v).split(" ").filter(x=>x.length>2&&!stop.has(x)).slice(0,100));
  }
  function overlap(a,b){
    if(!a.size||!b.size)return 0;
    let n=0; a.forEach(x=>{if(b.has(x))n++;});
    return n/Math.max(1,Math.min(a.size,b.size));
  }
  function followup(q){
    return /^(yes|yeah|yep|ok|okay|sure|do it|continue|next|same|that one|this one|go ahead|वही|इसे|उसे|हाँ|हां|ठीक है|करो|आगे|जारी रखो|नेक्स्ट|हाँ करो|हां करो)[!?.,\s]*$/i.test(norm(q)) ||
      /^(इसे|इसे ही|वही|वही वाला|उसी|उसको|इसको|उस पर|इस पर|पिछली|पिछला|ऊपर वाला|नीचे वाला)\b/i.test(norm(q));
  }

  window.aaruV9SelectLongContext=function(allMessages,currentQuery){
    const list=Array.isArray(allMessages)?allMessages:[];
    if(!list.length)return [];
    const max=Math.min(window.AARU_V9_MAX_CONTEXT,list.length);
    const source=list.slice(-max);
    if(source.length<=window.AARU_V9_MAX_SELECTED)return source;
    const q=norm(currentQuery), qt=tokens(q), isFollow=followup(q);
    const recent=source.slice(-window.AARU_V9_RECENT_ALWAYS);
    const recentSet=new Set(recent);
    const scored=[];
    source.forEach((m,i)=>{
      if(recentSet.has(m))return;
      const text=norm(m?.content||"");
      if(!text)return;
      let score=overlap(qt,tokens(text))*100;
      score += m?.role==="user" ? 5 : 2;
      score += Math.min(18,i/source.length*18);
      if(isFollow)score+=10;
      scored.push({m,i,score});
    });
    scored.sort((a,b)=>b.score-a.score || b.i-a.i);
    const keep=Math.max(0,window.AARU_V9_MAX_SELECTED-recent.length);
    const chosen=scored.slice(0,keep);
    const selected=new Map();
    chosen.forEach(x=>selected.set(x.i,x));
    /* Preserve the immediate reply/user pair around highly relevant turns. */
    chosen.slice(0,12).forEach(x=>{
      const ni=x.m?.role==="user"?x.i+1:x.i-1;
      if(ni>=0&&ni<source.length&&!selected.has(ni)&&selected.size<window.AARU_V9_MAX_SELECTED){
        const n=source[ni];
        if(n&&String(n.content||"").trim())selected.set(ni,{m:n,i:ni,score:x.score-1});
      }
    });
    return [...selected.values()].sort((a,b)=>a.i-b.i).map(x=>x.m).slice(-window.AARU_V9_MAX_SELECTED);
  };

  window.aaruV9BuildConversationState=function(allMessages,currentQuery){
    const list=Array.isArray(allMessages)?allMessages:[];
    const users=list.filter(m=>m?.role==="user").slice(-12).map(m=>String(m.content||""));
    const current=norm(currentQuery), qt=tokens(current);
    const topicFreq=new Map();
    users.forEach(t=>tokens(t).forEach(x=>topicFreq.set(x,(topicFreq.get(x)||0)+1)));
    const topics=[...topicFreq.entries()].sort((a,b)=>b[1]-a[1]).slice(0,12).map(x=>x[0]);
    const topicOverlap=overlap(qt,new Set(topics));
    const continuity=followup(current)||topicOverlap>=0.18;
    const freshTopic=!continuity && current.length>20 && topicOverlap<0.08;
    return {topics,continuity,freshTopic,followup:followup(current)};
  };

  window.aaruV9CompactText=function(text,maxChars){
    const value=String(text||"").trim();
    if(!value||value.length<=maxChars)return value;
    const parts=value.split(/\n+/).map(x=>x.trim()).filter(Boolean);
    let out="";
    for(const part of parts){
      if((out+"\n"+part).trim().length>maxChars)break;
      out=out?out+"\n"+part:part;
    }
    return out.slice(0,maxChars);
  };

  window.aaruV9ResetContinuity=function(){
    try{window.__AARU_V9_STATE__=null;}catch(_){ }
  };
})();
</script>

(function(){

  function norm(v){
    return String(v || "").toLowerCase().replace(/[^\p{L}\p{N}\s]/gu," ").replace(/\s+/g," ").trim();
  }
  function tokens(v){
    const stop=new Set(["the","and","for","with","that","this","you","are","was","has","have","from","what","how","why","can","में","और","का","की","के","को","से","है","हैं","था","थे","यह","वह","एक","क्या","कैसे","क्यों","करो","करें","मुझे","आप"]);
    return new Set(norm(v).split(" ").filter(x=>x.length>2&&!stop.has(x)).slice(0,80));
  }
  function overlap(a,b){
    if(!a.size||!b.size)return 0;
    let n=0; a.forEach(x=>{if(b.has(x))n++;});
    return n/Math.max(1,Math.min(a.size,b.size));
  }

  window.aaruV8BuildAdaptiveContext=function(allMessages,currentQuery){
    const list=Array.isArray(allMessages)?allMessages:[];
    const current=norm(currentQuery);
    const qTokens=tokens(current);
    const start=Math.max(0,list.length-window.AARU_V8_MAX_CONTEXT);
    const windowed=list.slice(start);
    if(windowed.length<=window.AARU_V8_MAX_SELECTED)return windowed;

    const recent=windowed.slice(-window.AARU_V8_RECENT_ALWAYS);
    const recentSet=new Set(recent);
    const scored=[];
    windowed.forEach((m,i)=>{
      if(recentSet.has(m))return;
      const text=norm(m?.content||"");
      if(!text)return;
      let score=overlap(qTokens,tokens(text))*100;
      if(m?.role==="user")score+=4;
      score+=Math.max(0,10-(windowed.length-i)/12);
      if(/(this|that|it|same|वही|इसे|उसे|इसको|उसको|इस पर|उस पर)/i.test(current))score+=8;
      scored.push({m,i,score});
    });
    scored.sort((a,b)=>b.score-a.score || b.i-a.i);
    const selected=scored.slice(0,Math.max(0,window.AARU_V8_MAX_SELECTED-recent.length)).sort((a,b)=>a.i-b.i).map(x=>x.m);
    return [...selected,...recent];
  };

  window.aaruV8GetTopicState=function(allMessages,currentQuery){
    const list=Array.isArray(allMessages)?allMessages:[];
    const users=list.filter(m=>m?.role==="user").slice(-6).map(m=>String(m.content||""));
    const current=norm(currentQuery);
    const q=tokens(current);
    const freq=new Map();
    users.forEach(text=>tokens(text).forEach(t=>freq.set(t,(freq.get(t)||0)+1)));
    const topic=[...freq.entries()].sort((a,b)=>b[1]-a[1]).slice(0,8).map(x=>x[0]);
    const followup=/^(yes|yeah|yep|ok|okay|sure|do it|continue|next|same|that one|this one|वही|इसे|उसे|हाँ|हां|ठीक है|करो|आगे|जारी रखो)[!?.,\s]*$/i.test(current)

    const continuity=followup || overlap(q,new Set(topic))>0.18;
    return {topic,followup,continuity};
  };

  window.aaruV8CompactMemory=function(text,maxChars){

    }
    return (out||value.slice(0,maxChars)).slice(0,maxChars);
  };
})();

function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

function cleanAaruText(text){
  return String(text ?? "")
    .replace(/<br\s*\/?>/gi,"\n")
    .replace(/<div\s*>/gi,"\n")
    .replace(/<\/div\s*>/gi,"\n")
    .replace(/\r\n/g,"\n")
    .replace(/\r/g,"\n")
    .replace(/\*\*(.*?)\*\*/gs,"$1")
    .replace(/(?<!\*)\*([^*\n]+)\*(?!\*)/g,"$1")
    .replace(/\n{3,}/g,"\n\n")
    .trim();
}

function cleanAaruChunk(text){
  return String(text ?? "")
    .replace(/<br\s*\/?>/gi,"\n")
    .replace(/\*\*/g,"")
    .replace(/(?<!\*)\*(?!\*)/g,"");
}

function inlineMarkdown(text){

  let s =
    escapeHTML(text);

  s =
    s.replace(
      /`([^`]+)`/g,
      "<code>$1</code>"
    );

  s =
    s.replace(
      /\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,
      '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>'
    );

  s =
    s.replace(
      /\*\*([^*]+)\*\*/g,
      "<strong>$1</strong>"
    );

  s =
    s.replace(
      /__([^_]+)__/g,
      "<strong>$1</strong>"
    );

  s =
    s.replace(
      /(?<!\*)\*([^*]+)\*(?!\*)/g,
      "<em>$1</em>"
    );

  s =
    s.replace(
      /(?<!_)_([^_]+)_(?!_)/g,
      "<em>$1</em>"
    );

  return s;
}


function renderMarkdown(text){

  const source = cleanAaruText(text);

  const lines =
    source.split("\n");

  let html = "";

  let inCode = false;

  let codeBuffer = [];

  let inUl = false;

  let inOl = false;

  let paragraph = [];


  function closeLists(){

    if(inUl){

      html += "</ul>";

      inUl = false;
    }

    if(inOl){

      html += "</ol>";

      inOl = false;
    }
  }


  function flushParagraph(buffer){

    if(!buffer.length){
      return;
    }

    const value =
      buffer.join("\n")
        .trim();

    if(!value){
      return;
    }

    html +=
      "<p>" +
      inlineMarkdown(
        value.replace(
          /\n/g,
          "<br>"
        )
      ) +
      "</p>";
  }


  for(let i=0;i<lines.length;i++){

    const line =
      lines[i];


    if(
      line.trim()
        .startsWith("```")
    ){

      if(inCode){

        html +=
          "<pre><code>" +
          escapeHTML(
            codeBuffer.join("\n")
          ) +
          "</code></pre>";

        codeBuffer = [];

        inCode = false;

      }else{

        flushParagraph(
          paragraph
        );

        paragraph = [];

        closeLists();

        inCode = true;
      }

      continue;
    }


    if(inCode){

      codeBuffer.push(
        line
      );

      continue;
    }


    if(!line.trim()){

      flushParagraph(
        paragraph
      );

      paragraph = [];

      closeLists();

      continue;
    }


    const h3 =
      line.match(
        /^###\s+(.+)$/
      );

    const h2 =
      line.match(
        /^##\s+(.+)$/
      );

    const h1 =
      line.match(
        /^#\s+(.+)$/
      );


    if(h1){

      flushParagraph(
        paragraph
      );

      paragraph = [];

      closeLists();

      html +=
        "<h1>" +
        inlineMarkdown(h1[1]) +
        "</h1>";

      continue;
    }


    if(h2){

      flushParagraph(
        paragraph
      );

      paragraph = [];

      closeLists();

      html +=
        "<h2>" +
        inlineMarkdown(h2[1]) +
        "</h2>";

      continue;
    }


    if(h3){

      flushParagraph(
        paragraph
      );

      paragraph = [];

      closeLists();

      html +=
        "<h3>" +
        inlineMarkdown(h3[1]) +
        "</h3>";

      continue;
    }


    const ul =
      line.match(
        /^\s*[-*+]\s+(.+)$/
      );

    const ol =
      line.match(
        /^\s*\d+[.)]\s+(.+)$/
      );


    if(ul){

      flushParagraph(
        paragraph
      );

      paragraph = [];

      if(inOl){

        html += "</ol>";

        inOl = false;
      }

      if(!inUl){

        html += "<ul>";

        inUl = true;
      }

      html +=
        "<li>" +
        inlineMarkdown(ul[1]) +
        "</li>";

      continue;
    }


    if(ol){

      flushParagraph(
        paragraph
      );

      paragraph = [];

      if(inUl){

        html += "</ul>";

        inUl = false;
      }

      if(!inOl){

        html += "<ol>";

        inOl = true;
      }

      html +=
        "<li>" +
        inlineMarkdown(ol[1]) +
        "</li>";

      continue;
    }


    const quote =
      line.match(
        /^\s*>\s?(.*)$/
      );


    if(quote){

      flushParagraph(
        paragraph
      );

      paragraph = [];

      closeLists();

      html +=
        "<blockquote>" +
        inlineMarkdown(quote[1]) +
        "</blockquote>";

      continue;
    }


    paragraph.push(
      line
    );
  }


  if(inCode){

    html +=
      "<pre><code>" +
      escapeHTML(
        codeBuffer.join("\n")
      ) +
      "</code></pre>";
  }


  flushParagraph(
    paragraph
  );

  closeLists();

  return html;
}

/* =========================================================
   CHAT NORMALIZE
========================================================= */

function normalizeChat(chat){

  if(!chat){
    return null;
  }

  const id =
    String(chat.id || "");

  if(!id){
    return null;
  }


  const raw =
    Array.isArray(chat.messages)
      ? chat.messages
      : [];

  const savedMemory =
    String(chat.memorySummary || "").trim();

  const savedSemanticMemory =
    Array.isArray(chat.semanticMemory) ? chat.semanticMemory : [];


  const normalized =
    raw
      .slice(-MAX_MESSAGES_PER_CHAT)
      .map(item => {

        const result = {

          role:
            item.role === "user"
              ? "user"
              : "assistant",

          content:
            String(
              item.content ??
              item.text ??
              ""
            ).slice(
              0,
              MAX_MESSAGE_CHARS
            )
        };


        if(item.imageId){

          result.imageId =
            String(
              item.imageId
            ).slice(
              0,
              100
            );
        }


        return result;
      });


  let title =
    String(
      chat.title || ""
    )
    .trim()
    .slice(0,80);


  if(!title){

    const firstUser =
      normalized.find(
        item =>
          item.role === "user"
      );

    title =
      firstUser
        ? firstUser.content
            .replace(/\s+/g," ")
            .slice(0,80)
        : "नई चैट";
  }


  return {

    id,

    title:
      title || "नई चैट",

    messages:
      normalized,

    semanticMemory:
      normalizeSemanticMemory(savedSemanticMemory),

    responseId:
      String(chat.responseId || chat.previousResponseId || "").slice(0,200) || null,

    createdAt:
      Number(
        chat.createdAt
      ) || Date.now(),

    updatedAt:
      Number(
        chat.updatedAt
      ) || Date.now()
  };
}


/* =========================================================
   LOAD CHAT HISTORY
========================================================= */

/*
  AARU REFRESH-DUPLICATE REPAIR
  renderCurrentChat() must never mutate the messages array.
  Older builds accidentally appended every rendered message back into
  messages, causing the saved conversation to double on each refresh.
*/
function collapseRepeatedMessageSequence(list){
  if(!Array.isArray(list) || list.length < 2) return Array.isArray(list) ? list : [];
  const n=list.length;
  const key=item=>JSON.stringify({
    role:item?.role==="user"?"user":"assistant",
    content:String(item?.content||""),
    imageId:item?.imageId||null
  });
  const keys=list.map(key);

  // Find the shortest exact period only when the ENTIRE array is repeated.
  for(let period=1; period<=Math.floor(n/2); period++){
    if(n % period !== 0) continue;
    let repeated=true;
    for(let i=period;i<n;i++){
      if(keys[i] !== keys[i%period]){
        repeated=false;
        break;
      }
    }
    if(repeated) return list.slice(0,period);
  }
  return list;
}

function repairChatHistoryDuplicates(){
  let changed=false;
  chats = (Array.isArray(chats)?chats:[]).map(chat=>{
    if(!chat || !Array.isArray(chat.messages)) return chat;
    const repaired=collapseRepeatedMessageSequence(chat.messages);
    if(repaired.length !== chat.messages.length){
      changed=true;
      return Object.assign({},chat,{messages:repaired,updatedAt:Date.now()});
    }
    return chat;
  });
  if(changed){
    try{ saveChatHistory(); }catch(_){}
  }
  return changed;
}

function loadChatHistory(){

  chats = [];

  const raw =
    safeGet(
      CHAT_LIST_KEY
    );


  if(raw){

    try{

      const parsed =
        JSON.parse(raw);

      if(Array.isArray(parsed)){

        const seen =
          new Set();

        chats =
          parsed
            .map(normalizeChat)
            .filter(Boolean)
            .filter(chat => {

              if(seen.has(chat.id)){
                return false;
              }

              seen.add(chat.id);

              return true;
            })
            .sort(
              (a,b) =>
                (b.updatedAt || 0) -
                (a.updatedAt || 0)
            )
            .slice(
              0,
              MAX_SAVED_CHATS
            );

        // Repair legacy refresh-duplication before the first render.
        repairChatHistoryDuplicates();
      }

    }catch(error){

      console.warn(
        "Chat history corrupted:",
        error
      );

      safeRemove(
        CHAT_LIST_KEY
      );
    }

    return;
  }


  /*
    पुराने storage की migration।
  */

  const oldRaw =
    safeGet(
      OLD_CHAT_KEY
    );


  if(oldRaw){

    try{

      const old =
        JSON.parse(
          oldRaw
        );

      if(
        Array.isArray(old) &&
        old.length
      ){

        const now =
          Date.now();

        const migrated =
          normalizeChat({

            id:
              makeChatId(),

            title:
              "पुरानी चैट",

            messages:
              old,

            createdAt:
              now,

            updatedAt:
              now
          });


        if(migrated){
          chats = [migrated];
        }
      }

    }catch(error){}

    safeRemove(
      OLD_CHAT_KEY
    );
  }
}


/* =========================================================
   SAVE CHAT HISTORY
========================================================= */

function saveChatHistory(){

  if(!HAS_STORAGE){
    return;
  }


  const sorted =
    chats
      .slice()
      .sort(
        (a,b) =>
          (b.updatedAt || 0) -
          (a.updatedAt || 0)
      )
      .slice(
        0,
        MAX_SAVED_CHATS
      );


  /*
    पहले सामान्य save।
  */

  if(
    safeSet(
      CHAT_LIST_KEY,
      JSON.stringify(sorted)
    )
  ){

    chats = sorted;

    return;
  }


  /*
    Storage quota भरने पर कम chats।
  */

  for(
    const count of [6,4,3,2,1]
  ){

    const smaller =
      sorted.slice(
        0,
        count
      );

    if(
      safeSet(
        CHAT_LIST_KEY,
        JSON.stringify(smaller)
      )
    ){

      chats = sorted;

      return;
    }
  }


  /*
    Last resort:
    image history हटाकर chat बचाएँ।
  */

  safeRemove(
    IMAGE_KEY
  );


  const emergency =
    sorted.slice(
      0,
      3
    );


  safeSet(
    CHAT_LIST_KEY,
    JSON.stringify(
      emergency
    )
  );

  chats = sorted;
}

/* =========================================================

========================================================= */

function ensureCurrentChat(){

  if(currentChatId){

    const existing =
      chats.find(
        chat =>
          chat.id === currentChatId
      );

    if(existing){
      return existing;
    }
  }


  return createNewChat(
    true
  );
}


/* =========================================================
   SAVE CURRENT CHAT
========================================================= */

function saveCurrentChat(){

  const chat =
    ensureCurrentChat();


  semanticMemory = updateSemanticMemory(semanticMemory, messages);
  chat.semanticMemory = semanticMemory.slice(0, MAX_SEMANTIC_MEMORIES);
  chat.memorySummary = buildMemorySummary(messages);
  memorySummary = buildMemorySummaryFromSemanticMemory(semanticMemory) || chat.memorySummary;

  chat.responseId =
    previousResponseId || null;

  chat.messages =
    messages
      .slice(
        -MAX_MESSAGES_PER_CHAT
      )
      .map(item => {

        const result = {

          role:
            item.role === "user"
              ? "user"
              : "assistant",

          content:
            String(
              item.content || ""
            ).slice(
              0,
              MAX_MESSAGE_CHARS
            )

        if(item.imageId){

          result.imageId =
            String(
              item.imageId
            ).slice(
              0,
              100
            );
        }


        return result;
      });


  const firstUser =
    chat.messages.find(
      item =>
        item.role === "user"
    );


  chat.title =
    firstUser
      ? firstUser.content
          .replace(/\s+/g," ")
          .slice(0,80)

/* =========================================================
   RENDER CURRENT CHAT
========================================================= */

function renderCurrentChat(){
  /* IMPORTANT: rendering is read-only; never append rendered items to messages. */

  messagesEl.innerHTML = "";


  const list =
    Array.isArray(messages)
      ? messages.slice(
          -MAX_MESSAGES_PER_CHAT
        )
      : [];


  if(!list.length){

    return;
  }


  list.forEach(item => {

    if(item.role === "user"){

      addUserMessage(
        item.content,
        false,
        null,
        true
      );

    }else{

      addAssistantMessage(
        item.content,
        false,
        item.imageId || null,
        true
      );
    }
  });
}

function setStreamStatus(value){ if(activeStream?.status) activeStream.status.textContent=String(value||""); }

function parseSSEEventBlock(block){
  const lines=String(block||"").split(/\r?\n/); let event=""; const dataLines=[];
  for(const line of lines){if(line.startsWith("event:")) event=line.slice(6).trim();else if(line.startsWith("data:")) dataLines.push(line.slice(5).trimStart());}

}

/* =========================================================
   DELETE CHAT
========================================================= */

function deleteChat(id){

  const chat =
    chats.find(
      item =>
        item.id === id
    );


  if(!chat){
    return;
  }


  const ok =
    confirm(
      `क्या आप "${chat.title || "इस चैट"}" को डिलीट करना चाहते हैं?`
    );


  if(!ok){
    return;
  }


  chats =
    chats.filter(
      item =>
        item.id !== id
    );


  if(currentChatId === id){

    currentChatId =
      null;

    messages = [];

    createNewChat(
      true
    );

    renderCurrentChat();

  }else{

    saveChatHistory();
  }


  renderChatHistory();

  showToast(
    "चैट डिलीट कर दी गई।"
  );
}

function getStoredCreations(){

  if(!HAS_STORAGE){
    return [];
  }


  const raw =
    safeGet(
      IMAGE_KEY
    );


  if(!raw){
    return [];
  }


  try{

    const parsed =
      JSON.parse(
        raw
      );


    if(!Array.isArray(parsed)){
      return [];
    }


    return parsed
      .filter(
        item =>
          item &&
          typeof item.image === "string"
      )
      .slice(
        0,
        MAX_SAVED_CREATIONS
      );

  }catch(error){

    console.warn(
      "Image history invalid:",
      error
    );

    safeRemove(
      IMAGE_KEY
    );

    return [];
  }
}


/* =========================================================
   CREATIONS
========================================================= */

function getCreations(){

  const stored =
    getStoredCreations();


  const all = [
    ...volatileCreations,
    ...stored
  ];


  const seen =
    new Set();


  return all
    .filter(item => {

      if(
        !item ||
        !item.image ||
        !item.id
      ){
        return false;
      }


      if(
        seen.has(
          item.id
        )
      ){
        return false;
      }


      seen.add(
        item.id
      );

      return true;
    })
    .sort(
      (a,b) =>
        (b.time || b.createdAt || 0) -
        (a.time || a.createdAt || 0)
    )
    .slice(
      0,
      MAX_SAVED_CREATIONS
    );
}


function findCreationById(id){

  if(!id){
    return null;
  }


  const volatile =
    volatileCreations.find(
      item =>
        item.id === id
    );


  if(volatile){
    return volatile;
  }


  return getStoredCreations()
    .find(
      item =>
        item.id === id
    ) || null;
}


/* =========================================================
   SAVE CREATIONS
========================================================= */

function saveCreations(list){

  if(!HAS_STORAGE){
    return false;
  }


  try{

    const clean =
      list
        .filter(
          item =>
            item &&
            item.image &&
            item.image.length <=
              MAX_HISTORY_IMAGE_CHARS
        )
        .slice(
          0,
          MAX_SAVED_CREATIONS
        );


    return safeSet(
      IMAGE_KEY,
      JSON.stringify(
        clean
      )
    );

  }catch(error){

    console.warn(
      "Creation save failed:",
      error
    );

    return false;
  }
}


/* =========================================================
   IMAGE BLOB HELPERS
========================================================= */

async function dataURLToBlob(
  dataURL
){

  if(!dataURL){
    throw new Error(
      "Image data missing"
    );
  }


  /*
    data:image/...;base64,...
  */

  if(
    dataURL.startsWith(
      "data:"
    )
  ){

    const parts =
      dataURL.split(",");

    const header =
      parts[0];

    const body =
      parts.slice(1).join(",");


    const mime =
      (
        header.match(
          /data:([^;]+)/
        ) || []
      )[1] ||
      "image/png";


    const binary =
      atob(body);


    const bytes =
      new Uint8Array(
        binary.length
      );


    for(
      let i=0;
      i<binary.length;
      i++
    ){

      bytes[i] =
        binary.charCodeAt(i);
    }


    return new Blob(
      [bytes],
      {
        type:mime
      }
    );
  }


  const response =
    await fetch(
      dataURL
    );


  if(!response.ok){

    throw new Error(
      "Image fetch failed"
    );
  }


  return response.blob();
}


async function blobToDataURL(
  blob
){

  return new Promise(
    (resolve,reject) => {

      const reader =
        new FileReader();


      reader.onload =
        () =>
          resolve(
            reader.result
          );


      reader.onerror =
        reject;


      reader.readAsDataURL(
        blob
      );
    }
  );
}


/* =========================================================
   IMAGE RESIZE
   IMPORTANT FOR FLUX.2 KLEIN REFERENCE IMAGE
========================================================= */

async function resizeImageDataURL(
  dataURL,
  maxSize = MAX_MODEL_IMAGE_SIZE,
  quality = .78
){

  if(!dataURL){
    return null;
  }


  const img =
    new Image();


  await new Promise(
    (resolve,reject) => {

      img.onload =
        resolve;

      img.onerror =
        reject;

      img.src =
        dataURL;
    }
  );


  const sourceWidth =
    img.naturalWidth ||
    img.width;


  const sourceHeight =
    img.naturalHeight ||
    img.height;


  if(
    !sourceWidth ||
    !sourceHeight
  ){

    return dataURL;
  }


  const scale =
    Math.min(
      1,
      maxSize /
      Math.max(
        sourceWidth,
        sourceHeight
      )
    );


  const width =
    Math.max(
      1,
      Math.round(
        sourceWidth * scale
      )
    );


  const height =
    Math.max(
      1,
      Math.round(
        sourceHeight * scale
      )
    );


  const canvas =
    document.createElement(
      "canvas"
    );


  canvas.width =
    width;

  canvas.height =
    height;


  const ctx =
    canvas.getContext(
      "2d"
    );


  if(!ctx){
    return dataURL;
  }


  ctx.drawImage(
    img,
    0,
    0,
    width,
    height
  );


  /*
    JPEG reference image काफी छोटा रहेगा।
  */

  return canvas.toDataURL(
    "image/jpeg",
    quality
  );
}


/* =========================================================
   HISTORY IMAGE
========================================================= */

async function blobToHistoryDataURL(
  blob,
  maxSize = 560
){

  try{

    const bitmap =
      await createImageBitmap(
        blob
      );


    /*
      IMPORTANT:
      dimensions close() से पहले save करें।
    */

    const originalWidth =
      bitmap.width;

    const originalHeight =
      bitmap.height;


    const scale =
      Math.min(
        1,
        maxSize /
        Math.max(
          originalWidth,
          originalHeight
        )
      );


    const width =
      Math.max(
        1,
        Math.round(
          originalWidth * scale
        )
      );


    const height =
      Math.max(
        1,
        Math.round(
          originalHeight * scale
        )
      );


    const canvas =
      document.createElement(
        "canvas"
      );


    canvas.width =
      width;

    canvas.height =
      height;


    const ctx =
      canvas.getContext(
        "2d"
      );


    if(!ctx){

      bitmap.close();

      return null;
    }


    ctx.drawImage(
      bitmap,
      0,
      0,
      width,
      height
    );


    bitmap.close();


    /*
      WebP preferred.
    */

    let dataURL =
      canvas.toDataURL(
        "image/webp",
        .70
      );


    /*
      Browser WebP support न करे तो JPEG।
    */

    if(
      !dataURL.startsWith(
        "data:image/webp"
      )
    ){

      dataURL =
        canvas.toDataURL(
          "image/jpeg",
          .70
        );
    }


    /*
      History के लिए hard limit।
    */

    if(
      dataURL.length >
      MAX_HISTORY_IMAGE_CHARS
    ){

      const smallerCanvas =
        document.createElement(
          "canvas"
        );


      const smallerMax =
        420;


      const smallerScale =
        Math.min(
          1,
          smallerMax /
          Math.max(
            originalWidth,
            originalHeight
          )
        );


      const smallWidth =
        Math.max(
          1,
          Math.round(
            originalWidth *
            smallerScale
          )
        );


      const smallHeight =
        Math.max(
          1,
          Math.round(
            originalHeight *
            smallerScale
          )
        );


      smallerCanvas.width =
        smallWidth;

      smallerCanvas.height =
        smallHeight;


      const smallerCtx =
        smallerCanvas.getContext(
          "2d"
        );


      if(!smallerCtx){
        return null;
      }


      /*
        Original bitmap बंद हो चुका है,
        इसलिए current canvas से downscale करें।
      */

      smallerCtx.drawImage(
        canvas,
        0,
        0,
        smallWidth,
        smallHeight
      );


      dataURL =
        smallerCanvas.toDataURL(
          "image/jpeg",
          .62
        );


      if(
        dataURL.length >
        MAX_HISTORY_IMAGE_CHARS
      ){

        return null;
      }
    }


    return dataURL;

  }catch(error){

    console.warn(
      "History image compression failed:",
      error
    );

    return null;
  }
}


/* =========================================================
   SAVE CREATION
========================================================= */

async function saveCreation(
  imageData,
  promptText
){

  if(!imageData){
    return null;
  }


  const imageId =
    makeImageId();


  /*
    Original image को localStorage में नहीं डालेंगे।
    पहले छोटा history copy बनाएँगे।
  */

  let historyImage =
    null;


  try{

    const blob =
      await dataURLToBlob(
        imageData
      );


    historyImage =
      await blobToHistoryDataURL(
        blob,
        560
      );

  }catch(error){

    console.warn(
      "Creation history conversion failed:",
      error
    );
  }


  /*
    अगर compressed history नहीं बनी,
    तो current session में full image रहेगी।
    localStorage में नहीं जाएगी।
  */

  const record = {

    id:
      imageId,

    image:
      historyImage ||
      imageData,

    prompt:
      String(
        promptText || ""
      ).slice(
        0,
        MAX_CREATION_PROMPT_CHARS
      ),

    time:
      Date.now()
  };


  volatileCreations.unshift(
    record
  );


  volatileCreations =
    volatileCreations.slice(
      0,
      MAX_SAVED_CREATIONS
    );


  /*
    केवल compressed image storage में save करें।
  */

  if(historyImage){

    const existing =
      getStoredCreations();


    const list =
      [
        {
          ...record,
          image:
            historyImage
        },
        ...existing
      ]
      .slice(
        0,
        MAX_SAVED_CREATIONS
      );


    if(
      saveCreations(
        list
      )
    ){

      /*
        Storage में successfully save हो गई,
        इसलिए duplicate volatile copy हटा दें।
      */

      volatileCreations =
        volatileCreations.filter(
          item =>
            item.id !== imageId
        );
    }
  }


  creationsLoaded =
    true;


  renderCreations();


  return imageId;
}

/* =========================================================
   IMAGE RESPONSE NORMALIZATION
========================================================= */

function normalizeImageResult(
  value
){

  if(!value){
    return null;
  }


  /*
    Direct data URL.
  */

  if(
    typeof value === "string"
  ){

    const s =
      value.trim();


    if(!s){
      return null;
    }


    if(
      s.startsWith(
        "data:image/"
      )
    ){

      return s;
    }


    /*
      URL भी स्वीकार करें।
    */

    if(
      /^https?:\/\//i.test(s)
    ){

      return s;
    }


    /*
      Raw Base64।
    */

    if(
      /^[A-Za-z0-9+/=\r\n]+$/.test(
        s
      )
    ){

      return (
        "data:image/png;base64," +
        s.replace(
          /\s/g,
          ""
        )
      );
    }


    return null;
  }


  /*
    Array response।
  */

  if(
    Array.isArray(value)
  ){

    for(
      const item of value
    ){

      const found =
        normalizeImageResult(
          item
        );

      if(found){
        return found;
      }
    }

    return null;
  }


  if(
    typeof value === "object"
  ){

    const candidates = [

      value.image,

      value.image_url,

      value.imageUrl,

      value.url,

      value.result,

      value.data
    ];


    for(
      const item of candidates
    ){

      const found =
        normalizeImageResult(
          item
        );

      if(found){
        return found;
      }
    }
  }


  return null;
}


/* =========================================================
   RAW IMAGE RESPONSE -> DATA URL
========================================================= */

async function responseToImage(
  response
){

  const contentType =
    (
      response.headers.get(
        "content-type"
      ) || ""
    ).toLowerCase();


  /*
    Worker अगर सीधे image/png,
    image/jpeg या image/webp लौटाता है।
  */

  if(
    contentType.startsWith(
      "image/"
    )
  ){

    const blob =
      await response.blob();


    return blobToDataURL(
      blob
    );
  }


  /*
    JSON response।
  */

  const text =
    await response.text();


  let data = null;


  try{

    data =
      text
        ? JSON.parse(text)
        : null;

  }catch(error){

    throw new Error(
      text ||
      "Image response पढ़ा नहीं जा सका।"
    );
  }


  if(!response.ok){

    throw new Error(
      data?.error ||
      data?.message ||
      data?.response ||
      "Image request failed."
    );
  }


  const image =
    normalizeImageResult(
      data
    );


  if(!image){

    throw new Error(
      "Image response में image नहीं मिली।"
    );
  }


  return image;
}

const MEMORY_STOPWORDS = new Set([
  "और","या","लेकिन","यह","वह","एक","इस","उस","को","से","में","पर","के","की","का","कि","है","हैं","था","थे","थी","तो","भी","ही","अब","जब","तक","आप","तुम","मैं","हम","मुझे","मेरा","मेरी","करो","करना","करके","क्या","क्यों","कैसे","कौन","कब","कहाँ","लिए","साथ","बहुत","ज्यादा","कुछ","कोई",
  "the","and","or","but","this","that","with","from","for","are","is","was","were","you","your","what","why","how","who","when","where","please","can","could","would","should","about"
]);

function memoryTokens(text){
  return cleanAaruText(String(text || "").toLowerCase())
    .replace(/[^\p{L}\p{N}\s]/gu, " ")
    .split(/\s+/)
    .map(w => w.trim())
    .filter(w => w.length >= 3 && !MEMORY_STOPWORDS.has(w))
    .slice(0, 120);
}

function memoryKey(text){
  return memoryTokens(text).slice(0, 18).join(" ");
}

function memoryImportance(item, index, total){
  const text = cleanAaruText(String(item?.content || "")).trim();
  if(!text) return 0;

  let score = 1;
  const lower = text.toLowerCase();

  // User-stated information/preferences should survive longer.
  if(item?.role === "user") score += 2;
  if(/\b(मेरा|मेरी|मेरे|मैं|मुझे|हमारा|हमारी|i am|i'm|my|me|we|our|i like|i prefer|i want|i need)\b/i.test(lower)) score += 3;
  if(/याद|remember|भूलना|always|हमेशा|पसंद|preference|prefer|project|परियोजना|बनाना|develop|developer|code|कोड/i.test(lower)) score += 2;
  if(text.length > 80) score += 1;

  // Slight recency bonus among the older messages.
  score += Math.min(2, index / Math.max(1, total) * 2);
  return score;
}


function normalizeSemanticMemory(list){
  if(!Array.isArray(list)) return [];
  return list.filter(m => m && typeof m.key === "string" && typeof m.value === "string").map(m => ({
    id: String(m.id || makeMemoryId()),
    type: String(m.type || "fact").slice(0,30),
    key: cleanAaruText(m.key).trim().slice(0,140),
    value: cleanAaruText(m.value).trim().slice(0,500),
    source: String(m.source || "user").slice(0,20),
    importance: Math.max(1, Math.min(10, Number(m.importance) || 5)),
    updatedAt: Number(m.updatedAt) || Date.now()
  })).filter(m => m.key && m.value).sort((a,b) => b.importance - a.importance || b.updatedAt - a.updatedAt).slice(0,MAX_SEMANTIC_MEMORIES);
}
function makeMemoryId(){ return "mem_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2,8); }
function semanticMemoryKey(text){ return memoryTokens(text).slice(0,12).join(" "); }
function extractSemanticMemories(list){
  const out=[];
  for(const item of (Array.isArray(list)?list:[])){
    if(item?.role!=="user") continue;
    const text=cleanAaruText(String(item.content||"")).replace(/\s+/g," ").trim();
    if(!text || text.length<4) continue;
    const patterns=[
      [/^(?:मेरा नाम|my name is)\s+(.{1,100})$/i,"नाम","identity",7],
      [/^(?:मुझे|i)\s+(?:पसंद है|पसंद हैं|like|prefer)\s+(.{2,180})$/i,"पसंद","preference",7],
      [/^(?:मुझे|i)\s+(?:नापसंद है|dislike)\s+(.{2,180})$/i,"नापसंद","preference",7],
      [/^(?:याद रखना|याद रखो|remember)[:\s]+(.{2,220})$/i,"याद रखने का निर्देश","instruction",9],
      [/^(?:हमेशा|always)\s+(.{2,220})$/i,"स्थायी निर्देश","instruction",9]
    ];
    let matched=false;
    for(const [re,label,type,importance] of patterns){
      const m=text.match(re); if(!m) continue;
      const value=m[1].trim();
      out.push({key:label+" "+semanticMemoryKey(value),value,type,source:"user",importance,updatedAt:Date.now()});
      matched=true; break;
    }
    if(!matched && /aaru ai|प्रोजेक्ट|परियोजना|बना रहा|बनाना है|worker|index|कोड|code/i.test(text) && text.length<=500){
      out.push({key:"project "+semanticMemoryKey(text),value:text,type:"project",source:"user",importance:8,updatedAt:Date.now()});
    }
  }
  return out;
}
function updateSemanticMemory(existing,list){
  let mem=normalizeSemanticMemory(existing);
  for(const item of extractSemanticMemories(list)){
    const same=mem.findIndex(m => m.type===item.type && semanticMemoryKey(m.key)===semanticMemoryKey(item.key));
    if(same>=0) mem[same]={...mem[same],...item,id:mem[same].id}; else mem.unshift({...item,id:makeMemoryId()});
  }
  const seen=new Set();
  mem=mem.filter(m=>{const k=semanticMemoryKey(m.type+" "+m.key+" "+m.value); if(!k||seen.has(k)) return false; seen.add(k); return true;});
  return normalizeSemanticMemory(mem);
}
function buildMemorySummaryFromSemanticMemory(mem){ return normalizeSemanticMemory(mem).map(m=>`[${m.type}] ${m.key}: ${m.value}`).join("\n").slice(0,MAX_MEMORY_SUMMARY_CHARS); }
function getSemanticRelevantMemory(query){
  const q=new Set(memoryTokens(query)); if(!q.size||!semanticMemory.length) return "";
  return semanticMemory.map(m=>{let overlap=0;for(const t of new Set(memoryTokens(m.key+" "+m.value))) if(q.has(t)) overlap++;return {...m,score:overlap*2+m.importance*.35};}).filter(m=>m.score>=2.5).sort((a,b)=>b.score-a.score).slice(0,8).map(m=>`[${m.type}] ${m.key}: ${m.value}`).join("\n").slice(0,MAX_RELEVANT_MEMORY_CHARS);
}
function forgetSemanticMemory(query){
  const q=new Set(memoryTokens(query)); if(!q.size) return 0; const before=semanticMemory.length;
  semanticMemory=semanticMemory.filter(m=>{let overlap=0;for(const t of new Set(memoryTokens(m.key+" "+m.value))) if(q.has(t)) overlap++;return overlap<Math.max(1,Math.min(3,q.size));});
  return before-semanticMemory.length;
}
function isForgetMemoryCommand(text){ return /^(भूल जाओ|भूल जाएं|भूल जाइए|याद मत रखो|forget this|forget that|forget it|delete memory|remove memory)\b/i.test(String(text||"").trim()); }
function getForgetTarget(text){ return String(text||"").replace(/^(भूल जाओ|भूल जाएं|भूल जाइए|याद मत रखो|forget this|forget that|forget it|delete memory|remove memory)\b[:\s-]*/i,"").trim(); }
function updateMemoryButton(){ const el=document.getElementById("memoryBtnText"); if(el) el.textContent=`स्मार्ट मेमोरी (${semanticMemory.length})`; }
function showMemoryStatus(){ if(!semanticMemory.length){showToast("स्मार्ट मेमोरी में अभी कोई स्थायी तथ्य नहीं है।");return;} alert("Aaru की स्मार्ट मेमोरी:\n\n"+semanticMemory.slice(0,10).map(m=>`• ${m.key}: ${m.value}`).join("\n")+(semanticMemory.length>10?`\n\nऔर ${semanticMemory.length-10} यादें...`:"")); }

function buildMemorySummary(list){
  const all = Array.isArray(list) ? list : [];
  const older = all.slice(0, -12);
  if(!older.length) return "";

  const candidates = older.map((item, index) => ({
    item,
    index,
    score: memoryImportance(item, index, older.length),
    text: cleanAaruText(String(item?.content || "")).replace(/\s+/g, " ").trim()
  })).filter(x => x.text);

  // Keep important user facts/preferences first, while retaining useful recent context.
  candidates.sort((a,b) => b.score - a.score || b.index - a.index);

  const seen = new Set();
  const parts = [];
  for(const x of candidates){
    const key = memoryKey(x.text) || x.text.slice(0, 120).toLowerCase();
    if(!key || seen.has(key)) continue;
    seen.add(key);

    const label = x.item?.role === "user" ? "यूज़र" : "Aaru";
    const compact = x.text.slice(0, 360);
    parts.push(`${label}: ${compact}`);

    if(parts.join("\n").length >= MAX_MEMORY_SUMMARY_CHARS) break;
  }

  return parts.join("\n").slice(0, MAX_MEMORY_SUMMARY_CHARS);
}

function getRelevantMemory(query){
  const semantic = getSemanticRelevantMemory(query);
  const qTokens = new Set(memoryTokens(query));
  if(!qTokens.size || !messages.length) return semantic;

  const older = messages.slice(0, -12);
  const scored = older.map((item, index) => {
    const text = cleanAaruText(String(item?.content || "")).replace(/\s+/g, " ").trim();
    const tokens = memoryTokens(text);
    if(!text || !tokens.length) return null;

    let overlap = 0;
    const unique = new Set(tokens);
    for(const token of unique){
      if(qTokens.has(token)) overlap++;
    }

    // Phrase-level match is stronger than individual word overlap.
    const qClean = cleanAaruText(String(query || "")).toLowerCase().replace(/\s+/g, " ").trim();
    const tClean = text.toLowerCase();
    const phraseBonus = qClean.length >= 8 && tClean.includes(qClean.slice(0, Math.min(50, qClean.length))) ? 6 : 0;

    const importance = memoryImportance(item, index, older.length);
    const recency = index / Math.max(1, older.length);
    const score = overlap * 2 + phraseBonus + importance + recency;

    return { item, index, score, text };
  }).filter(Boolean)
    .filter(x => x.score >= 3)
    .sort((a,b) => b.score - a.score || b.index - a.index)
    .slice(0, 8);

  // Include the neighboring message when it helps preserve a user/assistant pair.
  const selected = [];
  const used = new Set();
  for(const x of scored){
    if(used.has(x.index)) continue;
    used.add(x.index);
    selected.push(x);

    const neighborIndex = x.item?.role === "user" ? x.index + 1 : x.index - 1;
    if(neighborIndex >= 0 && neighborIndex < older.length && selected.length < 8 && !used.has(neighborIndex)){
      const neighbor = older[neighborIndex];
      const nt = cleanAaruText(String(neighbor?.content || "")).replace(/\s+/g, " ").trim();
      if(nt){
        used.add(neighborIndex);
        selected.push({ item: neighbor, index: neighborIndex, score: x.score - 0.5, text: nt });
      }
    }
  }

  selected.sort((a,b) => a.index - b.index);
  const historical = selected.map(x => {
    const label = x.item?.role === "user" ? "यूज़र" : "Aaru";
    return `${label}: ${x.text.slice(0, 480)}`;
  }).join("\n").slice(0, MAX_RELEVANT_MEMORY_CHARS);
  return [semantic, historical].filter(Boolean).join("\n").slice(0, MAX_RELEVANT_MEMORY_CHARS);
}

function restoreChatMemory(chat){
  semanticMemory = normalizeSemanticMemory(chat?.semanticMemory || []);
  memorySummary = buildMemorySummaryFromSemanticMemory(semanticMemory) || String(chat?.memorySummary || "").slice(0, MAX_MEMORY_SUMMARY_CHARS);
  if(!memorySummary && messages.length > 12) memorySummary = buildMemorySummary(messages);
  updateMemoryButton();
}

function applyWorkerMemoryResponse(data){
  if(!data || typeof data !== "object") return;
  const workerMemory = Array.isArray(data.memory) ? data.memory : [];
  const updates = Array.isArray(data.memory_updates) ? data.memory_updates : [];

  if(workerMemory.length){
    semanticMemory = normalizeSemanticMemory(workerMemory).slice(0, MAX_SEMANTIC_MEMORIES);
  }

  for(const update of updates.slice(0, MAX_WORKER_MEMORY_UPDATES)){
    const action = String(update?.action || "").toLowerCase();

    if(action === "add" && update.memory){
      const incoming = normalizeSemanticMemory([update.memory])[0];
      if(incoming){
        const same = semanticMemory.findIndex(m => m.type === incoming.type && semanticMemoryKey(m.key) === semanticMemoryKey(incoming.key));
        if(same >= 0) semanticMemory[same] = {...semanticMemory[same], ...incoming};
        else semanticMemory.unshift(incoming);
      }
    }

    if(action === "update" && update.id){
      const index = semanticMemory.findIndex(m => m.id === String(update.id));
      if(index >= 0){
        semanticMemory[index] = {...semanticMemory[index], value:String(update.new_value || semanticMemory[index].value || "").slice(0,500), updatedAt:Date.now()};
      }
    }

    if(action === "delete" && update.target){
      forgetSemanticMemory(String(update.target));
    }
  }

  semanticMemory = normalizeSemanticMemory(semanticMemory).slice(0, MAX_SEMANTIC_MEMORIES);
  memorySummary = buildMemorySummaryFromSemanticMemory(semanticMemory) || memorySummary;
  updateMemoryButton();
}

async function fetchChatWithRecovery(payload){

  let lastError = null;

  for(let attempt = 0; attempt < 2; attempt++){

    const controller =
      new AbortController();

    const timer =
      setTimeout(
        () => controller.abort(),
        CHAT_REQUEST_TIMEOUT_MS
      );

    try{

      const response =
        await fetch(API + "chat",{
          method:"POST",
          headers:{"Content-Type":"application/json"},
          body:JSON.stringify(payload),
          signal:controller.signal
        });

      clearTimeout(timer);

      if(
        response.ok ||
        attempt === 1 ||
        ![502,503,504].includes(response.status)
      ){
        return response;
      }

      lastError =
        new Error("Worker temporarily unavailable.");

    }catch(error){

      clearTimeout(timer);
      lastError = error;

      const retryable =
        error?.name === "AbortError" ||
        error instanceof TypeError;

      if(!retryable || attempt === 1){
        throw error;
      }
    }

    await new Promise(resolve =>
      setTimeout(resolve, CHAT_RETRY_DELAY_MS)
    );
  }

  throw lastError || new Error("Chat request failed.");
}

        role:item.role === "user" ? "user" : "assistant",
        content:cleanAaruText(String(item.content||"")).slice(0,MAX_MESSAGE_CHARS)
      }));
  const adaptiveMemory=fastConversation
    ? ""
    : (typeof window.aaruV9CompactText === "function"
      ? window.aaruV9CompactText(memorySummary||buildMemorySummaryFromSemanticMemory(semanticMemory)||buildMemorySummary(messages),MAX_MEMORY_SUMMARY_CHARS)
      : window.aaruV8CompactMemory(memorySummary||buildMemorySummaryFromSemanticMemory(semanticMemory)||buildMemorySummary(messages),MAX_MEMORY_SUMMARY_CHARS));
  const goalState=(typeof window.aaruV23GetGoalState === "function" ? window.aaruV23GetGoalState(currentChatId) : null);
  const multiStepWorkflow=(typeof window.aaruV26BuildWorkflow === "function" ? window.aaruV26BuildWorkflow(currentQuery,messages,taskPlan,goalState) : null);
  window.AARU_V26_LAST_WORKFLOW=multiStepWorkflow;
  if(typeof window.aaruV26SaveWorkflow === "function" && multiStepWorkflow) window.aaruV26SaveWorkflow(multiStepWorkflow);

  const payload={
    message:currentQuery,
    messages:contextMessages,
    memory_summary:adaptiveMemory,
    relevant_memory:fastConversation?"":relevantMemory,
    reasoning_effort:interaction.mode==="deep" || adaptiveTopic.continuity ? ASTRA_REASONING_EFFORT : getConversationReasoningEffort(currentQuery),
    client_intent:interaction.intent,
    client_followup:interaction.followup || adaptiveTopic.followup,
    client_tool_hint:interaction.tool_hint,
    client_tool_plan:window.aaruV12ToolHint(toolPlan),
    client_task_plan:typeof window.aaruV14CompactTaskPlan === "function" ? window.aaruV14CompactTaskPlan(taskPlan) : "",
    client_task_complexity:taskPlan.complexity,
    client_task_strategy:taskPlan.strategy,
    client_task_active:!!taskPlan.active,
    client_task_model_replan:taskPlan.modelMayReplan!==false,
    client_workflow_v26_version:window.AARU_V26_VERSION||"",
    client_workflow_v26_state:typeof window.aaruV26CompactWorkflow === "function" ? window.aaruV26CompactWorkflow(multiStepWorkflow) : "",
    client_workflow_v26_hint:typeof window.aaruV26GetWorkflowHint === "function" ? window.aaruV26GetWorkflowHint(multiStepWorkflow) : "",
    client_workflow_v26_active:!!multiStepWorkflow?.active,
    client_workflow_v26_remaining:Number(multiStepWorkflow?.remaining||0),
    client_workflow_version:window.AARU_V15_VERSION||"",
    client_workflow_state:typeof window.aaruV15CompactState === "function" ? window.aaruV15CompactState(workflowState) : "",
    client_workflow_execution:typeof window.aaruV15GetExecutionHint === "function" ? window.aaruV15GetExecutionHint(workflowState) : "",
    client_multimodal_mode:multimodalState.mode,
    client_attachment_type:multimodalState.attachment||"",
    client_topic:adaptiveTopic.topic.join(" ").slice(0,500),
    client_context_mode:fastConversation ? "fast" : (adaptiveTopic.continuity ? "continuity" : "adaptive"),
    client_context_count:contextMessages.length,
    client_persistent_state: persistentBridge.mode,
    client_persistent_topics: persistentBridge.topics,
    client_persistent_summary: fastConversation ? "" : persistentBridge.summary,
    client_persistent_message_count: persistentBridge.messageCount || messages.length,
    client_adaptive_version: window.AARU_V19_VERSION || "",
    client_adaptive_verbosity: adaptiveBehavior.verbosity,
    client_adaptive_tone: adaptiveBehavior.tone,
    client_adaptive_reasoning: adaptiveBehavior.reasoning,
    client_adaptive_continuity: !!adaptiveBehavior.continuity,
    client_adaptive_confidence: Number(adaptiveBehavior.confidence || .72),
    client_behavior_hint: typeof window.aaruV19GetBehaviorHint === "function" ? window.aaruV19GetBehaviorHint(adaptiveBehavior) : "",
    stream:true,
    previous_response_id:previousResponseId||undefined
  };

  if(selectedPhotoBase64){
    payload.image_b64 =
      await resizeImageDataURL(
        selectedPhotoBase64,
        MAX_MODEL_IMAGE_SIZE,
        .76
      );
  }else{
    const latestEditReference =
      await getLatestCreationReference(currentQuery);

    if(latestEditReference){
      payload.image_b64 =
        await resizeImageDataURL(
          latestEditReference,
          MAX_MODEL_IMAGE_SIZE,
          .76
        );
    }
  }

  if(selectedDocumentText){
    payload.document_text =
      selectedDocumentText.slice(0,90000);
  }

  const response =
    await fetchChatWithRecovery(payload);

  const contentType=(response.headers.get("content-type")||"").toLowerCase();
  if(contentType.includes("text/event-stream"))return await consumeAstraStream(response);
  if(contentType.startsWith("image/"))return {text:"इमेज तैयार है।",image:await blobToDataURL(await response.blob())};
  const raw=await response.text(); let data=null;
  try{data=raw?JSON.parse(raw):null;}catch{if(!response.ok)throw new Error(raw||"Chat request failed.");if(raw.trim())return {text:cleanAaruText(raw),image:null};throw new Error("Worker ने खाली response दिया।");}
  if(!response.ok){
    const message=data?.error||data?.message||data?.detail||`Chat request failed (${response.status})`;
    const error=new Error(String(message));
    error.status=response.status;
    error.code=data?.code||data?.error?.code||null;
    throw error;
  }
  const normalized=normalizeChatResult(data); const nextResponseId=data?.response_id||data?.id||null;
  if(nextResponseId){previousResponseId=String(nextResponseId).slice(0,200);const chat=chats.find(item=>item.id===currentChatId);if(chat)chat.responseId=previousResponseId;}
  lastToolsUsed=Array.isArray(data?.tools_used)?data.tools_used:[];
  if(!normalized?.text&&!normalized?.image)throw new Error("Aaru ने खाली response दिया।"); return normalized;
}

/* =========================================================
   HANDLE SEND
   Unified composer: text + photo + image generation/editing
========================================================= */

async function handleSend(){

  if(isBusy){
    return;
  }

  const prompt =
    promptEl.value.trim();

  const hasPhoto =
    !!selectedPhotoBase64;

  const hasDocument =
    !!selectedDocumentText;

  /* ChatGPT-style: photo alone can be sent. */
  if(!prompt && !hasPhoto && !hasDocument){
    showToast(
      "कुछ लिखें या photo जोड़ें।"
    );
    return;
  }

  ensureCurrentChat();

  isBusy =
    true;

  sendBtn.disabled =
    true;

  const attachedPhoto =
    selectedPhotoUrl;

  if(hasDocument && !prompt){
    promptEl.value = "इस PDF को पढ़कर समझाइए।";
  }

  const displayPrompt = prompt || (hasDocument ? "इस PDF को पढ़कर समझाइए।" : "इस तस्वीर को समझाइए।");

  addUserMessage(
    displayPrompt,
    false,
    attachedPhoto
  );

  if(isForgetMemoryCommand(displayPrompt)){
    const target=getForgetTarget(displayPrompt);
    const removed=target ? forgetSemanticMemory(target) : semanticMemory.length;
    if(!target) semanticMemory=[];
    saveCurrentChat();
    addAssistantMessage(removed ? `ठीक है, ${removed} मेमोरी हटा दी गई।` : "ठीक है, मेमोरी हटा दी गई।", true);
    promptEl.value=""; autoResize(); clearSelectedPhoto(); isBusy=false; sendBtn.disabled=false;
    return;
  }

  semanticMemory=updateSemanticMemory(semanticMemory,[messages[messages.length-1]]);
  saveCurrentChat();
  try{ if(typeof window.aaruV19PersistAdaptiveState === "function") window.aaruV19PersistAdaptiveState(currentChatId,messages,window.AARU_V19_LAST_PROFILE||{}); }catch(_){}
  try{
    if(typeof window.aaruV10PersistState === "function"){
      window.aaruV10PersistState(currentChatId,messages,displayPrompt);
    }
  }catch(_){}

  promptEl.value =
    "";

  autoResize();
  scrollBottom();

  try{

    showTyping();

    /*
      One unified route. Worker /chat automatically decides:
      normal chat, Vision, image generation or image editing.
    */
    const result =
      await sendChatRequest();

    saveCurrentChat();

    removeStreamingMessage();
    hideTyping();

    if(result && result.image){

      const imageId =
        await saveCreation(
          result.image,
          prompt || "Image generation"
        );

      addAssistantMessage(
        result.text ||
        "🖼️ Image generated successfully.",
        true,
        imageId
      );

    }else{

      const finalText =
        cleanAaruText(
          result?.text ||
          "माफ़ कीजिए, इस समय मुझे जवाब तैयार करने में समस्या हुई।"
        );

      addAssistantMessage(
        finalText,
        true
      );

      if(voiceOutputEnabled && finalText){
        speakAaru(finalText);
      }
    }

    clearSelectedPhoto();

  }catch(error){

    console.error(
      "Aaru request failed:",
      error
    );

    removeStreamingMessage();
    hideTyping();

    const rawError=String(error?.message||"");
    const quotaError=Number(error?.status||0)===429 || /(quota|credit|billing|insufficient|exceeded.*(quota|limit)|rate.?limit)/i.test(rawError);
    const networkError=error?.name === "TypeError" || /network|failed to fetch|load failed|offline/i.test(rawError);
    const timeoutError=error?.name === "AbortError";

    const userError=
      quotaError
        ? "⚠️ API credit/quota उपलब्ध नहीं है। कृपया OpenAI API billing/credits जाँचें।"
        : timeoutError
          ? "⚠️ Request में बहुत समय लग गया। कृपया फिर कोशिश करें।"
          : networkError
            ? "⚠️ इंटरनेट या Worker connection में समस्या है। नेटवर्क जाँचकर फिर कोशिश करें।"
            : (Number(error?.status||0)>=500 || /worker|astra|openai api/i.test(rawError))
              ? "⚠️ Aaru Worker/API इस समय जवाब नहीं दे रहा है। थोड़ी देर बाद फिर कोशिश करें।"
              : "⚠️ Request पूरी नहीं हो सकी। कृपया फिर कोशिश करें।";

    addAssistantMessage(userError,true);
    showToast(userError.replace(/^⚠️\s*/,""));

  }finally{

    isBusy =
      false;

    sendBtn.disabled =
      false;

    scrollBottom();

    try{
      promptEl.focus();
    }catch(error){}
  }
}

function speakAaru(text){
  if(!voiceOutputEnabled || !("speechSynthesis" in window) || !text) return;
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(cleanAaruText(text));
    u.lang = /[\u0900-\u097F]/.test(text) ? "hi-IN" : "en-US";
    u.rate = .98;
    speechSynthesis.speak(u);
  }catch(error){
    console.warn("Voice output failed:",error);
  }
}

/* =========================================================
   VOICE INPUT
========================================================= */

function startAaruVoice(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const micBtn = document.getElementById("micBtn");

  if(!SR){
    showToast("इस browser में Voice Input उपलब्ध नहीं है। Chrome में microphone permission जाँचें।");
    return;
  }

  if(recognition){
    try{ recognition.abort ? recognition.abort() : recognition.stop(); }catch(error){}
    recognition = null;
    micBtn?.classList.remove("voice-active");
    showToast("Voice Input बंद कर दिया गया।");
    return;
  }

  let started = false;
  const rec = new SR();
  recognition = rec;
  rec.lang = "hi-IN";
  rec.interimResults = false;
  rec.continuous = false;
  rec.maxAlternatives = 1;

  rec.onstart = () => {
    started = true;
    if(recognition !== rec) return;
    micBtn?.classList.add("voice-active");
    showToast("🎙️ सुन रहा हूँ… बोलिए।");
  };

  rec.onresult = event => {
    if(recognition !== rec) return;
    const text = event.results?.[0]?.[0]?.transcript?.trim() || "";
    if(text){
      promptEl.value = text;
      autoResize();
      promptEl.focus();
      showToast("आवाज़ को टेक्स्ट में बदल दिया गया।");
    }
  };

  rec.onerror = event => {
    if(recognition !== rec) return;
    const code = String(event?.error || "unknown").toLowerCase();
    const message =
      code === "not-allowed" || code === "service-not-allowed"
        ? "⚠️ Microphone permission की अनुमति दें।"
        : code === "no-speech"
          ? "⚠️ कोई आवाज़ नहीं मिली। फिर से बोलें।"
          : code === "audio-capture"
            ? "⚠️ Microphone उपलब्ध नहीं है।"
            : code === "network"
              ? "⚠️ Voice service/network में समस्या है।"
              : "⚠️ Voice Input में समस्या हुई। फिर कोशिश करें।";
    showToast(message.replace(/^⚠️\s*/,""));
  };

  rec.onend = () => {
    if(recognition === rec) recognition = null;
    micBtn?.classList.remove("voice-active");
    if(started) setTimeout(() => { try{ promptEl.focus(); }catch(error){} }, 0);
  };

  try{
    rec.start();
  }catch(error){
    if(recognition === rec) recognition = null;
    micBtn?.classList.remove("voice-active");
    showToast("Voice Input शुरू नहीं हो सका। फिर कोशिश करें।");
  }
}
/* =========================================================
   PDF READER
========================================================= */

async function extractPDFText(file){
  const pdfjs = await import("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs");
  pdfjs.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs";
  const data = new Uint8Array(await file.arrayBuffer());
  const pdf = await pdfjs.getDocument({data}).promise;
  let output = "";
  for(let pageNo=1; pageNo<=pdf.numPages; pageNo++){
    setToastProgress(`PDF पढ़ा जा रहा है… ${pageNo}/${pdf.numPages}`);
    const page = await pdf.getPage(pageNo);
    const content = await page.getTextContent();
    const text = content.items.map(item => item.str || "").join(" ");
    output += `\n\n--- Page ${pageNo} ---\n${text}`;
    if(output.length >= 90000) break;
  }
  return output.trim().slice(0,90000);
}

function setToastProgress(text){
  showToast(text);
}

async function handlePDFFile(file){
  try{
    selectedDocumentText = await extractPDFText(file);
    if(window.aaruV7TrimDocumentContext){
      selectedDocumentText = window.aaruV7TrimDocumentContext(selectedDocumentText);
    }
    if(!selectedDocumentText){
      showToast("PDF में पढ़ने योग्य text नहीं मिला।");
      return;
    }
    selectedPhotoBase64 = null;
    selectedPhotoUrl = null;
    photoPreview.classList.remove("show");
    photoPreviewImg.src = "";
    showToast(`PDF तैयार है: ${selectedDocumentText.length.toLocaleString()} अक्षर`);
  }catch(error){
    console.error("PDF failed:",error);
    selectedDocumentText = "";
    showToast("PDF पढ़ने में समस्या हुई।");
  }
}

========================================================= */

photoInput.addEventListener(
  "change",
  async event => {

    const file =
      event.target.files?.[0];


    if(!file){
      return;
    }


    if(
      file.type === "application/pdf" ||
      file.name.toLowerCase().endsWith(".pdf")
    ){
      await handlePDFFile(file);
      photoInput.value = "";
      return;
    }

    if(window.aaruV7ValidateAttachment){
      const validation=window.aaruV7ValidateAttachment(file);
      if(!validation.ok){
        const messages={
          "image-too-large":"Image बहुत बड़ी है। कृपया 12 MB से छोटी image चुनें।",
          "pdf-too-large":"PDF बहुत बड़ी है। कृपया 12 MB से छोटी PDF चुनें।",
          "unsupported":"यह file type supported नहीं है।"
        };
        showToast(messages[validation.reason] || "यह attachment supported नहीं है।");
        photoInput.value="";
        return;
      }
    }

    if(
      !file.type.startsWith(
        "image/"
      )
    ){

      showToast(
        "कृपया image file चुनें।"
      );

      return;
    }


    try{

      const original =
        await fileToDataURL(
          file
        );


      /*
        IMPORTANT:
        Preview और API दोनों के लिए
        छोटा image रखें।
      */

      const resized =
        await resizeImageDataURL(
          original,
          MAX_MODEL_IMAGE_SIZE,
          .80
        );


      selectedPhotoBase64 =
        resized;


      selectedPhotoUrl =
        resized;


      photoPreviewImg.src =
        selectedPhotoUrl;


      photoPreview.classList.add(
        "show"
      );


      showToast(
        "Photo तैयार है। अब सीधे Send दबाएँ या सवाल लिखें।"
      );


    }catch(error){

      console.error(
        "Photo processing failed:",
        error
      );


      showToast(
        "Photo पढ़ने में समस्या हुई।"
      );

    }finally{

      /*
        Same file दोबारा select हो सके।
      */

      photoInput.value =
        "";
    }
  });


function fileToDataURL(file){

  return new Promise(
    (resolve,reject) => {

      const reader =
        new FileReader();


      reader.onload =
        () =>
          resolve(
            reader.result
          );


      reader.onerror =
        reject;


      reader.readAsDataURL(
        file
      );
    }
  );
}

  lastPageShowRecovery =
    now;

      hideTyping();

      false;

  try{

    closeDrawer();

    closeImageViewer();

  try{

    const current =
      chats.find(
        item =>
          item.id ===

      messages =

          current.messages

          ? current.messages

          : [];

<script>
/* AARU v14 — Proactive Reasoning & Task Planning Engine (Index-only, Worker unchanged) */
(function(){
  window.AARU_V14_TASK_PLANNING=true;
  window.AARU_V14_VERSION="PROACTIVE-REASONING-TASK-PLANNING-V14";
  window.AARU_V14_MAX_STEPS=6;
  window.AARU_V14_MAX_TASK_CONTEXT=9000;

  const norm=v=>String(v||"").replace(/\s+/g," ").trim();
  const has=(q,re)=>re.test(q);

  window.aaruV14BuildTaskPlan=function(text,opts){
    opts=opts||{};
    const q=norm(text), lower=q.toLowerCase();
    const steps=[];
    const add=(id,label,why)=>{if(!steps.some(x=>x.id===id)&&steps.length<window.AARU_V14_MAX_STEPS)steps.push({id,label,why});};
    if(!q)return {active:false,complexity:"simple",steps:[],strategy:"direct",modelMayReplan:true};

    const current=/(latest|current|today|now|live|recent|news|search|web|price|weather|score|election|अभी|आज|ताज़ा|ताजा|लेटेस्ट|करंट|समाचार|न्यूज़|न्यूज|सर्च|खोज|कीमत|मौसम|स्कोर|चुनाव)/i;
    const data=/(calculate|calculation|math|compute|analy[sz]e data|csv|excel|python|code|debug|गणना|कैलकुलेट|हिसाब|डेटा|कोड|डिबग|प्रोग्राम|स्क्रिप्ट)/i;
    const compare=/(compare|comparison|versus|vs\.?|difference|तुलना|फर्क|अंतर|बनाम)/i;
    const research=/(research|investigate|deep dive|रिसर्च|जांच|जाँच|विस्तार से|गहराई से)/i;
    const image=/(generate|create|draw|make|edit|modify|transform).*(image|picture|photo)|\b(image|picture|photo)\b|इमेज|तस्वीर|फोटो|चित्र|बनाओ|जनरेट|एडिट/i;
    const doc=!!opts.hasPDF || !!opts.hasImage || /(pdf|document|file|फ़ाइल|फाइल|दस्तावेज|डॉक्यूमेंट)/i.test(lower);
    const multi=/(and then|then|after that|step by step|first.*then|पहले.*फिर|इसके बाद|फिर|उसके बाद|चरण|स्टेप)/i.test(lower) || q.length>180 || (compare.test(q)&&research.test(q));

    if(current.test(q)) add("retrieve","ताज़ा जानकारी जुटाना","request appears time-sensitive or search-oriented");
    if(doc) add("inspect","उपलब्ध image/PDF/document context देखना","attachment or document context is relevant");
    if(data.test(q)) add("analyze","डेटा/गणना/कोड का विश्लेषण करना","request requires computation or technical analysis");
    if(compare.test(q)) add("compare","विकल्पों की तुलना करना","request explicitly asks for comparison");
    if(research.test(q)) add("research","स्रोतों और तथ्यों को व्यवस्थित करना","request asks for research or investigation");
    if(image.test(q)) add("create","इमेज तैयार/संपादित करना","request is image-oriented");
    if(multi || steps.length>1) add("synthesize","परिणामों को जोड़कर उत्तर तैयार करना","multiple reasoning/tool stages need one coherent answer");

    let complexity="simple";
    if(steps.length>=3 || multi) complexity="complex";
    else if(steps.length>=1) complexity="moderate";
    const strategy=complexity==="complex"?"planned":(steps.length?"guided":"direct");
    return {active:steps.length>0,complexity,steps,strategy,modelMayReplan:true,attachmentAware:!!opts.hasImage||!!opts.hasPDF,query:q.slice(0,1200)};
  };

  window.aaruV14CompactTaskPlan=function(plan){

    const q=norm(text);

  };
})();
