<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Aaru AI</title>

<style>
*{
box-sizing:border-box;
margin:0;
padding:0
}

body{
font-family:Arial,Helvetica,sans-serif;
background:#070707;
color:#fff;
height:100vh;
overflow:hidden
}

.app{
height:100vh;
display:flex;
flex-direction:column;
max-width:900px;
margin:auto
}

/* HEADER */

.header{
height:62px;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 16px;
border-bottom:1px solid #222;
flex-shrink:0
}

.logo{
font-size:23px;
font-weight:800;
letter-spacing:-1px
}

.logo span{
opacity:.5
}

.header-right{
display:flex;
gap:8px
}

.header-btn{
background:#111;
border:1px solid #292929;
color:#fff;
border-radius:10px;
padding:8px 11px;
cursor:pointer;
font-size:12px
}

/* CHAT */

.chat{
flex:1;
overflow-y:auto;
padding:20px 16px 150px
}

.welcome{
text-align:center;
margin-top:14vh;
padding:20px
}

.welcome h1{
font-size:38px;
letter-spacing:-1.5px;
margin-bottom:10px
}

.welcome p{
color:#777;
font-size:14px;
line-height:1.6
}

.message{
display:flex;
margin-bottom:22px;
width:100%
}

.message.user{
justify-content:flex-end
}

.message.ai{
justify-content:flex-start
}

.bubble{
max-width:82%;
padding:13px 15px;
border-radius:16px;
font-size:15px;
line-height:1.55;
white-space:pre-wrap;
word-wrap:break-word
}

.user .bubble{
background:#fff;
color:#000;
border-bottom-right-radius:5px
}

.ai .bubble{
background:#111;
border:1px solid #242424;
border-bottom-left-radius:5px
}

.avatar{
width:30px;
height:30px;
border-radius:50%;
background:#fff;
color:#000;
display:flex;
align-items:center;
justify-content:center;
font-size:11px;
font-weight:800;
margin-right:9px;
flex-shrink:0
}

/* IMAGE */

.generated-image{
max-width:100%;
border-radius:14px;
display:block;
margin-top:10px;
background:#000
}

.image-actions{
display:flex;
gap:8px;
margin-top:9px
}

.image-actions a{
text-decoration:none;
color:#fff;
background:#1a1a1a;
border:1px solid #333;
border-radius:9px;
padding:8px 11px;
font-size:12px
}

/* TYPING */

.typing{
display:flex;
gap:5px;
padding:5px 2px
}

.typing span{
width:7px;
height:7px;
background:#777;
border-radius:50%;
animation:blink 1.2s infinite
}

.typing span:nth-child(2){
animation-delay:.15s
}

.typing span:nth-child(3){
animation-delay:.3s
}

@keyframes blink{
0%,80%,100%{opacity:.25}
40%{opacity:1}
}

/* COMPOSER */

.composer-wrap{
position:fixed;
bottom:0;
left:0;
right:0;
padding:12px 14px 14px;
background:linear-gradient(
transparent,
#070707 25%
);
z-index:10
}

.composer{
max-width:870px;
margin:auto;
background:#111;
border:1px solid #303030;
border-radius:17px;
padding:9px
}

.preview{
display:none;
position:relative;
padding:4px
}

.preview img{
width:90px;
height:90px;
object-fit:cover;
border-radius:10px
}

.remove-preview{
position:absolute;
left:78px;
top:-2px;
width:24px;
height:24px;
border:none;
border-radius:50%;
background:#000;
color:#fff;
cursor:pointer
}

.input-row{
display:flex;
align-items:flex-end;
gap:7px
}

textarea{
flex:1;
min-height:42px;
max-height:130px;
resize:none;
background:transparent;
border:none;
outline:none;
color:#fff;
font-size:15px;
line-height:1.45;
padding:9px 7px
}

textarea::placeholder{
color:#666
}

.icon-btn{
width:40px;
height:40px;
border:none;
border-radius:11px;
background:#1c1c1c;
color:#fff;
cursor:pointer;
font-size:17px;
flex-shrink:0
}

.send-btn{
width:40px;
height:40px;
border:none;
border-radius:11px;
background:#fff;
color:#000;
cursor:pointer;
font-size:17px;
font-weight:bold;
flex-shrink:0
}

.send-btn:disabled{
opacity:.4
}

.tools{
display:flex;
gap:7px;
padding:7px 5px 2px;
border-top:1px solid #222;
margin-top:5px
}

.tool{
background:transparent;
border:1px solid #292929;
color:#888;
border-radius:8px;
padding:6px 9px;
font-size:11px;
cursor:pointer
}

.tool.active{
color:#fff;
border-color:#555
}

#fileInput{
display:none
}

/* MOBILE */

@media(max-width:600px){

.welcome h1{
font-size:32px
}

.bubble{
max-width:88%
}

.chat{
padding-left:11px;
padding-right:11px
}

.header{
padding:0 11px
}

}
</style>
</head>

<body>

<div class="app">

<header class="header">

<div class="logo">
Aaru <span>AI</span>
</div>

<div class="header-right">

<button class="header-btn" onclick="newChat()">
＋ New Chat
</button>

</div>

</header>


<main class="chat" id="chat">

<div class="welcome" id="welcome">

<h1>How can I help?</h1>

<p>
Ask anything, create an image,<br>
or upload a photo to transform it.
</p>

</div>

</main>


<div class="composer-wrap">

<div class="composer">

<div class="preview" id="preview">

<img id="previewImage">

<button
class="remove-preview"
onclick="removeImage()"
type="button">
×
</button>

</div>


<div class="input-row">

<button
class="icon-btn"
onclick="document.getElementById('fileInput').click()"
type="button">
＋
</button>

<textarea
id="prompt"
rows="1"
placeholder="Message Aaru AI..."
></textarea>

<button
class="send-btn"
id="sendBtn"
onclick="sendMessage()"
type="button">
➤
</button>

</div>


<div class="tools">

<button
class="tool"
id="imageTool"
onclick="toggleImageMode()"
type="button">
🎨 Create Image
</button>

<button
class="tool"
onclick="document.getElementById('fileInput').click()"
type="button">
📷 Photo
</button>

</div>

<input
type="file"
id="fileInput"
accept="image/*">

</div>

</div>

</div>


<script>

const API_URL =
"https://aaru-ai-api.myera-org.workers.dev/";

let messages = [];

let imageMode = false;

let selectedImageBase64 = "";


// =====================================================
// ELEMENTS
// =====================================================

const chat =
document.getElementById("chat");

const promptInput =
document.getElementById("prompt");

const sendBtn =
document.getElementById("sendBtn");

const fileInput =
document.getElementById("fileInput");


// =====================================================
// AUTO RESIZE
// =====================================================

promptInput.addEventListener(
"input",
function(){

this.style.height="auto";

this.style.height =
Math.min(
this.scrollHeight,
130
) + "px";

}
);


// =====================================================
// ENTER TO SEND
// =====================================================

promptInput.addEventListener(
"keydown",
function(event){

if(
event.key === "Enter" &&
!event.shiftKey
){

event.preventDefault();

sendMessage();

}

}
);


// =====================================================
// IMAGE MODE
// =====================================================

function toggleImageMode(){

imageMode =
!imageMode;

const btn =
document.getElementById(
"imageTool"
);

if(imageMode){

btn.classList.add("active");

btn.textContent =
"🎨 Image Mode ON";

promptInput.placeholder =
"Describe the image you want...";

}else{

btn.classList.remove("active");

btn.textContent =
"🎨 Create Image";

promptInput.placeholder =
"Message Aaru AI...";

}

}


// =====================================================
// IMAGE UPLOAD
// =====================================================

fileInput.addEventListener(
"change",
function(event){

const file =
event.target.files[0];

if(!file)return;

if(!file.type.startsWith("image/")){

alert("कृपया image file चुनें।");

return;
}

const reader =
new FileReader();

reader.onload =
function(e){

selectedImageBase64 =
e.target.result;

document
.getElementById("previewImage")
.src =
selectedImageBase64;

document
.getElementById("preview")
.style.display =
"block";

};

reader.readAsDataURL(file);

}
);


// =====================================================
// REMOVE IMAGE
// =====================================================

function removeImage(){

selectedImageBase64 = "";

fileInput.value = "";

document
.getElementById("preview")
.style.display =
"none";

}


// =====================================================
// ADD USER MESSAGE
// =====================================================

function addUserMessage(text){

const row =
document.createElement("div");

row.className =
"message user";

const bubble =
document.createElement("div");

bubble.className =
"bubble";

bubble.textContent =
text;

row.appendChild(bubble);

chat.appendChild(row);

scrollBottom();

}


// =====================================================
// ADD AI MESSAGE
// =====================================================

function addAIMessage(text){

const row =
document.createElement("div");

row.className =
"message ai";

const avatar =
document.createElement("div");

avatar.className =
"avatar";

avatar.textContent =
"AI";

const bubble =
document.createElement("div");

bubble.className =
"bubble";

bubble.textContent =
text;

row.appendChild(avatar);

row.appendChild(bubble);

chat.appendChild(row);

scrollBottom();

return bubble;

}


// =====================================================
// TYPING
// =====================================================

function showTyping(){

const row =
document.createElement("div");

row.className =
"message ai";

row.id =
"typingMessage";

const avatar =
document.createElement("div");

avatar.className =
"avatar";

avatar.textContent =
"AI";

const bubble =
document.createElement("div");

bubble.className =
"bubble";

bubble.innerHTML = `
<div class="typing">
<span></span>
<span></span>
<span></span>
</div>
`;

row.appendChild(avatar);

row.appendChild(bubble);

chat.appendChild(row);

scrollBottom();

}


function removeTyping(){

const el =
document.getElementById(
"typingMessage"
);

if(el)el.remove();

}


// =====================================================
// SEND MESSAGE
// =====================================================

async function sendMessage(){

const text =
promptInput.value.trim();

if(!text && !selectedImageBase64){
return;
}

sendBtn.disabled =
true;


// Remove welcome

const welcome =
document.getElementById(
"welcome"
);

if(welcome){
welcome.remove();
}


// User message

if(text){

addUserMessage(text);

}


// =====================================================
// IMAGE GENERATION
// =====================================================

if(
imageMode ||
selectedImageBase64
){

await generateImage(
text || "Create a high quality image from the uploaded photo."
);

sendBtn.disabled =
false;

return;

}


// =====================================================
// CHAT
// =====================================================

messages.push({
role:"user",
content:text
});


// Keep context manageable

if(messages.length > 20){

messages =
messages.slice(-20);

}


showTyping();


try{

const response =
await fetch(
API_URL + "chat",
{
method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:JSON.stringify({
messages:messages
})

}
);


const data =
await response.json();


removeTyping();


if(!response.ok){

throw new Error(
data.error ||
"Chat request failed."
);

}


const reply =
data.reply || "";


messages.push({
role:"assistant",
content:reply
});


addAIMessage(reply);


}catch(error){

removeTyping();

addAIMessage(
"❌ " +
(
error.message ||
"Aaru AI से response नहीं मिला।"
)
);

}

finally{

sendBtn.disabled =
false;

promptInput.value = "";

promptInput.style.height =
"auto";

}

}


// =====================================================
// IMAGE GENERATION
// =====================================================

async function generateImage(
text
){

if(!text){

text =
"Create a beautiful high quality image.";
}

showTyping();


try{

let response;


if(selectedImageBase64){

response =
await fetch(
API_URL,
{
method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:JSON.stringify({

prompt:text,

ratio:"1:1",

quality:"hd",

image_b64:
cleanBase64(
selectedImageBase64
),

strength:0.65

})

}
);

}else{

const params =
new URLSearchParams({

prompt:text,

ratio:"1:1",

quality:"hd"

});

response =
await fetch(
API_URL + "?" +
params.toString()
);

}


if(!response.ok){

let errorData = {};

try{

errorData =
await response.json();

}catch(e){}

throw new Error(
errorData.error ||
"Image generation failed."
);

}


const blob =
await response.blob();


if(!blob.type.includes("image")){

throw new Error(
"Server ने valid image नहीं भेजी।"
);

}


const imageUrl =
URL.createObjectURL(blob);


removeTyping();


const row =
document.createElement("div");

row.className =
"message ai";


const avatar =
document.createElement("div");

avatar.className =
"avatar";

avatar.textContent =
"AI";


const bubble =
document.createElement("div");

bubble.className =
"bubble";

bubble.textContent =
"✨ आपकी image तैयार है।";


const image =
document.createElement("img");

image.className =
"generated-image";

image.src =
imageUrl;


const actions =
document.createElement("div");

actions.className =
"image-actions";


const download =
document.createElement("a");

download.href =
imageUrl;

download.download =
"aaru-ai-" +
Date.now() +
".png";

download.textContent =
"⬇️ Download";


actions.appendChild(
download
);

bubble.appendChild(
image
);

bubble.appendChild(
actions
);

row.appendChild(
avatar
);

row.appendChild(
bubble
);

chat.appendChild(
row
);


saveImageToHistory(
imageUrl
);

scrollBottom();


}catch(error){

removeTyping();

addAIMessage(
"❌ " +
(
error.message ||
"Image generation failed."
)
);

}

finally{

removeImage();

imageMode =
false;

const btn =
document.getElementById(
"imageTool"
);

btn.classList.remove(
"active"
);

btn.textContent =
"🎨 Create Image";

promptInput.placeholder =
"Message Aaru AI...";

promptInput.value = "";

promptInput.style.height =
"auto";

}

}


// =====================================================
// CLEAN BASE64
// =====================================================

function cleanBase64(
dataUrl
){

if(!dataUrl){
return "";
}

if(dataUrl.includes(",")){

return dataUrl.split(",")[1];

}

return dataUrl;

}


// =====================================================
// SAVE IMAGE HISTORY
// =====================================================

function saveImageToHistory(
imageUrl
){

try{

let history =
JSON.parse(
localStorage.getItem(
"aaru_history"
) || "[]"
);

history.unshift(
imageUrl
);

history =
history.slice(0,10);

localStorage.setItem(
"aaru_history",
JSON.stringify(history)
);

}catch(error){

console.log(
"History save failed",
error
);

}

}


// =====================================================
// NEW CHAT
// =====================================================

function newChat(){

messages = [];

chat.innerHTML = `
<div class="welcome" id="welcome">

<h1>How can I help?</h1>

<p>
Ask anything, create an image,<br>
or upload a photo to transform it.
</p>

</div>
`;

promptInput.value = "";

promptInput.style.height =
"auto";

removeImage();

}


// =====================================================
// SCROLL
// =====================================================

function scrollBottom(){

setTimeout(
function(){

chat.scrollTo({
top:chat.scrollHeight,
behavior:"smooth"
});

},
50
);

}

</script>

</body>
</html>
