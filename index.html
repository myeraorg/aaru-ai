<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Aaru AI</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  font-family:Arial,Helvetica,sans-serif;
  background:#0b0f14;
  color:#f5f7fa;
  overflow:hidden;
}

body{
  display:flex;
  flex-direction:column;
}

/* HEADER */

.header{
  height:58px;
  min-height:58px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 14px;
  border-bottom:1px solid #202833;
  background:#0b0f14;
  position:relative;
  z-index:20;
}

.header-left{
  display:flex;
  align-items:center;
  gap:12px;
}

.menu-btn{
  width:40px;
  height:40px;
  border:0;
  background:transparent;
  color:#fff;
  font-size:25px;
  cursor:pointer;
  border-radius:10px;
}

.menu-btn:active{
  background:#18202a;
}

.logo{
  font-size:21px;
  font-weight:700;
  letter-spacing:.2px;
}

.logo span{
  color:#7dd3fc;
}

.status{
  font-size:12px;
  color:#72e6a8;
  display:flex;
  align-items:center;
  gap:5px;
}

.status-dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:#4ade80;
}

/* MAIN */

.main{
  flex:1;
  overflow-y:auto;
  padding-bottom:125px;
  scroll-behavior:smooth;
}

.chat{
  width:100%;
  max-width:850px;
  margin:0 auto;
  padding:20px 14px 40px;
}

/* WELCOME */

.welcome{
  min-height:55vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:30px 10px;
}

.welcome-logo{
  width:72px;
  height:72px;
  border-radius:22px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,#38bdf8,#818cf8);
  color:white;
  font-size:34px;
  font-weight:800;
  box-shadow:0 12px 35px rgba(56,189,248,.18);
  margin-bottom:20px;
}

.welcome h1{
  font-size:29px;
  margin:0 0 10px;
}

.welcome p{
  margin:0;
  color:#9aa5b1;
  font-size:15px;
  line-height:1.6;
}

/* MESSAGES */

.message{
  display:flex;
  margin:18px 0;
  width:100%;
}

.message.user{
  justify-content:flex-end;
}

.message.assistant{
  justify-content:flex-start;
}

.bubble{
  max-width:84%;
  padding:12px 15px;
  border-radius:17px;
  font-size:15px;
  line-height:1.55;
  white-space:pre-wrap;
  word-break:break-word;
}

.user .bubble{
  background:#243244;
  border-bottom-right-radius:5px;
}

.assistant .bubble{
  background:#151c24;
  border:1px solid #222c37;
  border-bottom-left-radius:5px;
}

/* IMAGE CARD */

.image-card{
  width:min(100%,600px);
  background:#111821;
  border:1px solid #26313d;
  border-radius:18px;
  padding:8px;
  overflow:hidden;
}

.image-card img{
  width:100%;
  display:block;
  border-radius:13px;
  background:#080b0f;
}

.image-actions{
  display:flex;
  gap:8px;
  padding:9px 2px 2px;
}

.image-actions button{
  flex:1;
  border:0;
  border-radius:10px;
  padding:10px;
  background:#202b38;
  color:#fff;
  cursor:pointer;
  font-size:13px;
}

.image-actions button:active{
  transform:scale(.98);
}

/* LOADING */

.typing{
  display:flex;
  gap:5px;
  align-items:center;
}

.typing span{
  width:7px;
  height:7px;
  border-radius:50%;
  background:#8d9aaa;
  animation:bounce 1.2s infinite;
}

.typing span:nth-child(2){
  animation-delay:.15s;
}

.typing span:nth-child(3){
  animation-delay:.3s;
}

@keyframes bounce{
  0%,80%,100%{transform:translateY(0);opacity:.4}
  40%{transform:translateY(-5px);opacity:1}
}

/* COMPOSER */

.composer-wrap{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  padding:10px 12px calc(10px + env(safe-area-inset-bottom));
  background:linear-gradient(
    to top,
    #0b0f14 72%,
    rgba(11,15,20,.94) 86%,
    rgba(11,15,20,0)
  );
  z-index:15;
}

.composer{
  max-width:850px;
  margin:auto;
}

.input-box{
  background:#151c24;
  border:1px solid #2a3542;
  border-radius:18px;
  padding:8px;
  box-shadow:0 8px 30px rgba(0,0,0,.22);
}

.input-row{
  display:flex;
  align-items:flex-end;
  gap:7px;
}

.attach-btn,
.send-btn{
  width:42px;
  height:42px;
  min-width:42px;
  border:0;
  border-radius:12px;
  background:transparent;
  color:#d9e1ea;
  font-size:22px;
  cursor:pointer;
}

.send-btn{
  background:#e8edf2;
  color:#10151b;
  font-size:18px;
}

.send-btn:disabled{
  opacity:.35;
}

textarea{
  flex:1;
  min-height:42px;
  max-height:130px;
  resize:none;
  border:0;
  outline:0;
  background:transparent;
  color:#fff;
  font-size:15px;
  line-height:1.45;
  padding:10px 4px;
  font-family:inherit;
}

textarea::placeholder{
  color:#7f8b98;
}

.tools{
  display:flex;
  gap:7px;
  overflow-x:auto;
  padding:7px 3px 2px;
}

.tools::-webkit-scrollbar{
  display:none;
}

.tool{
  white-space:nowrap;
  border:1px solid #2a3542;
  background:#1b242e;
  color:#d8e0e8;
  border-radius:10px;
  padding:8px 11px;
  font-size:12px;
  cursor:pointer;
}

.tool.active{
  background:#263746;
  border-color:#4d6c82;
}

/* PHOTO PREVIEW */

.photo-preview{
  display:none;
  margin:3px 3px 8px;
  position:relative;
  width:82px;
  height:82px;
}

.photo-preview.show{
  display:block;
}

.photo-preview img{
  width:82px;
  height:82px;
  object-fit:cover;
  border-radius:12px;
  border:1px solid #364351;
}

.remove-photo{
  position:absolute;
  right:-6px;
  top:-6px;
  width:22px;
  height:22px;
  border:0;
  border-radius:50%;
  background:#ef4444;
  color:#fff;
  cursor:pointer;
}

/* DRAWER */

.overlay{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.58);
  z-index:30;
}

.overlay.show{
  display:block;
}

.drawer{
  position:fixed;
  left:0;
  top:0;
  bottom:0;
  width:min(330px,88vw);
  background:#11171f;
  border-right:1px solid #27313d;
  z-index:31;
  transform:translateX(-105%);
  transition:transform .22s ease;
  overflow-y:auto;
  padding:16px;
}

.drawer.show{
  transform:translateX(0);
}

.drawer-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:18px;
}

.drawer-title{
  font-size:18px;
  font-weight:700;
}

.close-drawer{
  width:36px;
  height:36px;
  border:0;
  background:#1b242e;
  color:#fff;
  border-radius:10px;
  font-size:20px;
}

.new-chat{
  width:100%;
  border:1px solid #344353;
  background:#1b2632;
  color:#fff;
  border-radius:12px;
  padding:12px;
  font-size:14px;
  cursor:pointer;
  margin-bottom:20px;
}

.new-chat:active{
  transform:scale(.99);
}

.section-title{
  color:#84909d;
  font-size:12px;
  text-transform:uppercase;
  letter-spacing:.6px;
  margin:15px 2px 9px;
}

.creation-item{
  display:flex;
  align-items:center;
  gap:10px;
  padding:8px;
  border-radius:12px;
  margin-bottom:6px;
  background:#171f28;
}

.creation-item img{
  width:55px;
  height:55px;
  object-fit:cover;
  border-radius:9px;
}

.creation-info{
  flex:1;
  min-width:0;
}

.creation-info div{
  font-size:12px;
  color:#aab4bf;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.delete-creation{
  width:30px;
  height:30px;
  border:0;
  background:transparent;
  color:#8b96a3;
  font-size:17px;
}

.clear-creations{
  width:100%;
  border:1px solid #303b48;
  background:transparent;
  color:#aeb8c3;
  border-radius:10px;
  padding:9px;
  margin-top:8px;
}

/* PHOTO INPUT */

#photoInput{
  display:none;
}

/* SMALL */

@media(max-width:600px){
  .bubble{
    max-width:90%;
  }

  .welcome h1{
    font-size:26px;
  }

  .chat{
    padding-left:10px;
    padding-right:10px;
  }
}
</style>
</head>

<body>

<header class="header">
  <div class="header-left">
    <button class="menu-btn" id="menuBtn">☰</button>
    <div class="logo">Aaru <span>AI</span></div>
  </div>

  <div class="status">
    <span class="status-dot"></span>
    Online
  </div>
</header>

<main class="main" id="main">
  <div class="chat" id="chat">

    <section class="welcome" id="welcome">
      <div class="welcome-logo">A</div>
      <h1>How can I help you?</h1>
      <p>
        सवाल पूछिए, लिखवाइए, ideas लीजिए या<br>
        शानदार images बनाइए।
      </p>
    </section>

  </div>
</main>

<!-- DRAWER -->

<div class="overlay" id="overlay"></div>

<aside class="drawer" id="drawer">

  <div class="drawer-head">
    <div class="drawer-title">Aaru AI</div>
    <button class="close-drawer" id="closeDrawer">×</button>
  </div>

  <button class="new-chat" id="newChatBtn">
    ＋ New Chat
  </button>

  <div class="section-title">
    Recent Creations
  </div>

  <div id="creations"></div>

  <button class="clear-creations" id="clearCreations">
    Delete all creations
  </button>

</aside>

<!-- COMPOSER -->

<div class="composer-wrap">

  <div class="composer">

    <div class="input-box">

      <div class="photo-preview" id="photoPreview">
        <img id="previewImage" alt="">
        <button class="remove-photo" id="removePhoto">×</button>
      </div>

      <div class="input-row">

        <button class="attach-btn" id="attachBtn" title="Photo">
          ＋
        </button>

        <textarea
          id="prompt"
          rows="1"
          placeholder="Message Aaru AI..."
        ></textarea>

        <button class="send-btn" id="sendBtn">
          ↑
        </button>

      </div>

      <div class="tools">

        <button class="tool" id="imageTool">
          🎨 Create Image
        </button>

        <button class="tool" id="photoTool">
          📷 Photo
        </button>

        <button class="tool" id="exampleTool">
          ✨ Example
        </button>

      </div>

    </div>

  </div>

</div>

<input
  type="file"
  id="photoInput"
  accept="image/*"
>

<script>
/* =========================================================
   AARU AI
   Conversation Memory + Image Generation
   ========================================================= */

const API = "https://aaru-ai-api.myera-org.workers.dev/";

const CHAT_KEY = "aaru_chat_messages";
const IMAGE_KEY = "aaru_history";

let messages = [];
let imageMode = false;
let selectedPhotoBase64 = null;
let selectedPhotoUrl = null;
let isBusy = false;

/* =========================================================
   ELEMENTS
   ========================================================= */

const main = document.getElementById("main");
const chat = document.getElementById("chat");
const welcome = document.getElementById("welcome");

const promptInput = document.getElementById("prompt");
const sendBtn = document.getElementById("sendBtn");

const imageTool = document.getElementById("imageTool");
const photoTool = document.getElementById("photoTool");
const exampleTool = document.getElementById("exampleTool");

const attachBtn = document.getElementById("attachBtn");
const photoInput = document.getElementById("photoInput");

const photoPreview = document.getElementById("photoPreview");
const previewImage = document.getElementById("previewImage");
const removePhoto = document.getElementById("removePhoto");

const menuBtn = document.getElementById("menuBtn");
const closeDrawer = document.getElementById("closeDrawer");
const overlay = document.getElementById("overlay");
const drawer = document.getElementById("drawer");

const newChatBtn = document.getElementById("newChatBtn");

const creations = document.getElementById("creations");
const clearCreations = document.getElementById("clearCreations");

/* =========================================================
   LOCAL STORAGE — CHAT MEMORY
   ========================================================= */

function saveChatMemory(){
  try{
    /*
      Only text messages are stored.
      Generated image blobs/base64 are NOT stored here,
      keeping localStorage small and fast.
    */
    const clean = messages
      .filter(m => m && (m.role === "user" || m.role === "assistant"))
      .map(m => ({
        role:m.role,
        content:String(m.content || "").slice(0,8000)
      }))
      .slice(-40);

    localStorage.setItem(CHAT_KEY, JSON.stringify(clean));
  }catch(e){
    console.warn("Chat memory save failed:",e);
  }
}

function loadChatMemory(){
  try{
    const raw = localStorage.getItem(CHAT_KEY);

    if(!raw){
      messages = [];
      return;
    }

    const saved = JSON.parse(raw);

    if(!Array.isArray(saved)){
      messages = [];
      return;
    }

    messages = saved
      .filter(m =>
        m &&
        (m.role === "user" || m.role === "assistant") &&
        typeof m.content === "string"
      )
      .slice(-40);

  }catch(e){
    console.warn("Chat memory load failed:",e);
    messages = [];
  }
}

/* =========================================================
   RESTORE CHAT UI
   ========================================================= */

function restoreChat(){

  if(!messages.length){
    welcome.style.display = "flex";
    return;
  }

  welcome.style.display = "none";

  for(const msg of messages){

    if(msg.role === "user"){
      addUserMessage(msg.content,false);
    }else{
      addAssistantMessage(msg.content,false);
    }
  }

  scrollBottom();
}

/* =========================================================
   MESSAGE UI
   ========================================================= */

function addUserMessage(text,save=true){

  welcome.style.display = "none";

  const row = document.createElement("div");
  row.className = "message user";

  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.textContent = text;

  row.appendChild(bubble);
  chat.appendChild(row);

  if(save){
    messages.push({
      role:"user",
      content:text
    });

    saveChatMemory();
  }

  scrollBottom();
}

function addAssistantMessage(text,save=true){

  welcome.style.display = "none";

  const row = document.createElement("div");
  row.className = "message assistant";

  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.textContent = text;

  row.appendChild(bubble);
  chat.appendChild(row);

  if(save){
    messages.push({
      role:"assistant",
      content:text
    });

    saveChatMemory();
  }

  scrollBottom();
}

function addTyping(){

  const row = document.createElement("div");
  row.className = "message assistant";
  row.id = "typingMessage";

  const bubble = document.createElement("div");
  bubble.className = "bubble";

  bubble.innerHTML = `
    <div class="typing">
      <span></span>
      <span></span>
      <span></span>
    </div>
  `;

  row.appendChild(bubble);
  chat.appendChild(row);

  scrollBottom();

  return row;
}

function removeTyping(){
  const el = document.getElementById("typingMessage");
  if(el) el.remove();
}

function scrollBottom(){
  requestAnimationFrame(()=>{
    main.scrollTop = main.scrollHeight;
  });
}

/* =========================================================
   IMAGE INTENT
   ========================================================= */

function detectImageIntent(text){

  const t = text.toLowerCase().trim();

  if(!t) return false;

  const phrases = [

    "create an image",
    "generate an image",
    "make an image",
    "create image",
    "generate image",
    "make image",
    "draw an image",
    "draw image",
    "create a photo",
    "generate a photo",
    "make a photo",

    "इमेज बनाओ",
    "इमेज बनाना",
    "इमेज बना",
    "फोटो बनाओ",
    "फोटो बना",
    "फोटो बनाना",
    "तस्वीर बनाओ",
    "तस्वीर बना",
    "चित्र बनाओ",
    "चित्र बना",
    "बना दो फोटो",
    "बना दो इमेज",
    "बनाकर दो फोटो",
    "बनाकर दो इमेज",

    "एक प्यारा कुत्ता बनाओ",
    "एक लड़की की फोटो बनाओ",
    "एक लड़के की फोटो बनाओ",
    "गांव का दृश्य बनाओ",
    "दृश्य बनाओ"
  ];

  if(phrases.some(p => t.includes(p))){
    return true;
  }

  /*
    Generic image requests:
    "एक ... बनाओ"
    लेकिन सामान्य text commands को image नहीं बनाना।
  */

  if(
    /^(एक|एकदम)\s+.+(बनाओ|बना दो|बनाकर दो)$/.test(t)
  ){
    return true;
  }

  return false;
}

/* =========================================================
   IMAGE GENERATION
   ========================================================= */

async function generateImage(userPrompt){

  const typing = addTyping();

  try{

    let response;

    if(selectedPhotoBase64){

      response = await fetch(API,{
        method:"POST",
        headers:{
          "Content-Type":"application/json"
        },
        body:JSON.stringify({
          prompt:userPrompt,
          ratio:"1:1",
          quality:"hd",
          image_b64:selectedPhotoBase64,
          strength:.65
        })
      });

    }else{

      const url =
        API +
        "?prompt=" +
        encodeURIComponent(userPrompt) +
        "&ratio=1:1" +
        "&quality=hd";

      response = await fetch(url);
    }

    if(!response.ok){

      let errorText = "";

      try{
        errorText = await response.text();
      }catch(e){}

      throw new Error(
        errorText || `Image generation failed (${response.status})`
      );
    }

    const blob = await response.blob();

    if(!blob.type.startsWith("image/")){
      throw new Error("Server ने image return नहीं की।");
    }

    const imageUrl = URL.createObjectURL(blob);

    removeTyping();

    addGeneratedImage(imageUrl,userPrompt);

    /*
      Memory में actual image नहीं रखेंगे।
      केवल event marker रखेंगे ताकि conversation context
      आगे भी समझ में आए।
    */

    messages.push({
      role:"assistant",
      content:"Image generated successfully."
    });

    saveChatMemory();

  }catch(error){

    removeTyping();

    console.error(error);

    addAssistantMessage(
      "माफ़ कीजिए, image generate नहीं हो पाई।\n\n" +
      (error.message || "Unknown error")
    );

  }finally{

    clearSelectedPhoto();

  }
}

/* =========================================================
   IMAGE CARD
   ========================================================= */

function addGeneratedImage(imageUrl,userPrompt){

  welcome.style.display = "none";

  const row = document.createElement("div");
  row.className = "message assistant";

  const card = document.createElement("div");
  card.className = "image-card";

  const img = document.createElement("img");
  img.src = imageUrl;
  img.alt = userPrompt || "Generated image";

  const actions = document.createElement("div");
  actions.className = "image-actions";

  const download = document.createElement("button");
  download.textContent = "⬇ Download";

  download.onclick = async ()=>{

    try{

      const a = document.createElement("a");
      a.href = imageUrl;
      a.download = "aaru-ai-image.png";

      document.body.appendChild(a);
      a.click();
      a.remove();

    }catch(e){
      console.error(e);
    }
  };

  const another = document.createElement("button");
  another.textContent = "✨ Create another";

  another.onclick = ()=>{
    promptInput.value = userPrompt || "";
    imageMode = true;
    imageTool.classList.add("active");
    promptInput.focus();
  };

  actions.appendChild(download);
  actions.appendChild(another);

  card.appendChild(img);
  card.appendChild(actions);

  row.appendChild(card);
  chat.appendChild(row);

  saveCreation(imageUrl,userPrompt);

  scrollBottom();
}

/* =========================================================
   CHAT API
   ========================================================= */

async function sendChat(){

  const text = promptInput.value.trim();

  if(!text || isBusy) return;

  /*
    Automatic image detection
  */

  if(!imageMode && !selectedPhotoBase64 && detectImageIntent(text)){
    imageMode = true;
  }

  isBusy = true;
  sendBtn.disabled = true;

  promptInput.value = "";
  autoResize();

  addUserMessage(text,true);

  /*
    IMAGE MODE
  */

  if(imageMode || selectedPhotoBase64){

    await generateImage(text);

    imageMode = false;
    imageTool.classList.remove("active");

    isBusy = false;
    sendBtn.disabled = false;

    return;
  }

  /*
    CHAT MODE
  */

  const typing = addTyping();

  try{

    /*
      Send last 20 messages to Worker.
      This is the actual Conversation Memory.
    */

    const contextMessages = messages
      .slice(-20)
      .map(m=>({
        role:m.role,
        content:String(m.content || "").slice(0,8000)
      }));

    const response = await fetch(API + "chat",{
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify({
        message:text,
        messages:contextMessages
      })
    });

    if(!response.ok){

      let err = "";

      try{
        err = await response.text();
      }catch(e){}

      throw new Error(
        err || `Chat request failed (${response.status})`
      );
    }

    const data = await response.json();

    removeTyping();

    const reply =
      data.reply ||
      data.answer ||
      data.response ||
      "मुझे कोई उत्तर नहीं मिला।";

    addAssistantMessage(reply,true);

  }catch(error){

    removeTyping();

    console.error(error);

    addAssistantMessage(
      "माफ़ कीजिए, अभी Aaru AI से connection नहीं हो पाया।\n\n" +
      (error.message || "Unknown error")
    );

  }finally{

    isBusy = false;
    sendBtn.disabled = false;
    promptInput.focus();
  }
}

    photoPreview.classList.add("show");

  photoInput.value = "";

  promptInput.placeholder = "Message Aaru AI...";
}

function preparePhoto(file){

  return new Promise((resolve,reject)=>{

    const reader = new FileReader();

    reader.onload = ()=>{

      const img = new Image();

      img.onload = ()=>{

        let max = 768;

        let w = img.width;
        let h = img.height;

        if(w > max || h > max){

          const scale = Math.min(max/w,max/h);

          w = Math.round(w * scale);
          h = Math.round(h * scale);
        }

        const canvas = document.createElement("canvas");

        canvas.width = w;
        canvas.height = h;

        const ctx = canvas.getContext("2d");

        ctx.drawImage(img,0,0,w,h);

        let quality = .78;

        let result = canvas.toDataURL(
          "image/jpeg",
          quality
        );

        /*
          Keep base64 reasonably small.
        */

        if(result.length > 600000){

          result = canvas.toDataURL(
            "image/jpeg",
            .62
          );
        }

        if(result.length > 600000){

          const scale = Math.min(
            512/w,
            512/h,
            1
          );

          const w2 = Math.max(
            1,
            Math.round(w*scale)
          );

          const h2 = Math.max(
            1,
            Math.round(h*scale)
          );

          canvas.width = w2;
          canvas.height = h2;

          ctx.drawImage(
            img,
            0,
            0,
            w2,
            h2
          );

          result = canvas.toDataURL(
            "image/jpeg",
            .62
          );
        }

        resolve(result);
      };

      img.onerror = reject;
      img.src = reader.result;
    };

    reader.onerror = reject;

    reader.readAsDataURL(file);
  });
}

/* =========================================================
   IMAGE HISTORY
   ========================================================= */

function saveCreation(url,promptText){

  try{

    const history =
      JSON.parse(
        localStorage.getItem(IMAGE_KEY) || "[]"
      );

    /*
      Blob URLs survive only in current page session.
      Store a data URL instead for persistence.
    */

    fetch(url)
      .then(r=>r.blob())
      .then(blob=>{

        const reader = new FileReader();

        reader.onload = ()=>{

          history.unshift({
            image:reader.result,
            prompt:String(promptText || "").slice(0,300),
            time:Date.now()
          });

          history.splice(20);

          try{
            localStorage.setItem(
              IMAGE_KEY,
              JSON.stringify(history)
            );
          }catch(e){

            /*
              If storage becomes full, keep fewer images.
            */

            history.splice(8);

            try{
              localStorage.setItem(
                IMAGE_KEY,
                JSON.stringify(history)
              );
            }catch(err){}
          }

          renderCreations();
        };

        reader.readAsDataURL(blob);
      })
      .catch(()=>{});

  }catch(e){
    console.warn("History save failed:",e);
  }
}

function renderCreations(){

  creations.innerHTML = "";

  let history = [];

  try{
    history =
      JSON.parse(
        localStorage.getItem(IMAGE_KEY) || "[]"
      );
  }catch(e){
    history = [];
  }

  if(!history.length){

    creations.innerHTML = `
      <div style="
        color:#697582;
        font-size:13px;
        padding:8px 2px;
      ">
        अभी कोई creation नहीं है।
      </div>
    `;

    return;
  }

  history.forEach((item,index)=>{

    const div = document.createElement("div");
    div.className = "creation-item";

    const img = document.createElement("img");

    img.src = item.image;
    img.alt = item.prompt || "Creation";

    const info = document.createElement("div");
    info.className = "creation-info";

    const title = document.createElement("div");
    title.textContent =
      item.prompt || "Generated image";

    info.appendChild(title);

    const del = document.createElement("button");
    del.className = "delete-creation";
    del.textContent = "×";

    del.onclick = (e)=>{

      e.stopPropagation();

      deleteCreation(index);
    };

    div.onclick = ()=>{

      openCreation(item.image);
    };

    div.appendChild(img);
    div.appendChild(info);
    div.appendChild(del);

    creations.appendChild(div);
  });
}

function deleteCreation(index){

  try{

    const history =
      JSON.parse(
        localStorage.getItem(IMAGE_KEY) || "[]"
      );

    history.splice(index,1);

    localStorage.setItem(
      IMAGE_KEY,
      JSON.stringify(history)
    );

    renderCreations();

  }catch(e){}
}

function openCreation(src){

  const win = window.open();

  if(win){

    win.document.write(`
      <html>
      <head>
        <title>Aaru AI</title>
        <style>
          body{
            margin:0;
            background:#000;
            display:flex;
            align-items:center;
            justify-content:center;
            min-height:100vh;
          }
          img{
            max-width:100%;
            max-height:100vh;
          }
        </style>
      </head>
      <body>
        <img src="${src}">
      </body>
      </html>
    `);
  }
}

clearCreations.onclick = ()=>{

  if(!confirm("सभी Recent Creations delete करें?")){
    return;
  }

  localStorage.removeItem(IMAGE_KEY);

  renderCreations();
};

   ========================================================= */

function autoResize(){

  promptInput.style.height = "auto";

  promptInput.style.height =
    Math.min(
      promptInput.scrollHeight,
      130
    ) + "px";
}

promptInput.addEventListener(
  "input",
  autoResize
);

promptInput.addEventListener(
  "keydown",
  e=>{

    if(e.key === "Enter" && !e.shiftKey){

      e.preventDefault();

      sendChat();
    }
  }
);
