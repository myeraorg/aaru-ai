<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1.0"
>

<title>Aaru AI</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0
}

body{
font-family:Arial,Helvetica,sans-serif;
background:#070707;
color:#fff;
height:100vh;
overflow:hidden
}

.app{
height:100vh;
display:flex;
max-width:1100px;
margin:auto
}


/* =====================================================
SIDEBAR
===================================================== */

.sidebar{
width:250px;
background:#0b0b0b;
border-right:1px solid #222;
display:flex;
flex-direction:column;
padding:12px;
flex-shrink:0
}

.sidebar-logo{
font-size:21px;
font-weight:800;
padding:10px 8px 16px
}

.sidebar-logo span{
opacity:.5
}

.new-chat{
width:100%;
border:1px solid #333;
background:#151515;
color:#fff;
padding:11px;
border-radius:10px;
cursor:pointer;
font-weight:bold;
margin-bottom:14px
}

.history-label{
font-size:11px;
color:#666;
padding:8px
}

.history-list{
flex:1;
overflow-y:auto
}

.history-item{
padding:10px;
border-radius:9px;
cursor:pointer;
font-size:13px;
color:#aaa;
margin-bottom:3px;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis
}

.history-item:hover{
background:#171717;
color:#fff
}

.memory-btn{
border:1px solid #292929;
background:#111;
color:#aaa;
padding:10px;
border-radius:9px;
cursor:pointer;
font-size:12px
}


/* =====================================================
MAIN
===================================================== */

.main{
flex:1;
display:flex;
flex-direction:column;
min-width:0
}

.header{
height:62px;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 16px;
border-bottom:1px solid #222;
flex-shrink:0
}

.logo{
font-size:20px;
font-weight:800
}

.logo span{
opacity:.5
}

.mobile-menu{
display:none;
background:#111;
border:1px solid #292929;
color:#fff;
border-radius:9px;
padding:8px 10px;
font-size:18px
}


/* =====================================================
CHAT
===================================================== */

.chat{
flex:1;
overflow-y:auto;
padding:20px 18px 150px
}

.welcome{
text-align:center;
margin-top:14vh;
padding:20px
}

.welcome h1{
font-size:38px;
letter-spacing:-1.5px;
margin-bottom:10px
}

.welcome p{
color:#777;
font-size:14px;
line-height:1.6
}

.message{
display:flex;
margin-bottom:22px;
width:100%
}

.message.user{
justify-content:flex-end
}

.message.ai{
justify-content:flex-start
}

.bubble{
max-width:82%;
padding:13px 15px;
border-radius:16px;
font-size:15px;
line-height:1.55;
white-space:pre-wrap;
word-break:break-word
}

.user .bubble{
background:#fff;
color:#000;
border-bottom-right-radius:5px
}

.ai .bubble{
background:#111;
border:1px solid #242424;
border-bottom-left-radius:5px
}

.avatar{
width:30px;
height:30px;
border-radius:50%;
background:#fff;
color:#000;
display:flex;
align-items:center;
justify-content:center;
font-size:10px;
font-weight:800;
margin-right:9px;
flex-shrink:0
}


/* =====================================================
GENERATED IMAGE
===================================================== */

.generated-image{
max-width:100%;
width:auto;
height:auto;
display:block;
margin-top:10px;
border-radius:14px;
background:#000
}

.image-actions{
display:flex;
gap:8px;
margin-top:9px
}

.image-actions a{
text-decoration:none;
color:#fff;
background:#1a1a1a;
border:1px solid #333;
padding:8px 11px;
border-radius:8px;
font-size:12px
}


/* =====================================================
TYPING
===================================================== */

.typing{
display:flex;
gap:5px;
padding:5px 2px
}

.typing span{
width:7px;
height:7px;
border-radius:50%;
background:#777;
animation:blink 1.2s infinite
}

.typing span:nth-child(2){
animation-delay:.15s
}

.typing span:nth-child(3){
animation-delay:.3s
}

@keyframes blink{

0%,80%,100%{
opacity:.2
}

40%{
opacity:1
}

}


/* =====================================================
COMPOSER
===================================================== */

.composer-wrap{
position:fixed;
bottom:0;
left:250px;
right:0;
padding:12px 14px 14px;
background:linear-gradient(
transparent,
#070707 25%
);
z-index:10
}

.composer{
max-width:850px;
margin:auto;
background:#111;
border:1px solid #303030;
border-radius:17px;
padding:9px
}

.preview{
display:none;
position:relative;
padding:4px
}

.preview img{
width:90px;
height:90px;
object-fit:cover;
border-radius:10px
}

.remove-preview{
position:absolute;
left:78px;
top:-2px;
width:24px;
height:24px;
border:none;
border-radius:50%;
background:#000;
color:#fff;
cursor:pointer
}

.input-row{
display:flex;
gap:7px;
align-items:flex-end
}

textarea{
flex:1;
min-height:42px;
max-height:130px;
resize:none;
background:transparent;
border:none;
outline:none;
color:#fff;
font-size:15px;
line-height:1.45;
padding:9px 7px
}

textarea::placeholder{
color:#666
}

.icon-btn,
.send-btn{
width:40px;
height:40px;
border-radius:11px;
border:none;
cursor:pointer;
flex-shrink:0
}

.icon-btn{
background:#1c1c1c;
color:#fff;
font-size:17px
}

.send-btn{
background:#fff;
color:#000;
font-size:17px
}

.send-btn:disabled{
opacity:.4;
cursor:not-allowed
}

.tools{
display:flex;
gap:7px;
padding:7px 5px 2px;
border-top:1px solid #222;
margin-top:5px
}

.tool{
background:transparent;
border:1px solid #292929;
color:#888;
border-radius:8px;
padding:6px 9px;
font-size:11px;
cursor:pointer
}

.tool.active{
color:#fff;
border-color:#555
}

#fileInput{
display:none
}


/* =====================================================
MEMORY MODAL
===================================================== */

.modal{
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,.75);
z-index:50;
align-items:center;
justify-content:center;
padding:20px
}

.modal-box{
width:100%;
max-width:480px;
background:#111;
border:1px solid #333;
border-radius:16px;
padding:18px
}

.modal-head{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:15px
}

.modal-head h2{
font-size:18px
}

.close{
background:none;
border:none;
color:#aaa;
font-size:22px;
cursor:pointer
}

.memory-info{
color:#777;
font-size:12px;
line-height:1.5;
margin-bottom:12px
}

.memory-list{
max-height:250px;
overflow-y:auto
}

.memory-row{
background:#090909;
border:1px solid #242424;
padding:10px;
border-radius:9px;
margin-bottom:7px;
font-size:12px;
color:#aaa;
display:flex;
justify-content:space-between;
gap:8px
}

.memory-row span{
word-break:break-word
}

.memory-row button{
background:none;
border:none;
color:#777;
cursor:pointer;
font-size:17px
}

.clear-memory{
width:100%;
margin-top:10px;
padding:10px;
background:#171717;
border:1px solid #333;
color:#fff;
border-radius:9px;
cursor:pointer
}


/* =====================================================
MOBILE
===================================================== */

@media(max-width:700px){

.sidebar{
position:fixed;
left:-260px;
top:0;
bottom:0;
z-index:30;
transition:.2s
}

.sidebar.open{
left:0
}

.mobile-menu{
display:block
}

.composer-wrap{
left:0
}

.header{
padding:0 11px
}

.chat{
padding-left:11px;
padding-right:11px
}

.bubble{
max-width:88%
}

.welcome h1{
font-size:32px
}

}

</style>

</head>


<body>


<div class="app">


<!-- =====================================================
SIDEBAR
===================================================== -->

<aside
class="sidebar"
id="sidebar"
>

<div class="sidebar-logo">
Aaru <span>AI</span>
</div>


<button
class="new-chat"
onclick="newChat()"
type="button"
>
＋ New Chat
</button>


<div class="history-label">
RECENT CHATS
</div>


<div
class="history-list"
id="historyList"
>
</div>


<button
class="memory-btn"
onclick="openMemory()"
type="button"
>
🧠 Memory
</button>

</aside>



<!-- =====================================================
MAIN
===================================================== -->

<main class="main">


<header class="header">


<button
class="mobile-menu"
onclick="toggleSidebar()"
type="button"
>
☰
</button>


<div class="logo">
Aaru <span>AI</span>
</div>


</header>



<!-- =====================================================
CHAT AREA
===================================================== -->

<div
class="chat"
id="chat"
>

<div
class="welcome"
id="welcome"
>

<h1>
How can I help?
</h1>

<p>
Ask anything, create an image,<br>
or upload a photo to transform it.
</p>

</div>

</div>



<!-- =====================================================
COMPOSER
===================================================== -->

<div class="composer-wrap">

<div class="composer">


<!-- IMAGE PREVIEW -->

<div
class="preview"
id="preview"
>

<img
id="previewImage"
alt="Selected photo"
>

<button
class="remove-preview"
onclick="removeImage()"
type="button"
>
×
</button>

</div>



<!-- INPUT -->

<div class="input-row">


<button
class="icon-btn"
onclick="fileInput.click()"
type="button"
>
＋
</button>


<textarea
id="prompt"
rows="1"
placeholder="Message Aaru AI..."
></textarea>


<button
class="send-btn"
id="sendBtn"
onclick="sendMessage()"
type="button"
>
➤
</button>


</div>



<!-- TOOLS -->

<div class="tools">


<button
class="tool"
id="imageTool"
onclick="toggleImageMode()"
type="button"
>
🎨 Create Image
</button>


<button
class="tool"
onclick="fileInput.click()"
type="button"
>
📷 Photo
</button>


</div>


<input
type="file"
id="fileInput"
accept="image/*"
>


</div>

</div>

</main>

</div>



<!-- =====================================================
MEMORY MODAL
===================================================== -->

<div
class="modal"
id="memoryModal"
>

<div class="modal-box">


<div class="modal-head">

<h2>
🧠 Aaru Memory
</h2>

<button
class="close"
onclick="closeMemory()"
type="button"
>
×
</button>

</div>


<div class="memory-info">
Aaru की saved memories अभी आपके browser में localStorage में रखी जाती हैं।
</div>


<div
class="memory-list"
id="memoryList"
>
</div>


<button
class="clear-memory"
onclick="clearMemory()"
type="button"
>
Clear All Memory
</button>


</div>

</div>



<script>


/* =====================================================
CONFIG
===================================================== */

const API_URL =
"https://aaru-ai-api.myera-org.workers.dev/";


/* =====================================================
STATE
===================================================== */

let messages = [];

let imageMode = false;

let selectedImageBase64 = "";

let currentChatId = null;


/* =====================================================
ELEMENTS
===================================================== */

const chat =
document.getElementById("chat");

const promptInput =
document.getElementById("prompt");

const sendBtn =
document.getElementById("sendBtn");

const fileInput =
document.getElementById("fileInput");

const historyList =
document.getElementById("historyList");


/* =====================================================
AUTO RESIZE TEXTAREA
===================================================== */

promptInput.addEventListener(
"input",
function(){

this.style.height =
"auto";

this.style.height =
Math.min(
this.scrollHeight,
130
) + "px";

}
);


/* =====================================================
ENTER TO SEND
===================================================== */

promptInput.addEventListener(
"keydown",
function(event){

if(
event.key === "Enter" &&
!event.shiftKey
){

event.preventDefault();

sendMessage();

}

}
);


/* =====================================================
LOCAL CHAT STORAGE
===================================================== */

function getChats(){

try{

return JSON.parse(
localStorage.getItem(
"aaru_chats"
) || "[]"
);

}catch(error){

return [];

}

}


function saveChats(chats){

localStorage.setItem(
"aaru_chats",
JSON.stringify(chats)
);

}


/* =====================================================
MEMORY STORAGE
===================================================== */

function getMemory(){

try{

return JSON.parse(
localStorage.getItem(
"aaru_memory"
) || "[]"
);

}catch(error){

return [];

}

}


function saveMemory(memory){

localStorage.setItem(
"aaru_memory",
JSON.stringify(memory)
);

}


/* =====================================================
AUTOMATIC MEMORY DETECTION
===================================================== */

function detectMemory(text){

if(!text){
return;
}

const lower =
text.toLowerCase();

const patterns = [

"remember that",
"याद रखना",
"याद रखो",
"मुझे पसंद है",
"मुझे पसंद",
"मेरा नाम",
"मैं चाहता हूँ",
"मैं चाहती हूँ",
"my name is",
"i like",
"i prefer"

];


const found =
patterns.some(
pattern =>
lower.includes(pattern)
);


if(!found){
return;
}


let memory =
getMemory();


if(
!memory.some(
item =>
item.text === text
)
){

memory.unshift({

id:Date.now(),

text:text

});


memory =
memory.slice(0,30);

saveMemory(memory);

renderMemory();

}

}


/* =====================================================
BUILD CHAT CONTEXT
===================================================== */

function buildMessages(){

const memory =
getMemory();

let memoryText = "";


if(memory.length){

memoryText =
"\n\nUser memory:\n" +
memory
.map(
item =>
"- " + item.text
)
.join("\n");

}


return [

{

role:"system",

content:
"You are Aaru AI, a helpful multilingual AI assistant. Use saved user memory when relevant." +
memoryText

},

...messages

];

}


/* =====================================================
CHAT HISTORY UI
===================================================== */

function renderHistory(){

const chats =
getChats();

historyList.innerHTML = "";


if(!chats.length){

historyList.innerHTML =
'<div style="color:#555;font-size:12px;padding:8px">No chats yet</div>';

return;

}


chats
.slice()
.reverse()
.forEach(
chatItem => {

const item =
document.createElement("div");

item.className =
"history-item";

item.textContent =
chatItem.title ||
"New Chat";

item.onclick =
function(){

loadChat(
chatItem.id
);

};

historyList.appendChild(item);

}
);

}


/* =====================================================
SAVE CURRENT CHAT
===================================================== */

function saveCurrentChat(){

if(!messages.length){
return;
}


const chats =
getChats();


const firstUser =
messages.find(
message =>
message.role === "user"
);


const title =
firstUser
? firstUser.content.slice(0,40)
: "New Chat";


const data = {

id:
currentChatId ||
Date.now(),

title:title,

messages:messages,

updatedAt:Date.now()

};


const index =
chats.findIndex(
item =>
item.id === data.id
);


if(index >= 0){

chats[index] =
data;

}else{

chats.push(data);

}


saveChats(chats);

currentChatId =
data.id;

renderHistory();

}


/* =====================================================
LOAD CHAT
===================================================== */

function loadChat(id){

const chats =
getChats();


const selected =
chats.find(
item =>
item.id === id
);


if(!selected){
return;
}


currentChatId =
selected.id;


messages =
Array.isArray(
selected.messages
)
? selected.messages
: [];


chat.innerHTML = "";


messages.forEach(
message => {

if(
message.role === "user"
){

addUserMessage(
message.content,
false
);

}

else if(
message.role === "assistant"
){

addAIMessage(
message.content,
false
);

}

}
);


closeSidebar();

scrollBottom();

}


/* =====================================================
NEW CHAT
===================================================== */

function newChat(){

saveCurrentChat();


messages = [];

currentChatId = null;


chat.innerHTML = `

<div
class="welcome"
id="welcome"
>

<h1>
How can I help?
</h1>

<p>
Ask anything, create an image,<br>
or upload a photo to transform it.
</p>

</div>

`;


promptInput.value = "";

promptInput.style.height =
"auto";


removeImage();


imageMode = false;


const imageBtn =
document.getElementById(
"imageTool"
);


imageBtn.classList.remove(
"active"
);


imageBtn.textContent =
"🎨 Create Image";


promptInput.placeholder =
"Message Aaru AI...";


closeSidebar();

}


/* =====================================================
ADD USER MESSAGE
===================================================== */

function addUserMessage(
text,
shouldScroll = true
){

const row =
document.createElement("div");

row.className =
"message user";


const bubble =
document.createElement("div");

bubble.className =
"bubble";

bubble.textContent =
text;


row.appendChild(
bubble
);

chat.appendChild(
row
);


if(shouldScroll){
scrollBottom();
}

}


/* =====================================================
ADD AI MESSAGE
===================================================== */

function addAIMessage(
text,
shouldScroll = true
){

const row =
document.createElement("div");

row.className =
"message ai";


const avatar =
document.createElement("div");

avatar.className =
"avatar";

avatar.textContent =
"AI";


const bubble =
document.createElement("div");

bubble.className =
"bubble";

bubble.textContent =
text;


row.appendChild(
avatar
);

row.appendChild(
bubble
);

chat.appendChild(
row
);


if(shouldScroll){
scrollBottom();
}


return bubble;

}


/* =====================================================
TYPING INDICATOR
===================================================== */

function showTyping(){

const row =
document.createElement("div");

row.className =
"message ai";

row.id =
"typingMessage";


const avatar =
document.createElement("div");

avatar.className =
"avatar";

avatar.textContent =
"AI";


const bubble =
document.createElement("div");

bubble.className =
"bubble";


bubble.innerHTML = `

<div class="typing">

<span></span>
<span></span>
<span></span>

</div>

`;


row.appendChild(
avatar
);

row.appendChild(
bubble
);

chat.appendChild(
row
);


scrollBottom();

}


function removeTyping(){

const element =
document.getElementById(
"typingMessage"
);


if(element){
element.remove();
}

}


/* =====================================================
IMAGE INTENT DETECTION
===================================================== */

function isImageRequest(text){

if(!text){
return false;
}


const value =
text
.toLowerCase()
.trim();


const imagePatterns = [

/चित्र\s*(बनाओ|बना|बनाना|तैयार करो|तैयार करें)/i,

/तस्वीर\s*(बनाओ|बना|बनाना|तैयार करो|तैयार करें)/i,

/फोटो\s*(बनाओ|बना|बनाना|तैयार करो|तैयार करें)/i,

/इमेज\s*(बनाओ|बना|बनाना|तैयार करो|तैयार करें)/i,

/चित्र\s*generate/i,

/तस्वीर\s*generate/i,

/इमेज\s*generate/i,

/फोटो\s*generate/i,

/image\s*(बनाओ|बना|generate|create|make|draw)/i,

/picture\s*(बनाओ|बना|generate|create|make|draw)/i,

/photo\s*(बनाओ|बना|generate|create|make|draw)/i,

/generate\s+(an?\s+)?image/i,

/generate\s+(an?\s+)?picture/i,

/generate\s+(a\s+)?photo/i,

/create\s+(an?\s+)?image/i,

/create\s+(an?\s+)?picture/i,

/create\s+(a\s+)?photo/i,

/make\s+(an?\s+)?image/i,

/make\s+(an?\s+)?picture/i,

/make\s+(a\s+)?photo/i,

/draw\s+(an?\s+)?image/i,

/draw\s+(a\s+)?picture/i,

/draw\s+(a\s+)?scene/i,

/generate\s+image/i,

/create\s+image/i,

/make\s+image/i,

/image\s+generation/i,

/image\s+generate\s+करो/i,

/इमेज\s+जनरेट\s+करो/i,

/इमेज\s+जनरेट\s+करें/i,

/तस्वीर\s+जनरेट\s+करो/i,

/चित्र\s+जनरेट\s+करो/i

];


return imagePatterns.some(
pattern =>
pattern.test(value)
);

}


/* =====================================================
SEND MESSAGE
===================================================== */

async function sendMessage(){

const text =
promptInput.value.trim();


if(
!text &&
!selectedImageBase64
){

return;

}


sendBtn.disabled =
true;


const welcome =
document.getElementById(
"welcome"
);


if(welcome){
welcome.remove();
}


/* =====================================================
SHOW USER MESSAGE
===================================================== */

if(text){

addUserMessage(text);

}


/* =====================================================
MEMORY
===================================================== */

if(text){

detectMemory(text);

}


/* =====================================================
IMAGE REQUEST
===================================================== */

const imageRequested =
isImageRequest(text);


/*
If:

1. Image Mode is ON
OR
2. Photo is uploaded
OR
3. User explicitly asks to create an image

then go directly to image generation.

This prevents GLM from returning:
{{image_generation_placeholder}}
*/


if(
imageMode ||
selectedImageBase64 ||
imageRequested
){

await generateImage(
text ||
"Create a high quality image from the uploaded photo."
);


sendBtn.disabled =
false;

return;

}


/* =====================================================
NORMAL CHAT
===================================================== */

messages.push({

role:"user",

content:text

});


/*
Keep last 20 messages.
*/

if(messages.length > 20){

messages =
messages.slice(-20);

}


showTyping();


try{

const response =
await fetch(
API_URL + "chat",
{

method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:JSON.stringify({

messages:
buildMessages()

})

}
);


let data = {};


try{

data =
await response.json();

}catch(error){

data = {};

}


removeTyping();


if(!response.ok){

throw new Error(
data.error ||
"Chat request failed."
);

}


const reply =
data.reply ||
"मुझे कोई response नहीं मिला।";


messages.push({

role:"assistant",

content:reply

});


addAIMessage(
reply
);


/* SAVE CHAT */

saveCurrentChat();


}catch(error){

removeTyping();


addAIMessage(
"❌ " +
(
error.message ||
"Aaru AI से response नहीं मिला।"
)
);

}


finally{

sendBtn.disabled =
false;

promptInput.value = "";

promptInput.style.height =
"auto";

}

}


/* =====================================================
GENERATE IMAGE
===================================================== */

async function generateImage(
text
){

if(!text){

text =
"Create a beautiful high quality image.";

}


showTyping();


try{

let response;


/* =====================================================
PHOTO TO IMAGE
===================================================== */

if(selectedImageBase64){

response =
await fetch(
API_URL,
{

method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:JSON.stringify({

prompt:text,

ratio:"1:1",

quality:"hd",

image_b64:
cleanBase64(
selectedImageBase64
),

strength:0.65

})

}
);

}


/* =====================================================
TEXT TO IMAGE
===================================================== */

else{

const params =
new URLSearchParams({

prompt:text,

ratio:"1:1",

quality:"hd"

});


response =
await fetch(
API_URL +
"?" +
params.toString()
);

}


/* =====================================================
CHECK RESPONSE
===================================================== */

if(!response.ok){

let errorData = {};


try{

errorData =
await response.json();

}catch(error){}


throw new Error(
errorData.error ||
"Image generation failed."
);

}


const blob =
await response.blob();


if(
!blob.type.includes("image")
){

throw new Error(
"Server ने valid image नहीं भेजी।"
);

}


/* =====================================================
IMAGE URL
===================================================== */

const imageUrl =
URL.createObjectURL(
blob
);


removeTyping();


/* =====================================================
IMAGE MESSAGE
===================================================== */

const row =
document.createElement("div");

row.className =
"message ai";


const avatar =
document.createElement("div");

avatar.className =
"avatar";

avatar.textContent =
"AI";


const bubble =
document.createElement("div");

bubble.className =
"bubble";


const title =
document.createElement("div");

title.textContent =
"✨ आपकी image तैयार है।";


const image =
document.createElement("img");

image.className =
"generated-image";

image.src =
imageUrl;

image.alt =
"Generated by Aaru AI";


/* =====================================================
DOWNLOAD BUTTON
===================================================== */

const actions =
document.createElement("div");

actions.className =
"image-actions";


const download =
document.createElement("a");

download.href =
imageUrl;

download.download =
"aaru-ai-" +
Date.now() +
".png";

download.textContent =
"⬇️ Download";


actions.appendChild(
download
);


bubble.appendChild(
title
);

bubble.appendChild(
image
);

bubble.appendChild(
actions
);


row.appendChild(
avatar
);

row.appendChild(
bubble
);

chat.appendChild(
row
);


scrollBottom();


/* =====================================================
SAVE IMAGE IN LOCAL HISTORY
===================================================== */

try{

const reader =
new FileReader();


reader.onloadend =
function(){

saveImageToHistory(
reader.result
);

};


reader.readAsDataURL(
blob
);

}catch(error){

console.log(
"Image history failed",
error
);

}


}catch(error){

removeTyping();


addAIMessage(
"❌ " +
(
error.message ||
"Image generation failed."
)
);

}


finally{

removeImage();


imageMode =
false;


const imageBtn =
document.getElementById(
"imageTool"
);


imageBtn.classList.remove(
"active"
);

imageBtn.textContent =
"🎨 Create Image";


promptInput.placeholder =
"Message Aaru AI...";


promptInput.value = "";

promptInput.style.height =
"auto";

}

}


/* =====================================================
IMAGE UPLOAD
===================================================== */

fileInput.addEventListener(
"change",
function(event){

const file =
event.target.files[0];


if(!file){
return;
}


if(
!file.type.startsWith("image/")
){

alert(
"कृपया image file चुनें।"
);

return;

}


const reader =
new FileReader();


reader.onload =
function(event){

selectedImageBase64 =
event.target.result;


document
.getElementById(
"previewImage"
)
.src =
selectedImageBase64;


document
.getElementById(
"preview"
)
.style.display =
"block";

};


reader.readAsDataURL(
file
);

}
);


/* =====================================================
REMOVE IMAGE
===================================================== */

function removeImage(){

selectedImageBase64 = "";

fileInput.value = "";


document
.getElementById(
"preview"
)
.style.display =
"none";

}


/* =====================================================
IMAGE MODE
===================================================== */

function toggleImageMode(){

imageMode =
!imageMode;


const button =
document.getElementById(
"imageTool"
);


if(imageMode){

button.classList.add(
"active"
);

button.textContent =
"🎨 Image Mode ON";


promptInput.placeholder =
"Describe the image you want...";

}else{

button.classList.remove(
"active"
);

button.textContent =
"🎨 Create Image";


promptInput.placeholder =
"Message Aaru AI...";

}

}


/* =====================================================
CLEAN BASE64
===================================================== */

function cleanBase64(
dataUrl
){

if(!dataUrl){
return "";
}


if(
dataUrl.includes(",")
){

return dataUrl.split(",")[1];

}


return dataUrl;

}


/* =====================================================
IMAGE HISTORY
===================================================== */

function saveImageToHistory(
imageData
){

try{

let history =
JSON.parse(
localStorage.getItem(
"aaru_image_history"
) || "[]"
);


history.unshift(
imageData
);


history =
history.slice(0,10);


localStorage.setItem(
"aaru_image_history",
JSON.stringify(history)
);

}catch(error){

console.log(
"Image history save failed",
error
);

}

}


/* =====================================================
MEMORY UI
===================================================== */

function openMemory(){

renderMemory();


document
.getElementById(
"memoryModal"
)
.style.display =
"flex";

}


function closeMemory(){

document
.getElementById(
"memoryModal"
)
.style.display =
"none";

}


function renderMemory(){

const container =
document.getElementById(
"memoryList"
);


const memory =
getMemory();


container.innerHTML = "";


if(!memory.length){

container.innerHTML =
'<div style="color:#555;font-size:12px;padding:8px">No saved memories.</div>';

return;

}


memory.forEach(
item => {

const row =
document.createElement("div");

row.className =
"memory-row";


const text =
document.createElement("span");

text.textContent =
item.text;


const button =
document.createElement("button");

button.textContent =
"×";

button.type =
"button";


button.onclick =
function(){

deleteMemory(
item.id
);

};


row.appendChild(
text
);

row.appendChild(
button
);

container.appendChild(
row
);

}
);

}


function deleteMemory(id){

let memory =
getMemory();


memory =
memory.filter(
item =>
item.id !== id
);


saveMemory(memory);

renderMemory();

}


function clearMemory(){

const confirmed =
confirm(
"क्या आप सभी saved memories हटाना चाहते हैं?"
);


if(!confirmed){
return;
}


localStorage.removeItem(
"aaru_memory"
);


renderMemory();

}


/* =====================================================
SIDEBAR
===================================================== */

function toggleSidebar(){

document
.getElementById(
"sidebar"
)
.classList.toggle(
"open"
);

}


function closeSidebar(){

document
.getElementById(
"sidebar"
)
.classList.remove(
"open"
);

}


/* =====================================================
SCROLL
===================================================== */

function scrollBottom(){

setTimeout(
function(){

chat.scrollTo({

top:
chat.scrollHeight,

behavior:
"smooth"

});

},
50
);

}


/* =====================================================
INITIAL LOAD
===================================================== */

renderHistory();

</script>
