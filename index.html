<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Aaru AI</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs" type="module"></script>
<style>
:root{--bg:#f7f8fb;--card:#fff;--text:#171923;--muted:#737887;--line:#e5e7ee;--accent:#246bfd;--user:#eaf1ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,sans-serif}
.app{min-height:100vh;max-width:900px;margin:auto;background:var(--bg)}
header{height:58px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 12px;position:sticky;top:0;z-index:20}
.brand{font-weight:800;font-size:18px}.brand small{display:block;font-size:10px;color:var(--muted);font-weight:500}
button{border:0;background:none;cursor:pointer;color:inherit}.topbtn{width:40px;height:40px;border-radius:12px;font-size:20px}.topbtn:hover{background:#f0f2f7}
main{padding:16px 12px 150px}.messages{display:flex;flex-direction:column;gap:12px}
.msg{display:flex}.msg.user{justify-content:flex-end}.bubble{max-width:min(84%,700px);padding:11px 13px;border-radius:16px;white-space:pre-wrap;line-height:1.5;font-size:15px}.assistant .bubble{background:#fff;border:1px solid var(--line)}.user .bubble{background:var(--user)}
.msg img{max-width:100%;border-radius:12px;display:block;margin-top:8px}
.typing{color:var(--muted);font-size:13px;padding:8px}
.composer-wrap{position:fixed;bottom:0;left:0;right:0;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 18%);z-index:15}
.composer{max-width:876px;margin:auto;background:#fff;border:1px solid var(--line);border-radius:20px;padding:8px;box-shadow:0 8px 30px #00000012}
.preview{display:none;position:relative;margin:2px 2px 8px}.preview.show{display:block}.preview img{width:74px;height:74px;object-fit:cover;border-radius:12px}.remove{position:absolute;top:-5px;left:65px;background:#222;color:#fff;border-radius:50%;width:22px;height:22px}
.row{display:flex;align-items:flex-end;gap:6px}.row textarea{flex:1;border:0;outline:0;resize:none;min-height:42px;max-height:140px;font:inherit;padding:10px;background:transparent}.ico{width:42px;height:42px;border-radius:13px;font-size:20px}.ico:hover{background:#f1f3f8}.send{background:var(--accent);color:#fff}.send:disabled{opacity:.45}
.panel{position:fixed;inset:0;background:#0005;z-index:50;display:none}.panel.open{display:block}.drawer{position:absolute;left:0;top:0;bottom:0;width:min(350px,88vw);background:#fff;padding:16px;overflow:auto}.drawer h3{margin:6px 0 14px}.drawer button.action{width:100%;padding:12px;border-radius:12px;background:#f2f4f8;text-align:left;margin-bottom:8px}.list{display:flex;flex-direction:column;gap:7px}.item{padding:10px;border:1px solid var(--line);border-radius:12px;cursor:pointer}.item small{display:block;color:var(--muted);margin-top:3px}.section{margin-top:18px;color:var(--muted);font-size:12px;font-weight:700}
#file{display:none}.status{font-size:11px;color:var(--muted);padding:2px 8px;min-height:16px}.creation{width:100%;border-radius:12px;margin-top:8px}
.empty{height:65vh;display:flex;align-items:center;justify-content:center;color:var(--muted);text-align:center;padding:30px}
</style>
</head>
<body>
<div class="app">
<header>
<button class="topbtn" id="menu">☰</button>
<div class="brand">Aaru AI<small>Fast • Smart • Multilingual</small></div>
<button class="topbtn" id="new">＋</button>
</header>
<main>
<div id="messages" class="messages"><div class="empty">नमस्ते! मैं Aaru AI हूँ।<br>आप लिखकर, बोलकर, फोटो या PDF के साथ बात कर सकते हैं।</div></div>
</main>

<div class="composer-wrap">
<div class="composer">
<div id="preview" class="preview"><img id="previewImg"><button class="remove" id="remove">×</button></div>
<div class="status" id="status"></div>
<div class="row">
<button class="ico" id="attach" title="फोटो/PDF">📎</button>
<button class="ico" id="mic" title="बोलें">🎙️</button>
<textarea id="prompt" rows="1" placeholder="Aaru से कुछ भी पूछें..."></textarea>
<button class="ico" id="speak" title="आवाज़ चालू/बंद">🔊</button>
<button class="ico send" id="send">➤</button>
</div>
</div>
</div>

<input id="file" type="file" accept="image/*,.pdf,application/pdf">

<div class="panel" id="panel"><aside class="drawer">
<button class="action" id="close">✕ बंद करें</button>
<button class="action" id="drawerNew">＋ नई चैट</button>
<button class="action" id="clear">🗑️ सभी चैट हटाएँ</button>
<div class="section">Recent Chats</div><div id="chatList" class="list"></div>
<div class="section">Recent Creations</div><div id="creationList" class="list"></div>
</aside></div>
</div>

<script type="module">
const API="https://aaru-ai-api.myera-org.workers.dev/";
const CHAT_KEY="aaru_v3_chats";
const CREATION_KEY="aaru_v3_creations";
const MAX_CHATS=12, MAX_MSG=40, MAX_CONTEXT=20;

const $=id=>document.getElementById(id);
const messagesEl=$("messages"), promptEl=$("prompt"), statusEl=$("status");
let chats=[], currentId=null, messages=[];
let attachedImage=null, attachedText="";
let speaking=true, busy=false, recognition=null;

function id(){return "c_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,8)}
function load(){
  try{chats=JSON.parse(localStorage.getItem(CHAT_KEY)||"[]")}catch{chats=[]}
  if(!chats.length) newChat(false); else {currentId=chats[0].id;messages=chats[0].messages||[]}
  render(); renderLists();
}
function save(){
  const i=chats.findIndex(c=>c.id===currentId);
  const item={id:currentId,title:messages.find(x=>x.role==="user")?.content?.slice(0,42)||"नई चैट",updatedAt:Date.now(),messages:messages.slice(-MAX_MSG)};
  if(i>=0)chats[i]=item;else chats.unshift(item);
  chats.sort((a,b)=>b.updatedAt-a.updatedAt);chats=chats.slice(0,MAX_CHATS);
  localStorage.setItem(CHAT_KEY,JSON.stringify(chats));renderLists();
}
function newChat(persist=true){
  currentId=id();messages=[];attachedImage=null;attachedText="";clearAttachment();render();if(persist)save();
}
function render(){
  messagesEl.innerHTML="";
  if(!messages.length){messagesEl.innerHTML='<div class="empty">नमस्ते! मैं Aaru AI हूँ।<br>आप लिखकर, बोलकर, फोटो या PDF के साथ बात कर सकते हैं।</div>';return}
  for(const m of messages){
    const wrap=document.createElement("div");wrap.className="msg "+m.role;
    const b=document.createElement("div");b.className="bubble";b.textContent=m.content||"";
    if(m.image){const img=document.createElement("img");img.src=m.image;b.appendChild(img)}
    wrap.appendChild(b);messagesEl.appendChild(wrap);
  }
  window.scrollTo({top:document.body.scrollHeight,behavior:"smooth"});
}
function add(role,content,image=null){messages.push({role,content:String(content||""),image});render();save()}
function setStatus(s){statusEl.textContent=s||""}
function escapeSize(data,max=511){
  return new Promise(resolve=>{
    const img=new Image();img.onload=()=>{
      const scale=Math.min(1,max/Math.max(img.width,img.height));
      const c=document.createElement("canvas");c.width=Math.max(1,Math.round(img.width*scale));c.height=Math.max(1,Math.round(img.height*scale));
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);resolve(c.toDataURL("image/jpeg",.78));
    };img.onerror=()=>resolve(data);img.src=data;
  })
}
function clearAttachment(){ $("preview").classList.remove("show");$("previewImg").src="";attachedImage=null;attachedText="";$("file").value=""}
async function imageData(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)})}

async function pdfText(file){
  setStatus("PDF पढ़ा जा रहा है…");
  const pdfjs=await import("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs");
  pdfjs.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs";
  const data=new Uint8Array(await file.arrayBuffer()),pdf=await pdfjs.getDocument({data}).promise;
  let out="";
  for(let p=1;p<=pdf.numPages;p++){
    const page=await pdf.getPage(p),content=await page.getTextContent();
    out+=`\n\n--- Page ${p} ---\n`+content.items.map(x=>x.str).join(" ");
    if(out.length>90000)break;
  }
  return out.trim();
}
async function attachFile(file){
  try{
    if(file.type==="application/pdf"||file.name.toLowerCase().endsWith(".pdf")){
      attachedText=await pdfText(file);attachedImage=null;setStatus(`PDF तैयार: ${attachedText.length.toLocaleString()} अक्षर`);
      return;
    }
    if(file.type.startsWith("image/")){
      const raw=await imageData(file);attachedImage=await escapeSize(raw);attachedText="";
      $("previewImg").src=attachedImage;$("preview").classList.add("show");setStatus("तस्वीर तैयार है — अब पूछें क्या जानना है।");
    }
  }catch(e){setStatus("फ़ाइल पढ़ने में समस्या: "+e.message)}
}
async function send(){
  if(busy)return;
  const text=promptEl.value.trim();
  if(!text && !attachedImage && !attachedText)return;
  busy=true;$("send").disabled=true;
  const display=text || (attachedText?"इस PDF को पढ़कर बताइए।":"इस तस्वीर को समझाइए।");
  const contextText=attachedText?`\n\n[PDF TEXT]\n${attachedText.slice(0,90000)}`:"";
  const userContent=display+contextText;
  add("user",display,attachedImage);
  promptEl.value="";setStatus("सोच रहा हूँ…");
  try{
    const payload={
      message:display,
      messages:messages.filter(m=>!m.image).slice(-MAX_CONTEXT).map(m=>({role:m.role,content:m.content})),
      image_b64:attachedImage||undefined
    };
    if(attachedText)payload.document_text=attachedText.slice(0,90000);
    const r=await fetch(API+"chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});
    const ct=r.headers.get("content-type")||"";
    if(ct.includes("image/")){
      const blob=await r.blob(),url=URL.createObjectURL(blob);
      add("assistant","इमेज तैयार है।",url);storeCreation(url,display);
    }else{
      const d=await r.json();
      if(!r.ok||d.ok===false)throw new Error(d.error||"Server error");
      add("assistant",d.response||d.reply||"जवाब नहीं मिला।");
      if(speaking) speak(d.response||d.reply||"");
    }
  }catch(e){add("assistant","माफ़ कीजिए, अभी समस्या हुई: "+e.message)}
  finally{clearAttachment();setStatus("");busy=false;$("send").disabled=false;promptEl.focus()}
}
function speak(text){
  if(!("speechSynthesis"in window)||!text)return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang=/[\u0900-\u097F]/.test(text)?"hi-IN":"en-US";u.rate=.98;speechSynthesis.speak(u);
}
function startVoice(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){setStatus("इस ब्राउज़र में voice input उपलब्ध नहीं है।");return}
  if(recognition){recognition.stop();recognition=null;return}
  recognition=new SR();recognition.lang="hi-IN";recognition.interimResults=false;recognition.continuous=false;
  recognition.onstart=()=>setStatus("सुन रहा हूँ…");
  recognition.onresult=e=>{promptEl.value=e.results[0][0].transcript;setStatus("आवाज़ text में बदल दी गई।");promptEl.focus()};
  recognition.onerror=e=>setStatus("Voice error: "+e.error);
  recognition.onend=()=>{recognition=null};
  recognition.start();
}
function storeCreation(url,prompt){
  try{
    const arr=JSON.parse(localStorage.getItem(CREATION_KEY)||"[]");
    arr.unshift({url,prompt,at:Date.now()});
    localStorage.setItem(CREATION_KEY,JSON.stringify(arr.slice(0,6)));
  }catch{}
  renderLists();
}
function renderLists(){
  $("chatList").innerHTML="";
  for(const c of chats){
    const d=document.createElement("div");d.className="item";d.textContent=c.title||"नई चैट";
    d.onclick=()=>{currentId=c.id;messages=c.messages||[];render();$("panel").classList.remove("open")};$("chatList").appendChild(d);
  }
  $("creationList").innerHTML="";
  try{
    const arr=JSON.parse(localStorage.getItem(CREATION_KEY)||"[]");
    for(const x of arr){
      const d=document.createElement("div");d.className="item";d.textContent=x.prompt.slice(0,55);
      d.onclick=()=>window.open(x.url,"_blank");$("creationList").appendChild(d);
    }
  }catch{}
}

$("send").onclick=send;$("new").onclick=()=>newChat(true);$("drawerNew").onclick=()=>{newChat(true);$("panel").classList.remove("open")};
$("menu").onclick=()=>$("panel").classList.add("open");$("close").onclick=()=>$("panel").classList.remove("open");
$("panel").onclick=e=>{if(e.target===$("panel"))$("panel").classList.remove("open")};
$("clear").onclick=()=>{if(confirm("सभी चैट हटाएँ?")){chats=[];localStorage.removeItem(CHAT_KEY);newChat(false);renderLists()}};
$("attach").onclick=()=>$("file").click();$("file").onchange=e=>e.target.files[0]&&attachFile(e.target.files[0]);
$("remove").onclick=clearAttachment;$("mic").onclick=startVoice;$("speak").onclick=()=>{speaking=!speaking;$("speak").textContent=speaking?"🔊":"🔇";if(!speaking)speechSynthesis?.cancel()};
promptEl.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send()}});
promptEl.addEventListener("input",()=>{promptEl.style.height="auto";promptEl.style.height=Math.min(promptEl.scrollHeight,140)+"px"});

load();
</script>
</body>
</html>
