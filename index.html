<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Aaru AI</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;width:100%;min-height:100dvh;font-family:Arial,Helvetica,sans-serif;background:#0f1117;color:#fff;overflow-x:clip;}
button,input,textarea{font:inherit;}
button{-webkit-user-select:none;user-select:none;}
main{position:relative;flex:1 0 auto;min-height:calc(100dvh - 58px);overflow:visible;scroll-behavior:smooth;}
.app{min-height:100dvh;display:flex;flex-direction:column;}
.header{position:sticky;top:0;z-index:100;height:58px;display:flex;align-items:center;gap:10px;padding:0 12px;background:rgba(15,17,23,.96);border-bottom:1px solid rgba(255,255,255,.07);backdrop-filter:blur(14px);}
.menu-btn,.new-chat-top{width:40px;height:40px;border:0;border-radius:12px;background:rgba(255,255,255,.07);color:#fff;font-size:21px;cursor:pointer;}
.brand{min-width:0;flex:1;}
.brand-name{font-size:18px;font-weight:800;}
.brand-sub{margin-top:1px;font-size:10px;opacity:.45;}
.drawer-overlay{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.58);opacity:0;pointer-events:none;transition:.2s;}
.drawer-overlay.open{opacity:1;pointer-events:auto;}
.drawer{position:fixed;z-index:210;top:0;left:0;bottom:0;width:min(88vw,340px);background:#151821;border-right:1px solid rgba(255,255,255,.07);transform:translateX(-105%);transition:.22s ease;display:flex;flex-direction:column;overflow:hidden;}
.drawer.open{transform:translateX(0);}
.drawer-head{height:58px;flex:none;display:flex;align-items:center;gap:10px;padding:0 12px;border-bottom:1px solid rgba(255,255,255,.07);}
.drawer-title{flex:1;font-size:17px;font-weight:800;}
.close-drawer{width:38px;height:38px;border:0;border-radius:11px;background:rgba(255,255,255,.07);color:#fff;font-size:21px;}
.drawer-body{flex:1;overflow-y:auto;padding:12px;}
.drawer-action{width:100%;display:flex;align-items:center;gap:10px;border:0;color:#fff;background:rgba(255,255,255,.055);border-radius:12px;padding:12px;margin-bottom:8px;text-align:left;cursor:pointer;}
.drawer-action:hover{background:rgba(255,255,255,.09);}
.section-title{margin:18px 4px 9px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;opacity:.4;}
.chat-history{display:flex;flex-direction:column;gap:4px;}
.chat-history-item{display:flex;align-items:center;gap:7px;padding:10px;border-radius:11px;cursor:pointer;transition:.15s;}
.chat-history-item:hover{background:rgba(255,255,255,.055);}
.chat-history-item.active{background:rgba(255,255,255,.085);}
.chat-history-info{min-width:0;flex:1;}
.chat-history-title{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.chat-history-meta{margin-top:3px;font-size:10px;opacity:.4;}
.delete-chat{width:30px;height:30px;flex:none;border:0;border-radius:8px;background:transparent;color:#fff;opacity:.48;font-size:16px;cursor:pointer;}
.delete-chat:hover{opacity:1;background:rgba(255,70,70,.13);}
.empty-history{padding:15px 10px;font-size:12px;opacity:.4;line-height:1.5;}
.chat-wrap{width:100%;max-width:900px;margin:0 auto;padding:18px 12px 155px;}
.messages{display:flex;flex-direction:column;gap:14px;}
.message{width:100%;display:flex;flex-direction:column;}
.message.user{align-items:flex-end;}
.message.assistant{align-items:flex-start;}
.bubble{max-width:min(85%,720px);padding:11px 14px;border-radius:17px;font-size:15px;line-height:1.55;word-break:break-word;user-select:text;}
.message.user .bubble{background:#245eea;border-bottom-right-radius:5px;}
.message.assistant .bubble{background:#191d27;border:1px solid rgba(255,255,255,.055);border-bottom-left-radius:5px;}
.msg-actions{display:flex;gap:8px;margin-top:4px;font-size:12px;}
.msg-action-btn{background:rgba(255,255,255,0.08);border:none;color:#fff;padding:2px 8px;border-radius:6px;cursor:pointer;}
.msg-action-btn:hover{background:rgba(255,255,255,0.15);}
.md h1,.md h2,.md h3{margin:14px 0 8px;line-height:1.25;}
.md p{margin:0 0 9px;}
.md ul,.md ol{margin:7px 0 10px;padding-left:22px;}
.attached-user-image,.generated-image{display:block;width:100%;max-width:320px;border-radius:12px;margin-bottom:7px;cursor:pointer;border:1px solid rgba(255,255,255,.08);}
.typing{display:flex;align-items:center;gap:5px;padding:5px 2px;}
.typing span{width:6px;height:6px;border-radius:50%;background:#fff;opacity:.35;animation:typing 1s infinite;}
.typing span:nth-child(2){animation-delay:.15s}
.typing span:nth-child(3){animation-delay:.3s}
@keyframes typing{0%,70%,100%{transform:translateY(0);opacity:.25;}35%{transform:translateY(-4px);opacity:.8;}}
.composer-shell{position:fixed;left:0;right:0;bottom:0;z-index:120;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:linear-gradient(to bottom, rgba(15,17,23,0), rgba(15,17,23,.94) 22%, #0f1117 48%);}
.composer{width:100%;max-width:900px;margin:0 auto;border:1px solid rgba(255,255,255,.1);background:#171a23;border-radius:18px;padding:8px;box-shadow:0 8px 35px rgba(0,0,0,.25);}
.file-preview{display:none;position:relative;padding:6px 10px;margin:3px 3px 8px;background:rgba(255,255,255,0.05);border-radius:10px;font-size:12px;align-items:center;gap:8px;}
.file-preview.show{display:flex;}
.file-preview img{width:40px;height:40px;object-fit:cover;border-radius:6px;}
.remove-file{margin-left:auto;background:#ef4444;color:#fff;border:none;width:20px;height:20px;border-radius:50%;cursor:pointer;}
.input-row{display:flex;align-items:flex-end;gap:7px;}
#prompt{flex:1;min-width:0;min-height:42px;max-height:150px;resize:none;border:0;outline:0;color:#fff;background:transparent;padding:10px 8px;}
.icon-btn{width:40px;height:40px;flex:none;border:0;border-radius:12px;background:rgba(255,255,255,.065);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.send-btn{background:#2864e8;}
#fileInput{display:none;}
.creation-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;}
.creation-card{position:relative;overflow:hidden;border-radius:11px;background:#0e1117;border:1px solid rgba(255,255,255,.06);}
.creation-card img{display:block;width:100%;aspect-ratio:1/1;object-fit:cover;}
.creation-prompt{padding:7px;font-size:10px;opacity:.6;}
.image-viewer{position:fixed;inset:0;z-index:500;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(0,0,0,.9);}
.image-viewer.open{display:flex;}
.image-viewer img{max-width:100%;max-height:90dvh;object-fit:contain;border-radius:10px;}
.close-viewer{position:absolute;top:14px;right:14px;width:40px;height:40px;border:0;border-radius:12px;background:rgba(255,255,255,.12);color:#fff;font-size:23px;}
.toast{position:fixed;left:50%;bottom:92px;z-index:700;transform:translate(-50%,20px);max-width:90vw;padding:10px 14px;border-radius:11px;background:#252a36;color:#fff;font-size:12px;opacity:0;pointer-events:none;transition:.2s;}
.toast.show{opacity:1;transform:translate(-50%,0);}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
</script>
</head>
<body>
<div class="app">
<header class="header">
<button class="menu-btn" id="menuBtn">☰</button>
<div class="brand">
<div class="brand-name">Aaru AI</div>
<div class="brand-sub">Fast • Smart • Indian AI</div>
</div>
<button class="new-chat-top" id="newChatTop">＋</button>
</header>
<div class="drawer-overlay" id="drawerOverlay"></div>
<aside class="drawer" id="drawer">
<div class="drawer-head">
<div class="drawer-title">Aaru AI</div>
<button class="close-drawer" id="closeDrawer">×</button>
</div>
<div class="drawer-body">
<button class="drawer-action" id="newChatBtn"><span>＋</span><span>नई चैट</span></button>
<button class="drawer-action" id="deleteAllBtn"><span>🗑️</span><span>सभी चैट डिलीट करें</span></button>
<div class="section-title">Recent Chats</div>
<div class="chat-history" id="chatHistory"></div>
<div class="section-title">Recent Creations</div>
<div class="creation-grid" id="creationGrid"></div>
</div>
</aside>
<main>
<div class="chat-wrap"><div class="messages" id="messages"></div></div>
</main>
<div class="composer-shell">
<div class="composer">
<div class="file-preview" id="filePreview">
<img id="filePreviewImg" alt="" style="display:none;">
<span id="filePreviewText"></span>
<button class="remove-file" id="removeFile">×</button>
</div>
<div class="input-row">
<button class="icon-btn" id="fileBtn">📎</button>
<button class="icon-btn" id="micBtn">🎤</button>
<textarea id="prompt" rows="1" placeholder="Aaru से कुछ भी पूछें..." autocomplete="off"></textarea>
<button class="icon-btn send-btn" id="sendBtn">➤</button>
</div>
</div>
</div>
</div>
<input type="file" id="fileInput" accept="image/*,.pdf">
<div class="image-viewer" id="imageViewer"><button class="close-viewer" id="closeViewer">×</button><img id="viewerImg" alt=""></div>
<div class="toast" id="toast"></div>

<script>
"use strict";
const API = "https://aaru-ai-api.myera-org.workers.dev/";
const CHAT_LIST_KEY = "aaru_chat_history_v3";
const IMAGE_KEY = "aaru_history_v3";
const MAX_SAVED_CHATS = 8;
const MAX_MESSAGES_PER_CHAT = 30;
const MAX_MESSAGE_CHARS = 4000;
const MAX_SAVED_CREATIONS = 4;
const MAX_MODEL_IMAGE_SIZE = 511;

let chats = [];
let currentChatId = null;
let messages = [];
let selectedFileContent = null;
let selectedFileType = null;
let selectedFileUrl = null;
let isBusy = false;
let volatileCreations = [];

const messagesEl = document.getElementById("messages");
const promptEl = document.getElementById("prompt");
const sendBtn = document.getElementById("sendBtn");
const fileInput = document.getElementById("fileInput");
const filePreview = document.getElementById("filePreview");
const filePreviewImg = document.getElementById("filePreviewImg");
const filePreviewText = document.getElementById("filePreviewText");
const chatHistoryEl = document.getElementById("chatHistory");
const creationGrid = document.getElementById("creationGrid");
const drawer = document.getElementById("drawer");
const drawerOverlay = document.getElementById("drawerOverlay");
const imageViewer = document.getElementById("imageViewer");
const viewerImg = document.getElementById("viewerImg");
const toastEl = document.getElementById("toast");
const micBtn = document.getElementById("micBtn");

function makeChatId(){ return "chat_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2,9); }
function makeImageId(){ return "img_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2,10); }

function showToast(text){
  toastEl.textContent = String(text || "");
  toastEl.classList.add("show");
  clearTimeout(showToast.timer);
  showToast.timer = setTimeout(() => { toastEl.classList.remove("show"); }, 2200);
}

function escapeHTML(value){
  return String(value ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
}

let recognition = null;
if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition = new SpeechRecognition();
  recognition.lang = 'hi-IN';
  recognition.onresult = (event) => {
    promptEl.value += (promptEl.value ? " " : "") + event.results[0][0].transcript;
    autoResize();
  };
}
micBtn.addEventListener("click", () => {
  if (!recognition) return showToast("वॉयस सपोर्ट नहीं है।");
  try { recognition.start(); } catch(e) { recognition.stop(); }
});

function speakText(text) {
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = 'hi-IN';
  window.speechSynthesis.speak(utterance);
}

function renderMarkdown(text){
  const source = String(text ?? "").replace(/\r\n/g,"\n");
  const lines = source.split("\n");
  let html = "";
  lines.forEach(line => {
    if(line.trim()) html += "<p>" + escapeHTML(line) + "</p>";
  });
  return html || escapeHTML(source);
}

function storageAvailable(){
  try{ const storage = window.localStorage; const key = "__aaru_test__"; storage.setItem(key, "1"); storage.removeItem(key); return true; }catch(e){ return false; }
}
const HAS_STORAGE = storageAvailable();
function safeGet(key){ return HAS_STORAGE ? localStorage.getItem(key) : null; }
function safeSet(key,value){ if(HAS_STORAGE) try{ localStorage.setItem(key, value); }catch(e){} }
function safeRemove(key){ if(HAS_STORAGE) localStorage.removeItem(key); }

function loadChatHistory(){
  chats = [];
  const raw = safeGet(CHAT_LIST_KEY);
  if(raw){
    try{
      const parsed = JSON.parse(raw);
      if(Array.isArray(parsed)) chats = parsed.slice(0, MAX_SAVED_CHATS);
    }catch(e){ safeRemove(CHAT_LIST_KEY); }
  }
}

function saveChatHistory(){
  if(!HAS_STORAGE) return;
  safeSet(CHAT_LIST_KEY, JSON.stringify(chats.slice(0, MAX_SAVED_CHATS)));
}

function createNewChat(persist = true){
  const chat = { id: makeChatId(), title: "नई चैट", messages: [], createdAt: Date.now(), updatedAt: Date.now() };
  chats.unshift(chat);
  currentChatId = chat.id;
  messages = [];
  if(persist) saveChatHistory();
  return chat;
}

function ensureCurrentChat(){
  if(currentChatId){
    const existing = chats.find(chat => chat.id === currentChatId);
    if(existing) return existing;
  }
  return createNewChat(true);
}

function saveCurrentChat(){
  const chat = ensureCurrentChat();
  chat.messages = messages.slice(-MAX_MESSAGES_PER_CHAT);
  const firstUser = chat.messages.find(item => item.role === "user");
  chat.title = firstUser ? firstUser.content.slice(0,50) : "नई चैट";
  chat.updatedAt = Date.now();
  saveChatHistory();
  renderChatHistory();
}

function renderCurrentChat(){
  messagesEl.innerHTML = "";
  messages.forEach(item => {
    if(item.role === "user") addUserMessage(item.content, false, item.imageUrl);
    else addAssistantMessage(item.content, false, item.imageId);
  });
}

function addUserMessage(text, persist = true, imageUrl = null){
  messages.push({ role: "user", content: text, imageUrl });
  const row = document.createElement("div"); row.className = "message user";
  const bubble = document.createElement("div"); bubble.className = "bubble";
  if(imageUrl){
    const img = document.createElement("img"); img.className = "attached-user-image"; img.src = imageUrl;
    img.onclick = () => openImageViewer(imageUrl); bubble.appendChild(img);
  }
  if(text){ const div = document.createElement("div"); div.textContent = text; bubble.appendChild(div); }
  row.appendChild(bubble); messagesEl.appendChild(row);
  if(persist) saveCurrentChat();
}

function addAssistantMessage(text, persist = true, imageId = null){
  messages.push({ role: "assistant", content: text, imageId });
  const row = document.createElement("div"); row.className = "message assistant";
  const bubble = document.createElement("div"); bubble.className = "bubble md";
  bubble.innerHTML = renderMarkdown(text);
  if(imageId){
    const creation = findCreationById(imageId);
    if(creation?.image){
      const img = document.createElement("img"); img.className = "generated-image"; img.src = creation.image;
      img.onclick = () => openImageViewer(creation.image); bubble.appendChild(img);
    }
  }
  row.appendChild(bubble);
  const actions = document.createElement("div"); actions.className = "msg-actions";
  const speakBtn = document.createElement("button"); speakBtn.className = "msg-action-btn"; speakBtn.textContent = "🔊 सुनें";
  speakBtn.onclick = () => speakText(text); actions.appendChild(speakBtn);
  row.appendChild(actions); messagesEl.appendChild(row);
  if(persist) saveCurrentChat();
}

function showTyping(){
  hideTyping();
  const row = document.createElement("div"); row.className = "message assistant"; row.id = "typingMessage";
  row.innerHTML = `<div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>`;
  messagesEl.appendChild(row); scrollBottom();
}
function hideTyping(){ document.getElementById("typingMessage")?.remove(); }
function scrollBottom(){ requestAnimationFrame(() => { window.scrollTo({ top: document.documentElement.scrollHeight, behavior: "smooth" }); }); }

function renderChatHistory(){
  chatHistoryEl.innerHTML = "";
  if(!chats.length){
    chatHistoryEl.innerHTML = `<div class="empty-history">कोई चैट नहीं है।</div>`;
    return;
  }
  chats.forEach(item => {
    const row = document.createElement("div"); row.className = "chat-history-item" + (item.id === currentChatId ? " active" : "");
    row.innerHTML = `<div class="chat-history-info"><div class="chat-history-title">${escapeHTML(item.title)}</div><div class="chat-history-meta">${new Date(item.updatedAt).toLocaleTimeString()}</div></div>`;
    const del = document.createElement("button"); del.className = "delete-chat"; del.textContent = "🗑️";
    del.onclick = (e) => { e.stopPropagation(); deleteChat(item.id); };
    row.appendChild(del);
    row.onclick = () => { currentChatId = item.id; messages = item.messages || []; renderCurrentChat(); renderChatHistory(); drawer.classList.remove("open"); drawerOverlay.classList.remove("open"); };
    chatHistoryEl.appendChild(row);
  });
}

function deleteChat(id){
  chats = chats.filter(i => i.id !== id);
  if(currentChatId === id) createNewChat(true);
  else saveChatHistory();
  renderChatHistory();
  renderCurrentChat();
}

function getStoredCreations(){
  const raw = safeGet(IMAGE_KEY);
  if(!raw) return [];
  try { return JSON.parse(raw); } catch(e){ return []; }
}

function findCreationById(id){
  return volatileCreations.find(i => i.id === id) || getStoredCreations().find(i => i.id === id);
}

async function saveCreation(imageData, promptText){
  if(!imageData) return null;
  const imageId = makeImageId();
  const record = { id: imageId, image: imageData, prompt: promptText, time: Date.now() };
  volatileCreations.unshift(record);
  safeSet(IMAGE_KEY, JSON.stringify([record, ...getStoredCreations()].slice(0, MAX_SAVED_CREATIONS)));
  renderCreations();
  return imageId;
}

function renderCreations(){
  creationGrid.innerHTML = "";
  const list = [...volatileCreations, ...getStoredCreations()].slice(0, MAX_SAVED_CREATIONS);
  if(!list.length){ creationGrid.innerHTML = `<div class="empty-history">कोई इमेज नहीं है।</div>`; return; }
  list.forEach(item => {
    const card = document.createElement("div"); card.className = "creation-card";
    card.innerHTML = `<img src="${item.image}" alt=""><div class="creation-prompt">${escapeHTML(item.prompt)}</div>`;
    card.onclick = () => openImageViewer(item.image);
    creationGrid.appendChild(card);
  });
}

function openImageViewer(src){ viewerImg.src = src; imageViewer.classList.add("open"); }
function closeImageViewer(){ imageViewer.classList.remove("open"); }

async function sendChatRequest(){
  const lastUser = messages.slice().reverse().find(i => i.role === "user");
  const res = await fetch(API + "chat", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ message: lastUser?.content || "", prompt: lastUser?.content || "", messages })
  });
  const data = await res.json();
  return {
    text: data.response || data.answer || data.text || data.message || "जवाब मिल गया।",
    image: data.image || data.image_url || null
  };
}

async function handleSend(){
  if(isBusy) return;
  const prompt = promptEl.value.trim();
  if(!prompt && !selectedFileContent) return showToast("कुछ लिखें।");

  // === डेवलपर और फोटो वाला कस्टम चेक ===
  const lower = prompt.toLowerCase();
  if(lower.includes("किसने बनाया") || lower.includes("who made you") || lower.includes("who created you")){
    ensureCurrentChat();
    isBusy = true; sendBtn.disabled = true;
    addUserMessage(prompt, true, selectedFileUrl);
    promptEl.value = ""; autoResize(); scrollBottom();
    showTyping();
    setTimeout(async () => {
      hideTyping();
      // यहाँ अपनी फोटो का डायरेक्ट लिंक या base64 डालें
      const myPhotoUrl = "https://via.placeholder.com/300"; 
      const responseText = "मुझे **अभिषेक त्रिपाठी जी बिहार वाले** ने बनाया है। आप नीचे उनकी तस्वीर देख सकते हैं:";
      const imageId = await saveCreation(myPhotoUrl, "Developer: Abhishek Tripathi");
      addAssistantMessage(responseText, true, imageId);
      isBusy = false; sendBtn.disabled = false; scrollBottom();
    }, 500);
    return;
  }
  // ===================================

  ensureCurrentChat();
  isBusy = true; sendBtn.disabled = true;
  const attached = selectedFileUrl;
  addUserMessage(prompt, true, attached);
  promptEl.value = ""; autoResize(); scrollBottom();

  try{
    showTyping();
    const result = await sendChatRequest();
    hideTyping();
    if(result && result.image){
      const imgId = await saveCreation(result.image, prompt);
      addAssistantMessage(result.text, true, imgId);
    } else {
      addAssistantMessage(result?.text || "उत्तर नहीं मिला।", true);
    }
    selectedFileContent = null; selectedFileUrl = null; filePreview.classList.remove("show");
  }catch(e){
    hideTyping();
    addAssistantMessage("⚠️ अभी request पूरी नहीं हो सकी।", true);
  }finally{
    isBusy = false; sendBtn.disabled = false; scrollBottom();
  }
}

function autoResize(){
  promptEl.style.height = "auto";
  promptEl.style.height = Math.min(promptEl.scrollHeight, 150) + "px";
}

promptEl.oninput = autoResize;
promptEl.onkeydown = (e) => { if(e.key === "Enter" && !e.shiftKey){ e.preventDefault(); handleSend(); } };
sendBtn.onclick = handleSend;

document.getElementById("menuBtn").onclick = () => { drawer.classList.add("open"); drawerOverlay.classList.add("open"); renderCreations(); };
document.getElementById("closeDrawer").onclick = () => { drawer.classList.remove("open"); drawerOverlay.classList.remove("open"); };
drawerOverlay.onclick = () => { drawer.classList.remove("open"); drawerOverlay.classList.remove("open"); };
document.getElementById("closeViewer").onclick = closeImageViewer;

document.getElementById("newChatBtn").onclick = () => { createNewChat(true); renderCurrentChat(); renderChatHistory(); drawer.classList.remove("open"); drawerOverlay.classList.remove("open"); };
document.getElementById("newChatTop").onclick = () => { createNewChat(true); renderCurrentChat(); renderChatHistory(); };
document.getElementById("deleteAllBtn").onclick = () => {
  if(!confirm("सभी चैट्स डिलीट करें?")) return;
  chats = []; safeRemove(CHAT_LIST_KEY); createNewChat(true); renderCurrentChat(); renderChatHistory();
  drawer.classList.remove("open"); drawerOverlay.classList.remove("open");
};

function init(){
  loadChatHistory();
  if(!chats.length) createNewChat(false);
  else { currentChatId = chats[0].id; messages = chats[0].messages || []; }
  renderCurrentChat();
  renderChatHistory();
  renderCreations();
}
init();
</script>
</body>
</html>
