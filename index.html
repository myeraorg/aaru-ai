<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Aaru AI</title>

<style>

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  background:#0f1117;
  color:#fff;
}

button,
textarea,
input{
  font:inherit;
}

button{
  cursor:pointer;
}

#app{
  width:100%;
  height:100dvh;
  display:flex;
  flex-direction:column;
}

header{
  height:58px;
  min-height:58px;
  display:flex;
  align-items:center;
  padding:0 14px;
  border-bottom:1px solid rgba(255,255,255,.08);
  background:#11141b;
}

.menu-btn{
  width:40px;
  height:40px;
  border:0;
  border-radius:10px;
  background:transparent;
  color:#fff;
  font-size:23px;
}

.menu-btn:hover{
  background:rgba(255,255,255,.07);
}

.logo{
  margin-left:8px;
  font-size:20px;
  font-weight:800;
  letter-spacing:.2px;
}

.online{
  margin-left:auto;
  display:flex;
  align-items:center;
  gap:6px;
  font-size:12px;
  opacity:.75;
}

.online-dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:#35d07f;
}

main{
  position:relative;
  flex:1;
  min-height:0;
  overflow-y:auto;
  overflow-x:hidden;
  scroll-behavior:smooth;
}

#chat{
  width:100%;
  max-width:900px;
  margin:0 auto;
  padding:22px 15px 150px;
}

#welcome{
  min-height:55vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding:25px;
}

.welcome-logo{
  font-size:38px;
  font-weight:900;
  margin-bottom:10px;
}

.welcome-text{
  font-size:15px;
  opacity:.6;
  max-width:500px;
  line-height:1.6;
}

.message{
  display:flex;
  width:100%;
  margin:10px 0;
}

.message.user{
  justify-content:flex-end;
}

.message.assistant{
  justify-content:flex-start;
}

.bubble{
  max-width:min(85%,720px);
  padding:11px 14px;
  border-radius:17px;
  font-size:15px;
  line-height:1.55;
  word-break:break-word;
}

.user .bubble{
  background:#2563eb;
  color:#fff;
  border-bottom-right-radius:5px;
  white-space:pre-wrap;
}

.assistant .bubble{
  background:#191d26;
  color:#f3f4f6;
  border:1px solid rgba(255,255,255,.06);
  border-bottom-left-radius:5px;
  white-space:normal;
}

.assistant .bubble p{
  margin:0 0 10px;
}

.assistant .bubble p:last-child{
  margin-bottom:0;
}

.assistant .bubble h1,
.assistant .bubble h2,
.assistant .bubble h3{
  margin:8px 0 10px;
  line-height:1.35;
}

.assistant .bubble h1{
  font-size:22px;
}

.assistant .bubble h2{
  font-size:19px;
}

.assistant .bubble h3{
  font-size:17px;
}

.assistant .bubble ul,
.assistant .bubble ol{
  margin:7px 0 11px;
  padding-left:23px;
}

.assistant .bubble li{
  margin:4px 0;
}

.assistant .bubble strong{
  font-weight:800;
}

.assistant .bubble em{
  font-style:italic;
}

.assistant .bubble a{
  color:#60a5fa;
  text-decoration:underline;
  word-break:break-all;
}

.assistant .bubble code{
  font-family:monospace;
  font-size:.9em;
  padding:2px 5px;
  border-radius:5px;
  background:rgba(255,255,255,.09);
}

.assistant .bubble pre{
  margin:10px 0;
  padding:12px;
  overflow-x:auto;
  border-radius:10px;
  background:#0b0d12;
  border:1px solid rgba(255,255,255,.08);
}

.assistant .bubble pre code{
  padding:0;
  background:none;
}

#overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  z-index:90;
  display:none;
}

#overlay.show{
  display:block;
}

#drawer{
  position:fixed;
  top:0;
  left:0;
  bottom:0;
  width:min(310px,85vw);
  background:#11141b;
  border-right:1px solid rgba(255,255,255,.08);
  z-index:100;
  transform:translateX(-105%);
  transition:transform .25s ease;
  display:flex;
  flex-direction:column;
}

#drawer.open{
  transform:translateX(0);
}

.drawer-top{
  padding:14px;
  border-bottom:1px solid rgba(255,255,255,.08);
}

.close-drawer{
  float:right;
  width:36px;
  height:36px;
  border:0;
  border-radius:10px;
  background:transparent;
  color:#fff;
  font-size:22px;
}

.close-drawer:hover{
  background:rgba(255,255,255,.07);
}

.new-chat-btn{
  width:100%;
  margin-top:4px;
  padding:11px 13px;
  border:0;
  border-radius:11px;
  background:#2563eb;
  color:#fff;
  font-weight:700;
}

.new-chat-btn:hover{
  background:#1d4ed8;
}

.drawer-scroll{
  flex:1;
  overflow-y:auto;
  padding:8px 10px 20px;
}

.history-section{
  margin:4px 0 20px;
}

.history-heading{
  padding:8px 5px;
  font-size:12px;
  font-weight:800;
  opacity:.55;
}

#chatHistory{
  display:flex;
  flex-direction:column;
  gap:5px;
}

.chat-history-item{
  display:flex;
  align-items:center;
  gap:7px;
  padding:10px;
  border-radius:11px;
  cursor:pointer;
  transition:.15s;
}

.chat-history-item:hover{
  background:rgba(255,255,255,.06);
}

.chat-history-item.active{
  background:rgba(255,255,255,.09);
}

.chat-history-info{
  min-width:0;
  flex:1;
}

.chat-history-title{
  font-size:13px;
  font-weight:600;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.chat-history-meta{
  margin-top:3px;
  font-size:10px;
  opacity:.4;
}

.delete-chat{
  width:28px;
  height:28px;
  flex:none;
  border:0;
  border-radius:7px;
  background:transparent;
  color:#fff;
  opacity:.3;
  font-size:19px;
}

.delete-chat:hover{
  opacity:1;
  background:rgba(255,255,255,.08);
}

.chat-history-empty{
  padding:8px 5px;
  font-size:12px;
  opacity:.4;
}

#creations{
  display:flex;
  flex-direction:column;
  gap:9px;
}

.creation-item{
  background:#191d26;
  border-radius:11px;
  overflow:hidden;
  border:1px solid rgba(255,255,255,.06);
}

.creation-item img{
  display:block;
  width:100%;
  aspect-ratio:1/1;
  object-fit:cover;
}

.creation-info{
  padding:8px;
}

.creation-prompt{
  font-size:11px;
  line-height:1.4;
  opacity:.65;
}

.drawer-bottom{
  padding:10px;
  border-top:1px solid rgba(255,255,255,.08);
}

.delete-all-btn{
  width:100%;
  padding:10px;
  border:1px solid rgba(255,255,255,.1);
  border-radius:10px;
  background:transparent;
  color:#fff;
  font-size:12px;
  opacity:.7;
}

.delete-all-btn:hover{
  background:rgba(255,255,255,.06);
  opacity:1;
}

.composer-wrap{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:50;
  padding:9px 12px calc(9px + env(safe-area-inset-bottom));
  background:linear-gradient(
    to top,
    #0f1117 75%,
    rgba(15,17,23,0)
  );
}

.composer{
  width:100%;
  max-width:900px;
  margin:0 auto;
  background:#191d26;
  border:1px solid rgba(255,255,255,.09);
  border-radius:18px;
  padding:8px;
  box-shadow:0 -4px 25px rgba(0,0,0,.18);
}

.input-row{
  display:flex;
  align-items:flex-end;
  gap:7px;
}

.tool-btn{
  width:39px;
  height:39px;
  flex:none;
  border:0;
  border-radius:10px;
  background:transparent;
  color:#fff;
  font-size:19px;
}

.tool-btn:hover{
  background:rgba(255,255,255,.07);
}

#prompt{
  flex:1;
  min-width:0;
  max-height:130px;
  min-height:39px;
  resize:none;
  border:0;
  outline:0;
  background:transparent;
  color:#fff;
  padding:10px 4px;
  font-size:15px;
  line-height:1.4;
}

#prompt::placeholder{
  color:rgba(255,255,255,.4);
}

.send-btn{
  width:42px;
  height:42px;
  flex:none;
  border:0;
  border-radius:12px;
  background:#2563eb;
  color:#fff;
  font-size:18px;
}

.send-btn:disabled{
  opacity:.4;
  cursor:not-allowed;
}

.tool-row{
  display:flex;
  gap:7px;
  margin-top:6px;
  overflow-x:auto;
  scrollbar-width:none;
}

.tool-row::-webkit-scrollbar{
  display:none;
}

.tool-chip{
  flex:none;
  border:1px solid rgba(255,255,255,.08);
  border-radius:10px;
  background:transparent;
  color:#ddd;
  padding:7px 10px;
  font-size:11px;
}

.tool-chip:hover,
.tool-chip.active{
  background:rgba(255,255,255,.08);
}

#photoPreview{
  display:none;
  position:relative;
  margin:4px 4px 7px;
  width:65px;
  height:65px;
  border-radius:10px;
  overflow:hidden;
  border:1px solid rgba(255,255,255,.1);
}

#photoPreview img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.clear-photo{
  position:absolute;
  top:3px;
  right:3px;
  width:21px;
  height:21px;
  border:0;
  border-radius:50%;
  background:rgba(0,0,0,.65);
  color:#fff;
  font-size:13px;
}

.generated-image-card{
  width:min(90%,650px);
  margin:8px 0;
  padding:8px;
  border-radius:15px;
  background:#191d26;
  border:1px solid rgba(255,255,255,.08);
}

.generated-image-card img{
  width:100%;
  display:block;
  border-radius:10px;
}

.generated-actions{
  display:flex;
  gap:7px;
  margin-top:8px;
}

.generated-actions button{
  flex:1;
  padding:9px;
  border:0;
  border-radius:9px;
  background:rgba(255,255,255,.08);
  color:#fff;
  font-size:12px;
}

.loading-row{
  display:flex;
  justify-content:flex-start;
  margin:10px 0;
}

.loading-bubble{
  padding:11px 14px;
  border-radius:17px;
  background:#191d26;
  border:1px solid rgba(255,255,255,.06);
  font-size:13px;
  opacity:.7;
}

.dots{
  display:inline-flex;
  gap:4px;
}

.dots span{
  width:5px;
  height:5px;
  border-radius:50%;
  background:#fff;
  opacity:.5;
  animation:dot 1.2s infinite;
}

.dots span:nth-child(2){
  animation-delay:.15s;
}

.dots span:nth-child(3){
  animation-delay:.3s;
}

@keyframes dot{
  0%,60%,100%{
    opacity:.25;
    transform:translateY(0);
  }

  30%{
    opacity:1;
    transform:translateY(-3px);
  }
}

@media(max-width:600px){

  #chat{
    padding:15px 10px 145px;
  }

  .bubble{
    max-width:90%;
    font-size:14px;
  }

  .welcome-logo{
    font-size:32px;
  }

  .tool-chip{
    padding:7px 9px;
  }
}

</style>
</head>


<body>

<div id="app">

<header>

<button
  id="menuBtn"
  class="menu-btn"
  type="button"
  aria-label="Menu"
>☰</button>

<div class="logo">
Aaru AI
</div>

<span class="online-dot"></span>
Online
</div>

</header>


<main id="main">

<div id="chat">

<div id="welcome">

<div class="welcome-logo">
Aaru AI
</div>

<div class="welcome-text">
नमस्ते! मैं Aaru AI हूँ।<br>
आप मुझसे कुछ भी पूछ सकते हैं।
</div>

</div>

</div>

</main>


<div id="overlay"></div>


<aside id="drawer">

<button
  id="closeDrawer"
  class="close-drawer"
  type="button"
>×</button>

<button
  id="newChatBtn"
  class="new-chat-btn"
  type="button"
>
＋ New Chat
</button>

</div>

<div class="history-heading">
Recent Chats
</div>

</div>


<div class="history-section">

Recent Creations
</div>

</div>

  id="deleteAllChatsBtn"
  class="delete-all-btn"
  type="button"
>
Delete all chat history
</button>

  id="previewImage"
  src=""
  alt=""
>

  class="clear-photo"
  type="button"
>×</button>

</div>

<button
  id="photoBtn"
  class="tool-btn"
  type="button"
  title="Photo"
>📷</button>

  id="prompt"
  rows="1"
  placeholder="Aaru AI से कुछ पूछें..."
></textarea>

  id="sendBtn"
  class="send-btn"
  type="button"
  aria-label="Send"
>➤</button>

  id="imageTool"
  class="tool-chip"
  type="button"
>
🎨 Create Image

<button
  id="photoTool"
  class="tool-chip"
  type="button"
>
📷 Photo

  type="button"
>
✨ Example
</button>

</div>

</div>


<input
  type="file"
  id="photoInput"
  accept="image/*"
  hidden
>

</div>


<script>

/* =========================================================
   AARU AI FRONTEND
========================================================= */

const API =
  "https://aaru-ai-api.myera-org.workers.dev/";

const CHAT_LIST_KEY =
  "aaru_chat_history_v2";

const OLD_CHAT_KEY =
  "aaru_chat_messages";

const IMAGE_KEY =
  "aaru_history";


const main =
  document.getElementById("main");

const chat =
  document.getElementById("chat");

const welcome =
  document.getElementById("welcome");

const prompt =
  document.getElementById("prompt");

const sendBtn =
  document.getElementById("sendBtn");

const menuBtn =
  document.getElementById("menuBtn");

const drawer =
  document.getElementById("drawer");

const overlay =
  document.getElementById("overlay");

const closeDrawer =
  document.getElementById("closeDrawer");

const newChatBtn =
  document.getElementById("newChatBtn");

const imageTool =
  document.getElementById("imageTool");

const photoTool =
  document.getElementById("photoTool");

const exampleTool =
  document.getElementById("exampleTool");

const photoBtn =
  document.getElementById("photoBtn");

const photoInput =
  document.getElementById("photoInput");

const photoPreview =
  document.getElementById("photoPreview");

const previewImage =
  document.getElementById("previewImage");

const clearPhotoBtn =
  document.getElementById("clearPhoto");

const chatHistory =
  document.getElementById("chatHistory");

const creations =
  document.getElementById("creations");

const deleteAllChatsBtn =
  document.getElementById("deleteAllChatsBtn");


let chats = [];

let currentChatId = null;

let messages = [];

let imageMode = false;

let selectedPhotoBase64 = null;

let selectedPhotoUrl = null;

let isBusy = false;


/* =========================================================
   UTILS
========================================================= */

function scrollBottom(){

  setTimeout(()=>{

    main.scrollTop =
      main.scrollHeight;

  },30);
}


function makeChatId(){

  return (
    Date.now().toString(36) +
    Math.random()
      .toString(36)
      .slice(2,8)
  );
}


function makeChatTitle(text){

  text =
    String(text || "")
      .trim()
      .replace(/\s+/g," ");

  if(!text){
    return "नई चैट";
  }

  if(text.length > 42){

    text =
      text
        .slice(0,42)
        .trim() +
      "…";
  }

  return text;
}


function formatChatDate(timestamp){

  if(!timestamp){
    return "";
  }

  const d =
    new Date(timestamp);

  const now =
    new Date();

  if(
    d.toDateString() ===
    now.toDateString()
  ){

    return d.toLocaleTimeString(
      "hi-IN",
      {
        hour:"2-digit",
        minute:"2-digit"
      }
    );
  }

  return d.toLocaleDateString(
    "hi-IN",
    {
      day:"numeric",
      month:"short"
    }
  );
}


/* =========================================================
   CHAT STORAGE
========================================================= */

function loadChatHistory(){

  try{

    const raw =
      localStorage.getItem(
        CHAT_LIST_KEY
      );

    if(raw){

      const saved =
        JSON.parse(raw);

      if(Array.isArray(saved)){

        chats =
          saved.filter(
            c =>
              c &&
              c.id &&
              Array.isArray(c.messages)
          );

        return;
      }
    }


    const oldRaw =
      localStorage.getItem(
        OLD_CHAT_KEY
      );

    if(oldRaw){

      const oldMessages =
        JSON.parse(oldRaw);

      if(
        Array.isArray(oldMessages) &&
        oldMessages.length
      ){

        const firstUser =
          oldMessages.find(
            m =>
              m &&
              m.role === "user"
          );


        const oldChat = {

          id:makeChatId(),

          title:makeChatTitle(
            firstUser
              ? firstUser.content
              : "पुरानी चैट"
          ),

          messages:
            oldMessages
              .filter(
                m =>
                  m &&
                  (
                    m.role === "user" ||
                    m.role === "assistant"
                  ) &&
                  typeof m.content === "string"
              )
              .slice(-40),

          createdAt:Date.now(),

          updatedAt:Date.now()
        };


        chats = [oldChat];


        localStorage.setItem(
          CHAT_LIST_KEY,
          JSON.stringify(chats)
        );


        localStorage.removeItem(
          OLD_CHAT_KEY
        );
      }
    }

  }catch(error){

    console.warn(
      "Chat history load failed:",
      error
    );

    chats = [];
  }
}


function saveChatHistory(){

  try{

    chats =
      chats
        .filter(
          c =>
            c &&
            c.id &&
            Array.isArray(c.messages)
        )
        .sort(
          (a,b) =>
            (b.updatedAt || 0) -
            (a.updatedAt || 0)
        )
        .slice(0,30);


    localStorage.setItem(
      CHAT_LIST_KEY,
      JSON.stringify(chats)
    );

  }catch(error){

    console.warn(
      "Chat history save failed:",
      error
    );
  }

  renderChatHistory();
}


function getCurrentChat(){

  if(!currentChatId){
    return null;
  }

  return chats.find(
    c =>
      c.id === currentChatId
  ) || null;
}


function createNewChat(){

  const item = {

    id:makeChatId(),

    title:"नई चैट",

    messages:[],

    createdAt:Date.now(),

    updatedAt:Date.now()
  };


  chats.unshift(item);

  currentChatId =
    item.id;

  messages = [];


  saveChatHistory();

  return item;
}


function saveCurrentChat(){

  if(!currentChatId){
    return;
  }

  const item =
    getCurrentChat();

  if(!item){
    return;
  }


  item.messages =
    messages
      .filter(
        m =>
          m &&
          (
            m.role === "user" ||
            m.role === "assistant"
          ) &&
          typeof m.content === "string"
      )
      .map(
        m => ({
          role:m.role,
          content:String(
            m.content || ""
          ).slice(0,8000)
        })
      )
      .slice(-40);


  const firstUser =
    item.messages.find(
      m =>
        m.role === "user"
    );


  if(firstUser){

    item.title =
      makeChatTitle(
        firstUser.content
      );
  }


  item.updatedAt =
    Date.now();


  saveChatHistory();
}


/* =========================================================
   CHAT HISTORY UI
========================================================= */

function renderChatHistory(){

  chatHistory.innerHTML = "";


  const sorted =
    [...chats].sort(
      (a,b) =>
        (b.updatedAt || 0) -
        (a.updatedAt || 0)
    );


  if(!sorted.length){

    const empty =
      document.createElement("div");

    empty.className =
      "chat-history-empty";

    empty.textContent =
      "अभी कोई पुरानी चैट नहीं है।";

    chatHistory.appendChild(
      empty
    );

    return;
  }


  for(const item of sorted){

    const row =
      document.createElement("div");

    row.className =
      "chat-history-item" +
      (
        item.id === currentChatId
          ? " active"
          : ""
      );


    const info =
      document.createElement("div");

    info.className =
      "chat-history-info";


    const title =
      document.createElement("div");

    title.className =
      "chat-history-title";

    title.textContent =
      item.title || "नई चैट";


    const meta =

========================================================= */

function openChat(id){

  const selected =
    chats.find(
      c => c.id === id
    );


  if(!selected){
    return;
  }


  if(currentChatId){
    saveCurrentChat();
  }


  currentChatId =
    selected.id;


  messages =
    Array.isArray(
      selected.messages
    )
      ? selected.messages.slice(-40)
      : [];


  chat.innerHTML = "";

  chat.appendChild(
    welcome
  );


  welcome.style.display =
    messages.length
      ? "none"
      : "flex";


  for(const msg of messages){

    if(msg.role === "user"){

      addUserMessage(
        msg.content,
        false
      );

    }else if(
      msg.role === "assistant"
    ){

      addAssistantMessage(
        msg.content,
        false
      );
    }
  }


  renderChatHistory();

  closeMenu();

  scrollBottom();
}


/* =========================================================
   SAFE MARKDOWN
========================================================= */

function escapeHTML(str){

  return String(str)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );
}


function inlineMarkdown(text){

  let s =
    escapeHTML(text);


  s =
    s.replace(
      /`([^`]+)`/g,
      "<code>$1</code>"
    );


  s =
    s.replace(
      /\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,

      '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>'
    );


  s =
    s.replace(
      /\*\*([^*]+)\*\*/g,
      "<strong>$1</strong>"
    );


  s =
    s.replace(
      /(^|[\s(])\*([^*\n]+)\*(?=$|[\s).,!?:;])/g,
      "$1<em>$2</em>"
    );


  s =
    s.replace(
      /__([^_]+)__/g,
      "<strong>$1</strong>"
    );


  return s;
}


function renderMarkdown(markdown){

  const text =
    String(markdown || "")
      .replace(/\r\n/g,"\n")
      .replace(/\r/g,"\n");


  const lines =
    text.split("\n");


  let html = "";

  let inCode = false;

  let codeBuffer = [];

  let inUl = false;

  let inOl = false;


  function closeLists(){

    if(inUl){

      html += "</ul>";

      inUl = false;
    }


    if(inOl){

      html += "</ol>";

      inOl = false;
    }
  }


  for(
    let i=0;
    i<lines.length;
    i++
  ){

    const raw =
      lines[i];


    if(
      raw
        .trim()
        .startsWith("```")
    ){

      if(!inCode){

        closeLists();

        inCode = true;

        codeBuffer = [];

      }else{

        html +=
          "<pre><code>" +
          escapeHTML(
            codeBuffer.join("\n")
          ) +
          "</code></pre>";

        inCode = false;

        codeBuffer = [];
      }

      continue;
    }


    if(inCode){

      codeBuffer.push(raw);

      continue;
    }


    if(!raw.trim()){

      closeLists();

      continue;
    }


    const heading =
      raw.match(
        /^(#{1,3})\s+(.+)$/
      );


    if(heading){

      closeLists();

      const level =
        heading[1].length;


      html +=
        "<h" +
        level +
        ">" +
        inlineMarkdown(
          heading[2]
        ) +
        "</h" +
        level +
        ">";


      continue;
    }


    const bullet =
      raw.match(
        /^\s*[-*+]\s+(.+)$/
      );


    if(bullet){

      if(inOl){

        html += "</ol>";

        inOl = false;
      }


      if(!inUl){

        html += "<ul>";

        inUl = true;
      }


      html +=
        "<li>" +
        inlineMarkdown(
          bullet[1]
        ) +
        "</li>";


      continue;
    }


    const numbered =
      raw.match(
        /^\s*\d+\.\s+(.+)$/
      );


    if(numbered){

      if(inUl){

        html += "</ul>";

        inUl = false;
      }


      if(!inOl){

        html += "<ol>";

        inOl = true;
      }


      html +=
        "<li>" +
        inlineMarkdown(
          numbered[1]
        ) +
        "</li>";


      continue;
    }


    closeLists();


    html +=
      "<p>" +
      inlineMarkdown(raw) +
      "</p>";
  }


  if(inCode){

    html +=
      "<pre><code>" +
      escapeHTML(
        codeBuffer.join("\n")
      ) +
      "</code></pre>";
  }


  closeLists();


  return html;
}

/* =========================================================
   CHAT API
========================================================= */

async function sendChat(text){

  if(isBusy){
    return;
  }


  text =
    String(text || "").trim();


  if(!text){
    return;
  }


  isBusy = true;

  sendBtn.disabled = true;


  addUserMessage(
    text,
    true
  );


  showLoading();


  try{

    const contextMessages =
      messages
        .slice(-20)
        .map(
          m => ({
            role:m.role,
            content:String(
              m.content || ""
            ).slice(0,8000)
          })
        );


    const response =
      await fetch(
        API + "chat",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({

            message:text,

            messages:
              contextMessages

          })
        }
      );


    let data = {};

    try{

      data =
        await response.json();

    }catch(e){

      data = {};
    }


    removeLoading();


    if(!response.ok){

      throw new Error(
        data.error ||
        data.message ||
        "Server error"
      );
    }


    const reply =
      data.reply ||
      data.answer ||
      data.response ||
      "मुझे कोई उत्तर नहीं मिला।";


    addAssistantMessage(
      reply,
      true
    );


  }catch(error){

    removeLoading();


    addAssistantMessage(
      "माफ़ कीजिए, अभी सर्वर से जवाब नहीं मिल पाया। कृपया थोड़ी देर बाद फिर कोशिश करें।",
      true
    );


    console.error(
      "Chat error:",
      error
    );

  }finally{

    isBusy = false;

    sendBtn.disabled = false;

    prompt.focus();
  }
}

   IMAGE GENERATION / EDITING
========================================================= */

async function generateImage(
  userPrompt
){

  if(isBusy){
    return;
  }


  userPrompt =
    String(
      userPrompt || ""
    ).trim();


  if(!userPrompt){
    return;
  }


  isBusy = true;

  sendBtn.disabled = true;


  /*
    Photo की current value को request से
    पहले सुरक्षित कर रहे हैं।
  */

  const photoForEdit =
    selectedPhotoBase64;

  const isPhotoEdit =
    !!photoForEdit;


  addUserMessage(
    userPrompt,
    true
  );


  showLoading();


  try{

    let response;


    /* ========================================
       PHOTO EDIT
    ======================================== */

    if(isPhotoEdit){

      response =
        await fetch(
          API + "image",
          {
            method:"POST",

            headers:{
              "Content-Type":
                "application/json"
            },

            body:JSON.stringify({

              prompt:userPrompt,

              /*
                यही Worker का सही field है।
              */

              image_b64:
                photoForEdit,

              ratio:"1:1",

              quality:"hd"

            })
          }
        );


    }else{

      /* ======================================
         NORMAL IMAGE GENERATION
      ====================================== */

      response =
        await fetch(

          API +
          "?prompt=" +
          encodeURIComponent(
            userPrompt
          ) +
          "&ratio=1:1&quality=hd",

          {
            method:"GET"
          }

        );
    }


    if(!response.ok){

      let errorText = "";

      try{

        errorText =
          await response.text();

      }catch(e){}


      throw new Error(
        errorText ||
        "Image generation failed"
      );
    }


    const blob =
      await response.blob();


    const imageUrl =
      URL.createObjectURL(
        blob
      );


    removeLoading();


    addGeneratedImage(
      imageUrl,
      userPrompt
    );


    messages.push({

      role:"assistant",

      content:
        isPhotoEdit
          ? "🖼️ Image edited successfully."
          : "🖼️ Image generated successfully."

    });


    saveCurrentChat();


    /*
      EDIT सफल होने के बाद composer से
      photo हटाएँ।
    */

    if(isPhotoEdit){

      clearSelectedPhoto();

      imageMode = false;

      imageTool.classList.remove(
        "active"
      );

      prompt.placeholder =
        "Aaru AI से कुछ पूछें...";
    }


  }catch(error){

    removeLoading();


    addAssistantMessage(
      isPhotoEdit
        ? "माफ़ कीजिए, फोटो edit नहीं हो पाई। कृपया फिर कोशिश करें।"
        : "माफ़ कीजिए, इमेज अभी generate नहीं हो पाई। कृपया फिर कोशिश करें।",
      true
    );


    console.error(
      "Image error:",
      error
    );

  }finally{

    isBusy = false;

    sendBtn.disabled = false;

    prompt.focus();
  }
}

/* =========================================================
   IMAGE HISTORY
========================================================= */

function saveCreation(
  url,
  promptText
){

  try{

    const history =
      JSON.parse(
        localStorage.getItem(
          IMAGE_KEY
        ) || "[]"
      );


    fetch(url)

      .then(
        response =>
          response.blob()
      )

      .then(
        blob => {

          const reader =
            new FileReader();


          reader.onload =
            function(){

              history.unshift({

                image:
                  reader.result,

                prompt:
                  String(
                    promptText || ""
                  ).slice(0,300),

                time:
                  Date.now()

              });


              history.splice(20);


              try{

                localStorage.setItem(

                  IMAGE_KEY,

                  JSON.stringify(
                    history
                  )

                );

              }catch(error){

                history.splice(8);


                try{

                  localStorage.setItem(

                    IMAGE_KEY,

                    JSON.stringify(
                      history
                    )

                  );

                }catch(e){}
              }


              renderCreations();
            };


          reader.readAsDataURL(
            blob
          );
        }
      )

      .catch(
        ()=>{}
      );

  }catch(error){

    console.warn(
      "History save failed:",
      error
    );
  }
}

/* =========================================================
   PHOTO RESIZE
========================================================= */

function resizeImageForReference(
  file,
  maxSize=480
){

  return new Promise(
    (resolve,reject)=>{

      const img =
        new Image();

      const objectUrl =
        URL.createObjectURL(
          file
        );


      img.onload =
        function(){

          try{

            const width =
              img.naturalWidth;

            const height =
              img.naturalHeight;


            const largest =
              Math.max(
                width,
                height
              );


            const scale =
              Math.min(
                1,
                maxSize / largest
              );


            const canvas =
              document.createElement(
                "canvas"
              );


            canvas.width =
              Math.max(
                1,
                Math.round(
                  width * scale
                )
              );


            canvas.height =
              Math.max(
                1,
                Math.round(
                  height * scale
                )
              );


            const ctx =
              canvas.getContext(
                "2d"
              );


            if(!ctx){

              throw new Error(
                "Canvas not supported"
              );
            }


            ctx.drawImage(
              img,
              0,
              0,
              canvas.width,
              canvas.height
            );


            const result =
              canvas.toDataURL(
                "image/jpeg",
                0.86
              );


            URL.revokeObjectURL(
              objectUrl
            );


            resolve(result);

          }catch(error){

            URL.revokeObjectURL(
              objectUrl
            );

            reject(error);
          }
        };


      img.onerror =
        function(){

          URL.revokeObjectURL(
            objectUrl
          );

          reject(
            new Error(
              "Image load failed"
            )
          );
        };


      img.src =
        objectUrl;
    }
  );
}

  selectedPhotoBase64 = null;

      selectedPhotoUrl.startsWith(
        "blob:"

    ){

      try{

        URL.revokeObjectURL(
          selectedPhotoUrl
        );

      }catch(e){}

  selectedPhotoUrl = null;

  previewImage.src = "";

  photoPreview.style.display =
    "none";

  photoInput.value = "";

    "open"
  );

  overlay.classList.remove(
    "show"
  );
}


menuBtn.onclick =
  openMenu;

closeDrawer.onclick =
  closeMenu;

overlay.onclick =
  closeMenu;


/* =========================================================
   NEW CHAT
========================================================= */

newChatBtn.onclick =
  function(){

    if(currentChatId){

      saveCurrentChat();
    }


    currentChatId = null;

    messages = [];


    chat.innerHTML = "";

    chat.appendChild(
      welcome
    );


    welcome.style.display =
      "flex";


    clearSelectedPhoto();


    imageMode = false;


    imageTool.classList.remove(
      "active"
    );


    prompt.placeholder =
      "Aaru AI से कुछ पूछें...";


    renderChatHistory();

    closeMenu();

    main.scrollTop = 0;


    prompt.focus();
  };


/* =========================================================
   DELETE ALL CHAT HISTORY
========================================================= */

deleteAllChatsBtn.onclick =
  deleteAllChats;


/* =========================================================
   SEND
========================================================= */

sendBtn.onclick =
  async function(){

    const text =
      prompt.value.trim();


    if(!text || isBusy){
      return;
    }


    /*
      Photo मौजूद है तो यह हमेशा
      PHOTO EDIT request होगी।
    */

    const hasPhoto =
      !!selectedPhotoBase64;


    /*
      Text को तुरंत composer से हटाएँ।
      Photo सफल request तक रहेगी।
    */

    prompt.value = "";

    autoResize();


    if(hasPhoto){

      imageMode = true;

      imageTool.classList.add(
        "active"
      );


      await generateImage(
        text
      );

      return;
    }


    /*
      Normal image generation
    */

    if(
      imageMode ||
      detectImageIntent(text)
    ){

      await generateImage(
        text
      );

      return;
    }


    /*
      Normal chat
    */

    await sendChat(
      text
    );
  };


/* =========================================================
   ENTER TO SEND
========================================================= */

prompt.addEventListener(
  "keydown",
  function(event){

    if(
      event.key === "Enter" &&
      !event.shiftKey
    ){

      event.preventDefault();

      sendBtn.click();
    }
  }
);


/* =========================================================
   AUTO RESIZE
========================================================= */

function autoResize(){

  prompt.style.height =
    "auto";


  prompt.style.height =
    Math.min(
      prompt.scrollHeight,
      130
    ) + "px";
}


prompt.addEventListener(
  "input",
  autoResize
);


/* =========================================================
   IMAGE TOOL
========================================================= */

imageTool.onclick =
  function(){

    imageMode =
      !imageMode;


    imageTool.classList.toggle(
      "active",
      imageMode
    );


    if(imageMode){

      prompt.placeholder =
        selectedPhotoBase64
          ? "फोटो में क्या edit करना है?"
          : "क्या image बनानी है?";

    }else{

      prompt.placeholder =
        "Aaru AI से कुछ पूछें...";
    }


    prompt.focus();
  };


/* =========================================================
   PHOTO TOOL
========================================================= */

photoTool.onclick =
  openPhotoPicker;

photoBtn.onclick =
  openPhotoPicker;

clearPhotoBtn.onclick =
  clearSelectedPhoto;


/* =========================================================
   EXAMPLE
========================================================= */

exampleTool.onclick =
  function(){

    const examples = [

      "भारत की आज की सबसे बड़ी खबर क्या है?",

      "मुझे एक futuristic Indian city की cinematic image बनाओ",

      "आज की तारीख में OpenAI की सबसे नई खबर क्या है?",

      "एक सुंदर भारतीय गाँव की realistic तस्वीर बनाओ"

    ];


    const selected =
      examples[
        Math.floor(
          Math.random() *
          examples.length
        )
      ];


    prompt.value =
      selected;


    autoResize();

    prompt.focus();
  };


/* =========================================================
   INITIAL LOAD
========================================================= */

loadChatHistory();


if(chats.length){

  const latest =
    [...chats].sort(
      (a,b) =>
        (b.updatedAt || 0) -
        (a.updatedAt || 0)
    )[0];


  currentChatId =
    latest.id;


  messages =
    Array.isArray(
      latest.messages
    )
      ? latest.messages.slice(-40)
      : [];
}


restoreCurrentChat();

renderChatHistory();

renderCreations();

autoResize();


/* =========================================================
   RESTORE
========================================================= */

function restoreCurrentChat(){

  if(!messages.length){

    welcome.style.display =
      "flex";

    return;
  }


  welcome.style.display =
    "none";


  for(
    const msg of messages
  ){

    if(msg.role === "user"){

      addUserMessage(
        msg.content,
        false
      );

    }else if(
      msg.role === "assistant"
    ){

      addAssistantMessage(
        msg.content,
        false
      );
    }
  }


  scrollBottom();
}

</script>
