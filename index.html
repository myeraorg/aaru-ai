<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#070707">
<title>Aaru AI</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#070707;
  color:#fff;
  min-height:100vh;
}

.container{
  width:100%;
  max-width:720px;
  margin:auto;
  padding:14px;
}

.header{
  height:48px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:18px;
}

.logo{
  font-size:24px;
  font-weight:800;
  letter-spacing:-1px;
}

.logo span{
  opacity:.5;
}

.menu-btn{
  width:40px;
  height:40px;
  border:1px solid #292929;
  background:#111;
  color:#fff;
  border-radius:12px;
  font-size:20px;
  cursor:pointer;
}

.chat{
  min-height:calc(100vh - 180px);
  padding-bottom:160px;
}

.welcome{
  text-align:center;
  padding:70px 15px 35px;
}

.welcome h1{
  font-size:36px;
  letter-spacing:-1.5px;
  margin-bottom:10px;
}

.welcome p{
  color:#888;
  font-size:14px;
  line-height:1.6;
}

.message{
  display:flex;
  margin:15px 0;
}

.message.user{
  justify-content:flex-end;
}

.message.assistant{
  justify-content:flex-start;
}

.bubble{
  max-width:88%;
  padding:13px 15px;
  border-radius:17px;
  line-height:1.55;
  font-size:15px;
  white-space:pre-wrap;
  word-break:break-word;
}

.user .bubble{
  background:#fff;
  color:#000;
  border-bottom-right-radius:5px;
}

.assistant .bubble{
  background:#151515;
  border:1px solid #252525;
  color:#eee;
  border-bottom-left-radius:5px;
}

.image-message{
  width:100%;
  max-width:520px;
}

.image-message img{
  width:100%;
  display:block;
  border-radius:16px;
  background:#111;
}

.image-actions{
  display:flex;
  gap:8px;
  margin-top:9px;
}

.image-actions a,
.image-actions button{
  flex:1;
  border:1px solid #333;
  background:#151515;
  color:#fff;
  text-decoration:none;
  padding:10px;
  border-radius:10px;
  text-align:center;
  font-size:13px;
  cursor:pointer;
}

.typing{
  display:inline-flex;
  gap:4px;
  align-items:center;
  padding:14px 16px;
  background:#151515;
  border:1px solid #252525;
  border-radius:16px;
}

.typing span{
  width:6px;
  height:6px;
  background:#777;
  border-radius:50%;
  animation:typing 1s infinite;
}

.typing span:nth-child(2){
  animation-delay:.15s;
}

.typing span:nth-child(3){
  animation-delay:.3s;
}

@keyframes typing{
  0%,60%,100%{
    transform:translateY(0);
    opacity:.4;
  }
  30%{
    transform:translateY(-4px);
    opacity:1;
  }
}

/* COMPOSER */

.composer-wrap{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  background:linear-gradient(
    to bottom,
    rgba(7,7,7,0),
    #070707 28%
  );
  padding:25px 14px 14px;
  z-index:50;
}

.composer{
  max-width:720px;
  margin:auto;
  background:#111;
  border:1px solid #292929;
  border-radius:18px;
  padding:10px;
}

.preview{
  display:none;
  position:relative;
  margin-bottom:9px;
}

.preview img{
  width:100%;
  max-height:180px;
  object-fit:contain;
  border-radius:12px;
  background:#050505;
}

.remove-photo{
  position:absolute;
  top:8px;
  right:8px;
  width:32px;
  height:32px;
  border:none;
  border-radius:50%;
  background:rgba(0,0,0,.85);
  color:#fff;
  font-size:19px;
  cursor:pointer;
}

.text-row{
  display:flex;
  align-items:flex-end;
  gap:8px;
}

.plus-btn{
  width:40px;
  height:40px;
  flex:none;
  border:1px solid #333;
  background:#181818;
  color:#fff;
  border-radius:12px;
  font-size:24px;
  cursor:pointer;
}

#prompt{
  flex:1;
  min-height:42px;
  max-height:140px;
  resize:none;
  border:none;
  outline:none;
  background:transparent;
  color:#fff;
  font-size:15px;
  line-height:1.45;
  padding:10px 4px;
}

#prompt::placeholder{
  color:#666;
}

.send-btn{
  width:42px;
  height:42px;
  flex:none;
  border:none;
  border-radius:13px;
  background:#fff;
  color:#000;
  font-size:18px;
  cursor:pointer;
}

.send-btn:disabled{
  opacity:.4;
}

.tools{
  display:flex;
  gap:7px;
  margin-top:8px;
  overflow-x:auto;
}

.tool-btn{
  border:1px solid #2c2c2c;
  background:#181818;
  color:#bbb;
  padding:8px 11px;
  border-radius:10px;
  font-size:12px;
  white-space:nowrap;
  cursor:pointer;
}

.tool-btn.active{
  background:#fff;
  color:#000;
}

.hidden{
  display:none!important;
}

.status{
  text-align:center;
  color:#888;
  font-size:12px;
  padding:8px;
}

.history-section{
  margin-top:25px;
}

.history-title{
  color:#aaa;
  font-size:14px;
  margin-bottom:10px;
}

.history{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}

.history-item{
  aspect-ratio:1;
  overflow:hidden;
  border-radius:10px;
  background:#111;
  cursor:pointer;
}

.history-item img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.empty{
  color:#555;
  font-size:12px;
  text-align:center;
  padding:12px;
}

@media(max-width:400px){
  .welcome h1{
    font-size:31px;
  }

  .bubble{
    max-width:92%;
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <div class="logo">Aaru <span>AI</span></div>

    <button class="menu-btn" type="button" onclick="clearChat()">
      ⋮
    </button>
  </div>

  <div class="chat" id="chat">

    <div class="welcome" id="welcome">
      <h1>What can I help with?</h1>
      <p>
        Chat करें, photo edit करें या अपनी कल्पना से नई image बनाएं।
      </p>
    </div>

  </div>

  <div class="history-section" id="historySection">
    <div class="history-title">Recent Creations</div>
    <div class="history" id="history"></div>
  </div>

</div>


<!-- COMPOSER -->

<div class="composer-wrap">

  <div class="composer">

    <div class="preview" id="preview">

      <img id="previewImage" alt="Selected photo">

      <button
        class="remove-photo"
        type="button"
        onclick="removePhoto()"
      >
        ×
      </button>

    </div>

    <div class="text-row">

      <button
        class="plus-btn"
        type="button"
        onclick="document.getElementById('imageInput').click()"
      >
        +
      </button>

      <textarea
        id="prompt"
        rows="1"
        placeholder="Message Aaru AI..."
      ></textarea>

      <button
        class="send-btn"
        id="sendBtn"
        type="button"
        onclick="sendMessage()"
      >
        ↑
      </button>

    </div>

    <div class="tools">

      <button
        class="tool-btn"
        id="imageModeBtn"
        type="button"
        onclick="toggleImageMode()"
      >
        🎨 Create Image
      </button>

      <button
        class="tool-btn"
        type="button"
        onclick="document.getElementById('imageInput').click()"
      >
        📷 Photo
      </button>

      <button
        class="tool-btn"
        type="button"
        onclick="setExample('एक realistic Indian village at sunrise, cinematic photography')"
      >
        ✨ Example
      </button>

    </div>

    <input
      type="file"
      id="imageInput"
      accept="image/*"
      class="hidden"
    >

    <div class="status" id="status"></div>

  </div>

</div>


<script>

const API_URL =
  "https://aaru-ai-api.myera-org.workers.dev/";

let selectedImageBase64 = "";
let imageMode = false;
let busy = false;


/* =========================
   ELEMENTS
========================= */

const promptInput =
  document.getElementById("prompt");

const sendBtn =
  document.getElementById("sendBtn");

const imageModeBtn =
  document.getElementById("imageModeBtn");

const imageInput =
  document.getElementById("imageInput");

const preview =
  document.getElementById("preview");

const previewImage =
  document.getElementById("previewImage");

const chat =
  document.getElementById("chat");

const welcome =
  document.getElementById("welcome");

const status =
  document.getElementById("status");


/* =========================
   TEXTAREA AUTO RESIZE
========================= */

promptInput.addEventListener(
  "input",
  function(){

    this.style.height = "42px";

    this.style.height =
      Math.min(
        this.scrollHeight,
        140
      ) + "px";

  }
);


/* =========================
   ENTER TO SEND
========================= */

promptInput.addEventListener(
  "keydown",
  function(event){

    if(
      event.key === "Enter" &&
      !event.shiftKey
    ){

      event.preventDefault();

      sendMessage();

    }

  }
);


/* =========================
   IMAGE MODE
========================= */

function toggleImageMode(){

  imageMode = !imageMode;

  if(imageMode){

    imageModeBtn.classList.add("active");

    promptInput.placeholder =
      "Image में क्या बनाना चाहते हैं?";

  }else{

    imageModeBtn.classList.remove("active");

    promptInput.placeholder =
      "Message Aaru AI...";

  }

}


/* =========================
   PHOTO UPLOAD
========================= */

imageInput.addEventListener(
  "change",
  async function(event){

    const file =
      event.target.files[0];

    if(!file){
      return;
    }

    if(!file.type.startsWith("image/")){

      alert("कृपया image file चुनें।");

      imageInput.value = "";

      return;
    }

    try{

      status.textContent =
        "Photo तैयार हो रही है...";

      selectedImageBase64 =
        await compressImage(file);

      previewImage.src =
        selectedImageBase64;

      preview.style.display =
        "block";

      /*
       * Photo attached होने पर
       * image mode automatically ON.
       */

      imageMode = true;

      imageModeBtn.classList.add("active");

      promptInput.placeholder =
        "इस photo के साथ क्या करना है?";

      status.textContent = "";

    }catch(error){

      console.error(error);

      status.textContent =
        "❌ Photo तैयार नहीं हो सकी।";

    }

  }
);


/* =========================
   COMPRESS PHOTO
========================= */

function compressImage(file){

  return new Promise(
    function(resolve,reject){

      const reader =
        new FileReader();

      reader.onerror =
        function(){
          reject(
            new Error(
              "File read failed"
            )
          );
        };

      reader.onload =
        function(){

          const img =
            new Image();

          img.onerror =
            function(){
              reject(
                new Error(
                  "Image load failed"
                )
              );
            };

          img.onload =
            function(){

              /*
               * Maximum dimension 768px.
               * इससे request काफी छोटी रहेगी।
               */

              const MAX_SIZE = 768;

              let width =
                img.width;

              let height =
                img.height;

              const scale =
                Math.min(
                  1,
                  MAX_SIZE / Math.max(
                    width,
                    height
                  )
                );

              width =
                Math.max(
                  1,
                  Math.round(
                    width * scale
                  )
                );

              height =
                Math.max(
                  1,
                  Math.round(
                    height * scale
                  )
                );

              const canvas =
                document.createElement(
                  "canvas"
                );

              canvas.width =
                width;

              canvas.height =
                height;

              const ctx =
                canvas.getContext(
                  "2d",
                  {
                    alpha:false
                  }
                );

              ctx.drawImage(
                img,
                0,
                0,
                width,
                height
              );

              /*
               * पहले quality .70
               */

              let quality = 0.70;

              let dataUrl =
                canvas.toDataURL(
                  "image/jpeg",
                  quality
                );

              /*
               * Base64 बहुत बड़ा हो तो
               * quality और कम करेंगे।
               */

              const MAX_BASE64_LENGTH =
                850000;

              while(
                dataUrl.length >
                  MAX_BASE64_LENGTH &&
                quality > 0.40
              ){

                quality -= 0.08;

                dataUrl =
                  canvas.toDataURL(
                    "image/jpeg",
                    quality
                  );

              }

              /*
               * अंतिम fallback:
               * 512px तक resize.
               */

              if(
                dataUrl.length >
                MAX_BASE64_LENGTH
              ){

                const secondCanvas =
                  document.createElement(
                    "canvas"
                  );

                const secondScale =
                  512 /
                  Math.max(
                    img.width,
                    img.height
                  );

                secondCanvas.width =
                  Math.max(
                    1,
                    Math.round(
                      img.width *
                      secondScale
                    )
                  );

                secondCanvas.height =
                  Math.max(
                    1,
                    Math.round(
                      img.height *
                      secondScale
                    )
                  );

                const secondCtx =
                  secondCanvas.getContext(
                    "2d",
                    {
                      alpha:false
                    }
                  );

                secondCtx.drawImage(
                  img,
                  0,
                  0,
                  secondCanvas.width,
                  secondCanvas.height
                );

                dataUrl =
                  secondCanvas.toDataURL(
                    "image/jpeg",
                    0.55
                  );

              }

              resolve(dataUrl);

            };

          img.src =
            reader.result;

        };

      reader.readAsDataURL(file);

    }
  );

}


/* =========================
   REMOVE PHOTO
========================= */

function removePhoto(){

  selectedImageBase64 = "";

  imageInput.value = "";

  preview.style.display =
    "none";

  previewImage.src = "";

  /*
   * Photo हटने पर image mode
   * automatically बंद नहीं करेंगे,
   * ताकि user Create Image mode में रह सके।
   */

}


/* =========================
   EXAMPLE
========================= */

function setExample(text){

  promptInput.value =
    text;

  promptInput.focus();

  promptInput.dispatchEvent(
    new Event("input")
  );

}


/* =========================
   ADD USER MESSAGE
========================= */

function addUserMessage(text){

  welcome.style.display =
    "none";

  const wrapper =
    document.createElement("div");

  wrapper.className =
    "message user";

  const bubble =
    document.createElement("div");

  bubble.className =
    "bubble";

  bubble.textContent =
    text;

  wrapper.appendChild(
    bubble
  );

  chat.appendChild(
    wrapper
  );

  scrollToBottom();

}


/* =========================
   ADD ASSISTANT MESSAGE
========================= */

function addAssistantMessage(text){

  const wrapper =
    document.createElement("div");

  wrapper.className =
    "message assistant";

  const bubble =
    document.createElement("div");

  bubble.className =
    "bubble";

  bubble.textContent =
    text;

  wrapper.appendChild(
    bubble
  );

  chat.appendChild(
    wrapper
  );

  scrollToBottom();

}


/* =========================
   TYPING
========================= */

function addTyping(){

  const wrapper =
    document.createElement("div");

  wrapper.className =
    "message assistant";

  wrapper.id =
    "typingMessage";

  wrapper.innerHTML = `
    <div class="typing">
      <span></span>
      <span></span>
      <span></span>
    </div>
  `;

  chat.appendChild(
    wrapper
  );

  scrollToBottom();

}


function removeTyping(){

  const element =
    document.getElementById(
      "typingMessage"
    );

  if(element){

    element.remove();

  }

}


/* =========================
   IMAGE MESSAGE
========================= */

function addImageMessage(
  imageUrl,
  blob
){

  welcome.style.display =
    "none";

  const wrapper =
    document.createElement("div");

  wrapper.className =
    "message assistant";

  const box =
    document.createElement("div");

  box.className =
    "image-message";

  const img =
    document.createElement("img");

  img.src =
    imageUrl;

  img.alt =
    "Aaru AI generated image";

  const actions =
    document.createElement("div");

  actions.className =
    "image-actions";

  const download =
    document.createElement("a");

  download.textContent =
    "⬇️ Download";

  download.href =
    imageUrl;

  download.download =
    "aaru-ai-" +
    Date.now() +
    ".png";

  const newImage =
    document.createElement("button");

  newImage.textContent =
    "🎨 Create another";

  newImage.onclick =
    function(){

      promptInput.focus();

    };

  actions.appendChild(
    download
  );

  actions.appendChild(
    newImage
  );

  box.appendChild(
    img
  );

  box.appendChild(
    actions
  );

  wrapper.appendChild(
    box
  );

  chat.appendChild(
    wrapper
  );

  saveHistoryFromBlob(
    blob
  );

  scrollToBottom();

}


/* =========================
   IMAGE INTENT
========================= */

function looksLikeImageRequest(text){

  const value =
    text.toLowerCase();

  const keywords = [

    "create image",
    "generate image",
    "make image",
    "make a picture",
    "generate a picture",
    "create a picture",
    "draw an image",
    "draw a picture",
    "image बनाओ",
    "इमेज बनाओ",
    "इमेज बना",
    "फोटो बनाओ",
    "फोटो बना",
    "चित्र बनाओ",
    "चित्र बना",
    "तस्वीर बनाओ",
    "तस्वीर बना",
    "photo बनाओ",
    "image generate"

  ];

  return keywords.some(
    function(keyword){
      return value.includes(
        keyword
      );
    }
  );

}


/* =========================
   SEND MESSAGE
========================= */

async function sendMessage(){

  if(busy){
    return;
  }

  const text =
    promptInput.value.trim();

  if(!text){

    if(selectedImageBase64){

      alert(
        "Photo के साथ क्या करना है, वह लिखें।"
      );

    }else{

      alert(
        "पहले message या prompt लिखें।"
      );

    }

    return;
  }


  /*
   * IMPORTANT:
   *
   * Photo attached होने पर
   * हमेशा image generation.
   *
   * इससे photo वाला prompt
   * normal chat में नहीं जाएगा।
   */

  const shouldGenerateImage =
    imageMode ||
    !!selectedImageBase64 ||
    looksLikeImageRequest(text);


  busy = true;

  sendBtn.disabled = true;


  if(shouldGenerateImage){

    await generateImageFromChat(
      text
    );

  }else{

    await sendChatMessage(
      text
    );

  }

  busy = false;

  sendBtn.disabled = false;

}


/* =========================
   CHAT
========================= */

async function sendChatMessage(
  text
){

  addUserMessage(
    text
  );

  promptInput.value = "";

  promptInput.style.height =
    "42px";

  addTyping();

  status.textContent =
    "Aaru सोच रहा है...";

  try{

    const response =
      await fetch(
        API_URL + "chat",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({
            message:text
          })
        }
      );

    const data =
      await readJsonResponse(
        response
      );

    if(!response.ok){

      throw new Error(
        data.error ||
        "Chat failed"
      );

    }

    removeTyping();

    addAssistantMessage(
      data.reply ||
      "मुझे कोई response नहीं मिला।"
    );

  }catch(error){

    console.error(error);

    removeTyping();

    addAssistantMessage(
      "❌ " +
      (
        error.message ||
        "Chat failed"
      )
    );

  }

  status.textContent = "";

}


/* =========================
   IMAGE GENERATION
========================= */

async function generateImageFromChat(
  text
){

  /*
   * User message chat में दिखेगा,
   * लेकिन Worker /chat पर नहीं जाएगा।
   */

  addUserMessage(
    text
  );

  promptInput.value = "";

  promptInput.style.height =
    "42px";

  status.textContent =
    selectedImageBase64
      ? "🔄 Photo तैयार करके image बना रहे हैं..."
      : "✨ आपकी image तैयार हो रही है...";

  try{

    let response;

    /*
     * PHOTO TO IMAGE
     */

    if(selectedImageBase64){

      const clean =
        cleanBase64(
          selectedImageBase64
        );

      if(!clean){

        throw new Error(
          "Uploaded photo data empty है।"
        );

      }

      response =
        await fetch(
          API_URL,
          {
            method:"POST",

            headers:{
              "Content-Type":
                "application/json"
            },

            body:JSON.stringify({

              prompt:text,

              ratio:"1:1",

              quality:"hd",

              image_b64:clean,

              strength:0.65

            })
          }
        );

    }

    /*
     * TEXT TO IMAGE
     */

    else{

      const params =
        new URLSearchParams();

      params.set(
        "prompt",
        text
      );

      params.set(
        "ratio",
        "1:1"
      );

      params.set(
        "quality",
        "hd"
      );

      response =
        await fetch(
          API_URL +
          "?" +
          params.toString()
        );

    }


    if(!response.ok){

      let errorMessage =
        "Image generation failed.";

      try{

        const errorData =
          await response.json();

        if(errorData.error){

          errorMessage =
            errorData.error;

        }

      }catch(e){}

      throw new Error(
        errorMessage
      );

    }


    const contentType =
      response.headers.get(
        "content-type"
      ) || "";


    if(
      !contentType.includes(
        "image"
      )
    ){

      let serverText =
        "";

      try{

        serverText =
          await response.text();

      }catch(e){}

      throw new Error(
        serverText ||
        "Server ने image नहीं भेजी।"
      );

    }


    const blob =
      await response.blob();

    const imageUrl =
      URL.createObjectURL(
        blob
      );


    addImageMessage(
      imageUrl,
      blob
    );


    status.textContent =
      "✅ Image तैयार है!";


    /*
     * Photo इस्तेमाल होने के बाद
     * उसे composer में न रखें।
     */

    removePhoto();


  }catch(error){

    console.error(
      "Image generation error:",
      error
    );

    addAssistantMessage(
      "❌ " +
      (
        error.message ||
        "Image generation failed."
      )
    );

    status.textContent =
      "Image generation failed.";

  }

}


/* =========================
   CLEAN BASE64
========================= */

function cleanBase64(
  data
){

  if(!data){
    return "";
  }

  if(
    data.startsWith(
      "data:"
    )
  ){

    const comma =
      data.indexOf(",");

    if(comma !== -1){

      return data.substring(
        comma + 1
      );

    }

  }

  return data
    .replace(/\s/g,"");

}

/* =========================
   HISTORY
========================= */

async function saveHistoryFromBlob(
  blob
){

  try{

    const reader =
      new FileReader();

    reader.onloadend =
      async function(){

        const thumbnail =
          await createThumbnail(
            reader.result
          );

        let history = [];

        try{

          history =
            JSON.parse(
              localStorage.getItem(
                "aaru_history"
              ) || "[]"
            );

        }catch(e){

          history = [];

        }

        history.unshift(
          thumbnail
        );

        history =
          history.slice(
            0,
            10
          );

        localStorage.setItem(
          "aaru_history",
          JSON.stringify(
            history
          )
        );

        loadHistory();

      };

    reader.readAsDataURL(
      blob
    );

  }catch(error){

    console.log(
      "History save failed",
      error
    );

  }

}


function createThumbnail(
  dataUrl
){

  return new Promise(
    function(resolve){

      const img =
        new Image();

      img.onload =
        function(){

          const maxWidth =
            500;

          let width =
            img.width;

          let height =
            img.height;

          if(
            width >
            maxWidth
          ){

            const scale =
              maxWidth /
              width;

            width =
              Math.round(
                width * scale
              );

            height =
              Math.round(
                height * scale
              );

          }

          const canvas =
            document.createElement(
              "canvas"
            );

          canvas.width =
            width;

          canvas.height =
            height;

          const ctx =
            canvas.getContext(
              "2d"
            );

          ctx.drawImage(
            img,
            0,
            0,
            width,
            height
          );

          resolve(
            canvas.toDataURL(
              "image/jpeg",
              0.65
            )
          );

        };

      img.src =
        dataUrl;

    }
  );

}


/* =========================
   LOAD HISTORY
========================= */

function loadHistory(){

  const container =
    document.getElementById(
      "history"
    );

  let history = [];

  try{

    history =
      JSON.parse(
        localStorage.getItem(
          "aaru_history"
        ) || "[]"
      );

  }catch(e){

    history = [];

  }

  container.innerHTML = "";

  if(!history.length){

    container.innerHTML =
      '<div class="empty">अभी कोई creation नहीं है</div>';

    return;

  }

  history.forEach(
    function(imageData){

      const item =
        document.createElement(
          "div"
        );

      item.className =
        "history-item";

      const img =
        document.createElement(
          "img"
        );

      img.src =
        imageData;

      img.loading =
        "lazy";

      item.appendChild(
        img
      );

      item.onclick =
        function(){

          const wrapper =
            document.createElement(
              "div"
            );

          wrapper.className =
            "message assistant";

          const box =
            document.createElement(
              "div"
            );

          box.className =
            "image-message";

          const result =
            document.createElement(
              "img"
            );

          result.src =
            imageData;

          const actions =
            document.createElement(
              "div"
            );

          actions.className =
            "image-actions";

          const download =
            document.createElement(
              "a"
            );

          download.textContent =
            "⬇️ Download";

          download.href =
            imageData;

          download.download =
            "aaru-ai-history.png";

          actions.appendChild(
            download
          );

          box.appendChild(
            result
          );

          box.appendChild(
            actions
          );

          wrapper.appendChild(
            box
          );

          chat.appendChild(
            wrapper
          );

          scrollToBottom();

        };

      container.appendChild(
        item
      );

    }
  );

}
