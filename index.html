<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#111111">
<title>AARU AI</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,Helvetica,sans-serif;
  background:#fff;
  color:#111;
}

button,input,textarea{
  font:inherit;
}

button{
  border:0;
  cursor:pointer;
}

.app{
  width:100%;
  height:100dvh;
  display:flex;
  flex-direction:column;
  background:#fff;
}

/* HEADER */
.header{
  height:58px;
  flex:none;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 14px;
  border-bottom:1px solid #e8e8e8;
  background:#fff;
  z-index:10;
}

.header-left{
  display:flex;
  align-items:center;
  gap:10px;
}

.menu-btn{
  width:40px;
  height:40px;
  border-radius:12px;
  background:transparent;
  font-size:24px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.menu-btn:active{
  background:#f1f1f1;
}

.logo{
  font-size:20px;
  font-weight:800;
  letter-spacing:.3px;
}

.logo span{
  font-weight:500;
}

.header-mode{
  font-size:12px;
  color:#777;
}

/* DRAWER */
.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.35);
  z-index:30;
  display:none;
}

.overlay.show{
  display:block;
}

.drawer{
  position:fixed;
  left:0;
  top:0;
  bottom:0;
  width:min(310px,85vw);
  background:#fff;
  z-index:31;
  transform:translateX(-105%);
  transition:transform .25s ease;
  box-shadow:5px 0 25px rgba(0,0,0,.15);
  display:flex;
  flex-direction:column;
}

.drawer.open{
  transform:translateX(0);
}

.drawer-head{
  height:65px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 15px;
  border-bottom:1px solid #eee;
}

.drawer-title{
  font-size:20px;
  font-weight:800;
}

.close-drawer{
  width:38px;
  height:38px;
  border-radius:10px;
  background:#f3f3f3;
  font-size:22px;
}

.drawer-actions{
  padding:12px;
  display:flex;
  flex-direction:column;
  gap:8px;
}

.drawer-action{
  width:100%;
  text-align:left;
  padding:13px 14px;
  border-radius:12px;
  background:#f5f5f5;
  font-size:14px;
}

.drawer-action:active{
  background:#e9e9e9;
}

.drawer-section{
  padding:8px 14px;
  font-size:12px;
  color:#777;
  font-weight:700;
}

.recent-list{
  flex:1;
  overflow-y:auto;
  padding:0 10px 20px;
}

.recent-item{
  padding:11px 12px;
  border-radius:11px;
  margin-bottom:5px;
  cursor:pointer;
  font-size:14px;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}

.recent-item:active,
.recent-item.active{
  background:#f0f0f0;
}

/* CHAT AREA */
.chat-wrap{
  flex:1;
  min-height:0;
  position:relative;
  display:flex;
  flex-direction:column;
}

.messages{
  flex:1;
  overflow-y:auto;
  padding:20px 14px 135px;
  scroll-behavior:smooth;
}

.message-row{
  width:100%;
  display:flex;
  margin:0 0 18px;
}

.message-row.user{
  justify-content:flex-end;
}

.message-row.assistant{
  justify-content:flex-start;
}

.message{
  max-width:min(88%,760px);
  line-height:1.55;
  font-size:15px;
  overflow-wrap:anywhere;
}

.user .message{
  background:#f1f1f1;
  border-radius:19px 19px 5px 19px;
  padding:11px 14px;
}

.assistant .message{
  padding:2px 2px;
}

.assistant-label{
  font-size:11px;
  color:#777;
  margin-bottom:4px;
  font-weight:700;
}

.message img.chat-image{
  display:block;
  max-width:100%;
  width:auto;
  max-height:520px;
  border-radius:14px;
  margin-top:7px;
}

.message pre{
  background:#111;
  color:#fff;
  padding:13px;
  border-radius:12px;
  overflow:auto;
  font-size:13px;
}

.message code{
  background:#f1f1f1;
  border-radius:5px;
  padding:2px 4px;
  font-size:.9em;
}

.message pre code{
  background:transparent;
  padding:0;
}

.message blockquote{
  border-left:3px solid #aaa;
  margin:8px 0;
  padding-left:12px;
  color:#555;
}

.message ul,
.message ol{
  padding-left:22px;
}

.message a{
  color:#2563eb;
  text-decoration:underline;
}

/* TYPING */
.typing{
  display:none;
  align-items:center;
  gap:5px;
  padding:8px 2px;
}

.typing.show{
  display:flex;
}

.dot{
  width:7px;
  height:7px;
  background:#777;
  border-radius:50%;
  animation:blink 1.2s infinite;
}

.dot:nth-child(2){
  animation-delay:.15s;
}

.dot:nth-child(3){
  animation-delay:.3s;
}

@keyframes blink{
  0%,80%,100%{opacity:.25}
  40%{opacity:1}
}

/* CREATIONS */
.creations{
  display:flex;
  gap:9px;
  overflow-x:auto;
  padding:0 2px 8px;
}

.creation{
  flex:0 0 76px;
  height:76px;
  border-radius:12px;
  overflow:hidden;
  background:#eee;
}

.creation img{
  width:100%;
  height:100%;
  object-fit:cover;
}

/* COMPOSER */
.composer-area{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  padding:8px 10px calc(8px + env(safe-area-inset-bottom));
  background:linear-gradient(to top,#fff 78%,rgba(255,255,255,0));
}

.composer{
  max-width:850px;
  margin:auto;
  border:1px solid #d8d8d8;
  border-radius:22px;
  background:#fff;
  box-shadow:0 3px 18px rgba(0,0,0,.06);
  padding:8px;
}

.attachment-preview{
  display:none;
  align-items:center;
  gap:9px;
  margin:2px 3px 8px;
  padding:9px 10px;
  background:#f5f5f5;
  border-radius:12px;
}

.attachment-preview.show{
  display:flex;
}

.attachment-thumb{
  width:46px;
  height:46px;
  border-radius:9px;
  object-fit:cover;
  background:#ddd;
  flex:none;
}

.pdf-icon{
  width:46px;
  height:46px;
  border-radius:9px;
  background:#ededed;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:24px;
  flex:none;
}

.attachment-info{
  min-width:0;
  flex:1;
}

.attachment-name{
  font-size:13px;
  font-weight:700;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}

.attachment-type{
  font-size:11px;
  color:#777;
  margin-top:2px;
}

.remove-attachment{
  width:32px;
  height:32px;
  border-radius:9px;
  background:#fff;
  font-size:18px;
  flex:none;
}

.input-row{
  display:flex;
  align-items:flex-end;
  gap:7px;
}

.textarea{
  flex:1;
  min-width:0;
  max-height:150px;
  min-height:42px;
  resize:none;
  border:0;
  outline:0;
  padding:10px 8px;
  background:transparent;
  line-height:1.4;
  font-size:15px;
}

.icon-btn{
  width:42px;
  height:42px;
  border-radius:13px;
  background:#f3f3f3;
  display:flex;
  align-items:center;
  justify-content:center;
  flex:none;
  font-size:19px;
}

.icon-btn:active{
  transform:scale(.96);
}

.send-btn{
  width:42px;
  height:42px;
  border-radius:50%;
  background:#111;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px;
  flex:none;
}

.send-btn:disabled{
  opacity:.35;
}

.bottom-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:4px 2px 0;
}

.mode-buttons{
  display:flex;
  gap:4px;
}

.mode-btn{
  padding:7px 11px;
  border-radius:10px;
  background:transparent;
  font-size:12px;
  color:#666;
}

.mode-btn.active{
  background:#ededed;
  color:#111;
  font-weight:700;
}

.disclaimer{
  font-size:9px;
  color:#999;
}

/* TOAST */
.toast{
  position:fixed;
  left:50%;
  bottom:105px;
  transform:translateX(-50%) translateY(15px);
  background:#111;
  color:#fff;
  padding:10px 14px;
  border-radius:12px;
  font-size:13px;
  z-index:100;
  opacity:0;
  pointer-events:none;
  transition:.2s;
  max-width:90vw;
  text-align:center;
}

.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

/* EMPTY */
.empty{
  min-height:60vh;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  text-align:center;
  color:#777;
  padding:30px;
}

.empty-logo{
  font-size:32px;
  font-weight:800;
  color:#111;
  margin-bottom:8px;
}

.empty p{
  margin:3px 0;
  font-size:14px;
}

/* MOBILE */
@media(max-width:600px){
  .header{
    padding:0 10px;
  }

  .messages{
    padding-left:11px;
    padding-right:11px;
  }

  .message{
    max-width:92%;
  }

  .disclaimer{
    display:none;
  }

  .logo{
    font-size:19px;
  }
}
</style>
</head>

<body>

<div class="app">

  <!-- HEADER -->
  <header class="header">
    <div class="header-left">
      <button class="menu-btn" id="menuBtn">☰</button>
      <div class="logo">AARU <span>AI</span></div>
    </div>
    <div class="header-mode" id="headerMode">Chat</div>
  </header>

  <!-- CHAT -->
  <main class="chat-wrap">
    <div class="messages" id="messages"></div>

    <div class="composer-area">
      <div class="composer">

        <!-- ATTACHMENT PREVIEW -->
        <div class="attachment-preview" id="attachmentPreview">
          <img class="attachment-thumb" id="imagePreview" alt="" style="display:none">
          <div class="pdf-icon" id="pdfIcon" style="display:none">📄</div>

          <div class="attachment-info">
            <div class="attachment-name" id="attachmentName"></div>
            <div class="attachment-type" id="attachmentType"></div>
          </div>

          <button class="remove-attachment" id="removeAttachment">×</button>
        </div>

        <div class="input-row">

          <button class="icon-btn" id="photoBtn" title="Attach">📎</button>

          <textarea
            id="prompt"
            class="textarea"
            rows="1"
            maxlength="4000"
            placeholder="AARU AI से कुछ भी पूछें..."
          ></textarea>

          <button class="send-btn" id="sendBtn" title="Send">➤</button>

        </div>

        <div class="bottom-row">

          <div class="mode-buttons">
            <button class="mode-btn active" id="chatMode">Chat</button>
            <button class="mode-btn" id="imageMode">Image</button>
          </div>

          <div class="disclaimer">AARU AI can make mistakes</div>

        </div>
      </div>
    </div>
  </main>
</div>

<!-- HIDDEN FILE INPUT -->
<input
  type="file"
  id="photoInput"
  accept="image/*,.pdf,application/pdf"
  style="display:none"
>

<!-- DRAWER -->
<div class="overlay" id="overlay"></div>

<aside class="drawer" id="drawer">

  <div class="drawer-head">
    <div class="drawer-title">AARU AI</div>
    <button class="close-drawer" id="closeDrawer">×</button>
  </div>

  <div class="drawer-actions">
    <button class="drawer-action" id="newChatBtn">＋ New Chat</button>
    <button class="drawer-action" id="deleteChatsBtn">🗑 Delete all chats</button>
  </div>

  <div class="drawer-section">RECENT CHATS</div>
  <div class="recent-list" id="recentChats"></div>

</aside>

<div class="toast" id="toast"></div>

<script>
/* =========================================================
   AARU AI FRONTEND
   ========================================================= */

const API = "https://aaru-ai-api.myera-org.workers.dev/";

const CHAT_HISTORY_KEY = "aaru_chat_history_v2";
const CHAT_MESSAGES_KEY = "aaru_chat_messages";
const OLD_HISTORY_KEY = "aaru_history";

const MAX_SAVED_CHATS = 8;
const MAX_MESSAGES_PER_CHAT = 30;
const MAX_MESSAGE_CHARS = 4000;
const MAX_MODEL_IMAGE_SIZE = 511;
const MAX_PDF_SIZE = 50 * 1024 * 1024;

let currentChatId = null;
let currentMessages = [];
let selectedImage = null;
let selectedPDF = null;
let selectedImageData = null;
let currentMode = "chat";
let busy = false;
let typingElement = null;

/* =========================================================
   DOM
   ========================================================= */

const messagesEl = document.getElementById("messages");
const promptEl = document.getElementById("prompt");
const sendBtn = document.getElementById("sendBtn");
const photoBtn = document.getElementById("photoBtn");
const photoInput = document.getElementById("photoInput");

const attachmentPreview = document.getElementById("attachmentPreview");
const imagePreview = document.getElementById("imagePreview");
const pdfIcon = document.getElementById("pdfIcon");
const attachmentName = document.getElementById("attachmentName");
const attachmentType = document.getElementById("attachmentType");
const removeAttachment = document.getElementById("removeAttachment");

const chatMode = document.getElementById("chatMode");
const imageMode = document.getElementById("imageMode");
const headerMode = document.getElementById("headerMode");

const menuBtn = document.getElementById("menuBtn");
const drawer = document.getElementById("drawer");
const overlay = document.getElementById("overlay");
const closeDrawer = document.getElementById("closeDrawer");

const newChatBtn = document.getElementById("newChatBtn");
const deleteChatsBtn = document.getElementById("deleteChatsBtn");
const recentChats = document.getElementById("recentChats");

const toastEl = document.getElementById("toast");

/* =========================================================
   UTILITIES
   ========================================================= */

function escapeHTML(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function showToast(text){
  toastEl.textContent = text;
  toastEl.classList.add("show");

  clearTimeout(showToast.timer);

  showToast.timer = setTimeout(()=>{
    toastEl.classList.remove("show");
  },2600);
}

function isPDFFile(file){
  if(!file) return false;

  const type = String(file.type || "").toLowerCase();
  const name = String(file.name || "").toLowerCase();

  return type === "application/pdf" || name.endsWith(".pdf");
}

function isImageFile(file){
  if(!file) return false;

  const type = String(file.type || "").toLowerCase();

  if(type.startsWith("image/")) return true;

  const name = String(file.name || "").toLowerCase();

  return /\.(jpg|jpeg|png|webp|gif|bmp)$/i.test(name);
}

function makeId(){
  return Date.now().toString(36) + Math.random().toString(36).slice(2,8);
}

/* =========================================================
   MARKDOWN
   ========================================================= */

function renderMarkdown(text){

  if(!text) return "";

  let s = escapeHTML(text);

  /* fenced code */
  s = s.replace(
    /```([\s\S]*?)```/g,
    function(_,code){
      return "<pre><code>"+code.trim()+"</code></pre>";
    }
  );

  /* headings */
  s = s.replace(/^### (.+)$/gm,"<h3>$1</h3>");
  s = s.replace(/^## (.+)$/gm,"<h2>$1</h2>");
  s = s.replace(/^# (.+)$/gm,"<h1>$1</h1>");

  /* blockquote */
  s = s.replace(/^&gt; (.+)$/gm,"<blockquote>$1</blockquote>");

  /* unordered list */
  s = s.replace(
    /(?:^|\n)(?:[-*] .+(?:\n|$))+/g,
    function(block){
      const lines = block.trim().split("\n");
      let html = "<ul>";

      lines.forEach(line=>{
        const item = line.replace(/^[-*]\s+/,"");
        html += "<li>"+item+"</li>";
      });

      html += "</ul>";
      return "\n"+html+"\n";
    }
  );

  /* ordered list */
  s = s.replace(
    /(?:^|\n)(?:\d+\.\s.+(?:\n|$))+/g,
    function(block){
      const lines = block.trim().split("\n");
      let html = "<ol>";

      lines.forEach(line=>{
        const item = line.replace(/^\d+\.\s+/,"");
        html += "<li>"+item+"</li>";
      });

      html += "</ol>";
      return "\n"+html+"\n";
    }
  );

  /* links */
  s = s.replace(
    /\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,
    '<a href="$2" target="_blank" rel="noopener">$1</a>'
  );

  /* bold / italic */
  s = s.replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>");
  s = s.replace(/__(.+?)__/g,"<strong>$1</strong>");
  s = s.replace(/\*(.+?)\*/g,"<em>$1</em>");
  s = s.replace(/_(.+?)_/g,"<em>$1</em>");

  /* inline code */
  s = s.replace(/`([^`]+)`/g,"<code>$1</code>");

  /* paragraphs / line breaks */
  s = s.replace(/\n\n+/g,"<br><br>");
  s = s.replace(/\n/g,"<br>");

  return s;
}

/* =========================================================
   LOCAL STORAGE
   ========================================================= */

function getSavedChats(){
  try{
    const raw = localStorage.getItem(CHAT_HISTORY_KEY);

    if(!raw) return [];

    const data = JSON.parse(raw);

    return Array.isArray(data) ? data : [];
  }catch(e){
    return [];
  }
}

function saveChats(chats){
  try{
    localStorage.setItem(
      CHAT_HISTORY_KEY,
      JSON.stringify(chats.slice(0,MAX_SAVED_CHATS))
    );
  }catch(e){}
}

function getCurrentStoredMessages(){
  try{
    const raw = localStorage.getItem(CHAT_MESSAGES_KEY);

    if(!raw) return {};

    const data = JSON.parse(raw);

    return data && typeof data === "object" ? data : {};
  }catch(e){
    return {};
  }
}

function saveCurrentMessages(){

  if(!currentChatId) return;

  try{

    const all = getCurrentStoredMessages();

    all[currentChatId] = currentMessages
      .slice(-MAX_MESSAGES_PER_CHAT)
      .map(m=>({
        role:m.role,
        content:String(m.content || "").slice(0,MAX_MESSAGE_CHARS)
      }));

    const ids = Object.keys(all);

    while(ids.length > MAX_SAVED_CHATS){
      delete all[ids.shift()];
    }

    localStorage.setItem(
      CHAT_MESSAGES_KEY,
      JSON.stringify(all)
    );

  }catch(e){}
}

function createChatRecord(){

  return {
    id:makeId(),
    title:"New Chat",
    updatedAt:Date.now()
  };

}

function ensureCurrentChat(){

  if(currentChatId) return;

  const chat = createChatRecord();

  currentChatId = chat.id;
  currentMessages = [];

  const chats = getSavedChats();

  chats.unshift(chat);

  saveChats(chats);
}

/* =========================================================
   CHAT LIST
   ========================================================= */

function refreshRecentChats(){

  recentChats.innerHTML = "";

  const chats = getSavedChats();

  if(!chats.length){

    recentChats.innerHTML =
      '<div style="padding:15px;color:#999;font-size:13px">No chats yet</div>';

    return;
  }

  chats.forEach(chat=>{

    const div = document.createElement("div");

    div.className =
      "recent-item" +
      (chat.id === currentChatId ? " active" : "");

    div.textContent = chat.title || "New Chat";

    div.onclick = ()=>{
      loadChat(chat.id);
      closeDrawerPanel();
    };

    recentChats.appendChild(div);

  });
}

function updateCurrentChatTitle(){

  if(!currentChatId) return;

  const chats = getSavedChats();

  const chat = chats.find(x=>x.id === currentChatId);

  if(!chat) return;

  const firstUser = currentMessages.find(
    x=>x.role === "user"
  );

  if(firstUser){

    let title = String(firstUser.content || "")
      .replace(/^📄\s*/,"")
      .replace(/\s+/g," ")
      .trim();

    if(title.length > 42){
      title = title.slice(0,42) + "…";
    }

    if(title){
      chat.title = title;
    }

  }

  chat.updatedAt = Date.now();

  const others = chats.filter(x=>x.id !== currentChatId);

  saveChats([chat,...others]);

  refreshRecentChats();
}

function loadChat(id){

  const chats = getSavedChats();

  const chat = chats.find(x=>x.id === id);

  if(!chat) return;

  currentChatId = id;

  const all = getCurrentStoredMessages();

  currentMessages = Array.isArray(all[id])
    ? all[id]
    : [];

  clearAttachment();

  renderMessages();

  refreshRecentChats();

}

/* =========================================================
   MESSAGE UI
   ========================================================= */

function addMessage(role,content,extraHTML=""){

  const row = document.createElement("div");

  row.className =
    "message-row " +
    (role === "user" ? "user" : "assistant");

  const box = document.createElement("div");

  box.className = "message";

  if(role === "assistant"){

    const label = document.createElement("div");

    label.className = "assistant-label";

    label.textContent = "AARU AI";

    box.appendChild(label);

  }

  const body = document.createElement("div");

  if(extraHTML){

    body.innerHTML = extraHTML;

  }else{

    body.innerHTML =
      role === "assistant"
        ? renderMarkdown(content)
        : escapeHTML(content).replace(/\n/g,"<br>");

  }

  box.appendChild(body);

  row.appendChild(box);

  messagesEl.appendChild(row);

  return row;
}

function renderMessages(){

  messagesEl.innerHTML = "";

  if(!currentMessages.length){

    const empty = document.createElement("div");

    empty.className = "empty";

    empty.innerHTML = `
      <div class="empty-logo">AARU AI</div>

function showPDFAttachment(file){

  selectedPDF = file;
  selectedImage = null;
  selectedImageData = null;

  attachmentPreview.classList.add("show");

  imagePreview.style.display = "none";
  imagePreview.removeAttribute("src");

  pdfIcon.style.display = "flex";

function formatFileSize(bytes){

  if(bytes < 1024) return bytes+" B";

  if(bytes < 1024*1024){
    return (bytes/1024).toFixed(1)+" KB";
  }

  return (bytes/(1024*1024)).toFixed(1)+" MB";

}

/* =========================================================
   IMAGE RESIZE
   ========================================================= */

function resizeImageToMax(file,maxSize){

  return new Promise((resolve,reject)=>{

    const reader = new FileReader();

    reader.onload = ()=>{

      const img = new Image();

      img.onload = ()=>{

        let width = img.naturalWidth;
        let height = img.naturalHeight;

        if(width > maxSize || height > maxSize){

          const scale =
            Math.min(maxSize/width,maxSize/height);

          width = Math.round(width*scale);
          height = Math.round(height*scale);

        }

        const canvas = document.createElement("canvas");

        canvas.width = width;
        canvas.height = height;

        const ctx = canvas.getContext("2d");

        ctx.drawImage(img,0,0,width,height);

        const dataURL =
          canvas.toDataURL("image/jpeg",.86);

        resolve(dataURL);

      };

      img.onerror = ()=>{
        reject(new Error("Image could not be loaded"));
      };

      img.src = reader.result;

    };

    reader.onerror = ()=>{
      reject(new Error("Could not read image"));
    };

    reader.readAsDataURL(file);

  });

}

function dataURLToBase64(dataURL){

  if(!dataURL) return "";

  const comma = dataURL.indexOf(",");

  return comma >= 0
    ? dataURL.slice(comma+1)
    : dataURL;

}

/* =========================================================
   DOCUMENT / PDF API
   ========================================================= */

async function sendDocumentRequest(file,question){

  const formData = new FormData();

  formData.append("file",file,file.name);

  formData.append("question",question);

  const response = await fetch(
    API + "document",
    {
      method:"POST",
      body:formData
    }
  );

  let data = null;

  try{
    data = await response.json();
  }catch(e){
    throw new Error(
      "Server ने valid response नहीं दिया।"
    );
  }

  if(!response.ok){

    throw new Error(
      data?.error ||
      data?.message ||
      "PDF process नहीं हो सका।"
    );

  }

  const answer =
    data?.response ??
    data?.reply ??
    data?.text ??
    data?.answer ??
    "";

  if(!answer){

    throw new Error(
      "PDF का जवाब खाली मिला।"
    );

  }

  return String(answer);

}

/* =========================================================
   CHAT API
   ========================================================= */

async function sendChatRequest(message){

  const messages =
    currentMessages
      .filter(m =>
        m.role === "user" ||
        m.role === "assistant"
      )
      .slice(-19)
      .map(m=>({
        role:m.role,
        content:String(m.content || "")
          .slice(0,MAX_MESSAGE_CHARS)
      }));

  const payload = {
    message:message,
    messages:messages
  };

  if(selectedImageData){

    payload.image_b64 =
      dataURLToBase64(selectedImageData);

  }

  const response = await fetch(
    API + "chat",
    {
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify(payload)
    }
  );

  let data = null;

  try{
    data = await response.json();
  }catch(e){
    throw new Error(
      "Server ने valid response नहीं दिया।"
    );
  }

  if(!response.ok){

    throw new Error(
      data?.error ||
      data?.message ||
      "Chat request failed."
    );

  }

  const reply =
    data?.reply ??
    data?.response ??
    data?.text ??
    data?.message ??
    "";

  if(!reply){

    throw new Error(
      "AARU AI का जवाब खाली मिला।"
    );

  }

  return {
    text:String(reply),
    image:data?.image || data?.image_url || null
  };

}

/* =========================================================
   IMAGE API
   ========================================================= */

async function generateImage(prompt){

  const payload = {
    prompt:prompt,
    ratio:"1:1",
    quality:"standard"
  };

  if(selectedImageData){

    payload.image_b64 =
      dataURLToBase64(selectedImageData);

  }

  const response = await fetch(
    API + "image",
    {
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify(payload)
    }
  );

  const contentType =
    response.headers.get("content-type") || "";

  if(contentType.includes("application/json")){

    const data = await response.json();

    if(!response.ok){

      throw new Error(
        data?.error ||
        data?.message ||
        "Image generation failed."
      );

    }

    if(data.image){
      return normalizeImageResult(data.image);
    }

    if(data.image_b64){
      return normalizeImageResult(
        data.image_b64
      );
    }

    if(data.url){
      return data.url;
    }

    if(data.image_url){
      return data.image_url;
    }

    throw new Error(
      "Image response में image नहीं मिली।"
    );

  }

  if(!response.ok){

    throw new Error(
      "Image generation failed."
    );

  }

  const blob = await response.blob();

  return URL.createObjectURL(blob);

}

function normalizeImageResult(value){

  if(!value) return "";

  if(typeof value !== "string"){

    if(value instanceof Uint8Array){

      const blob =
        new Blob([value],{
          type:"image/png"
        });

      return URL.createObjectURL(blob);

    }

    return "";

  }

  if(value.startsWith("data:image/")){

    return value;

  }

  if(value.startsWith("http://") ||
     value.startsWith("https://")){

    return value;

  }

  return "data:image/png;base64," + value;

}

function saveCreation(imageURL){

  try{

    const raw =
      JSON.parse(
        localStorage.getItem("aaru_history") || "[]"
      );

    raw.unshift({
      id:makeId(),
      image:imageURL,
      createdAt:Date.now()
    });

    localStorage.setItem(
      "aaru_history",
      JSON.stringify(raw.slice(0,4))
    );

  }catch(e){}

}

/* =========================================================
   SEND
   ========================================================= */

async function handleSend(){

  if(busy) return;

  const text =
    promptEl.value.trim();

  /* PDF */
  if(selectedPDF){

    if(!text){

      showToast(
        "PDF के बारे में अपना सवाल लिखें।"
      );

      promptEl.focus();

      return;
    }

    ensureCurrentChat();

    const userContent =
      "📄 " +
      (selectedPDF.name || "PDF") +
      "\n\n" +
      text;

    currentMessages.push({
      role:"user",
      content:userContent
    });

    if(currentMessages.length >
       MAX_MESSAGES_PER_CHAT){

      currentMessages =
        currentMessages.slice(
          -MAX_MESSAGES_PER_CHAT
        );

    }

    const empty =
      messagesEl.querySelector(".empty");

    if(empty) empty.remove();

    addMessage(
      "user",
      userContent
    );

    promptEl.value = "";

    saveCurrentMessages();
    updateCurrentChatTitle();

    busy = true;
    sendBtn.disabled = true;

    showTyping();

    try{

      const pdf = selectedPDF;

      const answer =
        await sendDocumentRequest(
          pdf,
          text
        );

      hideTyping();

      currentMessages.push({
        role:"assistant",
        content:answer
      });

      addMessage(
        "assistant",
        answer
      );

      saveCurrentMessages();

      clearAttachment();

      promptEl.placeholder =
        "AARU AI से कुछ भी पूछें...";

      scrollBottom();

    }catch(error){

      console.error(error);

      hideTyping();

      const errorText =
        "माफ़ कीजिए, PDF process करते समय समस्या हुई।\n\n" +
        (error?.message || "Unknown error");

      currentMessages.push({
        role:"assistant",
        content:errorText
      });

      addMessage(
        "assistant",
        errorText
      );

      saveCurrentMessages();

    }finally{

      busy = false;
      sendBtn.disabled = false;

    }

    return;
  }

  /* EMPTY */
  if(!text){

    if(currentMode === "image"){

      showToast(
        "Image बनाने के लिए prompt लिखें।"
      );

    }

    return;
  }

  ensureCurrentChat();

  const userContent = text;

  currentMessages.push({
    role:"user",
    content:userContent
  });

  if(currentMessages.length >
     MAX_MESSAGES_PER_CHAT){

    currentMessages =
      currentMessages.slice(
        -MAX_MESSAGES_PER_CHAT
      );

  }

  const empty =
    messagesEl.querySelector(".empty");

  if(empty) empty.remove();

  addMessage(
    "user",
    userContent
  );

  promptEl.value = "";

  saveCurrentMessages();
  updateCurrentChatTitle();

  busy = true;
  sendBtn.disabled = true;

  showTyping();

  try{

    /* IMAGE MODE */
    if(currentMode === "image"){

      const imageURL =
        await generateImage(
          text
        );

      hideTyping();

      addImageMessage(imageURL);

      clearAttachment();

      promptEl.placeholder =
        "Image बनाने के लिए prompt लिखें...";

      return;
    }

    /* CHAT MODE */
    const result =
      await sendChatRequest(
        text
      );

    hideTyping();

    if(result.image){

      addImageMessage(
        normalizeImageResult(result.image)
      );

    }

    if(result.text){

      currentMessages.push({
        role:"assistant",
        content:result.text
      });

      addMessage(
        "assistant",
        result.text
      );

    }

    saveCurrentMessages();

    clearAttachment();

    promptEl.placeholder =
      "AARU AI से कुछ भी पूछें...";

    scrollBottom();

  }catch(error){

    console.error(error);

    hideTyping();

    const errorText =
      "माफ़ कीजिए, अभी जवाब देने में समस्या हुई।\n\n" +
      (error?.message || "Unknown error");

    currentMessages.push({
      role:"assistant",
      content:errorText
    });

    addMessage(
      "assistant",
      errorText
    );

    saveCurrentMessages();

  }finally{

    busy = false;
    sendBtn.disabled = false;

  }

}
