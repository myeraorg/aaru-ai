<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#070707">
<title>Aaru AI</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,
body{
  width:100%;
  min-height:100%;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#070707;
  color:#fff;
  overflow-x:hidden;
}

button,
textarea,
input{
  font-family:inherit;
}

/* =========================
   APP
========================= */

.app{
  width:100%;
  min-height:100vh;
  max-width:900px;
  margin:auto;
}

/* =========================
   HEADER
========================= */

.header{
  position:sticky;
  top:0;
  z-index:20;
  height:58px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 16px;
  background:rgba(7,7,7,.94);
  border-bottom:1px solid #171717;
  backdrop-filter:blur(10px);
}

.left-header{
  display:flex;
  align-items:center;
  gap:10px;
}

.menu{
  width:38px;
  height:38px;
  border:1px solid #292929;
  border-radius:11px;
  background:#111;
  color:#fff;
  font-size:20px;
  cursor:pointer;
}

.logo{
  font-size:21px;
  font-weight:800;
  letter-spacing:-.7px;
}

.logo span{
  opacity:.5;
}

.header-status{
  font-size:11px;
  color:#777;
}

/* =========================
   CHAT AREA
========================= */

.chat{
  width:100%;
  padding:15px 14px 190px;
}

.welcome{
  min-height:62vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:20px;
}

.welcome-logo{
  width:62px;
  height:62px;
  display:flex;
  align-items:center;
  justify-content:center;
  border:1px solid #333;
  border-radius:20px;
  background:#111;
  font-size:25px;
  font-weight:800;
  margin-bottom:18px;
}

.welcome h1{
  font-size:34px;
  letter-spacing:-1.4px;
  margin-bottom:9px;
}

.welcome p{
  color:#777;
  font-size:14px;
  line-height:1.6;
  max-width:430px;
}

/* =========================
   MESSAGE
========================= */

.message{
  display:flex;
  width:100%;
  margin:17px 0;
}

.message.user{
  justify-content:flex-end;
}

.message.assistant{
  justify-content:flex-start;
}

.message-inner{
  max-width:min(78%,620px);
}

.user .message-inner{
  display:flex;
  flex-direction:column;
  align-items:flex-end;
}

.bubble{
  padding:12px 15px;
  border-radius:18px;
  font-size:15px;
  line-height:1.55;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}

.user .bubble{
  background:#fff;
  color:#000;
  border-bottom-right-radius:5px;
}

.assistant .bubble{
  background:#151515;
  color:#eee;
  border:1px solid #252525;
  border-bottom-left-radius:5px;
}

.photo-user{
  width:min(330px,80vw);
  margin-bottom:7px;
}

.photo-user img{
  display:block;
  width:100%;
  max-height:330px;
  object-fit:cover;
  border-radius:16px;
  border:1px solid #292929;
}

/* =========================
   GENERATED IMAGE
========================= */

.generated{
  width:min(560px,88vw);
}

.generated img{
  width:100%;
  display:block;
  border-radius:17px;
  background:#111;
  border:1px solid #252525;
}

.image-actions{
  display:flex;
  gap:8px;
  margin-top:9px;
}

.image-actions a,
.image-actions button{
  flex:1;
  min-width:0;
  border:1px solid #303030;
  background:#141414;
  color:#fff;
  text-decoration:none;
  text-align:center;
  padding:10px 8px;
  border-radius:11px;
  font-size:12px;
  cursor:pointer;
}

/* =========================
   TYPING
========================= */

.typing{
  display:flex;
  align-items:center;
  gap:5px;
  padding:13px 15px;
  background:#151515;
  border:1px solid #252525;
  border-radius:17px;
  border-bottom-left-radius:5px;
}

.typing i{
  width:6px;
  height:6px;
  display:block;
  background:#777;
  border-radius:50%;
  animation:typing 1s infinite;
}

.typing i:nth-child(2){
  animation-delay:.15s;
}

.typing i:nth-child(3){
  animation-delay:.30s;
}

@keyframes typing{
  0%,60%,100%{
    opacity:.35;
    transform:translateY(0);
  }

  30%{
    opacity:1;
    transform:translateY(-4px);
  }
}

/* =========================
   COMPOSER
========================= */

.composer-area{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:50;
  padding:22px 12px 12px;
  background:linear-gradient(
    to bottom,
    rgba(7,7,7,0),
    #070707 30%
  );
}

.composer{
  width:100%;
  max-width:870px;
  margin:auto;
  background:#111;
  border:1px solid #292929;
  border-radius:20px;
  padding:9px;
  box-shadow:0 -10px 35px rgba(0,0,0,.25);
}

/* =========================
   ATTACHMENT PREVIEW
========================= */

.attachment{
  display:none;
  position:relative;
  width:120px;
  margin:2px 0 9px 2px;
}

.attachment img{
  width:120px;
  height:120px;
  object-fit:cover;
  display:block;
  border-radius:13px;
  border:1px solid #333;
}

.remove-photo{
  position:absolute;
  top:5px;
  right:5px;
  width:28px;
  height:28px;
  border:0;
  border-radius:50%;
  background:rgba(0,0,0,.85);
  color:#fff;
  font-size:18px;
  cursor:pointer;
}

/* =========================
   INPUT
========================= */

.input-row{
  display:flex;
  align-items:flex-end;
  gap:8px;
}

.attach-btn,
.send-btn{
  width:42px;
  height:42px;
  flex:none;
  border-radius:13px;
  cursor:pointer;
}

.attach-btn{
  border:1px solid #303030;
  background:#181818;
  color:#fff;
  font-size:23px;
}

.send-btn{
  border:0;
  background:#fff;
  color:#000;
  font-size:19px;
  font-weight:bold;
}

.send-btn:disabled{
  opacity:.35;
  cursor:not-allowed;
}

#prompt{
  width:100%;
  min-height:42px;
  max-height:150px;
  resize:none;
  border:0;
  outline:0;
  background:transparent;
  color:#fff;
  font-size:15px;
  line-height:1.45;
  padding:10px 3px;
}

#prompt::placeholder{
  color:#666;
}

/* =========================
   TOOLS
========================= */

.tools{
  display:flex;
  gap:7px;
  margin-top:8px;
  padding:0 2px 1px;
  overflow-x:auto;
  scrollbar-width:none;
}

.tools::-webkit-scrollbar{
  display:none;
}

.tool{
  flex:none;
  border:1px solid #2b2b2b;
  background:#181818;
  color:#aaa;
  padding:8px 11px;
  border-radius:10px;
  font-size:12px;
  cursor:pointer;
}

.tool.active{
  background:#fff;
  color:#000;
  border-color:#fff;
}

#imageInput{
  display:none;
}

/* =========================
   STATUS
========================= */

.status{
  min-height:17px;
  text-align:center;
  color:#777;
  font-size:11px;
  padding-top:6px;
}

/* =========================
   RECENT CREATIONS
========================= */

.recent{
  padding:0 14px 185px;
}

.recent-title{
  color:#888;
  font-size:13px;
  margin:5px 0 10px;
}

.recent-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
}

.recent-item{
  aspect-ratio:1;
  border-radius:11px;
  overflow:hidden;
  background:#111;
  border:1px solid #202020;
  cursor:pointer;
}

.recent-item img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.recent-empty{
  color:#444;
  font-size:11px;
  padding:8px 0;
}

/* =========================
   MOBILE
========================= */

@media(max-width:600px){

  .header{
    padding:0 12px;
  }

  .chat{
    padding-left:10px;
    padding-right:10px;
  }

  .message-inner{
    max-width:88%;
  }

  .welcome h1{
    font-size:29px;
  }

  .welcome{
    min-height:58vh;
  }

  .generated{
    width:90vw;
  }

  .recent{
    padding-left:10px;
    padding-right:10px;
  }

  .recent-grid{
    grid-template-columns:repeat(4,1fr);
  }

}

@media(max-width:380px){

  .tools .tool{
    font-size:11px;
    padding:7px 9px;
  }

  .welcome h1{
    font-size:27px;
  }

}
</style>
</head>

<body>

<div class="app">

  <!-- HEADER -->

  <header class="header">

    <div class="left-header">

      <button
        class="menu"
        type="button"
        onclick="clearChat()"
        aria-label="Menu"
      >
        ☰
      </button>

      <div class="logo">
        Aaru <span>AI</span>
      </div>

    </div>

    <div class="header-status">
      AI Assistant
    </div>

  </header>


  <!-- CHAT -->

  <main
    class="chat"
    id="chat"
  >

    <section
      class="welcome"
      id="welcome"
    >

      <div class="welcome-logo">
        A
      </div>

      <h1>
        What can I help with?
      </h1>

      <p>
        Chat करें, photo edit करें या अपनी कल्पना से नई image बनाएं।
      </p>

    </section>

  </main>


  <!-- RECENT -->

  <section
    class="recent"
    id="recentSection"
  >

    <div class="recent-title">
      Recent Creations
    </div>

    <div
      class="recent-grid"
      id="recentGrid"
    ></div>

  </section>


</div>


<!-- COMPOSER -->

<div class="composer-area">

  <div class="composer">

    <div
      class="attachment"
      id="attachment"
    >

      <img
        id="attachmentImage"
        alt="Selected photo"
      >

      <button
        class="remove-photo"
        type="button"
        onclick="removePhoto()"
      >
        ×
      </button>

    </div>


    <div class="input-row">

      <button
        class="attach-btn"
        type="button"
        onclick="openPhotoPicker()"
        aria-label="Attach photo"
      >
        +
      </button>


      <textarea
        id="prompt"
        rows="1"
        placeholder="Message Aaru AI..."
      ></textarea>


      <button
        class="send-btn"
        id="sendBtn"
        type="button"
        onclick="sendMessage()"
      >
        ↑
      </button>

    </div>


    <div class="tools">

      <button
        class="tool"
        id="imageTool"
        type="button"
        onclick="toggleImageMode()"
      >
        🎨 Create Image
      </button>


      <button
        class="tool"
        type="button"
        onclick="openPhotoPicker()"
      >
        📷 Photo
      </button>


      <button
        class="tool"
        type="button"
        onclick="insertExample()"
      >
        ✨ Example
      </button>

    </div>


    <input
      type="file"
      id="imageInput"
      accept="image/jpeg,image/png,image/webp,image/*"
    >


    <div
      class="status"
      id="status"
    ></div>

  </div>

</div>


<script>

/* =========================
   CONFIG
========================= */

const API_URL =
  "https://aaru-ai-api.myera-org.workers.dev/";


/* =========================
   STATE
========================= */

let selectedImageDataUrl = "";

let imageMode = false;

let busy = false;


/* =========================
   ELEMENTS
========================= */

const chat =
  document.getElementById("chat");

const welcome =
  document.getElementById("welcome");

const promptInput =
  document.getElementById("prompt");

const imageInput =
  document.getElementById("imageInput");

const attachment =
  document.getElementById("attachment");

const attachmentImage =
  document.getElementById("attachmentImage");

const sendBtn =
  document.getElementById("sendBtn");

const imageTool =
  document.getElementById("imageTool");

const status =
  document.getElementById("status");

const recentGrid =
  document.getElementById("recentGrid");


/* =========================
   TEXTAREA
========================= */

promptInput.addEventListener(
  "input",
  function(){

    this.style.height =
      "42px";

    this.style.height =
      Math.min(
        this.scrollHeight,
        150
      ) + "px";

  }
);


/* =========================
   ENTER
========================= */

promptInput.addEventListener(
  "keydown",
  function(event){

    if(
      event.key === "Enter" &&
      !event.shiftKey
    ){

      event.preventDefault();

      sendMessage();

    }

  }
);


/* =========================
   PHOTO PICKER
========================= */

function openPhotoPicker(){

  imageInput.click();

}


/* =========================
   PHOTO SELECT
========================= */

imageInput.addEventListener(
  "change",
  async function(){

    const file =
      imageInput.files[0];

    if(!file){
      return;
    }


    if(
      !file.type.startsWith(
        "image/"
      )
    ){

      alert(
        "कृपया image file चुनें।"
      );

      imageInput.value = "";

      return;

    }


    try{

      setStatus(
        "🔄 Photo तैयार हो रही है..."
      );


      selectedImageDataUrl =
        await preparePhoto(
          file
        );


      attachmentImage.src =
        selectedImageDataUrl;


      attachment.style.display =
        "block";


      /*
       * Photo attach होते ही
       * image mode ON.
       */

      imageMode = true;

      imageTool.classList.add(
        "active"
      );


      promptInput.placeholder =
        "इस photo के साथ क्या करना है?";


      setStatus("");

    }catch(error){

      console.error(
        error
      );

      setStatus(
        "❌ Photo तैयार नहीं हो सकी।"
      );

    }

  }
);


/* =========================
   PREPARE PHOTO
========================= */

function preparePhoto(file){

  return new Promise(
    function(resolve,reject){

      const reader =
        new FileReader();


      reader.onerror =
        function(){

          reject(
            new Error(
              "Photo read failed."
            )
          );

        };


      reader.onload =
        function(){

          const img =
            new Image();


          img.onerror =
            function(){

              reject(
                new Error(
                  "Photo load failed."
                )
              );

            };


          img.onload =
            function(){

              /*
               * Small enough for AI request.
               */

              const MAX =
                768;


              let width =
                img.naturalWidth ||
                img.width;

              let height =
                img.naturalHeight ||
                img.height;


              const scale =
                Math.min(
                  1,
                  MAX /
                  Math.max(
                    width,
                    height
                  )
                );


              width =
                Math.max(
                  1,
                  Math.round(
                    width * scale
                  )
                );


              height =
                Math.max(
                  1,
                  Math.round(
                    height * scale
                  )
                );


              const canvas =
                document.createElement(
                  "canvas"
                );


              canvas.width =
                width;

              canvas.height =
                height;


              const ctx =
                canvas.getContext(
                  "2d",
                  {
                    alpha:false
                  }
                );


              ctx.drawImage(
                img,
                0,
                0,
                width,
                height
              );


              /*
               * Progressive compression.
               */

              let quality =
                0.70;

              let dataUrl =
                canvas.toDataURL(
                  "image/jpeg",
                  quality
                );


              /*
               * Keep base64 safely below
               * our Worker limit.
               */

              const MAX_LENGTH =
                650000;


              while(
                dataUrl.length >
                  MAX_LENGTH &&
                quality > 0.35
              ){

                quality -= 0.08;

                dataUrl =
                  canvas.toDataURL(
                    "image/jpeg",
                    quality
                  );

              }


              /*
               * If still large, use 512px.
               */

              if(
                dataUrl.length >
                MAX_LENGTH
              ){

                const scale2 =
                  512 /
                  Math.max(
                    img.naturalWidth ||
                    img.width,
                    img.naturalHeight ||
                    img.height
                  );


                const canvas2 =
                  document.createElement(
                    "canvas"
                  );


                canvas2.width =
                  Math.max(
                    1,
                    Math.round(
                      (
                        img.naturalWidth ||
                        img.width
                      ) * scale2
                    )
                  );


                canvas2.height =
                  Math.max(
                    1,
                    Math.round(
                      (
                        img.naturalHeight ||
                        img.height
                      ) * scale2
                    )
                  );


                const ctx2 =
                  canvas2.getContext(
                    "2d",
                    {
                      alpha:false
                    }
                  );


                ctx2.drawImage(
                  img,
                  0,
                  0,
                  canvas2.width,
                  canvas2.height
                );


                dataUrl =
                  canvas2.toDataURL(
                    "image/jpeg",
                    0.50
                  );

              }


              resolve(
                dataUrl
              );

            };


          img.src =
            reader.result;

        };


      reader.readAsDataURL(
        file
      );

    }
  );

}


/* =========================
   REMOVE PHOTO
========================= */

function removePhoto(){

  selectedImageDataUrl =
    "";

  imageInput.value =
    "";

  attachment.style.display =
    "none";

  attachmentImage.src =
    "";

  promptInput.placeholder =
    imageMode
      ? "Image में क्या बनाना चाहते हैं?"
      : "Message Aaru AI...";

}


/* =========================
   IMAGE MODE
========================= */

function toggleImageMode(){

  imageMode =
    !imageMode;


  if(imageMode){

    imageTool.classList.add(
      "active"
    );

    promptInput.placeholder =
      "Image में क्या बनाना चाहते हैं?";

  }else{

    imageTool.classList.remove(
      "active"
    );

    promptInput.placeholder =
      "Message Aaru AI...";

  }

}


/* =========================
   EXAMPLE
========================= */

function insertExample(){

  promptInput.value =
    "एक realistic Indian village at sunrise, cinematic photography";

  promptInput.dispatchEvent(
    new Event("input")
  );

  promptInput.focus();

}


/* =========================
   IMAGE INTENT
========================= */

function isImageRequest(text){

  const t =
    text.toLowerCase();


  const words = [

    "create image",
    "generate image",
    "make image",
    "create a picture",
    "generate a picture",
    "make a picture",
    "draw a picture",
    "draw an image",
    "image generate",
    "image बनाओ",
    "image बना",
    "इमेज बनाओ",
    "इमेज बना",
    "फोटो बनाओ",
    "फोटो बना",
    "चित्र बनाओ",
    "चित्र बना",
    "तस्वीर बनाओ",
    "तस्वीर बना"

  ];


  return words.some(
    function(word){

      return t.includes(
        word
      );

    }
  );

}


/* =========================
   SEND
========================= */

async function sendMessage(){

  if(busy){
    return;
  }


  const text =
    promptInput.value.trim();


  if(!text){

    if(selectedImageDataUrl){

      alert(
        "Photo के साथ क्या करना है, वह लिखें।"
      );

    }else{

      alert(
        "पहले अपना message लिखें।"
      );

    }

    return;

  }


  /*
   * PHOTO ALWAYS HAS PRIORITY.
   *
   * इससे photo + prompt
   * कभी normal chat में नहीं जाएगा।
   */

  const generate =
    !!selectedImageDataUrl ||
    imageMode ||
    isImageRequest(
      text
    );


  busy = true;

  sendBtn.disabled =
    true;


  try{

    if(generate){

      await generateImage(
        text
      );

    }else{

      await sendChat(
        text
      );

    }

  }finally{

    busy = false;

    sendBtn.disabled =
      false;

  }

}


/* =========================
   ADD USER MESSAGE
========================= */

function addUserMessage(
  text,
  imageData
){

  welcome.style.display =
    "none";


  const message =
    document.createElement(
      "div"
    );

  message.className =
    "message user";


  const inner =
    document.createElement(
      "div"
    );

  inner.className =
    "message-inner";


  if(imageData){

    const photo =
      document.createElement(
        "div"
      );

    photo.className =
      "photo-user";


    const img =
      document.createElement(
        "img"
      );


    img.src =
      imageData;


    photo.appendChild(
      img
    );


    inner.appendChild(
      photo
    );

  }


  const bubble =
    document.createElement(
      "div"
    );


  bubble.className =
    "bubble";


  bubble.textContent =
    text;


  inner.appendChild(
    bubble
  );


  message.appendChild(
    inner
  );


  chat.appendChild(
    message
  );


  scrollBottom();

}


/* =========================
   ASSISTANT TEXT
========================= */

function addAssistantMessage(
  text
){

  const message =
    document.createElement(
      "div"
    );


  message.className =
    "message assistant";


  const inner =
    document.createElement(
      "div"
    );


  inner.className =
    "message-inner";


  const bubble =
    document.createElement(
      "div"
    );


  bubble.className =
    "bubble";


  bubble.textContent =
    text;


  inner.appendChild(
    bubble
  );


  message.appendChild(
    inner
  );


  chat.appendChild(
    message
  );


  scrollBottom();

}


/* =========================
   TYPING
========================= */

function showTyping(){

  removeTyping();


  const message =
    document.createElement(
      "div"
    );


  message.className =
    "message assistant";

  message.id =
    "typingMessage";


  const inner =
    document.createElement(
      "div"
    );


  inner.className =
    "message-inner";


  inner.innerHTML = `
    <div class="typing">
      <i></i>
      <i></i>
      <i></i>
    </div>
  `;


  message.appendChild(
    inner
  );


  chat.appendChild(
    message
  );


  scrollBottom();

}


function removeTyping(){

  const item =
    document.getElementById(
      "typingMessage"
    );


  if(item){

    item.remove();

  }

}


/* =========================
   NORMAL CHAT
========================= */

async function sendChat(
  text
){

  addUserMessage(
    text
  );


  promptInput.value =
    "";

  resetTextarea();


  showTyping();


  setStatus(
    "Aaru सोच रहा है..."
  );


  try{

    const response =
      await fetch(
        API_URL + "chat",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({
            message:text
          })

        }
      );


    const data =
      await response.json();


    if(!response.ok){

      throw new Error(
        data.error ||
        "Chat failed."
      );

    }


    removeTyping();


    addAssistantMessage(
      data.reply ||
      "मुझे अभी कोई response नहीं मिला।"
    );


  }catch(error){

    console.error(
      error
    );


    removeTyping();


    addAssistantMessage(
      "❌ " +
      (
        error.message ||
        "Chat failed."
      )
    );

  }


  setStatus("");

}


/* =========================
   IMAGE GENERATION
========================= */

async function generateImage(
  text
){

  /*
   * Save photo BEFORE clearing it.
   */

  const sourcePhoto =
    selectedImageDataUrl;


  /*
   * Show user message.
   */

  addUserMessage(
    text,
    sourcePhoto
  );


  promptInput.value =
    "";

  resetTextarea();


  showTyping();


  setStatus(
    sourcePhoto
      ? "🔄 Photo को transform किया जा रहा है..."
      : "✨ आपकी image तैयार हो रही है..."
  );


  try{

    let response;


    /* =====================
       PHOTO → IMAGE
    ===================== */

    if(sourcePhoto){

      const base64 =
        cleanBase64(
          sourcePhoto
        );


      if(!base64){

        throw new Error(
          "Photo data खाली है।"
        );

      }


      response =
        await fetch(
          API_URL,
          {
            method:"POST",

            headers:{
              "Content-Type":
                "application/json"
            },

            body:JSON.stringify({

              prompt:text,

              ratio:"1:1",

              quality:"hd",

              image_b64:base64,

              strength:0.65

            })

          }
        );

    }


    /* =====================
       TEXT → IMAGE
    ===================== */

    else{

      const params =
        new URLSearchParams();


      params.set(
        "prompt",
        text
      );


      params.set(
        "ratio",
        "1:1"
      );


      params.set(
        "quality",
        "hd"
      );


      response =
        await fetch(
          API_URL +
          "?" +
          params.toString()
        );

    }


    if(!response.ok){

      let message =
        "Image generation failed.";


      try{

        const errorData =
          await response.json();


        if(
          errorData &&
          errorData.error
        ){

          message =
            errorData.error;

        }

      }catch(e){}


      throw new Error(
        message
      );

    }


    const contentType =
      response.headers.get(
        "content-type"
      ) || "";


    if(
      !contentType.includes(
        "image"
      )
    ){

      throw new Error(
        "Server ने valid image नहीं भेजी।"
      );

    }


    const blob =
      await response.blob();


    const imageUrl =
      URL.createObjectURL(
        blob
      );


    removeTyping();


    addGeneratedImage(
      imageUrl,
      blob
    );


    setStatus(
      "✅ Image तैयार है!"
    );


    /*
     * Composer से photo हटाएँ।
     */

    removePhoto();


  }catch(error){

    console.error(
      "Image error:",
      error
    );


    removeTyping();


    addAssistantMessage(
      "❌ " +
      (
        error.message ||
        "Image generation failed."
      )
    );


    setStatus(
      "Image generation failed."
    );

  }

}

/* =========================
   CLEAN BASE64
========================= */

function cleanBase64(
  value
){

  if(!value){
    return "";
  }


  if(
    value.startsWith(
      "data:"
    )
  ){

    const comma =
      value.indexOf(",");


    if(comma >= 0){

      value =
        value.substring(
          comma + 1
        );

    }

  }


  return value.replace(
    /\s/g,
    ""
  );

}


/* =========================
   HISTORY
========================= */

function saveHistory(
  blob
){

  const reader =
    new FileReader();


  reader.onloadend =
    async function(){

      try{

        const thumbnail =
          await makeThumbnail(
            reader.result
          );


        let history =
          JSON.parse(
            localStorage.getItem(
              "aaru_history"
            ) || "[]"
          );


        history.unshift(
          thumbnail
        );


        history =
          history.slice(
            0,
            12
          );


        localStorage.setItem(
          "aaru_history",
          JSON.stringify(
            history
          )
        );


        loadHistory();

      }catch(error){

        console.log(
          "History error:",
          error
        );

      }

    };


  reader.readAsDataURL(
    blob
  );

}


function makeThumbnail(
  dataUrl
){

  return new Promise(
    function(resolve){

      const img =
        new Image();


      img.onload =
        function(){

          const max =
            500;


          let width =
            img.width;

          let height =
            img.height;


          if(
            width > max
          ){

            const scale =
              max / width;


            width =
              Math.round(
                width * scale
              );


            height =
              Math.round(
                height * scale
              );

          }


          const canvas =
            document.createElement(
              "canvas"
            );


          canvas.width =
            width;


          canvas.height =
            height;


          const ctx =
            canvas.getContext(
              "2d"
            );


          ctx.drawImage(
            img,
            0,
            0,
            width,
            height
          );


          resolve(
            canvas.toDataURL(
              "image/jpeg",
              0.65
            )
          );

        };


      img.src =
        dataUrl;

    }
  );

}


/* =========================
   LOAD HISTORY
========================= */

function loadHistory(){

  let history = [];


  try{

    history =
      JSON.parse(
        localStorage.getItem(
          "aaru_history"
        ) || "[]"
      );

  }catch(error){

    history = [];

  }


  recentGrid.innerHTML =
    "";


  if(
    !history.length
  ){

    recentGrid.innerHTML =
      '<div class="recent-empty">अभी कोई creation नहीं है</div>';

    return;

  }


  history.forEach(
    function(imageData){

      const item =
        document.createElement(
          "div"
        );


      item.className =
        "recent-item";


      const img =
        document.createElement(
          "img"
        );


      img.src =
        imageData;


      img.loading =
        "lazy";


      item.appendChild(
        img
      );


      item.onclick =
        function(){

          const message =
            document.createElement(
              "div"
            );


          message.className =
            "message assistant";


          const inner =
            document.createElement(
              "div"
            );


          inner.className =
            "message-inner";


          const generated =
            document.createElement(
              "div"
            );


          generated.className =
            "generated";


          const preview =
            document.createElement(
              "img"
            );


          preview.src =
            imageData;


          const actions =
            document.createElement(
              "div"
            );


          actions.className =
            "image-actions";


          const download =
            document.createElement(
              "a"
            );


          download.href =
            imageData;


          download.download =
            "aaru-ai-history.jpg";


          download.textContent =
            "⬇️ Download";


          actions.appendChild(
            download
          );


          generated.appendChild(
            preview
          );


          generated.appendChild(
            actions
          );


          inner.appendChild(
            generated
          );


          message.appendChild(
            inner
          );


          chat.appendChild(
            message
          );


          scrollBottom();

        };


      recentGrid.appendChild(
        item
      );

    }
  );

}

  if(!ok){

  }


  chat.innerHTML =
    "";


  chat.appendChild(
    welcome
  );

}

========================= */

function resetTextarea(){

  promptInput.style.height =
    "42px";

}


/* =========================
   STATUS
========================= */

function setStatus(
  text
){

  status.textContent =
    text || "";

}


/* =========================
   SCROLL
========================= */

function scrollBottom(){

  setTimeout(
    function(){

      window.scrollTo(
        {
          top:
            document.body.scrollHeight,

          behavior:
            "smooth"
        }
      );

    },
    60
  );

}

loadHistory();
