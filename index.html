<!DOCTYPE html>
<html lang="hi">
<head>

      content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">

<style>
*{

}

html{
  margin:0;
  padding:0;

  overflow-y:auto;
  overscroll-behavior-y:auto;

button,

button{

}

main{

.header{

.menu-btn{

.drawer-overlay{

.drawer{

.drawer-head{

.drawer-title{

}

.close-drawer{

.drawer-body{

}

.drawer-action{

  align-items:center;
  gap:10px;
  border:0;
  color:#fff;

}

.drawer-action:hover{

}

.section-title{

}

.chat-history{

}

.chat-history-item{

.chat-history-item:hover{

}

.chat-history-item.active{

}

.chat-history-info{

}

.chat-history-title{

}

.chat-history-meta{

}

.delete-chat{

  height:30px;

  border:0;

}

.delete-chat:hover{

}

.empty-history{

.chat-wrap{

.messages{

.message.user .bubble,

.message.assistant .bubble{

    grid-template-columns:repeat(2,minmax(0,1fr));
  }

</style>
</head>

<script>
"use strict";


/* =========================================================
   CONFIG
========================================================= */

const API =
  "https://aaru-ai-api.myera-org.workers.dev/";


const CHAT_LIST_KEY =
  "aaru_chat_history_v2";


const OLD_CHAT_KEY =
  "aaru_chat_messages";


const IMAGE_KEY =
  "aaru_history";


const MAX_SAVED_CHATS = 8;
const MAX_MESSAGES_PER_CHAT = 30;
const MAX_MESSAGE_CHARS = 4000;
const MEMORY_SUMMARY_KEY = "aaru_smart_memory_v1";
const MEMORY_V3_KEY = "aaru_smart_memory_v3";
const MAX_MEMORY_SUMMARY_CHARS = 3200;
const MAX_RELEVANT_MEMORY_CHARS = 2600;
const MAX_SEMANTIC_MEMORIES = 80;
const CLIENT_INTELLIGENCE_VERSION = "5.1";
const CLIENT_MEMORY_ENGINE_VERSION = "5.1";
const MAX_WORKER_MEMORY_UPDATES = 40;

const MAX_SAVED_CREATIONS = 4;
const MAX_CREATION_PROMPT_CHARS = 300;
const MAX_HISTORY_IMAGE_CHARS = 420000;


/*
  Cloudflare FLUX.2 Klein 4B के लिए
  reference image 512x512 से छोटी होनी चाहिए।

  इसलिए 511 रखा गया है।
*/
const MAX_MODEL_IMAGE_SIZE = 511;


/* =========================================================
   STATE
========================================================= */

let chats = [];
let currentChatId = null;
let messages = [];
let memorySummary = "";
let semanticMemory = [];

let selectedPhotoBase64 = null;
let selectedPhotoUrl = null;
let selectedDocumentText = "";
let voiceOutputEnabled = true;
let recognition = null;

let isBusy = false;

let volatileCreations = [];

let creationsLoaded = false;

let appReady = false;

let lastPageShowRecovery = 0;


/* =========================================================
   DOM
========================================================= */

const messagesEl =
  document.getElementById("messages");

const promptEl =
  document.getElementById("prompt");

const sendBtn =
  document.getElementById("sendBtn");

const photoInput =
  document.getElementById("photoInput");

const photoPreview =
  document.getElementById("photoPreview");

const photoPreviewImg =
  document.getElementById("photoPreviewImg");

const chatHistoryEl =
  document.getElementById("chatHistory");

const creationGrid =
  document.getElementById("creationGrid");

const drawer =
  document.getElementById("drawer");

const drawerOverlay =
  document.getElementById("drawerOverlay");

const imageViewer =
  document.getElementById("imageViewer");

const viewerImg =
  document.getElementById("viewerImg");

const toastEl =
  document.getElementById("toast");

/* =========================================================
   HELPERS
========================================================= */

function makeChatId(){

  return "chat_" +
    Date.now().toString(36) +
    "_" +
    Math.random()
      .toString(36)
      .slice(2,9);
}


function makeImageId(){

  return "img_" +
    Date.now().toString(36) +
    "_" +
    Math.random()
      .toString(36)
      .slice(2,10);
}


function showToast(text){

  toastEl.textContent =
    String(text || "");

  toastEl.classList.add("show");

  clearTimeout(showToast.timer);

  showToast.timer =
    setTimeout(() => {

      toastEl.classList.remove(
        "show"
      );

    },2200);
}


function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


/* =========================================================
   MARKDOWN RENDERER
   IMPORTANT: UNCHANGED
========================================================= */

function cleanAaruText(text){
  return String(text ?? "")
    .replace(/<br\s*\/?>/gi,"\n")
    .replace(/<div\s*>/gi,"\n")
    .replace(/<\/div\s*>/gi,"\n")
    .replace(/\r\n/g,"\n")
    .replace(/\r/g,"\n")
    .replace(/\*\*(.*?)\*\*/gs,"$1")
    .replace(/(?<!\*)\*([^*\n]+)\*(?!\*)/g,"$1")
    .replace(/\n{3,}/g,"\n\n")
    .trim();
}

function cleanAaruChunk(text){
  return String(text ?? "")
    .replace(/<br\s*\/?>/gi,"\n")
    .replace(/\*\*/g,"")
    .replace(/(?<!\*)\*(?!\*)/g,"");
}

function inlineMarkdown(text){

  let s =
    escapeHTML(text);

  s =
    s.replace(
      /`([^`]+)`/g,
      "<code>$1</code>"
    );

  s =
    s.replace(
      /\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,
      '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>'
    );

  s =
    s.replace(
      /\*\*([^*]+)\*\*/g,
      "<strong>$1</strong>"
    );

  s =
    s.replace(
      /__([^_]+)__/g,
      "<strong>$1</strong>"
    );

  s =
    s.replace(
      /(?<!\*)\*([^*]+)\*(?!\*)/g,
      "<em>$1</em>"
    );

  s =
    s.replace(
      /(?<!_)_([^_]+)_(?!_)/g,
      "<em>$1</em>"
    );

  return s;
}


function renderMarkdown(text){

  const source = cleanAaruText(text);

  const lines =
    source.split("\n");

  let html = "";

  let inCode = false;

  let codeBuffer = [];

  let inUl = false;

  let inOl = false;

  let paragraph = [];


  function closeLists(){

    if(inUl){

      html += "</ul>";

      inUl = false;
    }

    if(inOl){

      html += "</ol>";

      inOl = false;
    }
  }


  function flushParagraph(buffer){

    if(!buffer.length){
      return;
    }

    const value =
      buffer.join("\n")
        .trim();

    if(!value){
      return;
    }

    html +=
      "<p>" +
      inlineMarkdown(
        value.replace(
          /\n/g,
          "<br>"
        )
      ) +
      "</p>";
  }


  for(let i=0;i<lines.length;i++){

    const line =
      lines[i];


    if(
      line.trim()
        .startsWith("```")
    ){

      if(inCode){

        html +=
          "<pre><code>" +
          escapeHTML(
            codeBuffer.join("\n")
          ) +
          "</code></pre>";

        codeBuffer = [];

        inCode = false;

      }else{

        flushParagraph(
          paragraph
        );

        paragraph = [];

        closeLists();

        inCode = true;
      }

      continue;
    }


    if(inCode){

      codeBuffer.push(
        line
      );

      continue;
    }


    if(!line.trim()){

      flushParagraph(
        paragraph
      );

      paragraph = [];

      closeLists();

      continue;
    }


    const h3 =
      line.match(
        /^###\s+(.+)$/
      );

    const h2 =
      line.match(
        /^##\s+(.+)$/
      );

    const h1 =
      line.match(
        /^#\s+(.+)$/
      );


    if(h1){

      flushParagraph(
        paragraph
      );

      paragraph = [];

      closeLists();

      html +=
        "<h1>" +
        inlineMarkdown(h1[1]) +
        "</h1>";

      continue;
    }


    if(h2){

      flushParagraph(
        paragraph
      );

      paragraph = [];

      closeLists();

      html +=
        "<h2>" +
        inlineMarkdown(h2[1]) +
        "</h2>";

      continue;
    }


    if(h3){

      flushParagraph(
        paragraph
      );

      paragraph = [];

      closeLists();

      html +=
        "<h3>" +
        inlineMarkdown(h3[1]) +
        "</h3>";

      continue;
    }


    const ul =
      line.match(
        /^\s*[-*+]\s+(.+)$/
      );

    const ol =
      line.match(
        /^\s*\d+[.)]\s+(.+)$/
      );


    if(ul){

      flushParagraph(
        paragraph
      );

      paragraph = [];

      if(inOl){

        html += "</ol>";

        inOl = false;
      }

      if(!inUl){

        html += "<ul>";

        inUl = true;
      }

      html +=
        "<li>" +
        inlineMarkdown(ul[1]) +
        "</li>";

      continue;
    }


    if(ol){

      flushParagraph(
        paragraph
      );

      paragraph = [];

      if(inUl){

        html += "</ul>";

        inUl = false;
      }

      if(!inOl){

        html += "<ol>";

        inOl = true;
      }

      html +=
        "<li>" +
        inlineMarkdown(ol[1]) +
        "</li>";

      continue;
    }


    const quote =
      line.match(
        /^\s*>\s?(.*)$/
      );


    if(quote){

      flushParagraph(
        paragraph
      );

      paragraph = [];

      closeLists();

      html +=
        "<blockquote>" +
        inlineMarkdown(quote[1]) +
        "</blockquote>";

      continue;
    }


    paragraph.push(
      line
    );
  }


  if(inCode){

    html +=
      "<pre><code>" +
      escapeHTML(
        codeBuffer.join("\n")
      ) +
      "</code></pre>";
  }


  flushParagraph(
    paragraph
  );

  closeLists();

  return html;
}


/* =========================================================
   STORAGE
========================================================= */

function storageAvailable(){

  try{

    const storage =
      window.localStorage;

    if(!storage){
      return false;
    }

    const key =
      "__aaru_test__";

    storage.setItem(
      key,
      "1"
    );

    storage.removeItem(
      key
    );

    return true;

  }catch(error){

    return false;
  }
}


const HAS_STORAGE =
  storageAvailable();


function safeGet(key){

  if(!HAS_STORAGE){
    return null;
  }

  try{

    return localStorage.getItem(
      key
    );

  }catch(error){

    return null;
  }
}


function safeSet(key,value){

  if(!HAS_STORAGE){
    return false;
  }

  try{

    localStorage.setItem(
      key,
      value
    );

    return true;

  }catch(error){

    console.warn(
      "Storage write failed:",
      key,
      error
    );

    return false;
  }
}


function safeRemove(key){

  if(!HAS_STORAGE){
    return;
  }

  try{

    localStorage.removeItem(
      key
    );

  }catch(error){}
}


/* =========================================================
   CHAT NORMALIZE
========================================================= */

function normalizeChat(chat){

  if(!chat){
    return null;
  }

  const id =
    String(chat.id || "");

  if(!id){
    return null;
  }


  const raw =
    Array.isArray(chat.messages)
      ? chat.messages
      : [];

  const savedMemory =
    String(chat.memorySummary || "").trim();

  const savedSemanticMemory =
    Array.isArray(chat.semanticMemory) ? chat.semanticMemory : [];


  const normalized =
    raw
      .slice(-MAX_MESSAGES_PER_CHAT)
      .map(item => {

        const result = {

          role:
            item.role === "user"
              ? "user"
              : "assistant",

          content:
            String(
              item.content ??
              item.text ??
              ""
            ).slice(
              0,
              MAX_MESSAGE_CHARS
            )
        };


        if(item.imageId){

          result.imageId =
            String(
              item.imageId
            ).slice(
              0,
              100
            );
        }


        return result;
      });


  let title =
    String(
      chat.title || ""
    )
    .trim()
    .slice(0,80);


  if(!title){

    const firstUser =
      normalized.find(
        item =>
          item.role === "user"
      );

    title =
      firstUser
        ? firstUser.content
            .replace(/\s+/g," ")
            .slice(0,80)
        : "नई चैट";
  }


  return {

    id,

    title:
      title || "नई चैट",

    messages:
      normalized,

    semanticMemory:
      normalizeSemanticMemory(savedSemanticMemory),

    createdAt:
      Number(
        chat.createdAt
      ) || Date.now(),

    updatedAt:
      Number(
        chat.updatedAt
      ) || Date.now()
  };
}


/* =========================================================
   LOAD CHAT HISTORY
========================================================= */

function loadChatHistory(){

  chats = [];

  const raw =
    safeGet(
      CHAT_LIST_KEY
    );


  if(raw){

    try{

      const parsed =
        JSON.parse(raw);

      if(Array.isArray(parsed)){

        const seen =
          new Set();

        chats =
          parsed
            .map(normalizeChat)
            .filter(Boolean)
            .filter(chat => {

              if(seen.has(chat.id)){
                return false;
              }

              seen.add(chat.id);

              return true;
            })
            .sort(
              (a,b) =>
                (b.updatedAt || 0) -
                (a.updatedAt || 0)
            )
            .slice(
              0,
              MAX_SAVED_CHATS
            );
      }

    }catch(error){

      console.warn(
        "Chat history corrupted:",
        error
      );

      safeRemove(
        CHAT_LIST_KEY
      );
    }

    return;
  }


  /*
    पुराने storage की migration।
  */

  const oldRaw =
    safeGet(
      OLD_CHAT_KEY
    );


  if(oldRaw){

    try{

      const old =
        JSON.parse(
          oldRaw
        );

      if(
        Array.isArray(old) &&
        old.length
      ){

        const now =
          Date.now();

        const migrated =
          normalizeChat({

            id:
              makeChatId(),

            title:
              "पुरानी चैट",

            messages:
              old,

            createdAt:
              now,

            updatedAt:
              now
          });


        if(migrated){
          chats = [migrated];
        }
      }

    }catch(error){}

    safeRemove(
      OLD_CHAT_KEY
    );
  }
}


/* =========================================================
   SAVE CHAT HISTORY
========================================================= */

function saveChatHistory(){

  if(!HAS_STORAGE){
    return;
  }


  const sorted =
    chats
      .slice()
      .sort(
        (a,b) =>
          (b.updatedAt || 0) -
          (a.updatedAt || 0)
      )
      .slice(
        0,
        MAX_SAVED_CHATS
      );


  /*
    पहले सामान्य save।
  */

  if(
    safeSet(
      CHAT_LIST_KEY,
      JSON.stringify(sorted)
    )
  ){

    chats = sorted;

    return;
  }


  /*
    Storage quota भरने पर कम chats।
  */

  for(
    const count of [6,4,3,2,1]
  ){

    const smaller =
      sorted.slice(
        0,
        count
      );

    if(
      safeSet(
        CHAT_LIST_KEY,
        JSON.stringify(smaller)
      )
    ){

      chats = sorted;

      return;
    }
  }


  /*
    Last resort:
    image history हटाकर chat बचाएँ।
  */

  safeRemove(
    IMAGE_KEY
  );


  const emergency =
    sorted.slice(
      0,
      3
    );


  safeSet(
    CHAT_LIST_KEY,
    JSON.stringify(
      emergency
    )
  );

  chats = sorted;
}


/* =========================================================
   NEW CHAT
========================================================= */

function createNewChat(
  persist = true
){

  const now =
    Date.now();


  const chat = {

    id:
      makeChatId(),

    title:
      "नई चैट",

    messages:
      [],

    semanticMemory:
      [],

    createdAt:
      now,

    updatedAt:
      now
  };


  chats.unshift(
    chat
  );


  chats =
    chats
      .sort(
        (a,b) =>
          (b.updatedAt || 0) -
          (a.updatedAt || 0)
      )
      .slice(
        0,
        MAX_SAVED_CHATS
      );


  currentChatId =
    chat.id;

  messages = [];
  semanticMemory = [];
  memorySummary = "";
  updateMemoryButton();


  if(persist){

    saveChatHistory();
  }


  return chat;
}


/* =========================================================
   ENSURE CURRENT CHAT
========================================================= */

function ensureCurrentChat(){

  if(currentChatId){

    const existing =
      chats.find(
        chat =>
          chat.id === currentChatId
      );

    if(existing){
      return existing;
    }
  }


  return createNewChat(
    true
  );
}


/* =========================================================
   SAVE CURRENT CHAT
========================================================= */

function saveCurrentChat(){

  const chat =
    ensureCurrentChat();


  semanticMemory = updateSemanticMemory(semanticMemory, messages);
  chat.semanticMemory = semanticMemory.slice(0, MAX_SEMANTIC_MEMORIES);
  chat.memorySummary = buildMemorySummary(messages);
  memorySummary = buildMemorySummaryFromSemanticMemory(semanticMemory) || chat.memorySummary;

  chat.messages =
    messages
      .slice(
        -MAX_MESSAGES_PER_CHAT
      )
      .map(item => {

        const result = {

          role:
            item.role === "user"
              ? "user"
              : "assistant",

          content:
            String(
              item.content || ""
            ).slice(
              0,
              MAX_MESSAGE_CHARS
            )
        };


        if(item.imageId){

          result.imageId =
            String(
              item.imageId
            ).slice(
              0,
              100
            );
        }


        return result;
      });


  const firstUser =
    chat.messages.find(
      item =>
        item.role === "user"
    );


  chat.title =
    firstUser
      ? firstUser.content
          .replace(/\s+/g," ")
          .slice(0,80)
      : "नई चैट";


  chat.updatedAt =
    Date.now();


  saveChatHistory();

  renderChatHistory();
}

========================================================= */

function openChat(id){

  const chat =
    chats.find(
      item =>
        item.id === id
    );


  if(!chat){
    return;
  }


  currentChatId =
    chat.id;


  messages =
    Array.isArray(
      chat.messages
    )
      ? chat.messages
          .slice(
            -MAX_MESSAGES_PER_CHAT
          )
      : [];


  isBusy =
    false;

  sendBtn.disabled =
    false;


  hideTyping();

  renderCurrentChat();

  renderChatHistory();

  scrollBottom();
}


/* =========================================================
   DELETE CHAT
========================================================= */

function deleteChat(id){

  const chat =
    chats.find(
      item =>
        item.id === id
    );


  if(!chat){
    return;
  }


  const ok =
    confirm(
      `क्या आप "${chat.title || "इस चैट"}" को डिलीट करना चाहते हैं?`
    );


  if(!ok){
    return;
  }


  chats =
    chats.filter(
      item =>
        item.id !== id
    );


  if(currentChatId === id){

    currentChatId =
      null;

    messages = [];

    createNewChat(
      true
    );

    renderCurrentChat();

  }else{

    saveChatHistory();
  }


  renderChatHistory();

  showToast(
    "चैट डिलीट कर दी गई।"
  );
}

/* =========================================================
   IMAGE HISTORY
========================================================= */

function getStoredCreations(){

  if(!HAS_STORAGE){
    return [];
  }


  const raw =
    safeGet(
      IMAGE_KEY
    );


  if(!raw){
    return [];
  }


  try{

    const parsed =
      JSON.parse(
        raw
      );


    if(!Array.isArray(parsed)){
      return [];
    }


    return parsed
      .filter(
        item =>
          item &&
          typeof item.image === "string"
      )
      .slice(
        0,
        MAX_SAVED_CREATIONS
      );

  }catch(error){

    console.warn(
      "Image history invalid:",
      error
    );

    safeRemove(
      IMAGE_KEY
    );

    return [];
  }
}


/* =========================================================
   CREATIONS
========================================================= */

function getCreations(){

  const stored =
    getStoredCreations();


  const all = [
    ...volatileCreations,
    ...stored
  ];


  const seen =
    new Set();


  return all
    .filter(item => {

      if(
        !item ||
        !item.image ||
        !item.id
      ){
        return false;
      }


      if(
        seen.has(
          item.id
        )
      ){
        return false;
      }


      seen.add(
        item.id
      );

      return true;
    })
    .sort(
      (a,b) =>
        (b.time || b.createdAt || 0) -
        (a.time || a.createdAt || 0)
    )
    .slice(
      0,
      MAX_SAVED_CREATIONS
    );
}


function findCreationById(id){

  if(!id){
    return null;
  }


  const volatile =
    volatileCreations.find(
      item =>
        item.id === id
    );


  if(volatile){
    return volatile;
  }


  return getStoredCreations()
    .find(
      item =>
        item.id === id
    ) || null;
}


/* =========================================================
   SAVE CREATIONS
========================================================= */

function saveCreations(list){

  if(!HAS_STORAGE){
    return false;
  }


  try{

    const clean =
      list
        .filter(
          item =>
            item &&
            item.image &&
            item.image.length <=
              MAX_HISTORY_IMAGE_CHARS
        )
        .slice(
          0,
          MAX_SAVED_CREATIONS
        );


    return safeSet(
      IMAGE_KEY,
      JSON.stringify(
        clean
      )
    );

  }catch(error){

    console.warn(
      "Creation save failed:",
      error
    );

    return false;
  }
}


/* =========================================================
   IMAGE BLOB HELPERS
========================================================= */

async function dataURLToBlob(
  dataURL
){

  if(!dataURL){
    throw new Error(
      "Image data missing"
    );
  }


  /*
    data:image/...;base64,...
  */

  if(
    dataURL.startsWith(
      "data:"
    )
  ){

    const parts =
      dataURL.split(",");

    const header =
      parts[0];

    const body =
      parts.slice(1).join(",");


    const mime =
      (
        header.match(
          /data:([^;]+)/
        ) || []
      )[1] ||
      "image/png";


    const binary =
      atob(body);


    const bytes =
      new Uint8Array(
        binary.length
      );


    for(
      let i=0;
      i<binary.length;
      i++
    ){

      bytes[i] =
        binary.charCodeAt(i);
    }


    return new Blob(
      [bytes],
      {
        type:mime
      }
    );
  }


  const response =
    await fetch(
      dataURL
    );


  if(!response.ok){

    throw new Error(
      "Image fetch failed"
    );
  }


  return response.blob();
}


async function blobToDataURL(
  blob
){

  return new Promise(
    (resolve,reject) => {

      const reader =
        new FileReader();


      reader.onload =
        () =>
          resolve(
            reader.result
          );


      reader.onerror =
        reject;


      reader.readAsDataURL(
        blob
      );
    }
  );
}


/* =========================================================
   IMAGE RESIZE
   IMPORTANT FOR FLUX.2 KLEIN REFERENCE IMAGE
========================================================= */

async function resizeImageDataURL(
  dataURL,
  maxSize = MAX_MODEL_IMAGE_SIZE,
  quality = .78
){

  if(!dataURL){
    return null;
  }


  const img =
    new Image();


  await new Promise(
    (resolve,reject) => {

      img.onload =
        resolve;

      img.onerror =
        reject;

      img.src =
        dataURL;
    }
  );


  const sourceWidth =
    img.naturalWidth ||
    img.width;


  const sourceHeight =
    img.naturalHeight ||
    img.height;


  if(
    !sourceWidth ||
    !sourceHeight
  ){

    return dataURL;
  }


  const scale =
    Math.min(
      1,
      maxSize /
      Math.max(
        sourceWidth,
        sourceHeight
      )
    );


  const width =
    Math.max(
      1,
      Math.round(
        sourceWidth * scale
      )
    );


  const height =
    Math.max(
      1,
      Math.round(
        sourceHeight * scale
      )
    );


  const canvas =
    document.createElement(
      "canvas"
    );


  canvas.width =
    width;

  canvas.height =
    height;


  const ctx =
    canvas.getContext(
      "2d"
    );


  if(!ctx){
    return dataURL;
  }


  ctx.drawImage(
    img,
    0,
    0,
    width,
    height
  );


  /*
    JPEG reference image काफी छोटा रहेगा।
  */

  return canvas.toDataURL(
    "image/jpeg",
    quality
  );
}


/* =========================================================
   HISTORY IMAGE
========================================================= */

async function blobToHistoryDataURL(
  blob,
  maxSize = 560
){

  try{

    const bitmap =
      await createImageBitmap(
        blob
      );


    /*
      IMPORTANT:
      dimensions close() से पहले save करें।
    */

    const originalWidth =
      bitmap.width;

    const originalHeight =
      bitmap.height;


    const scale =
      Math.min(
        1,
        maxSize /
        Math.max(
          originalWidth,
          originalHeight
        )
      );


    const width =
      Math.max(
        1,
        Math.round(
          originalWidth * scale
        )
      );


    const height =
      Math.max(
        1,
        Math.round(
          originalHeight * scale
        )
      );


    const canvas =
      document.createElement(
        "canvas"
      );


    canvas.width =
      width;

    canvas.height =
      height;


    const ctx =
      canvas.getContext(
        "2d"
      );


    if(!ctx){

      bitmap.close();

      return null;
    }


    ctx.drawImage(
      bitmap,
      0,
      0,
      width,
      height
    );


    bitmap.close();


    /*
      WebP preferred.
    */

    let dataURL =
      canvas.toDataURL(
        "image/webp",
        .70
      );


    /*
      Browser WebP support न करे तो JPEG।
    */

    if(
      !dataURL.startsWith(
        "data:image/webp"
      )
    ){

      dataURL =
        canvas.toDataURL(
          "image/jpeg",
          .70
        );
    }


    /*
      History के लिए hard limit।
    */

    if(
      dataURL.length >
      MAX_HISTORY_IMAGE_CHARS
    ){

      const smallerCanvas =
        document.createElement(
          "canvas"
        );


      const smallerMax =
        420;


      const smallerScale =
        Math.min(
          1,
          smallerMax /
          Math.max(
            originalWidth,
            originalHeight
          )
        );


      const smallWidth =
        Math.max(
          1,
          Math.round(
            originalWidth *
            smallerScale
          )
        );


      const smallHeight =
        Math.max(
          1,
          Math.round(
            originalHeight *
            smallerScale
          )
        );


      smallerCanvas.width =
        smallWidth;

      smallerCanvas.height =
        smallHeight;


      const smallerCtx =
        smallerCanvas.getContext(
          "2d"
        );


      if(!smallerCtx){
        return null;
      }


      /*
        Original bitmap बंद हो चुका है,
        इसलिए current canvas से downscale करें।
      */

      smallerCtx.drawImage(
        canvas,
        0,
        0,
        smallWidth,
        smallHeight
      );


      dataURL =
        smallerCanvas.toDataURL(
          "image/jpeg",
          .62
        );


      if(
        dataURL.length >
        MAX_HISTORY_IMAGE_CHARS
      ){

        return null;
      }
    }


    return dataURL;

  }catch(error){

    console.warn(
      "History image compression failed:",
      error
    );

    return null;
  }
}


/* =========================================================
   SAVE CREATION
========================================================= */

async function saveCreation(
  imageData,
  promptText
){

  if(!imageData){
    return null;
  }


  const imageId =
    makeImageId();


  /*
    Original image को localStorage में नहीं डालेंगे।
    पहले छोटा history copy बनाएँगे।
  */

  let historyImage =
    null;


  try{

    const blob =
      await dataURLToBlob(
        imageData
      );


    historyImage =
      await blobToHistoryDataURL(
        blob,
        560
      );

  }catch(error){

    console.warn(
      "Creation history conversion failed:",
      error
    );
  }


  /*
    अगर compressed history नहीं बनी,
    तो current session में full image रहेगी।
    localStorage में नहीं जाएगी।
  */

  const record = {

    id:
      imageId,

    image:
      historyImage ||
      imageData,

    prompt:
      String(
        promptText || ""
      ).slice(
        0,
        MAX_CREATION_PROMPT_CHARS
      ),

    time:
      Date.now()
  };


  volatileCreations.unshift(
    record
  );


  volatileCreations =
    volatileCreations.slice(
      0,
      MAX_SAVED_CREATIONS
    );


  /*
    केवल compressed image storage में save करें।
  */

  if(historyImage){

    const existing =
      getStoredCreations();


    const list =
      [
        {
          ...record,
          image:
            historyImage
        },
        ...existing
      ]
      .slice(
        0,
        MAX_SAVED_CREATIONS
      );


    if(
      saveCreations(
        list
      )
    ){

      /*
        Storage में successfully save हो गई,
        इसलिए duplicate volatile copy हटा दें।
      */

      volatileCreations =
        volatileCreations.filter(
          item =>
            item.id !== imageId
        );
    }
  }


  creationsLoaded =
    true;


  renderCreations();


  return imageId;
}

/* =========================================================
   IMAGE RESPONSE NORMALIZATION
========================================================= */

function normalizeImageResult(
  value
){

  if(!value){
    return null;
  }


  /*
    Direct data URL.
  */

  if(
    typeof value === "string"
  ){

    const s =
      value.trim();


    if(!s){
      return null;
    }


    if(
      s.startsWith(
        "data:image/"
      )
    ){

      return s;
    }


    /*
      URL भी स्वीकार करें।
    */

    if(
      /^https?:\/\//i.test(s)
    ){

      return s;
    }


    /*
      Raw Base64।
    */

    if(
      /^[A-Za-z0-9+/=\r\n]+$/.test(
        s
      )
    ){

      return (
        "data:image/png;base64," +
        s.replace(
          /\s/g,
          ""
        )
      );
    }


    return null;
  }


  /*
    Array response।
  */

  if(
    Array.isArray(value)
  ){

    for(
      const item of value
    ){

      const found =
        normalizeImageResult(
          item
        );

      if(found){
        return found;
      }
    }

    return null;
  }


  if(
    typeof value === "object"
  ){

    const candidates = [

      value.image,

      value.image_url,

      value.imageUrl,

      value.url,

      value.result,

      value.data
    ];


    for(
      const item of candidates
    ){

      const found =
        normalizeImageResult(
          item
        );

      if(found){
        return found;
      }
    }
  }


  return null;
}


/* =========================================================
   RAW IMAGE RESPONSE -> DATA URL
========================================================= */

async function responseToImage(
  response
){

  const contentType =
    (
      response.headers.get(
        "content-type"
      ) || ""
    ).toLowerCase();


  /*
    Worker अगर सीधे image/png,
    image/jpeg या image/webp लौटाता है।
  */

  if(
    contentType.startsWith(
      "image/"
    )
  ){

    const blob =
      await response.blob();


    return blobToDataURL(
      blob
    );
  }


  /*
    JSON response।
  */

  const text =
    await response.text();


  let data = null;


  try{

    data =
      text
        ? JSON.parse(text)
        : null;

  }catch(error){

    throw new Error(
      text ||
      "Image response पढ़ा नहीं जा सका।"
    );
  }


  if(!response.ok){

    throw new Error(
      data?.error ||
      data?.message ||
      data?.response ||
      "Image request failed."
    );
  }


  const image =
    normalizeImageResult(
      data
    );


  if(!image){

    throw new Error(
      "Image response में image नहीं मिली।"
    );
  }


  return image;
}

/* =========================================================
   SMART MEMORY 3.0
========================================================= */

const MEMORY_STOPWORDS = new Set([
  "और","या","लेकिन","यह","वह","एक","इस","उस","को","से","में","पर","के","की","का","कि","है","हैं","था","थे","थी","तो","भी","ही","अब","जब","तक","आप","तुम","मैं","हम","मुझे","मेरा","मेरी","करो","करना","करके","क्या","क्यों","कैसे","कौन","कब","कहाँ","लिए","साथ","बहुत","ज्यादा","कुछ","कोई",
  "the","and","or","but","this","that","with","from","for","are","is","was","were","you","your","what","why","how","who","when","where","please","can","could","would","should","about"
]);

function memoryTokens(text){
  return cleanAaruText(String(text || "").toLowerCase())
    .replace(/[^\p{L}\p{N}\s]/gu, " ")
    .split(/\s+/)
    .map(w => w.trim())
    .filter(w => w.length >= 3 && !MEMORY_STOPWORDS.has(w))
    .slice(0, 120);
}

function memoryKey(text){
  return memoryTokens(text).slice(0, 18).join(" ");
}

function memoryImportance(item, index, total){
  const text = cleanAaruText(String(item?.content || "")).trim();
  if(!text) return 0;

  let score = 1;
  const lower = text.toLowerCase();

  // User-stated information/preferences should survive longer.
  if(item?.role === "user") score += 2;
  if(/\b(मेरा|मेरी|मेरे|मैं|मुझे|हमारा|हमारी|i am|i'm|my|me|we|our|i like|i prefer|i want|i need)\b/i.test(lower)) score += 3;
  if(/याद|remember|भूलना|always|हमेशा|पसंद|preference|prefer|project|परियोजना|बनाना|develop|developer|code|कोड/i.test(lower)) score += 2;
  if(text.length > 80) score += 1;

  // Slight recency bonus among the older messages.
  score += Math.min(2, index / Math.max(1, total) * 2);
  return score;
}


function normalizeSemanticMemory(list){
  if(!Array.isArray(list)) return [];
  return list.filter(m => m && typeof m.key === "string" && typeof m.value === "string").map(m => ({
    id: String(m.id || makeMemoryId()),
    type: String(m.type || "fact").slice(0,30),
    key: cleanAaruText(m.key).trim().slice(0,140),
    value: cleanAaruText(m.value).trim().slice(0,500),
    source: String(m.source || "user").slice(0,20),
    importance: Math.max(1, Math.min(10, Number(m.importance) || 5)),
    updatedAt: Number(m.updatedAt) || Date.now()
  })).filter(m => m.key && m.value).sort((a,b) => b.importance - a.importance || b.updatedAt - a.updatedAt).slice(0,MAX_SEMANTIC_MEMORIES);
}
function makeMemoryId(){ return "mem_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2,8); }
function semanticMemoryKey(text){ return memoryTokens(text).slice(0,12).join(" "); }
function extractSemanticMemories(list){
  const out=[];
  for(const item of (Array.isArray(list)?list:[])){
    if(item?.role!=="user") continue;
    const text=cleanAaruText(String(item.content||"")).replace(/\s+/g," ").trim();
    if(!text || text.length<4) continue;
    const patterns=[
      [/^(?:मेरा नाम|my name is)\s+(.{1,100})$/i,"नाम","identity",7],
      [/^(?:मुझे|i)\s+(?:पसंद है|पसंद हैं|like|prefer)\s+(.{2,180})$/i,"पसंद","preference",7],
      [/^(?:मुझे|i)\s+(?:नापसंद है|dislike)\s+(.{2,180})$/i,"नापसंद","preference",7],
      [/^(?:याद रखना|याद रखो|remember)[:\s]+(.{2,220})$/i,"याद रखने का निर्देश","instruction",9],
      [/^(?:हमेशा|always)\s+(.{2,220})$/i,"स्थायी निर्देश","instruction",9]
    ];
    let matched=false;
    for(const [re,label,type,importance] of patterns){
      const m=text.match(re); if(!m) continue;
      const value=m[1].trim();
      out.push({key:label+" "+semanticMemoryKey(value),value,type,source:"user",importance,updatedAt:Date.now()});
      matched=true; break;
    }
    if(!matched && /aaru ai|प्रोजेक्ट|परियोजना|बना रहा|बनाना है|worker|index|कोड|code/i.test(text) && text.length<=500){
      out.push({key:"project "+semanticMemoryKey(text),value:text,type:"project",source:"user",importance:8,updatedAt:Date.now()});
    }
  }
  return out;
}
function updateSemanticMemory(existing,list){
  let mem=normalizeSemanticMemory(existing);
  for(const item of extractSemanticMemories(list)){
    const same=mem.findIndex(m => m.type===item.type && semanticMemoryKey(m.key)===semanticMemoryKey(item.key));
    if(same>=0) mem[same]={...mem[same],...item,id:mem[same].id}; else mem.unshift({...item,id:makeMemoryId()});
  }
  const seen=new Set();
  mem=mem.filter(m=>{const k=semanticMemoryKey(m.type+" "+m.key+" "+m.value); if(!k||seen.has(k)) return false; seen.add(k); return true;});
  return normalizeSemanticMemory(mem);
}
function buildMemorySummaryFromSemanticMemory(mem){ return normalizeSemanticMemory(mem).map(m=>`[${m.type}] ${m.key}: ${m.value}`).join("\n").slice(0,MAX_MEMORY_SUMMARY_CHARS); }
function getSemanticRelevantMemory(query){
  const q=new Set(memoryTokens(query)); if(!q.size||!semanticMemory.length) return "";
  return semanticMemory.map(m=>{let overlap=0;for(const t of new Set(memoryTokens(m.key+" "+m.value))) if(q.has(t)) overlap++;return {...m,score:overlap*2+m.importance*.35};}).filter(m=>m.score>=2.5).sort((a,b)=>b.score-a.score).slice(0,8).map(m=>`[${m.type}] ${m.key}: ${m.value}`).join("\n").slice(0,MAX_RELEVANT_MEMORY_CHARS);
}
function forgetSemanticMemory(query){
  const q=new Set(memoryTokens(query)); if(!q.size) return 0; const before=semanticMemory.length;
  semanticMemory=semanticMemory.filter(m=>{let overlap=0;for(const t of new Set(memoryTokens(m.key+" "+m.value))) if(q.has(t)) overlap++;return overlap<Math.max(1,Math.min(3,q.size));});
  return before-semanticMemory.length;
}
function isForgetMemoryCommand(text){ return /^(भूल जाओ|भूल जाएं|भूल जाइए|याद मत रखो|forget this|forget that|forget it|delete memory|remove memory)\b/i.test(String(text||"").trim()); }
function getForgetTarget(text){ return String(text||"").replace(/^(भूल जाओ|भूल जाएं|भूल जाइए|याद मत रखो|forget this|forget that|forget it|delete memory|remove memory)\b[:\s-]*/i,"").trim(); }
function updateMemoryButton(){ const el=document.getElementById("memoryBtnText"); if(el) el.textContent=`स्मार्ट मेमोरी (${semanticMemory.length})`; }
function showMemoryStatus(){ if(!semanticMemory.length){showToast("स्मार्ट मेमोरी में अभी कोई स्थायी तथ्य नहीं है।");return;} alert("Aaru की स्मार्ट मेमोरी:\n\n"+semanticMemory.slice(0,10).map(m=>`• ${m.key}: ${m.value}`).join("\n")+(semanticMemory.length>10?`\n\nऔर ${semanticMemory.length-10} यादें...`:"")); }

function buildMemorySummary(list){
  const all = Array.isArray(list) ? list : [];
  const older = all.slice(0, -12);
  if(!older.length) return "";

  const candidates = older.map((item, index) => ({
    item,
    index,
    score: memoryImportance(item, index, older.length),
    text: cleanAaruText(String(item?.content || "")).replace(/\s+/g, " ").trim()
  })).filter(x => x.text);

  // Keep important user facts/preferences first, while retaining useful recent context.
  candidates.sort((a,b) => b.score - a.score || b.index - a.index);

  const seen = new Set();
  const parts = [];
  for(const x of candidates){
    const key = memoryKey(x.text) || x.text.slice(0, 120).toLowerCase();
    if(!key || seen.has(key)) continue;
    seen.add(key);

    const label = x.item?.role === "user" ? "यूज़र" : "Aaru";
    const compact = x.text.slice(0, 360);
    parts.push(`${label}: ${compact}`);

    if(parts.join("\n").length >= MAX_MEMORY_SUMMARY_CHARS) break;
  }

  return parts.join("\n").slice(0, MAX_MEMORY_SUMMARY_CHARS);
}

function getRelevantMemory(query){
  const semantic = getSemanticRelevantMemory(query);
  const qTokens = new Set(memoryTokens(query));
  if(!qTokens.size || !messages.length) return semantic;

  const older = messages.slice(0, -12);
  const scored = older.map((item, index) => {
    const text = cleanAaruText(String(item?.content || "")).replace(/\s+/g, " ").trim();
    const tokens = memoryTokens(text);
    if(!text || !tokens.length) return null;

    let overlap = 0;
    const unique = new Set(tokens);
    for(const token of unique){
      if(qTokens.has(token)) overlap++;
    }

    // Phrase-level match is stronger than individual word overlap.
    const qClean = cleanAaruText(String(query || "")).toLowerCase().replace(/\s+/g, " ").trim();
    const tClean = text.toLowerCase();
    const phraseBonus = qClean.length >= 8 && tClean.includes(qClean.slice(0, Math.min(50, qClean.length))) ? 6 : 0;

    const importance = memoryImportance(item, index, older.length);
    const recency = index / Math.max(1, older.length);
    const score = overlap * 2 + phraseBonus + importance + recency;

    return { item, index, score, text };
  }).filter(Boolean)
    .filter(x => x.score >= 3)
    .sort((a,b) => b.score - a.score || b.index - a.index)
    .slice(0, 8);

  // Include the neighboring message when it helps preserve a user/assistant pair.
  const selected = [];
  const used = new Set();
  for(const x of scored){
    if(used.has(x.index)) continue;
    used.add(x.index);
    selected.push(x);

    const neighborIndex = x.item?.role === "user" ? x.index + 1 : x.index - 1;
    if(neighborIndex >= 0 && neighborIndex < older.length && selected.length < 8 && !used.has(neighborIndex)){
      const neighbor = older[neighborIndex];
      const nt = cleanAaruText(String(neighbor?.content || "")).replace(/\s+/g, " ").trim();
      if(nt){
        used.add(neighborIndex);
        selected.push({ item: neighbor, index: neighborIndex, score: x.score - 0.5, text: nt });
      }
    }
  }

  selected.sort((a,b) => a.index - b.index);
  const historical = selected.map(x => {
    const label = x.item?.role === "user" ? "यूज़र" : "Aaru";
    return `${label}: ${x.text.slice(0, 480)}`;
  }).join("\n").slice(0, MAX_RELEVANT_MEMORY_CHARS);
  return [semantic, historical].filter(Boolean).join("\n").slice(0, MAX_RELEVANT_MEMORY_CHARS);
}

function restoreChatMemory(chat){
  semanticMemory = normalizeSemanticMemory(chat?.semanticMemory || []);
  memorySummary = buildMemorySummaryFromSemanticMemory(semanticMemory) || String(chat?.memorySummary || "").slice(0, MAX_MEMORY_SUMMARY_CHARS);
  if(!memorySummary && messages.length > 12) memorySummary = buildMemorySummary(messages);
  updateMemoryButton();
}

function applyWorkerMemoryResponse(data){
  if(!data || typeof data !== "object") return;
  const workerMemory = Array.isArray(data.memory) ? data.memory : [];
  const updates = Array.isArray(data.memory_updates) ? data.memory_updates : [];

  if(workerMemory.length){
    semanticMemory = normalizeSemanticMemory(workerMemory).slice(0, MAX_SEMANTIC_MEMORIES);
  }

  for(const update of updates.slice(0, MAX_WORKER_MEMORY_UPDATES)){
    const action = String(update?.action || "").toLowerCase();

    if(action === "add" && update.memory){
      const incoming = normalizeSemanticMemory([update.memory])[0];
      if(incoming){
        const same = semanticMemory.findIndex(m => m.type === incoming.type && semanticMemoryKey(m.key) === semanticMemoryKey(incoming.key));
        if(same >= 0) semanticMemory[same] = {...semanticMemory[same], ...incoming};
        else semanticMemory.unshift(incoming);
      }
    }

    if(action === "update" && update.id){
      const index = semanticMemory.findIndex(m => m.id === String(update.id));
      if(index >= 0){
        semanticMemory[index] = {...semanticMemory[index], value:String(update.new_value || semanticMemory[index].value || "").slice(0,500), updatedAt:Date.now()};
      }
    }

    if(action === "delete" && update.target){
      forgetSemanticMemory(String(update.target));
    }
  }

  semanticMemory = normalizeSemanticMemory(semanticMemory).slice(0, MAX_SEMANTIC_MEMORIES);
  memorySummary = buildMemorySummaryFromSemanticMemory(semanticMemory) || memorySummary;
  updateMemoryButton();
}

/* =========================================================
   CHAT API
========================================================= */

async function sendChatRequest(){

  // Performance: send only the latest 12 messages.
  // The current user message is already inside messages via handleSend().
  const recentMessages =
    messages.slice(-12).map(item => ({
      role: item.role === "user" ? "user" : "assistant",
      content: cleanAaruText(
        String(item.content || "")
      ).slice(0, MAX_MESSAGE_CHARS)
    }));

  const lastUserMessage =
    messages
      .slice()
      .reverse()
      .find(item => item.role === "user");

  const currentQuery = lastUserMessage?.content || "";
  const relevantMemory = getRelevantMemory(currentQuery);

  const payload = {
    message: currentQuery,
    prompt: currentQuery,
    messages: recentMessages,
    memory_summary: memorySummary || buildMemorySummaryFromSemanticMemory(semanticMemory) || buildMemorySummary(messages),
    relevant_memory: relevantMemory,
    semantic_memory: semanticMemory.slice(0, MAX_SEMANTIC_MEMORIES),
    intelligence_layer: CLIENT_INTELLIGENCE_VERSION,
    client_version: CLIENT_INTELLIGENCE_VERSION,
    memory_engine: CLIENT_MEMORY_ENGINE_VERSION,
    stream: true
  };

  // Keep image generation / image understanding path unchanged.
  if(selectedPhotoBase64){
    payload.image_b64 =
      await resizeImageDataURL(
        selectedPhotoBase64,
        MAX_MODEL_IMAGE_SIZE,
        .76
      );
  }else{
    /* Automatically use the latest generated image for edit commands. */
    const latestEditReference =
      await getLatestCreationReference(
        lastUserMessage?.content || ""
      );

    if(latestEditReference){
      payload.image_b64 =
        await resizeImageDataURL(
          latestEditReference,
          MAX_MODEL_IMAGE_SIZE,
          .76
        );
    }
  }

  // Keep PDF support unchanged.
  if(selectedDocumentText){
    payload.document_text =
      selectedDocumentText.slice(0, 90000);
  }

  const response =
    await fetch(API + "chat", {
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify(payload)
    });

  const contentType =
    (response.headers.get("content-type") || "")
      .toLowerCase();

  // Image response: do not modify the working image path.
  if(contentType.startsWith("image/")){
    const image =
      await blobToDataURL(await response.blob());

    if(!response.ok){
      throw new Error("Chat image request failed.");
    }

    return {
      text:"इमेज तैयार है।",
      image
    };
  }

  if(!response.ok){
    const errText =
      await response.text();

    let errData = null;

    try{
      errData =
        errText ? JSON.parse(errText) : null;
    }catch{}

    throw new Error(
      errData?.error ||
      errData?.message ||
      errText ||
      "Chat request failed."
    );
  }

  const isStream =
    contentType.includes("text/event-stream") &&
    response.body;

  // Non-stream response fallback.
  if(!isStream){
    const raw = await response.text();
    let data = null;

    try{
      data = raw ? JSON.parse(raw) : null;
    }catch{
      return {
        text:cleanAaruText(raw),
        image:null
      };
    }

    return normalizeChatResult(data);
  }

  hideTyping();

  const row =
    document.createElement("div");

  row.className = "message assistant";
  row.id = "streamingMessage";

  const bubble =
    document.createElement("div");

  bubble.className = "bubble md";

  bubble.innerHTML =
    '<div class="typing"><span></span><span></span><span></span></div>';

  row.appendChild(bubble);
  messagesEl.appendChild(row);
  scrollBottom();

  let fullText = "";
  let buffer = "";

  // Performance: do not re-render DOM for every SSE chunk.
  let renderPending = false;
  let streamFinished = false;

  function extractStreamText(obj){
    if(obj == null) return "";
    if(typeof obj === "string") return obj;

    return (
      obj.response ??
      obj.text ??
      obj.content ??
      obj.delta ??
      obj.output_text ??
      obj.token ??
      obj.choices?.[0]?.delta?.content ??
      obj.choices?.[0]?.text ??
      obj.result?.response ??
      obj.result?.text ??
      ""
    );
  }

  function scheduleStreamRender(){
    if(renderPending) return;

    renderPending = true;

    requestAnimationFrame(() => {
      renderPending = false;

      bubble.innerHTML =
        renderMarkdown(fullText || "");

      if(!streamFinished){
        scrollBottom();
      }
    });
  }

  function consumeEvent(eventText){
    const lines = eventText.split(/\n/);

    for(const line of lines){
      const trimmed = line.trim();

      if(!trimmed || trimmed.startsWith(":")){
        continue;
      }

      if(!trimmed.startsWith("data:")){
        continue;
      }

      const dataText =
        trimmed.slice(5).trim();

      if(!dataText || dataText === "[DONE]"){
        continue;
      }

      let value = dataText;

      try{
        value =
          extractStreamText(
            JSON.parse(dataText)
          );
      }catch{}

      if(value){
        const chunk =
          cleanAaruChunk(String(value));

        if(chunk){
          fullText += chunk;
          scheduleStreamRender();
        }
      }
    }
  }

  const reader =
    response.body.getReader();

  const decoder =
    new TextDecoder();

  while(true){
    const {value,done} =
      await reader.read();

    if(done) break;

    buffer +=
      decoder.decode(
        value,
        {stream:true}
      );

    const events =
      buffer.split(/\n\n|\r\n\r\n/);

    buffer =
      events.pop() || "";

    for(const event of events){
      consumeEvent(event);
    }
  }

  buffer += decoder.decode();

  if(buffer.trim()){
    consumeEvent(buffer);
  }

  // Make sure the final frame is rendered before returning.
  streamFinished = true;

  await new Promise(resolve =>
    requestAnimationFrame(resolve)
  );

  bubble.innerHTML =
    renderMarkdown(fullText || "");

  scrollBottom();

  row.remove();

  return {
    text:cleanAaruText(fullText),
    image:null
  };
}


/* =========================================================
   HANDLE SEND
   Unified composer: text + photo + image generation/editing
========================================================= */

async function handleSend(){

  if(isBusy){
    return;
  }

  const prompt =
    promptEl.value.trim();

  const hasPhoto =
    !!selectedPhotoBase64;

  const hasDocument =
    !!selectedDocumentText;

  /* ChatGPT-style: photo alone can be sent. */
  if(!prompt && !hasPhoto && !hasDocument){
    showToast(
      "कुछ लिखें या photo जोड़ें।"
    );
    return;
  }

  ensureCurrentChat();

  isBusy =
    true;

  sendBtn.disabled =
    true;

  const attachedPhoto =
    selectedPhotoUrl;

  if(hasDocument && !prompt){
    promptEl.value = "इस PDF को पढ़कर समझाइए।";
  }

  const displayPrompt = prompt || (hasDocument ? "इस PDF को पढ़कर समझाइए।" : "इस तस्वीर को समझाइए।");

  addUserMessage(
    displayPrompt,
    false,
    attachedPhoto
  );

  if(isForgetMemoryCommand(displayPrompt)){
    const target=getForgetTarget(displayPrompt);
    const removed=target ? forgetSemanticMemory(target) : semanticMemory.length;
    if(!target) semanticMemory=[];
    saveCurrentChat();
    addAssistantMessage(removed ? `ठीक है, ${removed} मेमोरी हटा दी गई।` : "ठीक है, मेमोरी हटा दी गई।", true);
    promptEl.value=""; autoResize(); clearSelectedPhoto(); isBusy=false; sendBtn.disabled=false;
    return;
  }

  semanticMemory=updateSemanticMemory(semanticMemory,[messages[messages.length-1]]);
  saveCurrentChat();

  promptEl.value =
    "";

  autoResize();
  scrollBottom();

  try{

    showTyping();

    /*
      One unified route. Worker /chat automatically decides:
      normal chat, Vision, image generation or image editing.
    */
    const result =
      await sendChatRequest();

    saveCurrentChat();

    hideTyping();

    if(result && result.image){

      const imageId =
        await saveCreation(
          result.image,
          prompt || "Image generation"
        );

      addAssistantMessage(
        result.text ||
        "🖼️ Image generated successfully.",
        true,
        imageId
      );

    }else{

      const finalText =
        cleanAaruText(
          result?.text ||
          "माफ़ कीजिए, इस समय मुझे जवाब तैयार करने में समस्या हुई।"
        );

      addAssistantMessage(
        finalText,
        true
      );

      if(voiceOutputEnabled && finalText){
        speakAaru(finalText);
      }
    }

    clearSelectedPhoto();

  }catch(error){

    console.error(
      "Aaru request failed:",
      error
    );

    hideTyping();

    addAssistantMessage(
      "⚠️ अभी request पूरी नहीं हो सकी। कृपया थोड़ी देर बाद फिर कोशिश करें।",
      true
    );

    showToast(
      error?.message ||
      "Request failed"
    );

  }finally{

    isBusy =
      false;

    sendBtn.disabled =
      false;

    scrollBottom();

    try{
      promptEl.focus();
    }catch(error){}
  }
}

   VOICE OUTPUT
========================================================= */

function speakAaru(text){
  if(!voiceOutputEnabled || !("speechSynthesis" in window) || !text) return;
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(cleanAaruText(text));
    u.lang = /[\u0900-\u097F]/.test(text) ? "hi-IN" : "en-US";
    u.rate = .98;
    speechSynthesis.speak(u);
  }catch(error){
    console.warn("Voice output failed:",error);
  }
}

/* =========================================================
   VOICE INPUT
========================================================= */

function startAaruVoice(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){
    showToast("इस browser में Voice Input उपलब्ध नहीं है।");
    return;
  }
  if(recognition){
    try{ recognition.stop(); }catch(error){}
    recognition = null;
    document.getElementById("micBtn")?.classList.remove("voice-active");
    return;
  }
  recognition = new SR();
  recognition.lang = "hi-IN";
  recognition.interimResults = false;
  recognition.continuous = false;
  recognition.onstart = () => {
    document.getElementById("micBtn")?.classList.add("voice-active");
    showToast("सुन रहा हूँ…");
  };
  recognition.onresult = event => {
    const text = event.results?.[0]?.[0]?.transcript || "";
    if(text){
      promptEl.value = text;
      autoResize();
      promptEl.focus();
    }
  };
  recognition.onerror = event => {
    showToast("Voice error: " + (event.error || "unknown"));
  };
  recognition.onend = () => {
    recognition = null;
    document.getElementById("micBtn")?.classList.remove("voice-active");
  };
  try{ recognition.start(); }
  catch(error){
    recognition = null;
    document.getElementById("micBtn")?.classList.remove("voice-active");
  }
}

async function extractPDFText(file){
  const pdfjs = await import("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs");
  pdfjs.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs";
  const data = new Uint8Array(await file.arrayBuffer());
  const pdf = await pdfjs.getDocument({data}).promise;
  let output = "";
  for(let pageNo=1; pageNo<=pdf.numPages; pageNo++){
    setToastProgress(`PDF पढ़ा जा रहा है… ${pageNo}/${pdf.numPages}`);
    const page = await pdf.getPage(pageNo);
    const content = await page.getTextContent();
    const text = content.items.map(item => item.str || "").join(" ");
    output += `\n\n--- Page ${pageNo} ---\n${text}`;
    if(output.length >= 90000) break;
  }
  return output.trim().slice(0,90000);
}

function setToastProgress(text){
  showToast(text);
}

async function handlePDFFile(file){
  try{
    selectedDocumentText = await extractPDFText(file);
    if(!selectedDocumentText){
      showToast("PDF में पढ़ने योग्य text नहीं मिला।");
      return;
    }
    selectedPhotoBase64 = null;
    selectedPhotoUrl = null;
    photoPreview.classList.remove("show");
    photoPreviewImg.src = "";
    showToast(`PDF तैयार है: ${selectedDocumentText.length.toLocaleString()} अक्षर`);
  }catch(error){
    console.error("PDF failed:",error);
    selectedDocumentText = "";
    showToast("PDF पढ़ने में समस्या हुई।");
  }
}

      );

    }finally{

      /*
        Same file दोबारा select हो सके।
      */

      photoInput.value =
        "";
    }
  });


function fileToDataURL(file){

  return new Promise(
    (resolve,reject) => {

      const reader =
        new FileReader();


      reader.onload =
        () =>
          resolve(
            reader.result
          );


      reader.onerror =
        reject;


      reader.readAsDataURL(
        file
      );
    }
  );
}

/* =========================================================
   PAGE RECOVERY
========================================================= */

function recoverPage(){

  const now =
    Date.now();


  if(
    now -
    lastPageShowRecovery <
    300
  ){

    return;
  }


  lastPageShowRecovery =
    now;


  try{

    hideTyping();

  }catch(error){}


  isBusy =
    false;

  sendBtn.disabled =
    false;


  try{

    closeDrawer();

    closeImageViewer();

  }catch(error){}


  try{

    const current =
      chats.find(
        item =>
          item.id ===
          currentChatId
      );


    if(current){

      messages =
        Array.isArray(
          current.messages
        )
          ? current.messages
              .slice(
                -MAX_MESSAGES_PER_CHAT
              )
          : [];
    }


    renderCurrentChat();

    renderChatHistory();

    updateModeButtons();

    autoResize();

  }catch(error){

    console.error(
      "Recovery failed:",
      error
    );
  }
}


/* =========================================================
   PAGESHOW
========================================================= */

window.addEventListener(
  "pageshow",
  event => {

    if(!appReady){
      return;
    }


    if(event.persisted){

      recoverPage();

      return;
    }


    if(
      document.visibilityState ===
      "visible"
    ){

      setTimeout(
        recoverPage,
        50
      );
    }
  }
);


/* =========================================================
   VISIBILITY
========================================================= */

document.addEventListener(
  "visibilitychange",
  () => {

    if(
      document.visibilityState ===
      "visible" &&
      appReady
    ){

      setTimeout(
        () => {

          try{

            hideTyping();

            isBusy =
              false;

            sendBtn.disabled =
              false;

          }catch(error){}

        },
        80
      );
    }
  }
);


/* =========================================================
   INITIAL LOAD
========================================================= */

function safeInitialLoad(){

  try{

    loadChatHistory();

  }catch(error){

    console.error(
      "Chat history load failed:",
      error
    );

    chats = [];

    currentChatId =
      null;

    messages = [];
  }


  try{

    if(!chats.length){

      /*
        Startup पर localStorage write नहीं।
      */

      createNewChat(
        false
      );

    }else{

      const latest =
        chats
          .slice()
          .sort(
            (a,b) =>
              (b.updatedAt || 0) -
              (a.updatedAt || 0)
          )[0];


      if(latest){

        currentChatId =
          latest.id;


        messages =
          Array.isArray(
            latest.messages
          )
            ? latest.messages
                .slice(
                  -MAX_MESSAGES_PER_CHAT
                )
            : [];
        restoreChatMemory(latest);
      }
    }


  }catch(error){

    console.error(
      "Chat initialization failed:",
      error
    );

    chats = [];

    messages = [];

    currentChatId =
      null;


    createNewChat(
      false
    );
  }


  /*
    Chat पहले render।
  */

  renderCurrentChat();

  renderChatHistory();


  /*
    Image history startup पर parse नहीं।
  */

  creationGrid.innerHTML =
    `
      <div class="empty-history">
        Images देखने के लिए Menu खोलें।
      </div>
    `;


  updateModeButtons();

  autoResize();


  setTimeout(
    () => {

      try{

        window.scrollTo({
          top:
            document.documentElement
              .scrollHeight,

          behavior:"auto"
        });

      }catch(error){}

    },
    80
  );


  appReady =
    true;
}


const memoryBtn = document.getElementById("memoryBtn");
if(memoryBtn) memoryBtn.addEventListener("click", showMemoryStatus);

/* =========================================================
   START
========================================================= */

if(
  document.readyState ===
  "loading"
){

  document.addEventListener(
    "DOMContentLoaded",
    safeInitialLoad,
    {
      once:true
    }
  );

}else{

  setTimeout(
    safeInitialLoad,
    0
  );
}

window.addEventListener(

window.addEventListener(
