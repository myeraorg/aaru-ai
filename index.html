<script>
"use strict";

const API = "https://aaru-ai-api.myera-org.workers.dev/";
const CHAT_LIST_KEY = "aaru_chat_history_v2";
const OLD_CHAT_KEY = "aaru_chat_messages";
const IMAGE_KEY = "aaru_history";

const MAX_SAVED_CHATS = 8;
const MAX_MESSAGES_PER_CHAT = 30;
const MAX_MESSAGE_CHARS = 4000;
const MAX_SAVED_CREATIONS = 4;
const MAX_CREATION_PROMPT_CHARS = 300;
const MAX_HISTORY_IMAGE_CHARS = 420000;
const MAX_MODEL_IMAGE_SIZE = 511;

let chats = [];
let currentChatId = null;
let messages = [];

let selectedFileContent = null; // Base64 image or extracted PDF text
let selectedFileType = null; // 'image' or 'pdf'
let selectedFileUrl = null;
let isBusy = false;
let volatileCreations = [];
let creationsLoaded = false;
let appReady = false;
let lastPageShowRecovery = 0;

const messagesEl = document.getElementById("messages");
const promptEl = document.getElementById("prompt");
const sendBtn = document.getElementById("sendBtn");
const fileInput = document.getElementById("fileInput");
const filePreview = document.getElementById("filePreview");
const filePreviewImg = document.getElementById("filePreviewImg");
const filePreviewText = document.getElementById("filePreviewText");
const chatHistoryEl = document.getElementById("chatHistory");
const creationGrid = document.getElementById("creationGrid");
const drawer = document.getElementById("drawer");
const drawerOverlay = document.getElementById("drawerOverlay");
const imageViewer = document.getElementById("imageViewer");
const viewerImg = document.getElementById("viewerImg");
const toastEl = document.getElementById("toast");
const micBtn = document.getElementById("micBtn");

function makeChatId(){ return "chat_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2,9); }
function makeImageId(){ return "img_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2,10); }

function showToast(text){
  toastEl.textContent = String(text || "");
  toastEl.classList.add("show");
  clearTimeout(showToast.timer);
  showToast.timer = setTimeout(() => { toastEl.classList.remove("show"); }, 2200);
}

function escapeHTML(value){
  return String(value ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
}

/* ================= VOICE INPUT (Speech-to-Text) ================= */
let recognition = null;
if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition = new SpeechRecognition();
  recognition.lang = 'hi-IN'; // हिंदी सपोर्ट के लिए, जरूरत पड़ने पर बदला जा सकता है
  recognition.interimResults = false;
  
  recognition.onstart = () => { micBtn.classList.add("recording"); showToast("सुन रहे हैं... बोलिए"); };
  recognition.onresult = (event) => {
    const transcript = event.results[0][0].transcript;
    promptEl.value += (promptEl.value ? " " : "") + transcript;
    autoResize();
  };
  recognition.onerror = () => { showToast("वॉयस रिकग्निशन में त्रुटि हुई।"); };
  recognition.onend = () => { micBtn.classList.remove("recording"); };
}

micBtn.addEventListener("click", () => {
  if (!recognition) {
    showToast("आपका ब्राउज़र वॉयस इनपुट सपोर्ट नहीं करता।");
    return;
  }
  try {
    recognition.start();
  } catch(e) {
    recognition.stop();
  }
});

/* ================= VOICE OUTPUT (Text-to-Speech) ================= */
function speakText(text) {
  if (!('speechSynthesis' in window)) {
    showToast("आपका ब्राउज़र स्पीच आउटपुट सपोर्ट नहीं करता।");
    return;
  }
  window.speechSynthesis.cancel();
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = 'hi-IN';
  window.speechSynthesis.speak(utterance);
  showToast("बोला जा रहा है...");
}

/* ================= PDF READER (PDF to Text) ================= */
async function parsePdfFile(file) {
  try {
    const arrayBuffer = await file.arrayBuffer();
    const loadingTask = pdfjsLib.getDocument({ data: arrayBuffer });
    const pdfDoc = await loadingTask.promise;
    let fullText = "";
    for (let i = 1; i <= pdfDoc.numPages; i++) {
      const page = await pdfDoc.getPage(i);
      const textContent = await page.getTextContent();
      const pageText = textContent.items.map(item => item.str).join(" ");
      fullText += `--- Page ${i} ---\n` + pageText + "\n\n";
    }
    return fullText;
  } catch (err) {
    console.error("PDF parse error:", err);
    throw new Error("PDF फाइल को पढ़ा नहीं जा सका।");
  }
}

/* ================= MARKDOWN RENDERER ================= */
function inlineMarkdown(text){
  let s = escapeHTML(text);
  s = s.replace(/`([^`]+)`/g, "<code>$1</code>");
  s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  s = s.replace(/__([^_]+)__/g, "<strong>$1</strong>");
  s = s.replace(/(?<!\*)\*([^*]+)\*(?!\*)/g, "<em>$1</em>");
  s = s.replace(/(?<!_)_([^_]+)_(?!_)/g, "<em>$1</em>");
  return s;
}

function renderMarkdown(text){
  const source = String(text ?? "").replace(/\r\n/g,"\n").replace(/\r/g,"\n");
  const lines = source.split("\n");
  let html = "", inCode = false, codeBuffer = [], inUl = false, inOl = false, paragraph = [];

  function closeLists(){
    if(inUl){ html += "</ul>"; inUl = false; }
    if(inOl){ html += "</ol>"; inOl = false; }
  }
  function flushParagraph(buffer){
    if(!buffer.length) return;
    const value = buffer.join("\n").trim();
    if(!value) return;
    html += "<p>" + inlineMarkdown(value.replace(/\n/g, "<br>")) + "</p>";
  }

  for(let i=0;i<lines.length;i++){
    const line = lines[i];
    if(line.trim().startsWith("```")){
      if(inCode){
        html += "<pre><code>" + escapeHTML(codeBuffer.join("\n")) + "</code></pre>";
        codeBuffer = []; inCode = false;
      }else{
        flushParagraph(paragraph); paragraph = []; closeLists(); inCode = true;
      }
      continue;
    }
    if(inCode){ codeBuffer.push(line); continue; }
    if(!line.trim()){ flushParagraph(paragraph); paragraph = []; closeLists(); continue; }

    const h3 = line.match(/^###\s+(.+)$/);
    const h2 = line.match(/^##\s+(.+)$/);
    const h1 = line.match(/^#\s+(.+)$/);

    if(h1){ flushParagraph(paragraph); paragraph = []; closeLists(); html += "<h1>" + inlineMarkdown(h1[1]) + "</h1>"; continue; }
    if(h2){ flushParagraph(paragraph); paragraph = []; closeLists(); html += "<h2>" + inlineMarkdown(h2[1]) + "</h2>"; continue; }
    if(h3){ flushParagraph(paragraph); paragraph = []; closeLists(); html += "<h3>" + inlineMarkdown(h3[1]) + "</h3>"; continue; }

    const ul = line.match(/^\s*[-*+]\s+(.+)$/);
    const ol = line.match(/^\s*\d+[.)]\s+(.+)$/);

    if(ul){
      flushParagraph(paragraph); paragraph = [];
      if(inOl){ html += "</ol>"; inOl = false; }
      if(!inUl){ html += "<ul>"; inUl = true; }
      html += "<li>" + inlineMarkdown(ul[1]) + "</li>"; continue;
    }
    if(ol){
      flushParagraph(paragraph); paragraph = [];
      if(inUl){ html += "</ul>"; inUl = false; }
      if(!inOl){ html += "<ol>"; inOl = true; }
      html += "<li>" + inlineMarkdown(ol[1]) + "</li>"; continue;
    }
    paragraph.push(line);
  }
  if(inCode){ html += "<pre><code>" + escapeHTML(codeBuffer.join("\n")) + "</code></pre>"; }
  flushParagraph(paragraph); closeLists();
  return html;
}

function storageAvailable(){
  try{ const storage = window.localStorage; const key = "__aaru_test__"; storage.setItem(key, "1"); storage.removeItem(key); return true; }catch(e){ return false; }
}
const HAS_STORAGE = storageAvailable();
function safeGet(key){ return HAS_STORAGE ? localStorage.getItem(key) : null; }
function safeSet(key,value){ if(!HAS_STORAGE) return false; try{ localStorage.setItem(key, value); return true; }catch(e){ return false; } }
function safeRemove(key){ if(HAS_STORAGE) localStorage.removeItem(key); }

function normalizeChat(chat){
  if(!chat) return null;
  const id = String(chat.id || "");
  if(!id) return null;
  const raw = Array.isArray(chat.messages) ? chat.messages : [];
  const normalized = raw.slice(-MAX_MESSAGES_PER_CHAT).map(item => ({
    role: item.role === "user" ? "user" : "assistant",
    content: String(item.content ?? "").slice(0, MAX_MESSAGE_CHARS),
    imageId: item.imageId ? String(item.imageId).slice(0, 100) : undefined
  }));
  let title = String(chat.title || "").trim().slice(0, 80);
  if(!title){
    const firstUser = normalized.find(item => item.role === "user");
    title = firstUser ? firstUser.content.replace(/\s+/g," ").slice(0,80) : "नई चैट";
  }
  return { id, title: title || "नई चैट", messages: normalized, createdAt: Number(chat.createdAt) || Date.now(), updatedAt: Number(chat.updatedAt) || Date.now() };
}

function loadChatHistory(){
  chats = [];
  const raw = safeGet(CHAT_LIST_KEY);
  if(raw){
    try{
      const parsed = JSON.parse(raw);
      if(Array.isArray(parsed)){
        const seen = new Set();
        chats = parsed.map(normalizeChat).filter(Boolean).filter(chat => {
          if(seen.has(chat.id)) return false;
          seen.add(chat.id); return true;
        }).sort((a,b) => (b.updatedAt || 0) - (a.updatedAt || 0)).slice(0, MAX_SAVED_CHATS);
      }
    }catch(e){ safeRemove(CHAT_LIST_KEY); }
    return;
  }
}

function saveChatHistory(){
  if(!HAS_STORAGE) return;
  const sorted = chats.slice().sort((a,b) => (b.updatedAt || 0) - (a.updatedAt || 0)).slice(0, MAX_SAVED_CHATS);
  safeSet(CHAT_LIST_KEY, JSON.stringify(sorted));
  chats = sorted;
}

function createNewChat(persist = true){
  const now = Date.now();
  const chat = { id: makeChatId(), title: "नई चैट", messages: [], createdAt: now, updatedAt: now };
  chats.unshift(chat);
  chats = chats.slice(0, MAX_SAVED_CHATS);
  currentChatId = chat.id;
  messages = [];
  if(persist) saveChatHistory();
  return chat;
}

function ensureCurrentChat(){
  if(currentChatId){
    const existing = chats.find(chat => chat.id === currentChatId);
    if(existing) return existing;
  }
  return createNewChat(true);
}

function saveCurrentChat(){
  const chat = ensureCurrentChat();
  chat.messages = messages.slice(-MAX_MESSAGES_PER_CHAT).map(item => ({
    role: item.role === "user" ? "user" : "assistant",
    content: String(item.content || "").slice(0, MAX_MESSAGE_CHARS),
    imageId: item.imageId ? String(item.imageId).slice(0, 100) : undefined
  }));
  const firstUser = chat.messages.find(item => item.role === "user");
  chat.title = firstUser ? firstUser.content.replace(/\s+/g," ").slice(0,80) : "नई चैट";
  chat.updatedAt = Date.now();
  saveChatHistory();
  renderChatHistory();
}

function renderCurrentChat(){
  messagesEl.innerHTML = "";
  const list = Array.isArray(messages) ? messages.slice(-MAX_MESSAGES_PER_CHAT) : [];
  list.forEach(item => {
    if(item.role === "user"){
      addUserMessage(item.content, false);
    }else{
      addAssistantMessage(item.content, false, item.imageId || null);
    }
  });
}

function addUserMessage(text, persist = true, imageUrl = null){
  const value = String(text || "");
  messages.push({ role: "user", content: value });
  const row = document.createElement("div");
  row.className = "message user";
  const bubble = document.createElement("div");
  bubble.className = "bubble";

  if(imageUrl){
    const img = document.createElement("img");
    img.className = "attached-user-image";
    img.src = imageUrl;
    img.alt = "Attached image";
    img.addEventListener("click", () => openImageViewer(imageUrl));
    bubble.appendChild(img);
  }
  if(value){
    const textNode = document.createElement("div");
    textNode.textContent = value;
    bubble.appendChild(textNode);
  }
  row.appendChild(bubble);
  messagesEl.appendChild(row);
  if(persist) saveCurrentChat();
}

function addAssistantMessage(text, persist = true, imageId = null){
  const value = String(text || "");
  messages.push({ role: "assistant", content: value, imageId });
  const row = document.createElement("div");
  row.className = "message assistant";
  const bubble = document.createElement("div");
  bubble.className = "bubble md";
  bubble.innerHTML = renderMarkdown(value);

  if(imageId){
    const creation = findCreationById(imageId);
    if(creation?.image){
      const img = document.createElement("img");
      img.className = "generated-image";
      img.src = creation.image;
      img.alt = creation.prompt || "Generated image";
      img.addEventListener("click", () => openImageViewer(creation.image));
      bubble.appendChild(img);
    }
  }
  row.appendChild(bubble);

  // Audio / Voice Output button जोड़ा गया है
  const actionsDiv = document.createElement("div");
  actionsDiv.className = "msg-actions";
  const speakBtn = document.createElement("button");
  speakBtn.className = "msg-action-btn";
  speakBtn.textContent = "🔊 सुनें";
  speakBtn.addEventListener("click", () => speakText(value));
  actionsDiv.appendChild(speakBtn);
  row.appendChild(actionsDiv);

  messagesEl.appendChild(row);
  if(persist) saveCurrentChat();
}

function showTyping(){
  hideTyping();
  const row = document.createElement("div");
  row.className = "message assistant";
  row.id = "typingMessage";
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.innerHTML = `<div class="typing"><span></span><span></span><span></span></div>`;
  row.appendChild(bubble);
  messagesEl.appendChild(row);
  scrollBottom();
}

function hideTyping(){
  const item = document.getElementById("typingMessage");
  if(item) item.remove();
}

function scrollBottom(){
  requestAnimationFrame(() => {
    try{ window.scrollTo({ top: document.documentElement.scrollHeight, behavior: "smooth" }); }catch(e){}
  });
}

function formatTime(timestamp){
  if(!timestamp) return "";
  try{ return new Date(timestamp).toLocaleString("hi-IN", { day:"2-digit", month:"short", hour:"2-digit", minute:"2-digit" }); }catch(e){ return ""; }
}

function renderChatHistory(){
  chatHistoryEl.innerHTML = "";
  const sorted = chats.slice().sort((a,b) => (b.updatedAt || 0) - (a.updatedAt || 0));
  if(!sorted.length){
    const empty = document.createElement("div");
    empty.className = "empty-history";
    empty.textContent = "अभी कोई पुरानी चैट नहीं है।";
    chatHistoryEl.appendChild(empty);
    return;
  }
  sorted.forEach(item => {
    const row = document.createElement("div");
    row.className = "message-history-item chat-history-item" + (item.id === currentChatId ? " active" : "");
    const info = document.createElement("div");
    info.className = "chat-history-info";
    const title = document.createElement("div");
    title.className = "chat-history-title";
    title.textContent = item.title || "नई चैट";
    const meta = document.createElement("div");
    meta.className = "chat-history-meta";
    meta.textContent = (Array.isArray(item.messages) ? item.messages.length : 0) + " messages • " + formatTime(item.updatedAt);
    info.appendChild(title);
    info.appendChild(meta);

    const deleteBtn = document.createElement("button");
    deleteBtn.className = "delete-chat";
    deleteBtn.type = "button";
    deleteBtn.textContent = "🗑️";
    deleteBtn.addEventListener("click", e => { e.stopPropagation(); deleteChat(item.id); });

    row.appendChild(info);
    row.appendChild(deleteBtn);
    row.addEventListener("click", () => { openChat(item.id); closeDrawer(); });
    chatHistoryEl.appendChild(row);
  });
}

function openChat(id){
  const chat = chats.find(item => item.id === id);
  if(!chat) return;
  currentChatId = chat.id;
  messages = Array.isArray(chat.messages) ? chat.messages.slice(-MAX_MESSAGES_PER_CHAT) : [];
  isBusy = false;
  sendBtn.disabled = false;
  hideTyping();
  renderCurrentChat();
  renderChatHistory();
  scrollBottom();
}

function deleteChat(id){
  const chat = chats.find(item => item.id === id);
  if(!chat) return;
  if(!confirm(`क्या आप "${chat.title || "इस चैट"}" को डिलीट करना चाहते हैं?`)) return;
  chats = chats.filter(item => item.id !== id);
  if(currentChatId === id){
    currentChatId = null; messages = []; createNewChat(true); renderCurrentChat();
  }else{
    saveChatHistory();
  }
  renderChatHistory();
  showToast("चैट डिलीट कर दी गई।");
}

function getStoredCreations(){
  if(!HAS_STORAGE) return [];
  const raw = safeGet(IMAGE_KEY);
  if(!raw) return [];
  try{
    const parsed = JSON.parse(raw);
    return Array.isArray(parsed) ? parsed.filter(item => item && typeof item.image === "string").slice(0, MAX_SAVED_CREATIONS) : [];
  }catch(e){ safeRemove(IMAGE_KEY); return []; }
}

function getCreations(){
  const stored = getStoredCreations();
  const all = [...volatileCreations, ...stored];
  const seen = new Set();
  return all.filter(item => {
    if(!item || !item.image || !item.id || seen.has(item.id)) return false;
    seen.add(item.id); return true;
  }).sort((a,b) => (b.time || b.createdAt || 0) - (a.time || a.createdAt || 0)).slice(0, MAX_SAVED_CREATIONS);
}

function findCreationById(id){
  if(!id) return null;
  return volatileCreations.find(item => item.id === id) || getStoredCreations().find(item => item.id === id) || null;
}

function saveCreations(list){
  if(!HAS_STORAGE) return false;
  try{
    const clean = list.filter(item => item && item.image && item.image.length <= MAX_HISTORY_IMAGE_CHARS).slice(0, MAX_SAVED_CREATIONS);
    return safeSet(IMAGE_KEY, JSON.stringify(clean));
  }catch(e){ return false; }
}

async function dataURLToBlob(dataURL){
  const parts = dataURL.split(",");
  const mime = (parts[0].match(/data:([^;]+)/) || [])[1] || "image/png";
  const binary = atob(parts[1]);
  const bytes = new Uint8Array(binary.length);
  for(let i=0; i<binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return new Blob([bytes], { type: mime });
}

async function blobToDataURL(blob){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(blob);
  });
}

async function resizeImageDataURL(dataURL, maxSize = MAX_MODEL_IMAGE_SIZE, quality = .78){
  if(!dataURL) return null;
  const img = new Image();
  await new Promise((resolve, reject) => { img.onload = resolve; img.onerror = reject; img.src = dataURL; });
  const scale = Math.min(1, maxSize / Math.max(img.naturalWidth || img.width, img.naturalHeight || img.height));
  const width = Math.max(1, Math.round((img.naturalWidth || img.width) * scale));
  const height = Math.max(1, Math.round((img.naturalHeight || img.height) * scale));
  const canvas = document.createElement("canvas");
  canvas.width = width; canvas.height = height;
  const ctx = canvas.getContext("2d");
  ctx.drawImage(img, 0, 0, width, height);
  return canvas.toDataURL("image/jpeg", quality);
}

async function blobToHistoryDataURL(blob, maxSize = 560){
  try{
    const bitmap = await createImageBitmap(blob);
    const scale = Math.min(1, maxSize / Math.max(bitmap.width, bitmap.height));
    const width = Math.max(1, Math.round(bitmap.width * scale));
    const height = Math.max(1, Math.round(bitmap.height * scale));
    const canvas = document.createElement("canvas");
    canvas.width = width; canvas.height = height;
    const ctx = canvas.getContext("2d");
    ctx.drawImage(bitmap, 0, 0, width, height);
    bitmap.close();
    return canvas.toDataURL("image/jpeg", .70);
  }catch(e){ return null; }
}

async function saveCreation(imageData, promptText){
  if(!imageData) return null;
  const imageId = makeImageId();
  let historyImage = null;
  try{
    const blob = await dataURLToBlob(imageData);
    historyImage = await blobToHistoryDataURL(blob, 560);
  }catch(e){}
  
  const record = { id: imageId, image: historyImage || imageData, prompt: String(promptText || "").slice(0, MAX_CREATION_PROMPT_CHARS), time: Date.now() };
  volatileCreations.unshift(record);
  creationsLoaded = true;
  renderCreations();
  return imageId;
}

function renderCreations(){
  creationGrid.innerHTML = "";
  const list = getCreations().slice(0, MAX_SAVED_CREATIONS);
  if(!list.length){
    creationGrid.innerHTML = `<div class="empty-history">अभी कोई image creation नहीं है।</div>`;
    return;
  }
  list.forEach(item => {
    const card = document.createElement("div");
    card.className = "creation-card";
    const img = document.createElement("img");
    img.src = item.image;
    img.alt = item.prompt || "Creation";
    img.addEventListener("click", () => openImageViewer(item.image));
    const caption = document.createElement("div");
    caption.className = "creation-prompt";
    caption.textContent = item.prompt || "Image";
    card.appendChild(img); card.appendChild(caption);
    creationGrid.appendChild(card);
  });
}

function loadCreationsLazy(){
  creationsLoaded = true;
  renderCreations();
}

function openImageViewer(src){
  if(!src) return;
  viewerImg.src = src;
  imageViewer.classList.add("open");
}
function closeImageViewer(){
  imageViewer.classList.remove("open");
  viewerImg.removeAttribute("src");
}

function normalizeImageResult(value){
  if(!value) return null;
  if(typeof value === "string"){
    const s = value.trim();
    if(s.startsWith("data:image/") || /^https?:\/\//i.test(s)) return s;
    if(/^[A-Za-z0-9+/=\r\n]+$/.test(s)) return "data:image/png;base64," + s.replace(/\s/g, "");
  }
  return null;
}

async function responseToImage(response){
  const contentType = (response.headers.get("content-type") || "").toLowerCase();
  if(contentType.startsWith("image/")){
    const blob = await response.blob();
    return blobToDataURL(blob);
  }
  const text = await response.text();
  let data = JSON.parse(text);
  return normalizeImageResult(data);
}

function clearSelectedFile(){
  selectedFileContent = null;
  selectedFileType = null;
  selectedFileUrl = null;
  fileInput.value = "";
  filePreview.classList.remove("show");
  filePreviewImg.style.display = "none";
  filePreviewText.textContent = "";
}

async function sendChatRequest(){
  const recentMessages = messages.slice(-19).map(item => ({
    role: item.role === "user" ? "user" : "assistant",
    content: String(item.content || "").slice(0, MAX_MESSAGE_CHARS)
  }));
  const lastUserMessage = messages.slice().reverse().find(item => item.role === "user");

  const payload = {
    message: lastUserMessage?.content || "",
    prompt: lastUserMessage?.content || "",
    messages: recentMessages
  };

  if(selectedFileType === 'image' && selectedFileContent){
    payload.image_b64 = await resizeImageDataURL(selectedFileContent, MAX_MODEL_IMAGE_SIZE, .76);
  } else if(selectedFileType === 'pdf' && selectedFileContent){
    payload.message = `PDF Document Content:\n${selectedFileContent}\n\nUser query: ${payload.message}`;
  }

  const response = await fetch(API + "chat", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload)
  });

  const raw = await response.text();
  let data = JSON.parse(raw);
  return {
    text: data.response || data.answer || data.text || data.message || data,
    image: normalizeImageResult(data.image || data.image_url)
  };
}

async function handleSend(){
  if(isBusy) return;
  const prompt = promptEl.value.trim();
  if(!prompt && !selectedFileContent){
    showToast("कुछ लिखें या फाइल/फोटो जोड़ें।");
    return;
  }
  ensureCurrentChat();
  isBusy = true;
  sendBtn.disabled = true;
  
  const attachedPreviewUrl = selectedFileUrl;
  addUserMessage(prompt, true, attachedPreviewUrl);
  promptEl.value = "";
  autoResize();
  scrollBottom();

  try{
    showTyping();
    const result = await sendChatRequest();
    hideTyping();

    if(result && result.image){
      const imageId = await saveCreation(result.image, prompt || "Image generation");
      addAssistantMessage(result.text || "🖼️ Image generated successfully.", true, imageId);
    } else {
      addAssistantMessage(result?.text || "माफ़ कीजिए, उत्तर प्राप्त नहीं हुआ।", true);
    }
    clearSelectedFile();
  }catch(error){
    hideTyping();
    addAssistantMessage("⚠️ अभी request पूरी नहीं हो सकी।", true);
    showToast("Request failed");
  }finally{
    isBusy = false;
    sendBtn.disabled = false;
    scrollBottom();
  }
}

function autoResize(){
  promptEl.style.height = "auto";
  promptEl.style.height = Math.min(promptEl.scrollHeight, 150) + "px";
}

promptEl.addEventListener("input", autoResize);
promptEl.addEventListener("keydown", e => { if(e.key === "Enter" && !e.shiftKey){ e.preventDefault(); handleSend(); } });
sendBtn.addEventListener("click", handleSend);

document.getElementById("fileBtn").addEventListener("click", () => fileInput.click());

fileInput.addEventListener("change", async e => {
  const file = e.target.files?.[0];
  if(!file) return;

  if(file.type.startsWith("image/")){
    try{
      const original = await blobToDataURL(file);
      const resized = await resizeImageDataURL(original, MAX_MODEL_IMAGE_SIZE, .80);
      selectedFileContent = resized;
      selectedFileType = 'image';
      selectedFileUrl = resized;
      filePreviewImg.src = selectedFileUrl;
      filePreviewImg.style.display = "block";
      filePreviewText.textContent = file.name;
      filePreview.classList.add("show");
      showToast("फोटो संलग्न हो गई है।");
    }catch(err){ showToast("फोटो पढ़ने में समस्या हुई।"); }
  } else if(file.type === "application/pdf" || file.name.endsWith(".pdf")){
    try{
      showToast("PDF पढ़ी जा रही है...");
      const text = await parsePdfFile(file);
      selectedFileContent = text;
      selectedFileType = 'pdf';
      selectedFileUrl = null;
      filePreviewImg.style.display = "none";
      filePreviewText.textContent = "📄 " + file.name;
      filePreview.classList.add("show");
      showToast("PDF सफलतापूर्वक लोड हो गई!");
    }catch(err){ showToast("PDF पढ़ने में असमर्थ।"); }
  } else {
    showToast("कृपया इमेज या PDF फाइल चुनें।");
  }
  fileInput.value = "";
});

document.getElementById("removeFile").addEventListener("click", clearSelectedFile);

document.getElementById("menuBtn").addEventListener("click", () => { drawer.classList.add("open"); drawerOverlay.classList.add("open"); loadCreationsLazy(); });
document.getElementById("closeDrawer").addEventListener("click", () => { drawer.classList.remove("open"); drawerOverlay.classList.remove("open"); });
drawerOverlay.addEventListener("click", () => { drawer.classList.remove("open"); drawerOverlay.classList.remove("open"); });

function startNewChat(){
  if(isBusy) return;
  if(currentChatId) saveCurrentChat();
  createNewChat(true);
  renderCurrentChat();
  renderChatHistory();
  clearSelectedFile();
  closeDrawer();
}

document.getElementById("newChatBtn").addEventListener("click", startNewChat);
document.getElementById("newChatTop").addEventListener("click", startNewChat);
document.getElementById("closeViewer").addEventListener("click", closeImageViewer);

function safeInitialLoad(){
  loadChatHistory();
  if(!chats.length) createNewChat(false);
  else {
    const latest = chats[0];
    currentChatId = latest.id;
    messages = latest.messages || [];
  }
  renderCurrentChat();
  renderChatHistory();
  creationGrid.innerHTML = `<div class="empty-history">Images देखने के लिए Menu खोलें।</div>`;
  autoResize();
  appReady = true;
}

document.addEventListener("DOMContentLoaded", safeInitialLoad);
