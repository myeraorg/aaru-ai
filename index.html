<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">

<title>Aaru AI</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  overflow-x:clip;
  overflow-y:auto;
  overscroll-behavior-y:auto;
}

body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100dvh;
  font-family:Arial,Helvetica,sans-serif;
  background:#0f1117;
  color:#fff;
  overflow-x:clip;
  overflow-y:auto;
  overscroll-behavior-y:auto;
}

button,
input,
textarea{
  font:inherit;
}

button{
  -webkit-user-select:none;
  user-select:none;
}

main{
  position:relative;
  flex:1 0 auto;
  min-height:calc(100dvh - 58px);
  overflow:visible;
  scroll-behavior:smooth;
}

.app{
  min-height:100dvh;
  display:flex;
  flex-direction:column;
}

/* =========================
   HEADER
========================= */

.header{
  position:sticky;
  top:0;
  z-index:100;
  height:58px;
  display:flex;
  align-items:center;
  gap:10px;
  padding:0 12px;
  background:rgba(15,17,23,.96);
  border-bottom:1px solid rgba(255,255,255,.07);
  backdrop-filter:blur(14px);
}

.menu-btn{
  width:40px;
  height:40px;
  border:0;
  border-radius:12px;
  background:rgba(255,255,255,.07);
  color:#fff;
  font-size:22px;
  cursor:pointer;
}

.brand{
  min-width:0;
  flex:1;
}

.brand-name{
  font-size:18px;
  font-weight:800;
  letter-spacing:.2px;
}

.brand-sub{
  margin-top:1px;
  font-size:10px;
  opacity:.45;
}

.new-chat-top{
  width:40px;
  height:40px;
  border:0;
  border-radius:12px;
  background:rgba(255,255,255,.07);
  color:#fff;
  font-size:21px;
  cursor:pointer;
}

/* =========================
   DRAWER
========================= */

.drawer-overlay{
  position:fixed;
  inset:0;
  z-index:200;
  background:rgba(0,0,0,.58);
  opacity:0;
  pointer-events:none;
  transition:.2s;
}

.drawer-overlay.open{
  opacity:1;
  pointer-events:auto;
}

.drawer{
  position:fixed;
  z-index:210;
  top:0;
  left:0;
  bottom:0;
  width:min(88vw,340px);
  background:#151821;
  border-right:1px solid rgba(255,255,255,.07);
  transform:translateX(-105%);
  transition:.22s ease;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

.drawer.open{
  transform:translateX(0);
}

.drawer-head{
  height:58px;
  flex:none;
  display:flex;
  align-items:center;
  gap:10px;
  padding:0 12px;
  border-bottom:1px solid rgba(255,255,255,.07);
}

.drawer-title{
  flex:1;
  font-size:17px;
  font-weight:800;
}

.close-drawer{
  width:38px;
  height:38px;
  border:0;
  border-radius:11px;
  background:rgba(255,255,255,.07);
  color:#fff;
  font-size:21px;
}

.drawer-body{
  flex:1;
  overflow-y:auto;
  padding:12px;
}

.drawer-action{
  width:100%;
  display:flex;
  align-items:center;
  gap:10px;
  border:0;
  color:#fff;
  background:rgba(255,255,255,.055);
  border-radius:12px;
  padding:12px;
  margin-bottom:8px;
  text-align:left;
  cursor:pointer;
}

.drawer-action:hover{
  background:rgba(255,255,255,.09);
}

.section-title{
  margin:18px 4px 9px;
  font-size:11px;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.8px;
  opacity:.4;
}

/* =========================
   CHAT HISTORY
========================= */

.chat-history{
  display:flex;
  flex-direction:column;
  gap:4px;
}

.chat-history-item{
  display:flex;
  align-items:center;
  gap:7px;
  padding:10px;
  border-radius:11px;
  cursor:pointer;
  transition:.15s;
}

.chat-history-item:hover{
  background:rgba(255,255,255,.055);
}

.chat-history-item.active{
  background:rgba(255,255,255,.085);
}

.chat-history-info{
  min-width:0;
  flex:1;
}

.chat-history-title{
  font-size:13px;
  font-weight:600;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.chat-history-meta{
  margin-top:3px;
  font-size:10px;
  opacity:.4;
}

.delete-chat{
  width:30px;
  height:30px;
  flex:none;
  border:0;
  border-radius:8px;
  background:transparent;
  color:#fff;
  opacity:.48;
  font-size:16px;
  cursor:pointer;
}

.delete-chat:hover{
  opacity:1;
  background:rgba(255,70,70,.13);
}

.empty-history{
  padding:15px 10px;
  font-size:12px;
  opacity:.4;
  line-height:1.5;
}

/* =========================
   CHAT AREA
========================= */

.chat-wrap{
  width:100%;
  max-width:900px;
  margin:0 auto;
  padding:18px 12px 155px;
}

.messages{
  display:flex;
  flex-direction:column;
  gap:14px;
}

.message{
  width:100%;
  display:flex;
}

.message.user{
  justify-content:flex-end;
}

.message.assistant{
  justify-content:flex-start;
}

.bubble{
  max-width:min(85%,720px);
  padding:11px 14px;
  border-radius:17px;
  font-size:15px;
  line-height:1.55;
  word-break:break-word;

  -webkit-user-select:text;
  user-select:text;
  -webkit-touch-callout:default;
  touch-action:auto;
  cursor:text;
}

.message.user .bubble,
.message.assistant .bubble{
  -webkit-user-select:text;
  user-select:text;
  -webkit-touch-callout:default;
  touch-action:auto;
}

.message.user .bubble{
  background:#245eea;
  border-bottom-right-radius:5px;
}

.message.assistant .bubble{
  background:#191d27;
  border:1px solid rgba(255,255,255,.055);
  border-bottom-left-radius:5px;
}

.message.system .bubble{
  background:rgba(255,255,255,.05);
}

/* =========================
   MARKDOWN
========================= */

.md h1,
.md h2,
.md h3{
  margin:14px 0 8px;
  line-height:1.25;
}

.md h1{
  font-size:22px;
}

.md h2{
  font-size:19px;
}

.md h3{
  font-size:17px;
}

.md p{
  margin:0 0 9px;
}

.md p:last-child{
  margin-bottom:0;
}

.md ul,
.md ol{
  margin:7px 0 10px;
  padding-left:22px;
}

.md li{
  margin:4px 0;
}

.md blockquote{
  margin:10px 0;
  padding:7px 12px;
  border-left:3px solid #777;
  background:rgba(255,255,255,.04);
  opacity:.9;
}

.md a{
  color:#71a7ff;
  text-decoration:underline;
}

.md code{
  padding:2px 5px;
  border-radius:5px;
  background:#0d1016;
  font-family:monospace;
  font-size:.92em;
}

.md pre{
  margin:10px 0;
  padding:12px;
  overflow:auto;
  border-radius:10px;
  background:#0b0e13;
  border:1px solid rgba(255,255,255,.07);
  white-space:pre;
}

.md pre code{
  padding:0;
  background:transparent;
}

/* =========================
   IMAGES
========================= */

.generated-image{
  display:block;
  width:100%;
  max-width:720px;
  border-radius:14px;
  margin-top:8px;
  cursor:pointer;
  border:1px solid rgba(255,255,255,.08);
}

.image-note{
  margin-top:7px;
  font-size:11px;
  opacity:.42;
}

/* =========================
   TYPING
========================= */

.typing{
  display:flex;
  align-items:center;
  gap:5px;
  padding:5px 2px;
}

.typing span{
  width:6px;
  height:6px;
  border-radius:50%;
  background:#fff;
  opacity:.35;
  animation:typing 1s infinite;
}

.typing span:nth-child(2){
  animation-delay:.15s;
}

.typing span:nth-child(3){
  animation-delay:.3s;
}

@keyframes typing{
  0%,70%,100%{
    transform:translateY(0);
    opacity:.25;
  }
  35%{
    transform:translateY(-4px);
    opacity:.8;
  }
}

/* =========================
   COMPOSER
========================= */

.composer-shell{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:120;
  padding:8px 10px calc(8px + env(safe-area-inset-bottom));
  background:linear-gradient(
    to bottom,
    rgba(15,17,23,0),
    rgba(15,17,23,.94) 22%,
    #0f1117 48%
  );
}

.composer{
  width:100%;
  max-width:900px;
  margin:0 auto;
  border:1px solid rgba(255,255,255,.1);
  background:#171a23;
  border-radius:18px;
  padding:8px;
  box-shadow:0 8px 35px rgba(0,0,0,.25);
}

.photo-preview{
  display:none;
  position:relative;
  width:74px;
  height:74px;
  margin:3px 3px 8px;
}

.photo-preview.show{
  display:block;
}

.photo-preview img{
  width:74px;
  height:74px;
  object-fit:cover;
  border-radius:10px;
}

.remove-photo{
  position:absolute;
  right:-6px;
  top:-6px;
  width:23px;
  height:23px;
  border:0;
  border-radius:50%;
  background:#ef4444;
  color:#fff;
  font-size:15px;
}

.input-row{
  display:flex;
  align-items:flex-end;
  gap:7px;
}

#prompt{
  flex:1;
  min-width:0;
  min-height:42px;
  max-height:150px;
  resize:none;
  border:0;
  outline:0;
  color:#fff;
  background:transparent;
  padding:10px 8px;
  line-height:1.4;
}

#prompt::placeholder{
  color:#fff;
  opacity:.38;
}

.icon-btn{
  width:40px;
  height:40px;
  flex:none;
  border:0;
  border-radius:12px;
  background:rgba(255,255,255,.065);
  color:#fff;
  cursor:pointer;
}

.icon-btn:hover{
  background:rgba(255,255,255,.1);
}

.send-btn{
  background:#2864e8;
}

.send-btn:hover{
  background:#3570ed;
}

.send-btn:disabled{
  opacity:.4;
  cursor:not-allowed;
}

.mode-row{
  display:flex;
  align-items:center;
  gap:7px;
  padding:4px 4px 1px;
}

.mode-pill{
  border:0;
  border-radius:10px;
  padding:6px 9px;
  font-size:11px;
  background:transparent;
  color:#fff;
  opacity:.48;
  cursor:pointer;
}

.mode-pill.active{
  background:rgba(255,255,255,.08);
  opacity:1;
}

#photoInput{
  display:none;
}

/* =========================
   CREATIONS
========================= */

.creation-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:8px;
}

.creation-card{
  position:relative;
  overflow:hidden;
  border-radius:11px;
  background:#0e1117;
  border:1px solid rgba(255,255,255,.06);
}

.creation-card img{
  display:block;
  width:100%;
  aspect-ratio:1/1;
  object-fit:cover;
}

.creation-prompt{
  padding:7px;
  font-size:10px;
  opacity:.6;
  line-height:1.35;
}

/* =========================
   IMAGE VIEWER
========================= */

.image-viewer{
  position:fixed;
  inset:0;
  z-index:500;
  display:none;
  align-items:center;
  justify-content:center;
  padding:18px;
  background:rgba(0,0,0,.9);
}

.image-viewer.open{
  display:flex;
}

.image-viewer img{
  max-width:100%;
  max-height:90dvh;
  object-fit:contain;
  border-radius:10px;
}

.close-viewer{
  position:absolute;
  top:14px;
  right:14px;
  width:40px;
  height:40px;
  border:0;
  border-radius:12px;
  background:rgba(255,255,255,.12);
  color:#fff;
  font-size:23px;
}

/* =========================
   TOAST
========================= */

.toast{
  position:fixed;
  left:50%;
  bottom:92px;
  z-index:700;
  transform:translate(-50%,20px);
  max-width:90vw;
  padding:10px 14px;
  border-radius:11px;
  background:#252a36;
  color:#fff;
  font-size:12px;
  opacity:0;
  pointer-events:none;
  transition:.2s;
  box-shadow:0 7px 25px rgba(0,0,0,.3);
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:600px){

  .header{
    height:55px;
  }

  .brand-name{
    font-size:17px;
  }

  .chat-wrap{
    padding:14px 9px 155px;
  }

  .bubble{
    max-width:90%;
    font-size:15px;
  }

  .composer{
    border-radius:17px;
  }

  .creation-grid{
    grid-template-columns:repeat(2,minmax(0,1fr));
  }
}
</style>
</head>

<body>

<div class="app">

  <header class="header">
    <button class="menu-btn" id="menuBtn" aria-label="Menu">☰</button>

    <div class="brand">
      <div class="brand-name">Aaru AI</div>
      <div class="brand-sub">Fast • Smart • Indian AI</div>
    </div>

    <button class="new-chat-top" id="newChatTop" aria-label="New Chat">
      ＋
    </button>
  </header>

  <div class="drawer-overlay" id="drawerOverlay"></div>

  <aside class="drawer" id="drawer">

    <div class="drawer-head">
      <div class="drawer-title">Aaru AI</div>
      <button class="close-drawer" id="closeDrawer">×</button>
    </div>

    <div class="drawer-body">

      <button class="drawer-action" id="newChatBtn">
        <span>＋</span>
        <span>नई चैट</span>
      </button>

      <button class="drawer-action" id="deleteAllBtn">
        <span>🗑️</span>
        <span>सभी चैट डिलीट करें</span>
      </button>

      <div class="section-title">Recent Chats</div>
      <div class="chat-history" id="chatHistory"></div>

      <div class="section-title">Recent Creations</div>
      <div class="creation-grid" id="creationGrid"></div>

    </div>
  </aside>

  <main>

    <div class="chat-wrap">
      <div class="messages" id="messages"></div>
    </div>

  </main>

  <div class="composer-shell">

    <div class="composer">

      <div class="photo-preview" id="photoPreview">
        <img id="photoPreviewImg" alt="Selected image">
        <button class="remove-photo" id="removePhoto">×</button>
      </div>

      <div class="input-row">

        <button class="icon-btn" id="photoBtn" title="Photo">
          📎
        </button>

        <textarea
          id="prompt"
          rows="1"
          placeholder="Aaru से कुछ भी पूछें..."
          autocomplete="off"
          spellcheck="true"></textarea>

        <button class="icon-btn send-btn" id="sendBtn" title="Send">
          ➤
        </button>

      </div>

      <div class="mode-row">

        <button
          class="mode-pill"
          id="chatModeBtn"
          type="button">
          💬 Chat
        </button>

        <button
          class="mode-pill"
          id="imageModeBtn"
          type="button">
          🎨 Image
        </button>

      </div>

    </div>

  </div>

</div>

<input
  type="file"
  id="photoInput"
  accept="image/*">

<div class="image-viewer" id="imageViewer">
  <button class="close-viewer" id="closeViewer">×</button>
  <img id="viewerImg" alt="Image preview">
</div>

<div class="toast" id="toast"></div>


<script>
"use strict";

/* =========================================================
   CONFIG
========================================================= */

const API =
  "https://aaru-ai-api.myera-org.workers.dev/";

const CHAT_LIST_KEY =
  "aaru_chat_history_v2";

const OLD_CHAT_KEY =
  "aaru_chat_messages";

const IMAGE_KEY =
  "aaru_history";


/* =========================================================
   SAFE STORAGE LIMITS
========================================================= */

const MAX_SAVED_CHATS = 8;
const MAX_MESSAGES_PER_CHAT = 30;
const MAX_MESSAGE_CHARS = 4000;

const MAX_SAVED_CREATIONS = 4;
const MAX_CREATION_PROMPT_CHARS = 300;

/*
  localStorage में image बहुत बड़ी नहीं होने देंगे।
  Base64 character limit जानबूझकर काफी छोटा रखा गया है।
*/
const MAX_HISTORY_IMAGE_CHARS = 420000;


/* =========================================================
   STATE
========================================================= */

let chats = [];
let currentChatId = null;
let messages = [];

let imageMode = false;

let selectedPhotoBase64 = null;
let selectedPhotoUrl = null;

let isBusy = false;

/*
  localStorage में image save न हो सके तो
  current session में image रहेगी।
*/
let volatileCreations = [];

/*
  Image history startup पर तुरंत load नहीं होगी।
*/
let creationsLoaded = false;

/*
  Initial startup पूरा हुआ या नहीं।
*/
let appReady = false;

/*
  pageshow recovery को duplicate होने से रोकना।
*/
let lastPageShowRecovery = 0;


/* =========================================================
   DOM
========================================================= */

const messagesEl =
  document.getElementById("messages");

const promptEl =
  document.getElementById("prompt");

const sendBtn =
  document.getElementById("sendBtn");

const photoInput =
  document.getElementById("photoInput");

const photoPreview =
  document.getElementById("photoPreview");

const photoPreviewImg =
  document.getElementById("photoPreviewImg");

const chatHistoryEl =
  document.getElementById("chatHistory");

const creationGrid =
  document.getElementById("creationGrid");

const drawer =
  document.getElementById("drawer");

const drawerOverlay =
  document.getElementById("drawerOverlay");

const imageViewer =
  document.getElementById("imageViewer");

const viewerImg =
  document.getElementById("viewerImg");

const toastEl =
  document.getElementById("toast");

const chatModeBtn =
  document.getElementById("chatModeBtn");

const imageModeBtn =
  document.getElementById("imageModeBtn");


/* =========================================================
   BASIC HELPERS
========================================================= */

function makeChatId(){

  return "chat_" +
    Date.now().toString(36) +
    "_" +
    Math.random()
      .toString(36)
      .slice(2,9);
}


function makeImageId(){

  return "img_" +
    Date.now().toString(36) +
    "_" +
    Math.random()
      .toString(36)
      .slice(2,10);
}


function showToast(text){

  toastEl.textContent =
    String(text || "");

  toastEl.classList.add("show");

  clearTimeout(showToast.timer);

  showToast.timer =
    setTimeout(() => {
      toastEl.classList.remove("show");
    },2200);
}


function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


/* =========================================================
   MARKDOWN RENDERER
   IMPORTANT: UNCHANGED
========================================================= */

function inlineMarkdown(text){

  let s = escapeHTML(text);

  s = s.replace(
    /`([^`]+)`/g,
    "<code>$1</code>"
  );

  s = s.replace(
    /\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,
    '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>'
  );

  s = s.replace(
    /\*\*([^*]+)\*\*/g,
    "<strong>$1</strong>"
  );

  s = s.replace(
    /__([^_]+)__/g,
    "<strong>$1</strong>"
  );

  s = s.replace(
    /(?<!\*)\*([^*]+)\*(?!\*)/g,
    "<em>$1</em>"
  );

  s = s.replace(
    /(?<!_)_([^_]+)_(?!_)/g,
    "<em>$1</em>"
  );

  return s;
}


function renderMarkdown(text){

  const source =
    String(text ?? "")
      .replace(/\r\n/g,"\n")
      .replace(/\r/g,"\n");

  const lines =
    source.split("\n");

  let html = "";
  let inCode = false;
  let codeBuffer = [];
  let codeLang = "";

  let inUl = false;
  let inOl = false;

  function closeLists(){

    if(inUl){
      html += "</ul>";
      inUl = false;
    }

    if(inOl){
      html += "</ol>";
      inOl = false;
    }
  }

  function flushParagraph(buffer){

    if(!buffer.length) return;

    const value =
      buffer.join("\n").trim();

    if(!value) return;

    html +=
      "<p>" +
      inlineMarkdown(
        value.replace(/\n/g,"<br>")
      ) +
      "</p>";
  }

  let paragraph = [];

  for(let i=0;i<lines.length;i++){

    const line = lines[i];

    if(line.trim().startsWith("```")){

      if(inCode){

        html +=
          "<pre><code>" +
          escapeHTML(
            codeBuffer.join("\n")
          ) +
          "</code></pre>";

        codeBuffer = [];
        codeLang = "";
        inCode = false;

      }else{

        flushParagraph(paragraph);
        paragraph = [];

        closeLists();

        inCode = true;

        codeLang =
          line.trim()
            .slice(3)
            .trim();
      }

      continue;
    }

    if(inCode){

      codeBuffer.push(line);
      continue;
    }

    if(!line.trim()){

      flushParagraph(paragraph);
      paragraph = [];

      closeLists();

      continue;
    }

    const h3 =
      line.match(/^###\s+(.+)$/);

    const h2 =
      line.match(/^##\s+(.+)$/);

    const h1 =
      line.match(/^#\s+(.+)$/);

    if(h1){

      flushParagraph(paragraph);
      paragraph = [];
      closeLists();

      html +=
        "<h1>" +
        inlineMarkdown(h1[1]) +
        "</h1>";

      continue;
    }

    if(h2){

      flushParagraph(paragraph);
      paragraph = [];
      closeLists();

      html +=
        "<h2>" +
        inlineMarkdown(h2[1]) +
        "</h2>";

      continue;
    }

    if(h3){

      flushParagraph(paragraph);
      paragraph = [];
      closeLists();

      html +=
        "<h3>" +
        inlineMarkdown(h3[1]) +
        "</h3>";

      continue;
    }

    const ul =
      line.match(/^\s*[-*+]\s+(.+)$/);

    const ol =
      line.match(/^\s*\d+[.)]\s+(.+)$/);

    if(ul){

      flushParagraph(paragraph);
      paragraph = [];

      if(inOl){
        html += "</ol>";
        inOl = false;
      }

      if(!inUl){

        html += "<ul>";
        inUl = true;
      }

      html +=
        "<li>" +
        inlineMarkdown(ul[1]) +
        "</li>";

      continue;
    }

    if(ol){

      flushParagraph(paragraph);
      paragraph = [];

      if(inUl){
        html += "</ul>";
        inUl = false;
      }

      if(!inOl){

        html += "<ol>";
        inOl = true;
      }

      html +=
        "<li>" +
        inlineMarkdown(ol[1]) +
        "</li>";

      continue;
    }

    const quote =
      line.match(/^\s*>\s?(.*)$/);

    if(quote){

      flushParagraph(paragraph);
      paragraph = [];
      closeLists();

      html +=
        "<blockquote>" +
        inlineMarkdown(quote[1]) +
        "</blockquote>";

      continue;
    }

    paragraph.push(line);
  }

  if(inCode){

    html +=
      "<pre><code>" +
      escapeHTML(
        codeBuffer.join("\n")
      ) +
      "</code></pre>";
  }

  flushParagraph(paragraph);
  closeLists();

  return html || "";
}


/* =========================================================
   STORAGE HELPERS
========================================================= */

function storageAvailable(){

  try{

    const storage =
      window.localStorage;

    if(!storage){
      return false;
    }

    const testKey =
      "__aaru_storage_test__";

    storage.setItem(
      testKey,
      "1"
    );

    storage.removeItem(
      testKey
    );

    return true;

  }catch(error){

    console.warn(
      "localStorage unavailable:",
      error
    );

    return false;
  }
}


const HAS_STORAGE =
  storageAvailable();


function safeGet(key){

  if(!HAS_STORAGE){
    return null;
  }

  try{

    return localStorage.getItem(key);

  }catch(e){

    console.warn(
      "localStorage get failed:",
      key,
      e
    );

    return null;
  }
}


function safeRemove(key){

  if(!HAS_STORAGE){
    return;
  }

  try{

    localStorage.removeItem(key);

  }catch(e){

    console.warn(
      "localStorage remove failed:",
      key,
      e
    );
  }
}


function safeSet(key,value){

  if(!HAS_STORAGE){
    return false;
  }

  try{

    localStorage.setItem(
      key,
      value
    );

    return true;

  }catch(error){

    console.warn(
      "localStorage set failed:",
      key,
      error
    );

    return false;
  }
}


/* =========================================================
   CHAT NORMALIZATION
========================================================= */

function normalizeChat(chat){

  if(!chat || typeof chat !== "object"){
    return null;
  }

  const id =
    String(chat.id || "");

  if(!id){
    return null;
  }

  const rawMessages =
    Array.isArray(chat.messages)
      ? chat.messages
      : [];

  const normalizedMessages =
    rawMessages
      .filter(Boolean)
      .slice(-MAX_MESSAGES_PER_CHAT)
      .map(msg => {

        const role =
          msg.role === "user"
            ? "user"
            : "assistant";

        const content =
          String(msg.content ?? "")
            .slice(0,MAX_MESSAGE_CHARS);

        const result = {
          role,
          content
        };

        if(msg.imageId){

          result.imageId =
            String(msg.imageId)
              .slice(0,100);
        }

        return result;
      });

  let title =
    String(chat.title || "")
      .trim()
      .slice(0,80);

  if(!title || title === "नई चैट"){

    const firstUser =
      normalizedMessages.find(
        m => m.role === "user"
      );

    if(firstUser){

      title =
        firstUser.content
          .replace(/\s+/g," ")
          .trim()
          .slice(0,80);
    }
  }

  if(!title){
    title = "नई चैट";
  }

  const now =
    Date.now();

  return {

    id,

    title,

    messages:
      normalizedMessages,

    createdAt:
      Number(chat.createdAt) || now,

    updatedAt:
      Number(chat.updatedAt) || now
  };
}


/* =========================================================
   CHAT SAVE
========================================================= */

function saveChatHistory(showError = true){

  if(!HAS_STORAGE){
    return false;
  }

  const sorted =
    chats
      .slice()
      .sort(
        (a,b) =>
          (b.updatedAt || 0) -
          (a.updatedAt || 0)
      );

  const limits = [
    MAX_SAVED_CHATS,
    6,
    4,
    3,
    2,
    1
  ];

  for(const limit of limits){

    try{

      const data =
        sorted
          .slice(0,limit)
          .map(normalizeChat)
          .filter(Boolean);

      const json =
        JSON.stringify(data);

      if(
        safeSet(
          CHAT_LIST_KEY,
          json
        )
      ){

        chats =
          sorted
            .slice(0,MAX_SAVED_CHATS)
            .map(normalizeChat)
            .filter(Boolean);

        return true;
      }

    }catch(error){

      console.warn(
        "Chat history save failed:",
        error
      );
    }
  }

  /*
    अगर storage quota भर गया है,
    image history हटाकर chat को बचाएँ।
  */

  try{

    safeRemove(IMAGE_KEY);

    const emergency =
      sorted
        .slice(0,3)
        .map(normalizeChat)
        .filter(Boolean);

    if(
      safeSet(
        CHAT_LIST_KEY,
        JSON.stringify(emergency)
      )
    ){

      chats =
        sorted
          .slice(0,MAX_SAVED_CHATS)
          .map(normalizeChat)
          .filter(Boolean);

      return true;
    }

  }catch(error){

    console.warn(
      "Emergency chat save failed:",
      error
    );
  }

  if(showError){

    showToast(
      "Chat history save नहीं हो पाई।"
    );
  }

  return false;
}


/* =========================================================
   LOAD CHAT HISTORY
========================================================= */

function loadChatHistory(){

  chats = [];

  const raw =
    safeGet(CHAT_LIST_KEY);

  if(raw){

    try{

      const parsed =
        JSON.parse(raw);

      if(Array.isArray(parsed)){

        const seen =
          new Set();

        chats =
          parsed
            .map(normalizeChat)
            .filter(Boolean)
            .filter(chat => {

              if(seen.has(chat.id)){
                return false;
              }

              seen.add(chat.id);

              return true;

            })
            .sort(
              (a,b) =>
                (b.updatedAt || 0) -
                (a.updatedAt || 0)
            )
            .slice(0,MAX_SAVED_CHATS);
      }

    }catch(error){

      console.warn(
        "Invalid chat history. Clearing corrupted data:",
        error
      );

      chats = [];

      safeRemove(
        CHAT_LIST_KEY
      );
    }

    /*
      IMPORTANT:
      Startup पर saveChatHistory() नहीं चलाया जा रहा।
      इससे refresh के समय synchronous write नहीं होगा।
    */

    return;
  }


  /* पुराने single-chat storage की migration */

  const oldRaw =
    safeGet(OLD_CHAT_KEY);

  if(oldRaw){

    try{

      const oldMessages =
        JSON.parse(oldRaw);

      if(
        Array.isArray(oldMessages) &&
        oldMessages.length
      ){

        const now =
          Date.now();

        const item =
          normalizeChat({

            id:
              makeChatId(),

            title:
              "पुरानी चैट",

            messages:
              oldMessages,

            createdAt:
              now,

            updatedAt:
              now
          });

        if(item){
          chats = [item];
        }
      }

    }catch(error){

      console.warn(
        "Old chat migration failed:",
        error
      );
    }

    safeRemove(
      OLD_CHAT_KEY
    );

    /*
      Migration के बाद भी startup पर तुरंत save नहीं।
      अगली user action पर save होगा।
    */
  }
}


/* =========================================================
   CREATE NEW CHAT
========================================================= */

function createNewChat(
  persist = true
){

  const now =
    Date.now();

  const item = {

    id:
      makeChatId(),

    title:
      "नई चैट",

    messages:
      [],

    createdAt:
      now,

    updatedAt:
      now
  };

  chats.unshift(item);

  currentChatId =
    item.id;

  messages = [];

  chats =
    chats
      .slice()
      .sort(
        (a,b) =>
          (b.updatedAt || 0) -
          (a.updatedAt || 0)
      )
      .slice(0,MAX_SAVED_CHATS);

  if(persist){

    saveChatHistory(false);
  }

  return item;
}


/* =========================================================
   CURRENT CHAT
========================================================= */

function ensureCurrentChat(){

  if(currentChatId){

    const found =
      chats.find(
        chat =>
          chat.id === currentChatId
      );

    if(found){
      return found;
    }
  }

  return createNewChat(true);
}


function saveCurrentChat(){

  const chat =
    ensureCurrentChat();

  chat.messages =
    messages
      .slice(-MAX_MESSAGES_PER_CHAT)
      .map(msg => {

        const result = {

          role:
            msg.role === "user"
              ? "user"
              : "assistant",

          content:
            String(msg.content ?? "")
              .slice(0,MAX_MESSAGE_CHARS)
        };

        if(msg.imageId){

          result.imageId =
            String(msg.imageId)
              .slice(0,100);
        }

        return result;
      });

  const firstUser =
    chat.messages.find(
      msg =>
        msg.role === "user"
    );

  if(firstUser){

    chat.title =
      firstUser.content
        .replace(/\s+/g," ")
        .trim()
        .slice(0,80)
        || "नई चैट";

  }else{

    chat.title =
      "नई चैट";
  }

  chat.updatedAt =
    Date.now();

  saveChatHistory();
}


/* =========================================================
   RENDER CURRENT CHAT
========================================================= */

function renderCurrentChat(){

  messagesEl.innerHTML = "";

  const list =
    Array.isArray(messages)
      ? messages.slice(-MAX_MESSAGES_PER_CHAT)
      : [];

  for(const msg of list){

    if(msg.role === "user"){

      addUserMessage(
        msg.content,
        false
      );

    }else{

      addAssistantMessage(
        msg.content,
        false,
        msg.imageId || null
      );
    }
  }
}

========================================================= */

function addUserMessage(

){

  messages.push({

    role:"user",

    content:value
  });

  message.className =
    "message user";

    document.createElement("div");

  bubble.className =
    "bubble";

  bubble.textContent =
    value;

  message.appendChild(bubble);

  messagesEl.appendChild(message);

  if(persist){
    saveCurrentChat();
  }
}


/* =========================================================
   ADD ASSISTANT MESSAGE
========================================================= */

function addAssistantMessage(
  text,
  persist = true,
  imageId = null
){

  const value =
    String(text ?? "");

  messages.push({

    role:"assistant",

    content:value,

    ...(imageId
      ? {imageId}
      : {})
  });

  const message =
    document.createElement("div");

  message.className =
    "message assistant";

  const bubble =
    document.createElement("div");

  bubble.className =
    "bubble md";

  bubble.innerHTML =

      findCreationById(imageId);

    if(creation){

      const img =
        document.createElement("img");

      img.className =
        "generated-image";

      img.src =
        creation.image;

        )
      );

        document.createElement("div");

      note.className =
        "image-note";

      note.textContent =
        "Image generated successfully.";

      bubble.appendChild(note);
    }

  message.appendChild(bubble);

  messagesEl.appendChild(message);

  if(persist){
    saveCurrentChat();
  }
}

========================================================= */

function formatTime(timestamp){

  if(!timestamp){
    return "";
  }

  const date =
    new Date(timestamp);

  return date.toLocaleString(
    "hi-IN",
    {
      day:"2-digit",
      month:"short",
      hour:"2-digit",
      minute:"2-digit"
    }
  );
}


function renderChatHistory(){

  chatHistoryEl.innerHTML = "";

  const sorted =
    chats
      .slice()
      .sort(
        (a,b) =>
          (b.updatedAt || 0) -
          (a.updatedAt || 0)
      );

  if(!sorted.length){

    const empty =
      document.createElement("div");

    empty.className =
      "empty-history";

    empty.textContent =
      "अभी कोई पुरानी चैट नहीं है।";

    chatHistoryEl.appendChild(empty);

    return;
  }


  for(const item of sorted){

    const row =
      document.createElement("div");

    row.className =
      "chat-history-item" +
      (
        item.id === currentChatId
          ? " active"
          : ""
      );


    const info =
      document.createElement("div");

    info.className =
      "chat-history-info";


    const title =
      document.createElement("div");

    title.className =
      "chat-history-title";

    title.textContent =
      item.title || "नई चैट";


    const meta =
      document.createElement("div");

    meta.className =
      "chat-history-meta";

    const count =
      Array.isArray(item.messages)
        ? item.messages.length
        : 0;

    meta.textContent =
      count +
      " messages • " +
      formatTime(item.updatedAt);


    info.appendChild(title);
    info.appendChild(meta);


    const deleteBtn =
      document.createElement("button");

    deleteBtn.className =
      "delete-chat";

    deleteBtn.type =
      "button";

    deleteBtn.title =
      "इस चैट को डिलीट करें";

    deleteBtn.setAttribute(
      "aria-label",
      "Delete chat"
    );

    deleteBtn.textContent =
      "🗑️";


    deleteBtn.addEventListener(
      "click",
      event => {

        event.preventDefault();
        event.stopPropagation();

        deleteChat(item.id);
      }
    );


    row.appendChild(info);
    row.appendChild(deleteBtn);


    row.addEventListener(
      "click",
      () => {

        openChat(item.id);
        closeDrawer();
      }
    );


    chatHistoryEl.appendChild(row);
  }
}


/* =========================================================
   OPEN CHAT
========================================================= */

function openChat(id){

  const chat =
    chats.find(
      item => item.id === id
    );

  if(!chat){
    return;
  }

  currentChatId =
    chat.id;

  messages =
    Array.isArray(chat.messages)
      ? chat.messages
          .slice(-MAX_MESSAGES_PER_CHAT)
      : [];

  hideTyping();

  isBusy = false;

  sendBtn.disabled = false;

  renderCurrentChat();
  renderChatHistory();

  scrollBottom();
}


/* =========================================================
   DELETE CHAT
========================================================= */

function deleteChat(id){

  const chat =
    chats.find(
      item => item.id === id
    );

  if(!chat){
    return;
  }

  const ok =
    confirm(
      `क्या आप "${chat.title || "इस चैट"}" को डिलीट करना चाहते हैं?`
    );

  if(!ok){
    return;
  }

  chats =
    chats.filter(
      item => item.id !== id
    );


  if(currentChatId === id){

    currentChatId =
      null;

    messages = [];

    createNewChat(true);

    renderCurrentChat();

  }else{

    saveChatHistory();
  }

  renderChatHistory();

  showToast(
    "चैट डिलीट कर दी गई।"
  );
}

/* =========================================================
   IMAGE HISTORY
========================================================= */

function getStoredCreations(){

  if(!HAS_STORAGE){
    return [];
  }

  const raw =
    safeGet(IMAGE_KEY);

  if(!raw){
    return [];
  }

  /*
    बहुत बड़ा image-history data मिला तो उसे
    startup को block करने से रोकने के लिए discard करें।
  */

  if(
    raw.length >
    MAX_HISTORY_IMAGE_CHARS *
    MAX_SAVED_CREATIONS
  ){

    console.warn(
      "Image history too large. Clearing it."
    );

    safeRemove(IMAGE_KEY);

    return [];
  }

  try{

    const parsed =
      JSON.parse(raw);

    if(!Array.isArray(parsed)){
      return [];
    }

    return parsed
      .filter(
        item =>
          item &&
          typeof item.image === "string" &&
          item.image.length <= MAX_HISTORY_IMAGE_CHARS
      )
      .slice(0,MAX_SAVED_CREATIONS);

  }catch(error){

    console.warn(
      "Image history parse failed. Clearing invalid data:",
      error
    );

    safeRemove(IMAGE_KEY);

    return [];
  }
}


function getCreations(){

  const stored =
    getStoredCreations();

  const combined = [
    ...volatileCreations,
    ...stored
  ];

  const seen =
    new Set();

  return combined
    .filter(item => {

      if(!item || !item.image){
        return false;
      }

      if(seen.has(item.id)){
        return false;
      }

      seen.add(item.id);

      return true;

    })
    .slice(0,MAX_SAVED_CREATIONS);
}


function saveCreations(list){

  if(!HAS_STORAGE){
    return false;
  }

  const attempts = [
    MAX_SAVED_CREATIONS,
    3,
    2,
    1
  ];

  for(const limit of attempts){

    try{

      const cleanList =
        list
          .filter(
            item =>
              item &&
              typeof item.image === "string" &&
              item.image.length <=
                MAX_HISTORY_IMAGE_CHARS
          )
          .slice(0,limit);

      const json =
        JSON.stringify(
          cleanList
        );

      if(
        safeSet(
          IMAGE_KEY,
          json
        )
      ){

        return true;
      }

    }catch(error){

      console.warn(
        "Image history save failed:",
        error
      );
    }
  }

  return false;
}


function findCreationById(id){

  if(!id){
    return null;
  }

  /*
    पहले volatile memory check करें।
  */

  const volatile =
    volatileCreations.find(
      item =>
        item.id === id
    );

  if(volatile){
    return volatile;
  }

  /*
    उसके बाद storage check करें।
  */

  if(!creationsLoaded){
    return null;
  }

  return getStoredCreations().find(
    item =>
      item.id === id
  ) || null;
}


/* =========================================================
   IMAGE COMPRESSION
========================================================= */

async function blobToHistoryDataURL(
  blob,
  maxSize = 560
){

  try{

    const bitmap =
      await createImageBitmap(blob);

    let width =
      bitmap.width;

    let height =
      bitmap.height;

    const scale =
      Math.min(
        1,
        maxSize /
        Math.max(width,height)
      );

    width =
      Math.max(
        1,
        Math.round(width * scale)
      );

    height =
      Math.max(
        1,
        Math.round(height * scale)
      );

    const canvas =
      document.createElement("canvas");

    canvas.width =
      width;

    canvas.height =
      height;

    const ctx =
      canvas.getContext("2d");

    if(!ctx){

      bitmap.close();

      return null;
    }

    ctx.drawImage(
      bitmap,
      0,
      0,
      width,
      height
    );

    bitmap.close();

    /*
      WebP छोटा रखने की कोशिश।
    */

    let dataURL =
      canvas.toDataURL(
        "image/webp",
        .68
      );

    /*
      अगर WebP supported नहीं है,
      JPEG इस्तेमाल करें।
    */

    if(
      !dataURL ||
      dataURL.indexOf(
        "data:image/webp"
      ) !== 0
    ){

      dataURL =
        canvas.toDataURL(
          "image/jpeg",
          .68
        );
    }

    /*
      Final hard limit.
      बहुत बड़ी history image कभी save नहीं होगी।
    */

    if(
      !dataURL ||
      dataURL.length >
        MAX_HISTORY_IMAGE_CHARS
    ){

      /*
        एक और छोटी कोशिश।
      */

      const smallerCanvas =
        document.createElement("canvas");

      const smallerSize =
        420;

      const scale2 =
        Math.min(
          1,
          smallerSize /
          Math.max(
            bitmap?.width || width,
            bitmap?.height || height
          )
        );

      smallerCanvas.width =
        Math.max(
          1,
          Math.round(width * scale2)
        );

      smallerCanvas.height =
        Math.max(
          1,
          Math.round(height * scale2)
        );

      /*
        अगर पहली image पहले ही बनाई जा चुकी है,
        तो current dataURL को ही reject करना सुरक्षित है।
      */

      return null;
    }

    return dataURL;

  }catch(error){

    console.warn(
      "Image compression failed:",
      error
    );

    return null;
  }
}


/* =========================================================
   SAVE CREATION
========================================================= */

async function saveCreation(
  imageData,
  promptText
){

  if(!imageData){
    return null;
  }

  const imageId =
    makeImageId();

  let historyImage =
    null;


  /*
    IMPORTANT:
    Original full-size Base64 को localStorage में
    कभी fallback नहीं करेंगे।
  */

  try{

    const response =
      await fetch(imageData);

    if(response.ok){

      const blob =
        await response.blob();

      historyImage =
        await blobToHistoryDataURL(
          blob,
          560
        );
    }

  }catch(error){

    console.warn(
      "Image history compression failed:",
      error
    );
  }


  /*
    अगर compression fail हुई तो image को
    localStorage में बिल्कुल save नहीं करेंगे।
    Current chat में volatile memory में रहेगी।
  */

  if(!historyImage){

    const volatileRecord = {

      id:imageId,

      image:imageData,

      prompt:
        String(promptText || "")
          .slice(
            0,
            MAX_CREATION_PROMPT_CHARS
          ),

      time:
        Date.now()
    };

    volatileCreations =
      [
        volatileRecord,
        ...volatileCreations
      ]
      .slice(0,MAX_SAVED_CREATIONS);

    renderCreations();

    showToast(
      "Image बनी है। History में temporary रखी गई है।"
    );

    return imageId;
  }


  const record = {

    id:imageId,

    image:historyImage,

    prompt:
      String(promptText || "")
        .slice(
          0,
          MAX_CREATION_PROMPT_CHARS
        ),

    time:
      Date.now()
  };


  /*
    पहले memory में।
  */

  volatileCreations =
    [
      record,
      ...volatileCreations
    ]
    .slice(0,MAX_SAVED_CREATIONS);


  let storedList =
    getStoredCreations();

  storedList =
    [
      record,
      ...storedList
    ]
    .slice(0,MAX_SAVED_CREATIONS);


  const saved =
    saveCreations(
      storedList
    );


  if(saved){

    volatileCreations =
      volatileCreations.filter(
        item =>
          item.id !== imageId
      );

  }else{

    /*
      केवल compressed image की एक copy try करें।
      Full-size image कभी नहीं।
    */

    safeRemove(IMAGE_KEY);

    const one =
      saveCreations([record]);

    if(one){

      volatileCreations =
        volatileCreations.filter(
          item =>
            item.id !== imageId
        );

    }else{

      showToast(
        "Image बनी है, लेकिन History में save नहीं हो सकी।"
      );
    }
  }


  renderCreations();

  return imageId;
}

        reject;

    }
  );
}

/* =========================================================
   IMAGE DATA NORMALIZATION
========================================================= */

function normalizeImageResult(data){

  if(!data){
    return null;
  }

  if(typeof data === "string"){

    if(
      data.startsWith("data:image/")
    ){
      return data;
    }

    return (
      "data:image/png;base64," +
      data
    );
  }

  if(data.image){

    return normalizeImageResult(
      data.image
    );
  }

  if(data.result){

    return normalizeImageResult(
      data.result
    );
  }

  if(data.data){

    return normalizeImageResult(
      data.data
    );
  }

  return null;
}


/* =========================================================
   GENERATE IMAGE
========================================================= */

async function generateImage(
  prompt
){

  const payload = {

    prompt:
      String(prompt || ""),

    ratio:
      "1:1",

    quality:
      "standard"
  };

  if(selectedPhotoBase64){

    payload.image_b64 =
      selectedPhotoBase64;
  }


  const response =
    await fetch(
      API + "image",
      {
        method:"POST",

        headers:{
          "Content-Type":
            "application/json"
        },

        body:
          JSON.stringify(payload)
      }
    );


  const text =
    await response.text();

  let data = null;

  try{

    data =
      JSON.parse(text);

  }catch(error){

    data = null;
  }


  if(!response.ok){

    throw new Error(
      data?.error ||
      data?.message ||
      text ||
      "Image generation failed"
    );
  }


  const image =
    normalizeImageResult(
      data
    );

  if(!image){

    throw new Error(
      "Image response में image नहीं मिली।"
    );
  }

  return image;
}


/* =========================================================
   CHAT API
========================================================= */

async function sendChatRequest(){

  const cleanMessages =
    messages
      .slice(-19)
      .map(msg => ({
        role:
          msg.role === "user"
            ? "user"
            : "assistant",

        content:
          String(msg.content || "")
            .slice(0,MAX_MESSAGE_CHARS)
      }));


  const response =
    await fetch(
      API + "chat",
      {
        method:"POST",

        headers:{
          "Content-Type":
            "application/json"
        },

        body:
          JSON.stringify({

            message:
              messages[messages.length - 1]
                ?.content || "",

            messages:
              cleanMessages
          })
      }
    );


  const text =
    await response.text();

  let data = null;

  try{

    data =
      JSON.parse(text);

  }catch(error){

    data = null;
  }


  if(!response.ok){

    throw new Error(
      data?.error ||
      data?.message ||
      text ||
      "Chat request failed"
    );
  }


  if(typeof data === "string"){
    return data;
  }


  return (
    data?.response ??
    data?.answer ??
    data?.text ??
    data?.message ??
    data?.output ??
    data?.content ??
    ""
  );
}


/* =========================================================
   SEND
========================================================= */

async function handleSend(){

  if(isBusy){
    return;
  }

  const prompt =
    promptEl.value.trim();

  if(!prompt){

    showToast(
      "पहले कुछ लिखें।"
    );

    return;
  }


  ensureCurrentChat();


  isBusy = true;

  sendBtn.disabled =
    true;


  addUserMessage(
    prompt,
    true
  );


  promptEl.value = "";

  autoResize();

  scrollBottom();


  try{

    if(imageMode){

      showTyping();

      const image =
        await generateImage(
          prompt
        );

      hideTyping();

      const imageId =
        await saveCreation(
          image,
          prompt
        );


      addAssistantMessage(
        "🖼️ Image generated successfully.",
        false,
        imageId
      );

      saveCurrentChat();


      selectedPhotoBase64 =
        null;

      selectedPhotoUrl =
        null;

      photoInput.value =
        "";

      photoPreview.classList.remove(
        "show"
      );

    }else{

      showTyping();

      const answer =
        await sendChatRequest();

      hideTyping();

      addAssistantMessage(
        answer ||
        "माफ़ कीजिए, अभी कोई जवाब नहीं मिला।",
        true
      );
    }


  }catch(error){

    console.error(error);

    hideTyping();

    addAssistantMessage(
      "⚠️ अभी request पूरी नहीं हो सकी। कृपया थोड़ी देर बाद फिर कोशिश करें।",
      true
    );

    showToast(
      error?.message ||
      "Request failed"
    );

  }finally{

    isBusy = false;

    sendBtn.disabled =
      false;

    scrollBottom();

    try{
      promptEl.focus();
    }catch(e){}
  }
}

/* =========================================================
   PAGE RECOVERY
========================================================= */

/*
  Mobile Chrome में Back/Forward से लौटने पर
  pageshow fire होता है।

  अगर page bfcache से restore हुआ है,
  तो UI को दोबारा साफ state में लाते हैं।
*/

function recoverPage(){

  const now =
    Date.now();

  /*
    Duplicate recovery को रोकें।
  */

  if(
    now - lastPageShowRecovery <
    300
  ){
    return;
  }

  lastPageShowRecovery =
    now;


  try{

    hideTyping();

  }catch(error){

    console.warn(
      "Typing recovery failed:",
      error
    );
  }


  /*
    Network request वापस आने पर कभी-कभी
    stale busy state रह सकती है।
  */

  isBusy = false;

  sendBtn.disabled =
    false;


  try{

    closeDrawer();

  }catch(error){}


  try{

    closeImageViewer();

  }catch(error){}


  /*
    अगर current chat memory में है तो उसी को
    वापस render करें।
  */

  try{

    const chat =
      chats.find(
        item =>
          item.id === currentChatId
      );

    if(chat){

      messages =
        Array.isArray(chat.messages)
          ? chat.messages
              .slice(-MAX_MESSAGES_PER_CHAT)
          : [];

    }

    renderCurrentChat();

  }catch(error){

    console.error(
      "Page recovery render failed:",
      error
    );

    /*
      Last-resort recovery:
      storage से chat फिर पढ़ने की कोशिश।
    */

    try{

      loadChatHistory();

      const latest =
        chats
          .slice()
          .sort(
            (a,b) =>
              (b.updatedAt || 0) -
              (a.updatedAt || 0)
          )[0];

      if(latest){

        currentChatId =
          latest.id;

        messages =
          Array.isArray(latest.messages)
            ? latest.messages
                .slice(-MAX_MESSAGES_PER_CHAT)
            : [];

      }else{

        createNewChat(false);
      }

      renderCurrentChat();

    }catch(secondError){

      console.error(
        "Last recovery failed:",
        secondError
      );

      messagesEl.innerHTML = "";
    }
  }


  try{

    renderChatHistory();

  }catch(error){

    console.warn(
      "History recovery failed:",
      error
    );
  }


  try{

    updateModeButtons();

  }catch(error){}


  try{

    autoResize();

  }catch(error){}


  /*
    Image history Back पर तुरंत parse नहीं होगी।
    Drawer खोलने पर lazy-load होगी।
  */

  try{

    if(
      drawer.classList.contains("open")
    ){

      setTimeout(
        loadCreationsLazy,
        0
      );
    }

  }catch(error){}


  /*
    Mobile browser में restored page का scroll
    कभी गलत position पर जा सकता है।
  */

  setTimeout(() => {

    try{

      window.scrollTo({
        top:document.documentElement.scrollHeight,
        behavior:"auto"
      });

    }catch(error){}

  },50);
}


/*
  pageshow initial load पर भी आता है।
  Initial load में safeInitialLoad() मुख्य काम करेगा।
  उसके बाद केवल persisted/bfcache recovery की जरूरत है।
*/

window.addEventListener(
  "pageshow",
  event => {

    if(!appReady){
      return;
    }

    /*
      खास तौर पर Back/Forward/bfcache restore।
    */

    if(event.persisted){

      recoverPage();

      return;
    }

    /*
      कुछ mobile browsers persisted=false के साथ भी
      page को history navigation से वापस activate कर सकते हैं।
      इसलिए visible state में हल्का recovery रखें।
    */

    if(
      document.visibilityState === "visible"
    ){

      setTimeout(
        recoverPage,
        50
      );
    }
  }
);


/*
  visibilitychange पर कोई भारी storage save नहीं।
  केवल अगर page वापस visible हो तो stale loading state
  को recover करें।
*/

document.addEventListener(
  "visibilitychange",
  () => {

    if(
      document.visibilityState === "visible" &&
      appReady
    ){

      setTimeout(
        () => {

          try{

            hideTyping();

            isBusy = false;

            sendBtn.disabled =
              false;

          }catch(error){

            console.warn(
              "Visibility recovery failed:",
              error
            );
          }

        },
        80
      );
    }
  }
);


/* =========================================================
   SAFE INITIAL LOAD
========================================================= */

function safeInitialLoad(){

  /*
    पहले सबसे हल्का possible UI state।
  */

  try{

    isBusy = false;

    sendBtn.disabled =
      false;

    hideTyping();

  }catch(error){}


  /*
    Chat history load करें।
    यह bounded है।
  */

  try{

    loadChatHistory();

  }catch(error){

    console.error(
      "Chat history startup failed:",
      error
    );

    chats = [];

    currentChatId = null;

    messages = [];

    safeRemove(
      CHAT_LIST_KEY
    );

    safeRemove(
      OLD_CHAT_KEY
    );
  }


  try{

    if(!chats.length){

      /*
        IMPORTANT:
        Startup पर नया chat बनाते समय
        localStorage write नहीं होगी।
      */

      createNewChat(false);

    }else{

      const latest =
        chats
          .slice()
          .sort(
            (a,b) =>
              (b.updatedAt || 0) -
              (a.updatedAt || 0)
          )[0];

      if(latest){

        currentChatId =
          latest.id;

        messages =
          Array.isArray(latest.messages)
            ? latest.messages
                .slice(-MAX_MESSAGES_PER_CHAT)
            : [];
      }
    }

  }catch(error){

    console.error(
      "Chat initialization failed:",
      error
    );

    chats = [];

    currentChatId = null;

    messages = [];

    try{

      createNewChat(false);

    }catch(createError){

      console.error(
        "New chat creation failed:",
        createError
      );
    }
  }


  /*
    Chat UI पहले render होगा।
  */

  try{

    renderCurrentChat();

  }catch(error){

    console.error(
      "Chat render failed:",
      error
    );

    messagesEl.innerHTML = "";
  }


  try{

    renderChatHistory();

  }catch(error){

    console.error(
      "History render failed:",
      error
    );

    chatHistoryEl.innerHTML = "";
  }


  /*
    IMPORTANT:
    renderCreations() startup पर नहीं।
    इससे बड़े Base64 image history के कारण
    first paint block नहीं होगा।
  */

  try{

    creationGrid.innerHTML = "";

    const empty =
      document.createElement("div");

    empty.className =
      "empty-history";

    empty.textContent =
      "Images देखने के लिए Menu खोलें।";

    creationGrid.appendChild(empty);

  }catch(error){

    creationGrid.innerHTML = "";
  }


  try{

    updateModeButtons();

  }catch(error){

    console.error(
      "Mode button initialization failed:",
      error
    );
  }


  try{

    autoResize();

  }catch(error){

    console.error(
      "Textarea initialization failed:",
      error
    );
  }


  /*
    Startup scroll.
    Smooth नहीं, ताकि mobile browser layout को
    बार-बार animate न करना पड़े।
  */

  setTimeout(() => {

    try{

      window.scrollTo({
        top:document.documentElement.scrollHeight,
        behavior:"auto"
      });

    }catch(error){

      console.warn(
        "Initial scroll failed:",
        error
      );
    }

  },80);


  /*
    अब app को ready mark करें।
  */

  appReady = true;


  /*
    Browser को थोड़ा समय दें।
    Image history केवल background में load होगी,
    लेकिन पहले paint के बाद।
  */

  setTimeout(
    () => {

      if(!appReady){
        return;
      }

      /*
        केवल बहुत हल्का check।
        Actual image history तब parse होगी
        जब drawer खोला जाएगा।
      */

      try{

        if(
          drawer.classList.contains("open")
        ){
          loadCreationsLazy();
        }

      }catch(error){}

    },
    1200
  );
}


/* =========================================================
   STARTUP
========================================================= */

if(
  document.readyState === "loading"
){

  document.addEventListener(
    "DOMContentLoaded",
    safeInitialLoad,
    {
      once:true
    }
  );

}else{

  setTimeout(
    safeInitialLoad,
    0
  );
}


/*
  IMPORTANT:

  pagehide / beforeunload पर भारी localStorage save
  जानबूझकर नहीं लगाया गया है।

  Normal chat actions saveCurrentChat() से save होती हैं।

  pageshow + visibilitychange केवल UI recovery के लिए हैं।
*/
</script>
